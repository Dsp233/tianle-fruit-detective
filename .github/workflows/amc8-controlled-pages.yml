name: AMC8 controlled Pages delivery

# Inert until the owner switches Pages Source to GitHub Actions, configures
# main protection, and sets repository variable AMC8_G1_PAGES_ACTIONS_ENABLED=true.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: Immutable release or frozen pre-G1 rollback
        required: true
        type: choice
        default: release
        options: [release, rollback]

permissions:
  contents: read

concurrency:
  group: amc8-controlled-pages-production
  cancel-in-progress: false

jobs:
  preflight:
    if: ${{ vars.AMC8_G1_PAGES_ACTIONS_ENABLED == 'true' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      target_ref: ${{ steps.plan.outputs.target_ref }}
      mode: ${{ steps.plan.outputs.mode }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select and verify immutable delivery identity
        id: plan
        env:
          REQUESTED_MODE: ${{ inputs.mode }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mode="${REQUESTED_MODE:-release}"
          target_ref="$GITHUB_SHA"
          if [ "$mode" = rollback ]; then
            test "$GITHUB_EVENT_NAME" = workflow_dispatch
            target_ref=05f73af21ddf35134bb7c5e598cd75845e82baf2
          else
            test "$mode" = release
          fi
          main_sha="$(git rev-parse refs/remotes/origin/main)"
          python3 -I -B code-review/G1/auto_release.py \
            --mode "$mode" --ref "$target_ref" --main "$main_sha"
          echo "target_ref=$target_ref" >> "$GITHUB_OUTPUT"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"

  package:
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.preflight.outputs.target_ref }}
          persist-credentials: false
      - uses: actions/configure-pages@v5
      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Assert entry point and fingerprint the release
        env:
          TARGET_REF: ${{ needs.preflight.outputs.target_ref }}
          DELIVERY_MODE: ${{ needs.preflight.outputs.mode }}
        run: |
          set -euo pipefail
          test -s _site/index.html
          test -f _site/assets/loading-r1/6992afedc262477a6fec07da6d2f63a5260abede789399ef5c3b5e0aa7d72d98.css
          python3 - <<'PY'
          import json, os, pathlib
          target = pathlib.Path("_site/amc8-g1-release.json")
          target.write_text(json.dumps({
              "sourceSha": os.environ["TARGET_REF"],
              "mode": os.environ["DELIVERY_MODE"]
          }, sort_keys=True) + "\n", encoding="utf-8")
          PY
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site/

  deploy:
    needs: [preflight, package]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    outputs:
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy only the verified Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4

  smoke:
    needs: [preflight, deploy]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Verify deployed SHA from public Pages response
        env:
          PAGE_URL: ${{ needs.deploy.outputs.url }}
          TARGET_REF: ${{ needs.preflight.outputs.target_ref }}
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.request
          root = os.environ["PAGE_URL"].rstrip("/") + "/"
          expected = os.environ["TARGET_REF"]
          last = ""
          for n in range(20):
              try:
                  request = urllib.request.Request(
                      root + "amc8-g1-release.json?attempt=" + str(n),
                      headers={"Cache-Control": "no-cache"})
                  with urllib.request.urlopen(request, timeout=15) as response:
                      receipt = json.load(response)
                  with urllib.request.urlopen(root + "index.html?attempt=" + str(n), timeout=15) as response:
                      html = response.read().decode("utf-8")
                  if receipt.get("sourceSha") == expected and "天乐的功夫学堂" in html:
                      print("PUBLIC_SMOKE_PASS", receipt)
                      break
                  last = "stale receipt or missing title: " + str(receipt)
              except Exception as exc:
                  last = str(exc)
              time.sleep(15)
          else:
              raise SystemExit("PUBLIC_SMOKE_FAILED: " + last)
          PY

  emergency-rollback:
    needs: [preflight, package, deploy, smoke]
    if: ${{ always() && needs.preflight.result == 'success' && needs.package.result == 'success' && needs.preflight.outputs.mode == 'release' && (needs.deploy.result == 'failure' || needs.smoke.result == 'failure') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    environment:
      name: github-pages
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: 05f73af21ddf35134bb7c5e598cd75845e82baf2
          persist-credentials: false
      - uses: actions/configure-pages@v5
      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Mark frozen rollback source
        run: |
          test -s _site/index.html
          printf '%s\n' '{"mode":"rollback","sourceSha":"05f73af21ddf35134bb7c5e598cd75845e82baf2"}' > _site/amc8-g1-release.json
      - uses: actions/upload-pages-artifact@v3
        with:
          name: amc8-g1-emergency-rollback
          path: ./_site/
      - name: Restore pre-G1 site artifact automatically
        uses: actions/deploy-pages@v4
        with:
          artifact_name: amc8-g1-emergency-rollback
