name: AMC8 final integration preparation (isolated)
on:
  push:
    branches: [codex/final-integration-20261124]
    paths: ['tools/final-integration/**', 'tools/g1-source-lock.json', '.github/workflows/amc8-final-integration.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: amc8-final-integration-${{ github.sha }}
  cancel-in-progress: true
jobs:
  source-toolchain:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        replica: [A, B]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !*.zip
            !*.zip.part-*
            !*.tar.gz
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
      - name: Recover controlled inputs using existing pinned releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/integration-proof" "$RUNNER_TEMP/private-input"
          if ! gh api repos/Dsp233/tianle-fruit-detective/actions/artifacts/13604511680/zip > "$RUNNER_TEMP/private-input/w1.zip"; then
            gh api -H 'Accept: application/octet-stream' repos/Dsp233/tianle-fruit-detective/releases/assets/723206305 > "$RUNNER_TEMP/private-input/w1.zip"
          fi
          if ! gh api repos/Dsp233/tianle-fruit-detective/actions/artifacts/12637348462/zip > "$RUNNER_TEMP/private-input/home.zip"; then
            gh api -H 'Accept: application/octet-stream' repos/Dsp233/tianle-fruit-detective/releases/assets/723206068 > "$RUNNER_TEMP/private-input/home.zip"
          fi
          python -m pip download --no-deps --require-hashes -r tools/g1-w1-reading-requirements.txt -d "$RUNNER_TEMP/private-input"
          python -B tools/final-integration/recover_inputs.py --w1 "$RUNNER_TEMP/private-input/w1.zip" --home "$RUNNER_TEMP/private-input/home.zip" --wheel "$RUNNER_TEMP/private-input/pypinyin-0.55.0-py2.py3-none-any.whl" --out "$RUNNER_TEMP/private-input/locked" --receipt "$RUNNER_TEMP/integration-proof/source-receipt.json"
      - name: Install exact replacement Python and native sandbox
        run: |
          set -euo pipefail
          export UV_PYTHON_INSTALL_DIR="$RUNNER_TEMP/managed"
          command -v uv
          uv python install 3.12.14
          py="$UV_PYTHON_INSTALL_DIR/cpython-3.12.14-linux-x86_64-gnu/bin/python3.12"
          test -x "$py"
          echo "$(dirname "$py")" >> "$GITHUB_PATH"
          echo "AMC8_NATIVE_PY=$py" >> "$GITHUB_ENV"
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap
      - name: Independently rebuild the existing G1 product under the original offline sandbox
        run: |
          set -euo pipefail
          unset LD_LIBRARY_PATH PYTHONPATH
          "$AMC8_NATIVE_PY" -I -B -c 'import sys,zlib,hashlib; print(sys.version, zlib.ZLIB_RUNTIME_VERSION, hashlib.sha256(open(sys.executable,"rb").read()).hexdigest())'
          # The original native_build mounts only the checkout, recovered input and pinned tools,
          # denies sockets and starts with empty scratch. Root on the ephemeral runner permits bwrap
          # without disabling host AppArmor/user-namespace restrictions.
          sudo chown -R root:root "$GITHUB_WORKSPACE" "$RUNNER_TEMP/private-input"
          sudo env PATH="$PATH" "$AMC8_NATIVE_PY" -I -B tools/final-integration/native_proof.py "$RUNNER_TEMP/private-input/locked" "$RUNNER_TEMP/native-proof" "$RUNNER_TEMP/integration-proof"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: final-native-proof-${{ matrix.replica }}
          path: ${{ runner.temp }}/integration-proof/
          if-no-files-found: error
      - name: Destroy temporary source and archives
        if: always()
        run: sudo rm -rf "$RUNNER_TEMP/private-input" "$RUNNER_TEMP/native-proof"
  compare:
    needs: source-toolchain
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: final-native-proof-*
          path: proof
      - name: Compare exact native output manifests from independent runners
        run: |
          set -euo pipefail
          cmp proof/final-native-proof-A/build-manifest.json proof/final-native-proof-B/build-manifest.json
          cmp proof/final-native-proof-A/source-receipt.json proof/final-native-proof-B/source-receipt.json
          python3 - <<'PY'
          import json
          m=json.load(open("proof/final-native-proof-A/build-manifest.json"))
          print("DUAL_NATIVE_BYTE_IDENTICAL",len(m["files"]),m["toolchain"])
          PY
