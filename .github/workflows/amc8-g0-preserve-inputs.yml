name: AMC8 G0 preserve pinned build inputs
on:
  push:
    branches: [rc79-reading-workpackage-20261101]
    paths: [.github/workflows/amc8-g0-preserve-inputs.yml]
permissions:
  contents: write
  actions: read
concurrency:
  group: amc8-g0-pin-w1-build-inputs
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      G0_TAG: amc8-g0-pinned-w1-inputs-20261108
      LIVE_SHA: 7e1b5df76e63abcb45836200dbde4d06e88eaf35
    steps:
      - name: Verify original archive bytes
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/g0-archive"
          cd "$RUNNER_TEMP/g0-archive"
          cat > pinned.tsv <<'ROWS'
          12637348462 abf49d6cdecd31bcece2feda6fd40464eedd21ecef490158daa00c735edcb0f4 home-h1-frozen-12637348462.zip
          13122827352 34e071de6fe1825b67cc078618f3beca1851ce840ac73d0af6ff3001c7e26f69 fix15-rollback-13122827352.zip
          13604511680 691e39be468335977f615b4d96497ff81d6b2f38dc7cee6ff0e6f0e44ec00e21 w1-frozen-13604511680.zip
          13595790278 ad38df5d92fce91898ca57f4cc7a7478fd1c9f5fbe55538b0a94010227cd1cf0 w1-qa-baseline-13595790278.zip
          ROWS
          while read -r id sha name; do
            curl --fail --show-error --silent --location --retry 3 \
              -H "Accept: application/vnd.github+json" -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" --output "$name"
            printf '%s  %s\n' "$sha" "$name" | sha256sum --check
          done < pinned.tsv
          unzip -p home-h1-frozen-12637348462.zip RC79_HOME1_candidate.zip > home-h1-inner.zip
          echo 'a61a4b6376f1b6cc39fd1b1bb8e2dda4f94d38a2e05410dd4db9e23254e09c06  home-h1-inner.zip' | sha256sum --check
      - name: Preserve only in a draft release and verify readback
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/g0-archive"
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases" --slurp > releases.json
          release_id="$(jq -er --arg tag "$G0_TAG" '[.[][] | select(.tag_name == $tag)] | if length > 1 then error("ambiguous archive release") elif length == 1 then .[0].id else "" end' releases.json)"
          if test -z "$release_id"; then
            release_id="$(gh api -X POST "repos/$GITHUB_REPOSITORY/releases" \
              -f tag_name="$G0_TAG" -f target_commitish="$LIVE_SHA" \
              -f name='AMC8 G0 engineering archive (draft only)' \
              -f body='Restricted recovery copy of pinned AMC8 build and rollback inputs. Keep this release in draft.' \
              -F draft=true --jq '.id')"
          fi
          gh api "repos/$GITHUB_REPOSITORY/releases/$release_id" > release.json
          jq -e --arg tag "$G0_TAG" --arg sha "$LIVE_SHA" '.draft and .tag_name == $tag and .target_commitish == $sha' release.json >/dev/null
          while read -r id sha name; do
            asset_id="$(jq -r --arg name "$name" '.assets[] | select(.name == $name) | .id' release.json)"
            if test -z "$asset_id"; then
              gh release upload "$G0_TAG" "$name" --repo "$GITHUB_REPOSITORY"
            fi
          done < pinned.tsv
          gh api "repos/$GITHUB_REPOSITORY/releases/$release_id" > release.json
          jq -e '.draft and (.assets | length == 4)' release.json >/dev/null
          jq -n --argjson releaseId "$release_id" --arg tag "$G0_TAG" --arg sha "$LIVE_SHA" \
            '{status:"VERIFIED_DRAFT_ARCHIVE",releaseId:$releaseId,tag:$tag,productionCommit:$sha,assets:[]}' > receipt.json
          while read -r id sha name; do
            asset_id="$(jq -er --arg name "$name" '.assets[] | select(.name == $name and .state == "uploaded") | .id' release.json)"
            gh api -H "Accept: application/octet-stream" "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id" > readback.zip
            printf '%s  %s\n' "$sha" readback.zip | sha256sum --check
            jq --argjson sourceId "$id" --argjson assetId "$asset_id" --arg sha "$sha" --arg name "$name" \
              '.assets += [{sourceArtifactId:$sourceId,assetId:$assetId,sha256:$sha,name:$name}]' receipt.json > updated.json
            mv updated.json receipt.json
          done < pinned.tsv
          cat receipt.json
      - uses: actions/upload-artifact@v4
        with:
          name: amc8-g0-archive-receipt
          path: ${{ runner.temp }}/g0-archive/receipt.json
          if-no-files-found: error
