name: AMC8 Q0 isolated formal software candidate
on:
  push:
    branches: [rc79-reading-workpackage-20261101]
    paths:
      - '.github/workflows/amc8-q0-formal-candidate.yml'
      - 'github-upload/rc79-reading-workpackage/safety-work/w1-review-overlay/package_formal_review_candidate.py'
      - 'github-upload/rc79-reading-workpackage/safety-work/w1-review-overlay/review-overlay.js'
      - 'github-upload/rc79-reading-workpackage/safety-work/w1-review-overlay/review-overlay.css'
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 7e1b5df76e63abcb45836200dbde4d06e88eaf35
          path: production-base
          persist-credentials: false
      - name: Verify source and package isolated Q0 candidate
        run: |
          set -euo pipefail
          node --check github-upload/rc79-reading-workpackage/safety-work/w1-review-overlay/review-overlay.js
          python3 github-upload/rc79-reading-workpackage/safety-work/w1-review-overlay/package_formal_review_candidate.py \
            --production production-base --receipt github-upload/rc79-reading-workpackage/safety-work/w1-checkpoint/w1-public-byte-receipt.json \
            --output "$RUNNER_TEMP/q0-candidate" --expected-commit 7e1b5df76e63abcb45836200dbde4d06e88eaf35
      - uses: actions/upload-artifact@v4
        with:
          name: amc8-q0-formal-candidate-not-deployed
          path: ${{ runner.temp }}/q0-candidate
          if-no-files-found: error
