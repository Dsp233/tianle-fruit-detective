name: AMC8 W1 G5 prepare release Git objects
on:
  push:
    branches: [rc79-reading-workpackage-20261101]
    paths: [.github/workflows/amc8-w1-g5-prepare-git-objects.yml]
permissions:
  contents: write
  actions: read
concurrency:
  group: amc8-w1-g5-prepare-f935008b
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      FIX15_SHA: 23755d3aa9bf9e479468bb24263f81ea8228430e
      W1_ZIP_SHA: 691e39be468335977f615b4d96497ff81d6b2f38dc7cee6ff0e6f0e44ec00e21
      STAGE_REF: refs/heads/w1-g5-stage-f935008b
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.FIX15_SHA }}
          path: main-baseline
      - name: Materialize exactly the approved release transaction
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/Dsp233/tianle-fruit-detective/actions/artifacts/13604511680/zip > "$RUNNER_TEMP/w1.zip"
          python3 github-upload/rc79-reading-workpackage/safety-work/w1-checkpoint/g5_release_envelope.py \
            --candidate . --baseline main-baseline --main-sha "$FIX15_SHA" \
            --frozen-zip "$RUNNER_TEMP/w1.zip" --expected-zip-sha256 "$W1_ZIP_SHA" \
            --output "$RUNNER_TEMP/w1-staged"
          python3 - <<'PY'
          import json, os, shutil
          from pathlib import Path
          support = Path('github-upload/rc79-reading-workpackage/safety-work/w1-checkpoint')
          staged = Path(os.environ['RUNNER_TEMP']) / 'w1-staged'
          receipt = json.loads((staged / 'w1-g5-staging-receipt.json').read_text())
          approved = json.loads((support / 'w1-g5-envelope-disposition.json').read_text())
          for field in ('mainBaseline', 'sourceCommit', 'allowlistSha256', 'manifestSha256', 'runtimeActionCount', 'copiedRuntimeFiles', 'supportFiles'):
              assert receipt[field] == approved[field], field
          assert receipt['actualFrozenZipSha256'] == approved['frozenZipSha256']
          rows = json.loads((support / 'w1-g5-allowlist.json').read_text())['actions']
          paths = [row['path'] for row in rows if row['action'] != 'retain']
          paths += [path for path in receipt['supportFiles'] if not path.startswith('.github/workflows/')]
          paths.append('muse/rc79/manifest.json')
          assert len(paths) == len(set(paths)) == 52
          for path in paths:
              dest = Path('main-baseline') / path
              dest.parent.mkdir(parents=True, exist_ok=True)
              shutil.copyfile(staged / path, dest)
          PY
      - name: Publish one isolated staging ref for independent promotion
        working-directory: main-baseline
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$FIX15_SHA"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$FIX15_SHA"
          test -z "$(git ls-remote origin "$STAGE_REF")"
          git add --all
          test "$(git write-tree)" = 6283319ec4ba15612fb2a89e02d104f3ab04f553
          git -c user.name=github-actions -c user.email=41898282+github-actions[bot]@users.noreply.github.com \
            commit -m 'Stage verified W1 runtime and release support objects'
          git push origin "HEAD:$STAGE_REF"
          git rev-parse HEAD
