name: AMC8 W1 G5 release transaction preflight
on:
  push:
    branches: [rc79-reading-workpackage-20261101]
    paths:
      - 'github-upload/rc79-reading-workpackage/safety-work/w1-checkpoint/g5_release_envelope.py'
      - 'github-upload/rc79-reading-workpackage/safety-work/w1-checkpoint/test_g5_release_envelope.py'
      - 'github-upload/rc79-reading-workpackage/safety-work/w1-checkpoint/w1-g5-allowlist.json'
      - 'github-upload/rc79-reading-workpackage/safety-work/w1-checkpoint/public_release.py'
      - '.github/workflows/rc79-fix15-public.yml'
      - '.github/workflows/amc8-w1-g5-release-preflight.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release-envelope:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Checkout pinned FIX15 baseline to independent path
        uses: actions/checkout@v4
        with:
          ref: 23755d3aa9bf9e479468bb24263f81ea8228430e
          path: main-baseline
      - name: Run isolated release transaction tests
        run: python3 -m unittest discover -s github-upload/rc79-reading-workpackage/safety-work/w1-checkpoint -p test_g5_release_envelope.py -v
      - name: Validate candidate release-support closure against actual FIX15 tree
        run: |
          python3 github-upload/rc79-reading-workpackage/safety-work/w1-checkpoint/g5_release_envelope.py \
            --candidate . --baseline main-baseline --main-sha 23755d3aa9bf9e479468bb24263f81ea8228430e
      - name: Download original pinned G3/G4 frozen artifact ZIP without rebuilding
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/w1-g5-artifact"
          curl --fail --show-error --silent --location --retry 3 \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            "https://api.github.com/repos/Dsp233/tianle-fruit-detective/actions/artifacts/13604511680/zip" \
            --output "$RUNNER_TEMP/w1-g5-artifact/frozen.zip"
          echo "691e39be468335977f615b4d96497ff81d6b2f38dc7cee6ff0e6f0e44ec00e21  $RUNNER_TEMP/w1-g5-artifact/frozen.zip" | sha256sum --check
      - name: Stage and verify complete non-production release transaction
        run: |
          set -euo pipefail
          python3 github-upload/rc79-reading-workpackage/safety-work/w1-checkpoint/g5_release_envelope.py \
            --candidate . \
            --baseline main-baseline \
            --main-sha 23755d3aa9bf9e479468bb24263f81ea8228430e \
            --frozen-zip "$RUNNER_TEMP/w1-g5-artifact/frozen.zip" \
            --expected-zip-sha256 691e39be468335977f615b4d96497ff81d6b2f38dc7cee6ff0e6f0e44ec00e21 \
            --output "$RUNNER_TEMP/w1-g5-staged" \
            | tee "$RUNNER_TEMP/w1-g5-artifact/ci-stage-result.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          r = Path(os.environ['RUNNER_TEMP'])/'w1-g5-staged'/'w1-g5-staging-receipt.json'
          d = json.loads(r.read_text())
          assert d['state'] == 'STAGED_NOT_DEPLOYED'
          assert d['runtimeActionCount'] == 439
          assert d['copiedRuntimeFiles'] == 48
          assert d['mainBaseline'] == '23755d3aa9bf9e479468bb24263f81ea8228430e'
          assert d['sourceCommit'] == 'f935008b75d79cfc44610b197122c01e1b6b9a6e'
          print('STAGED_RELEASE_VERIFIED_NOT_DEPLOYED')
          PY
          cp "$RUNNER_TEMP/w1-g5-staged/w1-g5-staging-receipt.json" "$RUNNER_TEMP/w1-g5-artifact/"
      - name: Retain staged verification receipts only (no deployment)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w1-g5-preflight-receipts
          path: ${{ runner.temp }}/w1-g5-artifact/*.json
          if-no-files-found: warn
          retention-days: 90
