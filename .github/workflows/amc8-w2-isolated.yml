name: AMC8 W2 isolated diagnostic candidate
on:
  push:
    branches: [codex/w2-develop-20261124]
    paths:
      - 'tools/w2/**'
      - '.github/workflows/amc8-w2-isolated.yml'
permissions:
  contents: read
concurrency:
  group: amc8-w2-isolated-candidate
  cancel-in-progress: true
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /index.html
            /review-overlay.js
            /amc8/index.html
            /source/index.html
            /tools/g1_reading_packets.py
            /tools/g1-w1-reading-requirements.txt
            /tools/w2/
            /assets/
            /academy/
            /reading-art/
      - uses: actions/checkout@v4
        with:
          ref: 7d68e6204e079cfd1a3dbf8cc1e4066cf83807bb
          path: draft-source
          persist-credentials: false
          sparse-checkout: github-upload/rc79-reading-workpackage/safety-work/wp-diagnostics
      - name: Recover pinned source and original draft
        run: python3 tools/w2/prepare_diagnostics.py --root . --draft-dir draft-source/github-upload/rc79-reading-workpackage/safety-work/wp-diagnostics --out "$RUNNER_TEMP/w2"
      - name: Install pinned W1 pronunciation dictionary
        run: python3 -m pip install --require-hashes -r tools/g1-w1-reading-requirements.txt
      - name: Build reviewed W2 isolated overlay
        run: python3 tools/w2/build_candidate.py --root . --prepared "$RUNNER_TEMP/w2" --out "$RUNNER_TEMP/w2-candidate"
      - name: Exercise all 208 reviewed answers in inherited engine
        run: set -o pipefail; node tools/w2/test_engine.cjs "$RUNNER_TEMP/w2" "$RUNNER_TEMP/w2-candidate" | tee "$RUNNER_TEMP/w2-candidate/engine-test.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: amc8-w2-isolated-candidate
          path: ${{ runner.temp }}/w2-candidate/
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: amc8-w2-isolated-prepared-source
          path: ${{ runner.temp }}/w2/
          if-no-files-found: error
