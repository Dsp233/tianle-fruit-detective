name: CR4 integrity tests
on:
  push:
    branches: [codex/cr4-integrity]
    paths: ['reading-art/**', 'index.html', 'amc8/index.html', 'source/index.html', 'code-review/CR4/**', '.github/workflows/cr4-integrity.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright==1.57.0
      - run: python -m playwright install --with-deps chromium webkit
      - run: python reading-art/build.py --verify-release
      - run: python code-review/CR4/test.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cr4-integrity
          path: code-review/CR4/evidence
