name: AMC8 protected R5 lease claim (isolated)
on:
  push:
    branches: [codex/g0x-g1-receipt-bot-trigger-20261124]
    paths: [.github/workflows/g0x-g1-receipt-transfer.yml]
permissions:
  contents: read
jobs:
  submit-receipt:
    if: github.repository == 'Dsp233/tianle-fruit-detective' && github.ref == 'refs/heads/codex/g0x-g1-receipt-bot-trigger-20261124'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: e7bc1618c59e2adcb55e68b7156666cea47f5b71
          persist-credentials: false
      - name: Submit existing G0-X claim transition for owner review
        uses: actions/github-script@v7
        with:
          script: |
            const owner='Dsp233', repo='tianle-fruit-detective';
            const base='rc79-reading-workpackage-20261101';
            const baseSha='e7bc1618c59e2adcb55e68b7156666cea47f5b71';
            const queuePath='github-upload/rc79-reading-workpackage/safety-work/g0x/queue.json';
            const branch='codex/m1-r5-chat-claim-20261124';
            const reviewer='r5-chat-independent-20261124';
            const ref=(await github.rest.git.getRef({owner,repo,ref:'heads/'+base})).data;
            if(ref.object.sha!==baseSha) throw Error('Canonical head advanced');
            const rule=(await github.request('GET /repos/{owner}/{repo}/rulesets/{rule_id}',{owner,repo,rule_id:27690779})).data;
            const p=rule.rules?.find(r=>r.type==='pull_request')?.parameters;
            const c=rule.rules?.find(r=>r.type==='required_status_checks')?.parameters;
            if(rule.enforcement!=='active'||rule.target!=='branch'||JSON.stringify(rule.conditions?.ref_name?.include)!==JSON.stringify(['refs/heads/'+base])||(rule.bypass_actors||[]).length!==0||(p?.required_approving_review_count||0)<1||!p?.require_last_push_approval||!p?.dismiss_stale_reviews_on_push||!c?.strict_required_status_checks_policy||!c?.required_status_checks?.some(x=>x.context==='validate-queue'&&x.integration_id===15368)) throw Error('Queue protection changed');
            const fs=require('node:fs');
            const q=JSON.parse(fs.readFileSync(queuePath,'utf8'));
            const t=q.tasks.find(t=>t.id==='M-R5-REVIEW');
            if(q.revision!==296||t.status!=='TODO'||t.lease!==null||t.semanticReview.candidateSourceSha!=='c732284e991023398aa9ebec454fcc59901ee90c'||t.semanticReview.completedCount!==29||t.semanticReview.issueCount!==0||t.semanticReview.nextFamilyId!=='J-D01-01')throw Error('R5 baseline changed');
            const {claim,validate}=await import('file://'+process.env.GITHUB_WORKSPACE+'/github-upload/rc79-reading-workpackage/safety-work/g0x/queue-core.mjs');
            validate(q);
            const leaseId=require('node:crypto').randomUUID();
            const next=claim(q,{id:'M-R5-REVIEW',owner:reviewer,leaseId,at:new Date().toISOString(),ttlMinutes:180,approvalRef:t.approvalRef,role:'independent-reviewer'});
            validate(next);
            const nt=next.tasks.find(t=>t.id==='M-R5-REVIEW');
            if(next.revision!==297||nt.status!=='ACTIVE'||JSON.stringify(nt.semanticReview)!==JSON.stringify(t.semanticReview)||next.tasks.some(x=>x.id!==t.id&&JSON.stringify(x)!==JSON.stringify(q.tasks.find(y=>y.id===x.id))))throw Error('Unexpected claim transition');
            const baseCommit=(await github.rest.git.getCommit({owner,repo,commit_sha:baseSha})).data;
            const blob=(await github.rest.git.createBlob({owner,repo,content:JSON.stringify(next,null,2)+'\n',encoding:'utf-8'})).data;
            const tree=(await github.rest.git.createTree({owner,repo,base_tree:baseCommit.tree.sha,tree:[{path:queuePath,mode:'100644',type:'blob',sha:blob.sha}]})).data;
            const commit=(await github.rest.git.createCommit({owner,repo,tree:tree.sha,parents:[baseSha],message:'chore(g0x): claim R5 independent chat review on existing candidate'})).data;
            await github.rest.git.createRef({owner,repo,ref:'refs/heads/'+branch,sha:commit.sha});
            const pr=(await github.rest.pulls.create({owner,repo,head:branch,base,title:'M1 R5: claim independent chat review lease (revision 297)',body:'Existing G0-X claim only: revision 296 -> 297; candidate c732284e; 29/84 PASS, 0 ISSUE; next J-D01-01. Reviewer '+reviewer+'; lease '+leaseId+'; expires '+nt.lease.expiresAt+'. No review is signed by this PR. Uses original queue-core claim and recorded authorization. Existing validate-queue and distinct owner approval remain mandatory; no bypass, no main changes.'})).data;
            core.notice('Created claim PR #'+pr.number+' at '+commit.sha+'; lease '+leaseId);
