            const pr=(await github.rest.pulls.create({owner,repo,head:branch,base,title:'M1 R5: J-D01-01 independent review checkpoint (revision 298)',body:'29 -> 30/84 PASS, zero teaching ISSUE; J-D01-02 next. Existing lease unchanged. G/I1/C independent evidence inherited, I2 and D independently solved and actually accepted in Chromium. Source c732284e; evidence '+"https://github.com/Dsp233/tianle-fruit-detective/actions/runs/45298379371/artifacts/14877941010"+' and '+"https://github.com/Dsp233/tianle-fruit-detective/actions/runs/42724320551/artifacts/13721802572"+'. D undefined small title recorded as nonblocking presentation issue consistent with existing G02-04. Actual delayed gate observed before simulated +25h; no claim of real child learning. No main changes. Existing validate-queue and separate owner review required.'})).data;
            core.notice('Created R5 checkpoint PR #'+pr.number+' at '+commit.sha);
