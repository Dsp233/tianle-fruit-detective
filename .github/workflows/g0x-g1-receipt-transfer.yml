UPPORT_NECESSITY":{"status":"PASS","evidenceRef":"https://github.com/Dsp233/tianle-fruit-detective/actions/runs/45298379371/artifacts/14877941010 · G 22bf2d5bb065af2105628f50991e16e8eb7afaa2acbff83fd89ee7510169bdc2 · I1 030ece260782a7384b86170cf7bdbb97a695665d82c85215265425d743e0a1ed · I2 45182b4ceba8f3a275bfe148f82f15cae407b87ddfb8614de52c92d3b91b64d8 · D e12be409d9c92e46b0a409cbd6590ca8e20201df147cccb2de71b4a18b1b7616","note":"等组乘法用于图例换算与计价；加法用于合计及固定费；I1 包数及余量须用包含除和向上取整；I2 比较两个报价；D 比较预算并扣减。与题面实际要求匹配。"},"TRANSFER_SUBSTANCE":{"status":"PASS","evidenceRef":"https://github.com/Dsp233/tianle-fruit-detective/actions/runs/45298379371/artifacts/14877941010 · I1 ca95befd2608321d0a2b3186b8a40822a297d0e41dd796bb101fdfa7de1c6ac1 · I2 63e91103fef462fa5e8356a2948eee27d02998ce47ce4558d6b25747a783d4c3 · D gate a224ada4527ddc2684e16595148f7d73755a225c98b45cd5293ad41b5f927206 · D e12be409d9c92e46b0a409cbd6590ca8e20201df147cccb2de71b4a18b1b7616","note":"I1改变图例至4球、引入半枚图标及整包供应；I2改为1件/枚并比较不同固定费报价；D保留零类并加入预算判断。真实浏览器先确认24小时门禁，模拟前移25小时后完成新题；不冒充真实隔日学习。"},"SIX_DIMENSION_APPLICABILITY":{"status":"PASS","evidenceRef":"https://github.com/Dsp233/tianle-fruit-detective/actions/runs/45298379371/artifacts/14877941010 · G-prompt f852ebbe6674f6f2d1af6bdf3bb1d2e399f437c1417297af314de9c9f5890381 · I1-before-submit 259ac3c71cadaee02f94aa122ca4947161d2cdd027364ccde84ef3e8c6faaf0b · D-graded e12be409d9c92e46b0a409cbd6590ca8e20201df147cccb2de71b4a18b1b7616 · C https://github.com/Dsp233/tianle-fruit-detective/actions/runs/42724320551/artifacts/13721802572","note":"数学关系、可见图式、实际拆移与表格、解释和反例、迁移及应用有真实操作证据。真实儿童理解、认知负担、真机听音和真实隔日学习成效留最终UAT。D 的 undefined 小标题非数学条件缺失，另列界面缺陷。"}}};
