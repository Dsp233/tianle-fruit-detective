name: AMC8 R1.1 isolated product probe
on:
  push:
    branches: [codex/r11-c-139-publish-check-20261125]
permissions:
  contents: read
jobs:
  c-public-exact:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Verify public release receipt and exact already-tested runtime files
        run: |
          python3 - <<'PY'
          import hashlib,json,time,urllib.request
          root='https://dsp233.github.io/tianle-fruit-detective/'
          expected='d0c9c3e265a7a76052487d374255fcda35f21117'
          files={"assets/final-integration/002fe0f17d9911149a2ac4397aa60473f16408dc201984db89a7dc6f72e18b66.json":"002fe0f17d9911149a2ac4397aa60473f16408dc201984db89a7dc6f72e18b66","assets/final-integration/9e65b11fe9d109a9fba4208ce19115283d1b999ce27be507a8bad4d176e301f1.json":"9e65b11fe9d109a9fba4208ce19115283d1b999ce27be507a8bad4d176e301f1","index.html":"3678241a456540d8360d8852c8f76429c27a2ba93103446c47fcf94fd44cf617","amc8/index.html":"11414d121cbc136917896f6067bf2c3ab2213a86c4c1a78abe663c6206249172","source/index.html":"11414d121cbc136917896f6067bf2c3ab2213a86c4c1a78abe663c6206249172"}
          def fetch(path):
              req=urllib.request.Request(root+path+'?r11_c='+expected+'&t='+str(time.time_ns()),headers={'Cache-Control':'no-cache','Pragma':'no-cache'})
              with urllib.request.urlopen(req,timeout=15) as res:
                  assert res.status==200
                  return res.read()
          for i in range(45):
              try:
                  receipt=json.loads(fetch('amc8-g1-release.json'))
                  if receipt.get('sourceSha')!=expected or receipt.get('mode')!='release':
                      print('PUBLIC_NOT_YET_CURRENT',receipt,flush=True)
                      time.sleep(10);continue
                  actual={k:hashlib.sha256(fetch(k)).hexdigest() for k in files}
                  if actual==files:
                      print('C_PUBLIC_EXACT_PASS '+json.dumps({'release':receipt,'sha256':actual,'files':len(actual)},sort_keys=True),flush=True)
                      break
                  print('PUBLIC_DIGEST_MISMATCH',actual,flush=True)
              except Exception as exc:
                  print('PUBLIC_RETRY',type(exc).__name__,str(exc),flush=True)
              time.sleep(10)
          else:
              raise SystemExit('C_PUBLIC_EXACT_NOT_VERIFIED')
          PY
