name: AMC8 R1.1 isolated product probe
on:
  push:
    branches: [codex/r11-c-142-publish-check-20261125]
permissions:
  contents: read
jobs:
  c-exact-policy-pin:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Existing gate exact registration delta only
        run: |
          set -euo pipefail
          export GIT_AUTHOR_NAME='AMC8 isolated verification' GIT_AUTHOR_EMAIL='verify@localhost'
          export GIT_COMMITTER_NAME="$GIT_AUTHOR_NAME" GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"
          base=d0c9c3e265a7a76052487d374255fcda35f21117
          candidate=b1387c4e7dac83a0f5ad64b77d8c8879c964538d
          policy=ac6adb262a02b6f59008d4143a4a31cc3ae80214
          test "$(git rev-parse "$candidate^{tree}")" = 41d7d4250b0ab54001b86378f896e36bdb1d8cac
          test "$(git diff --name-only "$base" "$policy" | sort)" = "$(printf '%s\n' code-review/G1/auto_release.py code-review/G1/production_gate.py)"
          for file in production_gate.py auto_release.py; do
            git show "$policy:code-review/G1/$file" > "$RUNNER_TEMP/$file"
            git show "$base:code-review/G1/$file" > "$RUNNER_TEMP/old-$file"
          done
          tree=$(git merge-tree --write-tree "$policy" "$candidate")
          merge=$(echo 'isolated exact C test merge' | git commit-tree "$tree" -p "$policy" -p "$candidate")
          python3 -I -B "$RUNNER_TEMP/production_gate.py" --target main --base "$policy" --head "$candidate" --merge "$merge"
          python3 -I -B "$RUNNER_TEMP/auto_release.py" --mode release --ref "$merge" --main "$merge" --base "$policy" --head "$candidate"
          python3 -I -B "$RUNNER_TEMP/auto_release.py" --mode release --ref "$policy" --main "$policy"
          if python3 -I -B "$RUNNER_TEMP/old-production_gate.py" --target main --base "$policy" --head "$candidate" --merge "$merge"; then
            echo 'old gate unexpectedly accepted new product'; exit 1
          fi
          # Preserve fail-closed behavior for a new unregistered byte.
          export GIT_INDEX_FILE="$RUNNER_TEMP/negative-index"
          git read-tree "$tree"
          blob=$(printf 'unapproved drift\n' | git hash-object -w --stdin)
          git update-index --add --cacheinfo "100644,$blob,assets/r11-unapproved-proof.txt"
          badtree=$(git write-tree)
          bad=$(echo 'isolated negative' | git commit-tree "$badtree" -p "$policy" -p "$candidate")
          if python3 -I -B "$RUNNER_TEMP/production_gate.py" --target main --base "$policy" --head "$candidate" --merge "$bad"; then exit 1; fi
          if python3 -I -B "$RUNNER_TEMP/auto_release.py" --mode release --ref "$bad" --main "$bad"; then exit 1; fi
          echo 'C_EXACT_POLICY_PIN_PASS'
