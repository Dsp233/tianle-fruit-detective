name: AMC8 R1.1 isolated product probe
on:
  push:
    branches: [codex/r11-c-148-publish-check-20261128]
permissions:
  contents: read
jobs:
  c-public-exact:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Verify public release receipt and exact already-tested runtime files
        run: |
          python3 - <<'PY'
          import hashlib,json,time,urllib.request
          root='https://dsp233.github.io/tianle-fruit-detective/'
          expected='db908d35e5dd4bf05f29676d23ba4343fd8be334'
          files={"assets/g1-runtime/0b1eda8940a5fcf5273925ba9f6b8489774360b2b20c7ef36c16eb5e7ab58221.js":"0b1eda8940a5fcf5273925ba9f6b8489774360b2b20c7ef36c16eb5e7ab58221","assets/final-integration/ec18c0db476faa4f07cfd24ffe8ea2be24c5b26bf9695bb209a0d1753a202d89.json":"ec18c0db476faa4f07cfd24ffe8ea2be24c5b26bf9695bb209a0d1753a202d89","assets/final-integration/4ceb7839d3f2c3112a2a0067a6ba221de148add8fa05d1d03bc9ed26b2bdbe6c.json":"4ceb7839d3f2c3112a2a0067a6ba221de148add8fa05d1d03bc9ed26b2bdbe6c","assets/final-integration/2c66c7c6c9b06ea371eb15ea2faf86ef6ce27527ab9f6570937422635a75945d.json":"2c66c7c6c9b06ea371eb15ea2faf86ef6ce27527ab9f6570937422635a75945d","assets/final-integration/5808e21532a4eaceb1d9059d0a99c10d8508df8370890be74e7b2edb44ac5e45.json":"5808e21532a4eaceb1d9059d0a99c10d8508df8370890be74e7b2edb44ac5e45","assets/final-integration/035703af587251d17496da17b82b449d27956b421228afdf42322ecb8e280828.json":"035703af587251d17496da17b82b449d27956b421228afdf42322ecb8e280828","index.html":"cf31e35b32d65346f87597ad36754a00b7d6a61377bb4273b28fc11264ea6073","amc8/index.html":"fe370bde400d6fd1982246e3057d5dba6c9b12aa68c87e3b8c5e381274caeff2","source/index.html":"fe370bde400d6fd1982246e3057d5dba6c9b12aa68c87e3b8c5e381274caeff2"}
          def fetch(path):
              req=urllib.request.Request(root+path+'?r11_c='+expected+'&t='+str(time.time_ns()),headers={'Cache-Control':'no-cache','Pragma':'no-cache'})
              with urllib.request.urlopen(req,timeout=15) as res:
                  assert res.status==200
                  return res.read()
          for i in range(45):
              try:
                  receipt=json.loads(fetch('amc8-g1-release.json'))
                  if receipt.get('sourceSha')!=expected or receipt.get('mode')!='release':
                      print('PUBLIC_NOT_YET_CURRENT',receipt,flush=True)
                      time.sleep(10);continue
                  actual={k:hashlib.sha256(fetch(k)).hexdigest() for k in files}
                  if actual==files:
                      print('C_PUBLIC_EXACT_PASS '+json.dumps({'release':receipt,'sha256':actual,'files':len(actual)},sort_keys=True),flush=True)
                      break
                  print('PUBLIC_DIGEST_MISMATCH',actual,flush=True)
              except Exception as exc:
                  print('PUBLIC_RETRY',type(exc).__name__,str(exc),flush=True)
              time.sleep(10)
          else:
              raise SystemExit('C_PUBLIC_EXACT_NOT_VERIFIED')
          PY
