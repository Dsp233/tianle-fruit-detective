name: AMC8 R1.1 isolated product probe
on:
  push:
    branches: [codex/r11-c-teaching-fixes-20261125]
permissions:
  contents: read
jobs:
  c-public-exact:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Verify public release receipt and exact already-tested runtime files
        run: |
          python3 - <<'PY'
          import hashlib,json,time,urllib.request
          root='https://dsp233.github.io/tianle-fruit-detective/'
          expected='f306ceafc90b16e5794e3e4a1df95101a73e2778'
          files={"assets/final-integration/fce58054a54ffee6dbb8c76605fa25038ffec9d711133784da9d09c07c36efb7.json":"fce58054a54ffee6dbb8c76605fa25038ffec9d711133784da9d09c07c36efb7","assets/final-integration/4a888cc293ba4026c56b44e7c91188b29d1c433de50b3d15f34f1285f8951062.json":"4a888cc293ba4026c56b44e7c91188b29d1c433de50b3d15f34f1285f8951062","assets/final-integration/8dc790c3fb5e62a31f1cd5d4d7737980e513285a5f3958a0a777e29044857c80.json":"8dc790c3fb5e62a31f1cd5d4d7737980e513285a5f3958a0a777e29044857c80","index.html":"8d30939054c8ebba9fc4d7b6dd27fdd0262dd1b3520b39e1f0a2251c34e6ebf7","amc8/index.html":"ae7228ead4b8dc482931f98bdd82818bad64c589aa6d8bda73930814550d7a17","source/index.html":"ae7228ead4b8dc482931f98bdd82818bad64c589aa6d8bda73930814550d7a17"}
          def fetch(path):
              req=urllib.request.Request(root+path+'?r11_c='+expected+'&t='+str(time.time_ns()),headers={'Cache-Control':'no-cache','Pragma':'no-cache'})
              with urllib.request.urlopen(req,timeout=15) as res:
                  assert res.status==200
                  return res.read()
          for i in range(45):
              try:
                  receipt=json.loads(fetch('amc8-g1-release.json'))
                  if receipt.get('sourceSha')!=expected or receipt.get('mode')!='release':
                      print('PUBLIC_NOT_YET_CURRENT',receipt,flush=True)
                      time.sleep(10);continue
                  actual={k:hashlib.sha256(fetch(k)).hexdigest() for k in files}
                  if actual==files:
                      print('C_PUBLIC_EXACT_PASS '+json.dumps({'release':receipt,'sha256':actual,'files':len(actual)},sort_keys=True),flush=True)
                      break
                  print('PUBLIC_DIGEST_MISMATCH',actual,flush=True)
              except Exception as exc:
                  print('PUBLIC_RETRY',type(exc).__name__,str(exc),flush=True)
              time.sleep(10)
          else:
              raise SystemExit('C_PUBLIC_EXACT_NOT_VERIFIED')
          PY
