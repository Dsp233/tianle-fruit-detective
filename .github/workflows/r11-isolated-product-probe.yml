name: AMC8 R1.1 D remaining math delta
on:
  push:
    branches: [codex/r11-d-math-delta-20261124]
    paths:
      - tools/r11-product/d-math-delta.py
      - tools/r11-product/d-math-delta-expected.json
      - .github/workflows/r11-isolated-product-probe.yml
permissions:
  contents: read
jobs:
  remaining-delta:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install existing browser toolchain
        run: |
          python3 -m pip install --user playwright==1.57.0
          python3 -m playwright install --with-deps chromium
      - name: Check restricted historical retention on isolated synthetic fixtures
        run: python3 tools/r11-product/d-restricted-history.py
      - name: Preserve actual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r11-d-restricted-history
          path: r11-probe-output/
          if-no-files-found: warn
