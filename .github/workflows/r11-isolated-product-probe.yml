name: AMC8 R1.1 D independent targeted acceptance
on:
  push:
    branches: [codex/r11-d-independent-20261124]
    paths:
      - '.github/workflows/r11-isolated-product-probe.yml'
permissions:
  contents: read
  actions: read
jobs:
  recover-existing-semantic-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: r11-d-rc73-stage-chromium-${{ matrix.shard }}
          run-id: 45646170985
          github-token: ${{ github.token }}
          path: /tmp/d-original
      - uses: actions/download-artifact@v4
        with:
          name: r11-d-true-hint-delta-chromium-${{ matrix.shard }}
          run-id: 45918409638
          github-token: ${{ github.token }}
          path: /tmp/d-next
      - env:
          D_SHARD: ${{ matrix.shard }}
        run: python3 tools/r11-product/d-r11-rc73-semantic-reuse-20261128.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r11-d-semantic-reuse-${{ matrix.shard }}
          path: r11-probe-output/
  remote-delta:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
        scope: [controls, supply-storage]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: git worktree add --detach /tmp/d-product fcef9785308363379b028129871c92700e1f93d4
      - uses: actions/download-artifact@v4
        if: matrix.scope == 'supply-storage'
        with:
          name: r11-d-shared-continuation-math-C
          run-id: 45918601046
          github-token: ${{ github.token }}
          path: /tmp/d-profile
      - run: |
          python3 -m pip install --user playwright==1.57.0
          python3 -m playwright install --with-deps ${{ matrix.engine }}
      - env:
          D_PRODUCT: /tmp/d-product
          D_ENGINE: ${{ matrix.engine }}
          D_SCOPE: ${{ matrix.scope }}
        run: |
          if [ "$D_SCOPE" = controls ]; then
            python3 tools/r11-product/d-v3-public-control-delta-20261128.py
          else
            python3 tools/r11-product/d-v3-public-supply-storage-20261128.py
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r11-d-remote-${{ matrix.scope }}-${{ matrix.engine }}
          path: r11-probe-output/
