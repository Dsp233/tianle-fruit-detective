name: AMC8 R1.1 isolated product probe
on:
  push:
    branches: [codex/r11-product-engineering-20261124]
permissions:
  contents: read
  actions: read
jobs:
  c-frozen-transfer:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: r11-c-targeted
          run-id: 45500886605
          github-token: ${{ github.token }}
          path: frozen
      - name: Transfer only exact already-tested candidate bytes
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, pathlib
          root=pathlib.Path('frozen')
          m=json.loads((root/'candidate-manifest.json').read_text())
          assert m['base']=='72f2f229246af362f9024db217479357890c8cd3'
          assert m['storageAndDataUnchanged'] is True
          for browser in ('chromium','webkit'):
              r=json.loads((root/f'receipt-{browser}.json').read_text())
              assert r['status']=='PASS' and r['browser']==browser
          for name,digest in m['files'].items():
              body=(root/'overlay'/name).read_bytes()
              assert hashlib.sha256(body).hexdigest()==digest
              encoded=base64.b64encode(body).decode()
              chunks=[encoded[i:i+8000] for i in range(0,len(encoded),8000)]
              for i,c in enumerate(chunks):
                  print('C_FROZEN_CHUNK '+json.dumps(dict(path=name,sha256=digest,index=i,total=len(chunks),base64=c),separators=(',',':')),flush=True)
          print('C_FROZEN_TRANSFER_PASS',flush=True)
          PY
