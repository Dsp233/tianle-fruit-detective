name: AMC8 R1.1 D independent targeted acceptance
on:
  push:
    branches: [codex/r11-d-independent-20261124]
    paths:
      - '.github/workflows/r11-isolated-product-probe.yml'
permissions:
  contents: read
jobs:
  shared-journeys:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Stage formal product, W1 evidence baseline and frozen inputs
        run: |
          git worktree add --detach /tmp/d-product f306ceafc90b16e5794e3e4a1df95101a73e2778
          git worktree add --detach /tmp/d-w1 8618cbe108a58c6f13664cca0f2ffe6a70600f06
          git show 8a406106c976dac5e4b368dbb86048b5da1419a8:tools/r11-product/d-deep-wrong-expected.json > /tmp/d-deep-wrong-expected.json
      - name: Existing browser toolchain
        run: |
          python3 -m pip install --user playwright==1.57.0
          python3 -m playwright install --with-deps chromium webkit
      - name: Shared normal math and diagnostic journeys
        env:
          D_PRODUCT: /tmp/d-product
          D_EVIDENCE: ${{ github.workspace }}
        run: python3 tools/r11-product/d-complete-shared-journeys.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r11-d-complete-shared-journeys
          path: r11-probe-output/
