name: AMC8 R1.1 D independent targeted acceptance
on:
  push:
    branches: [codex/r11-d-independent-20261124]
permissions:
  contents: read
jobs:
  same-release-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        script: [d-bulk-grade]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install existing browser toolchain
        run: |
          python3 -m pip install --user playwright==1.57.0
          python3 -m playwright install --with-deps chromium
      - name: Execute independent D attempt on frozen production bytes
        env:
          D_EXPECTED_FILE: d-bulk-expected-04.json
        run: python3 tools/r11-product/${{ matrix.script }}.py
      - name: Preserve actual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r11-${{ matrix.script }}
          path: r11-probe-output/
          if-no-files-found: warn
