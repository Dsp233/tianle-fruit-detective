name: AMC8 R1.1 D independent targeted acceptance
on:
  push:
    branches: [codex/r11-d-independent-20261124]
    paths:
      - '.github/workflows/r11-isolated-product-probe.yml'
permissions:
  contents: read
  actions: read
jobs:
  recover-profile-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/download-artifact@v4
        with:
          pattern: r11-d-shared-continuation-*
          run-id: 45918601046
          github-token: ${{ github.token }}
          path: /tmp/d-profile-results
      - run: python3 tools/r11-product/d-shared-profile-evidence-recovery-20261127.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r11-d-profile-evidence-recovery
          path: r11-probe-output/
  retry-reading-d-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: git worktree add --detach /tmp/d-product fcef9785308363379b028129871c92700e1f93d4
      - uses: actions/download-artifact@v4
        with:
          name: r11-d-reconstructed-cross-module
          run-id: 45526410091
          github-token: ${{ github.token }}
          path: /tmp/d-prior
      - run: |
          python3 -m pip install --user playwright==1.57.0
          python3 -m playwright install --with-deps webkit
          sed -i 's/p.set_default_timeout(12000)/p.set_default_timeout(60000)/g' tools/r11-product/d-shared-profile-continuation-20261127.py
      - env:
          D_PRODUCT: /tmp/d-product
          D_EVIDENCE: ${{ github.workspace }}
          D_PRIOR: /tmp/d-prior
          D_ENGINE: webkit
          D_KIND: reading
          D_PROFILE: D
        run: python3 tools/r11-product/d-shared-profile-continuation-20261127.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r11-d-reading-D-retry
          path: r11-probe-output/
