name: R1.1 D frozen holdout grade
on:
  push:
    branches: [codex/r11-d-holdout-20261124]
jobs:
  grade:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: pip install playwright==1.57.0 && python -m playwright install --with-deps chromium
      - run: python tools/r11-product/d-r12-holdout-grade.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r12-holdout-grade
          path: r11-probe-output/
