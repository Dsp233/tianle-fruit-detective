name: AMC8 R1.1 D independent targeted acceptance
on:
  push:
    branches: [codex/r11-d2-final-20261128]
    paths:
      - '.github/workflows/r11-isolated-product-probe.yml'
permissions:
  contents: read
  actions: read
jobs:
  uncovered-journey:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: git worktree add --detach /tmp/d-product fcef9785308363379b028129871c92700e1f93d4
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 46121359271
          name: r11-d-uncovered-natural-${{ matrix.engine }}
          path: /tmp/d-latest
      - run: |
          python3 -m pip install --user playwright==1.57.0
          python3 -m playwright install --with-deps ${{ matrix.engine }}
      - env:
          D_PRODUCT: /tmp/d-product
          D_ENGINE: ${{ matrix.engine }}
        run: python3 tools/r11-product/d-r11-d2-natural-continuation-20261128.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r11-d2-natural-${{ matrix.engine }}
          path: r11-probe-output/
