name: AMC8 R1.1 D independent targeted acceptance
on:
  push:
    branches: [codex/r11-d-independent-20261124]
    paths:
      - '.github/workflows/r11-isolated-product-probe.yml'
permissions:
  contents: read
jobs:
  experience-restore:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Stage exact formal product and current score recipes
        run: |
          git worktree add --detach /tmp/d-product f306ceafc90b16e5794e3e4a1df95101a73e2778
          git show a10d6907f0372a51f6aaa979cf731ff247d2687f:tools/r11-product/d-six-dimension-score-20261125.json > /tmp/d-score-input.json
      - name: Existing browser toolchain
        run: |
          python3 -m pip install --user playwright==1.57.0
          python3 -m playwright install --with-deps chromium
      - name: Actual draft reentry and weighted revision 5 diagram
        env:
          D_PRODUCT: /tmp/d-product
        run: python3 tools/r11-product/d-experience-restore-delta.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r11-d-experience-restore-delta
          path: r11-probe-output/
