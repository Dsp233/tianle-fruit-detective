name: AMC8 R1.1 isolated product probe
on:
  push:
    branches: [codex/r11-product-engineering-20261124]
permissions:
  contents: read
jobs:
  c-public-exact:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Verify public release receipt and exact already-tested runtime files
        run: |
          python3 - <<'PY'
          import hashlib,json,time,urllib.request
          root='https://dsp233.github.io/tianle-fruit-detective/'
          expected='3f22d8002406857a33a3e254ebafc4366f6cec51'
          files={
              'index.html':'d51b53efa75987524e998737af53e57c8447ff7734d34806012f6cdaec17f69b',
              'amc8/index.html':'3c8364ba96edae42fa1b4c1cfa431dc2f8d91ba867f8fa46965a83ba91061adf',
              'source/index.html':'3c8364ba96edae42fa1b4c1cfa431dc2f8d91ba867f8fa46965a83ba91061adf',
              'assets/final-integration/380ef6c47de0a037bae3adb35093d7a731e48c837074fff78166bfabb95f1cd1.json':'380ef6c47de0a037bae3adb35093d7a731e48c837074fff78166bfabb95f1cd1',
              'assets/final-integration/5f64b99618ef66f1ac71a51342bf2499f4bc88a209d705953400c8041d5e6589.json':'5f64b99618ef66f1ac71a51342bf2499f4bc88a209d705953400c8041d5e6589'
          }
          def fetch(path):
              req=urllib.request.Request(root+path+'?r11_c='+expected+'&t='+str(time.time_ns()),headers={'Cache-Control':'no-cache','Pragma':'no-cache'})
              with urllib.request.urlopen(req,timeout=15) as res:
                  assert res.status==200
                  return res.read()
          for i in range(45):
              try:
                  receipt=json.loads(fetch('amc8-g1-release.json'))
                  if receipt.get('sourceSha')!=expected or receipt.get('mode')!='release':
                      print('PUBLIC_NOT_YET_CURRENT',receipt,flush=True)
                      time.sleep(10);continue
                  actual={k:hashlib.sha256(fetch(k)).hexdigest() for k in files}
                  if actual==files:
                      print('C_PUBLIC_EXACT_PASS '+json.dumps({'release':receipt,'sha256':actual,'files':len(actual)},sort_keys=True),flush=True)
                      break
                  print('PUBLIC_DIGEST_MISMATCH',actual,flush=True)
              except Exception as exc:
                  print('PUBLIC_RETRY',type(exc).__name__,str(exc),flush=True)
              time.sleep(10)
          else:
              raise SystemExit('C_PUBLIC_EXACT_NOT_VERIFIED')
          PY
