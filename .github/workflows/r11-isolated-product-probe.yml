name: AMC8 R1.1 D remote remaining controls
on:
  push:
    branches: [codex/r11-d-independent-20261124]
permissions:
  contents: read
jobs:
  remote-delta:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: |
          python3 -m pip install --user playwright==1.57.0
          python3 -m playwright install --with-deps chromium
      - run: python3 tools/r11-product/d-v3-remote-final.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r11-d-v3-remote-final
          path: r11-probe-output/
