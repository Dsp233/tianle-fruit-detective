name: RC67 isolated browser regression

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Read existing repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Playwright library without a browser download
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm install --prefix "$RUNNER_TEMP/rc67-playwright" --ignore-scripts --no-audit --no-fund playwright@1.62.1
      - name: Restore frozen source and run real isolated HTTP Chrome tests
        env:
          NODE_PATH: ${{ runner.temp }}/rc67-playwright/node_modules
        run: python3 muse/qa-browser-runner.py
      - name: Preserve actual results, console logs, geometry and screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rc67-browser-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rc67-browser/evidence/
          if-no-files-found: error
          retention-days: 3
