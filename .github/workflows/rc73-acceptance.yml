name: RC78 stage accepted pages
on:
  workflow_dispatch:
    inputs:
      acceptance_run_id:
        description: Successful complete RC78 R3 acceptance run
        required: true
      candidate_package:
        description: Frozen candidate receipt basename
        default: AMC8_RC78_152_R3_candidate.zip
        required: true
permissions:
  contents: read
  actions: read
concurrency:
  group: rc78-stage-accepted-pages
  cancel-in-progress: false
jobs:
  stage:
    if: github.ref == 'refs/heads/rc75-release'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
      - name: Download the exact complete acceptance ledger
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: rc78-complete-acceptance
          run-id: ${{ inputs.acceptance_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/passed-acceptance
      - name: Reconstruct and verify the exact frozen candidate
        env:
          CANDIDATE_PACKAGE: ${{ inputs.candidate_package }}
        run: python3 rc78_ci_unpack_overlay.py "$CANDIDATE_PACKAGE" "${CANDIDATE_PACKAGE%.zip}.json" "$RUNNER_TEMP/stage-candidate"
      - name: Verify every release gate and stage only declared public files
        env:
          ACCEPTANCE_RUN_ID: ${{ inputs.acceptance_run_id }}
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib,shutil,subprocess
          root=pathlib.Path.cwd();candidate=pathlib.Path(os.environ['RUNNER_TEMP'])/'stage-candidate'
          accepted=pathlib.Path(os.environ['RUNNER_TEMP'])/'passed-acceptance'
          c=json.loads((candidate/'release-contract.json').read_text())
          r=json.loads((accepted/'ci-receipt.json').read_text())
          a=json.loads((accepted/'acceptance.json').read_text())
          assert c['buildId']=='9e69297e22e54b75852e079c4823a6311b3577734a9cc35a11b331df3aae938d'
          assert r['buildId']==c['buildId']==a['buildId']
          assert r['sourceCommit']==c['sourceCommit']
          assert r['buildSha256']==c['buildSha256']
          assert str(r['runId'])==os.environ['ACCEPTANCE_RUN_ID']
          assert r['developmentResult']=='PASS' and a['result']=='PASS'
          assert r['logicalTasks']==73 and not r['failedTasks'] and not r['populationErrors']
          assert len(a['cases'])==73 and all(x['status'] in ['PASS','POLICY_PASS'] for x in a['cases'])
          assert all(v['status']=='PASS' for v in r['selfVerification'].values())
          for name in ['matrix','browser']:
              assert r['populations'][name]['instances']==765
              assert r['populations'][name]['completeIdentitySet'] is True
          def remote(branch):
              value=subprocess.check_output(['git','ls-remote','--heads','origin','refs/heads/'+branch],text=True)
              assert len(value.splitlines())==1
              return value.split()[0]
          assert remote('main')=='4dc544d67d59b4bd0bc710e77290519cad8ae269','Main changed; review the newer main before staging'
          assert remote('rc75-release')==os.environ['GITHUB_SHA'],'Candidate branch changed during staging'
          allowed={'index.html','source/index.html','amc8/index.html','academy/index.html','qa/index.html','qa/normal/index.html','qa/history/index.html','muse/rc78/maintenance.html'}
          assert set(c['files'])==allowed
          paths=[]
          for name in sorted(allowed):
              data=(candidate/name).read_bytes()
              assert hashlib.sha256(data).hexdigest()==c['files'][name]
              target=root/name;target.parent.mkdir(parents=True,exist_ok=True);target.write_bytes(data)
              paths.append(name)
          for source,name in [(candidate/'release-contract.json','muse/rc78/release-contract.json'),(accepted/'ci-receipt.json','muse/rc78/ci-receipt.json')]:
              target=root/name;target.parent.mkdir(parents=True,exist_ok=True);shutil.copy2(source,target);paths.append(name)
          receipt={'schema':1,'phase':'STAGED_FOR_MAIN','buildId':c['buildId'],'buildSha256':c['buildSha256'],'acceptanceRunId':r['runId'],'stagingRunId':os.environ['GITHUB_RUN_ID'],'rollbackCommit':'4dc544d67d59b4bd0bc710e77290519cad8ae269','files':c['files'],'productionFeatureFlags':c['release']['features']}
          name='muse/rc78/staging-receipt.json';(root/name).write_text(json.dumps(receipt,ensure_ascii=False,indent=2)+'\n');paths.append(name)
          subprocess.run(['git','add','--',*paths],check=True)
          subprocess.run(['git','-c','user.name=github-actions[bot]','-c','user.email=41898282+github-actions[bot]@users.noreply.github.com','commit','-m','Stage RC78.152 R3 pages after complete acceptance'],check=True)
          subprocess.run(['git','push','origin','HEAD:refs/heads/rc75-release'],check=True)
          commit=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          print(json.dumps({'result':'PASS','stagedCommit':commit,**receipt},ensure_ascii=False))
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a')as f:
              f.write('RC78 frozen pages staged on rc75-release.\n\nCommit: '+commit+'\n\nAcceptance run: '+str(r['runId'])+'\n\nMain is unchanged; merge the reviewed release branch to publish through the existing Pages configuration.\n')
          PY
