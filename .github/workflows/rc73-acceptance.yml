name: RC73 immutable candidate acceptance
on:
  push:
    branches: [rc73-release]
    paths: ['rc73-native-code-only.zip', 'rc73-native-code-only.json', '.github/workflows/rc73-acceptance.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  core:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify and unpack the frozen candidate
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib,zipfile
          package=pathlib.Path('rc73-native-code-only.zip')
          assert hashlib.sha256(package.read_bytes()).hexdigest()==json.load(open('rc73-native-code-only.json'))['zipSha256']
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'rc70-candidate'
          out.mkdir()
          with zipfile.ZipFile(package)as z:
              manifest=json.loads(z.read('transfer-manifest.json'))
              for row in manifest['files']:
                  assert hashlib.sha256(z.read(row['path'])).hexdigest()==row['sha256']
              for name in z.namelist():assert (out/name).resolve().is_relative_to(out.resolve())
              z.extractall(out)
          PY
      - name: Run isolated CPU, history and complete instance matrix
        run: python3 "$RUNNER_TEMP/rc70-candidate/source/rc70_ci.py" cpu
      - name: Preserve CPU attempts and original evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: rc70-raw-core
          path: ${{ runner.temp }}/rc70-run/
          if-no-files-found: error
          retention-days: 90
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install pinned Playwright without browser download
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm install --prefix "$RUNNER_TEMP/rc70-playwright" --ignore-scripts --no-audit --no-fund playwright@1.62.1
      - name: Verify and unpack the frozen candidate
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib,zipfile
          package=pathlib.Path('rc73-native-code-only.zip')
          assert hashlib.sha256(package.read_bytes()).hexdigest()==json.load(open('rc73-native-code-only.json'))['zipSha256']
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'rc70-candidate'
          out.mkdir()
          with zipfile.ZipFile(package)as z:
              manifest=json.loads(z.read('transfer-manifest.json'))
              for row in manifest['files']:
                  assert hashlib.sha256(z.read(row['path'])).hexdigest()==row['sha256']
              for name in z.namelist():assert (out/name).resolve().is_relative_to(out.resolve())
              z.extractall(out)
          PY
      - name: Execute actual Chrome events with isolated contexts
        env:
          NODE_PATH: ${{ runner.temp }}/rc70-playwright/node_modules
        run: python3 "$RUNNER_TEMP/rc70-candidate/source/rc70_ci.py" browser ${{ matrix.shard }}
      - name: Preserve native screenshots, DOM and every result
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: rc70-raw-browser-${{ matrix.shard }}
          path: ${{ runner.temp }}/rc70-run/
          if-no-files-found: error
          retention-days: 90
  collect:
    if: always()
    needs: [core, browser]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          pattern: rc70-raw-*
          path: ${{ runner.temp }}/rc70-raw
      - name: Verify candidate and aggregate all required logical cases
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib,subprocess,zipfile
          package=pathlib.Path('rc73-native-code-only.zip')
          assert hashlib.sha256(package.read_bytes()).hexdigest()==json.load(open('rc73-native-code-only.json'))['zipSha256']
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'rc70-candidate'
          out.mkdir()
          with zipfile.ZipFile(package)as z:
              manifest=json.loads(z.read('transfer-manifest.json'))
              for row in manifest['files']:assert hashlib.sha256(z.read(row['path'])).hexdigest()==row['sha256']
              for name in z.namelist():assert (out/name).resolve().is_relative_to(out.resolve())
              z.extractall(out)
          subprocess.run(['python3',str(out/'source/rc70_ci.py'),'collect',str(pathlib.Path(os.environ['RUNNER_TEMP'])/'rc70-raw')],check=True)
          PY
      - name: Preserve complete acceptance ledger
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: rc70-complete-acceptance
          path: ${{ runner.temp }}/rc70-merged/
          if-no-files-found: error
          retention-days: 90
