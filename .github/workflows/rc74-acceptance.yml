name: RC78 R5 table narration native diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  narration_diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify the complete immutable R5 tree
        run: python3 rc78_ci_unpack_overlay.py AMC8_RC78_152_R5_candidate.zip AMC8_RC78_152_R5_candidate.json "$RUNNER_TEMP/diagnostic-candidate"
      - name: Install the pinned native browser
        run: |
          npm install --prefix "$RUNNER_TEMP/rc78-playwright" --ignore-scripts --no-audit --no-fund playwright@1.62.1
          "$RUNNER_TEMP/rc78-playwright/node_modules/.bin/playwright" install chromium
          echo "NODE_PATH=$RUNNER_TEMP/rc78-playwright/node_modules" >> "$GITHUB_ENV"
          NODE_PATH="$RUNNER_TEMP/rc78-playwright/node_modules" node -e 'console.log("AMC8_BROWSER_EXECUTABLE="+require("playwright").chromium.executablePath())' >> "$GITHUB_ENV"
      - name: Load a separately identified four-case diagnostic copy
        run: |
          python3 - <<'PY'
          import hashlib,os,pathlib,zipfile
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'diagnostic-candidate'
          assert hashlib.sha256((root/'source/test_rtm1_browser.js').read_bytes()).hexdigest()=='c85335d13570afadf030ff6f58ede4236b8714827b55debd9fd9552f06070b04'
          patch=pathlib.Path('rc78-narration-diagnostic-r5.zip')
          assert hashlib.sha256(patch.read_bytes()).hexdigest()=='cbca735f34aa8a04e284674d8efad4bf483deef4267e4f3970a04414dc349ab0'
          with zipfile.ZipFile(patch)as z:
              assert z.namelist()==['source/test_rtm1_narration_diagnostic_r5.js']
              z.extractall(root)
          print('NON-GATING diagnostic working copy; frozen R5 source and public pages unchanged')
          PY
      - name: Exercise both authored tables and plain-text controls in native Chromium
        env:
          AMC8_RC70_CANDIDATE: ${{ runner.temp }}/diagnostic-candidate
          AMC8_RC70_EVIDENCE: ${{ runner.temp }}/narration-diagnostic
          AMC8_RC70_SHARD: '0'
          AMC8_RC70_SHARDS: '1'
        run: node --max-old-space-size=768 "$RUNNER_TEMP/diagnostic-candidate/source/test_rtm1_narration_diagnostic_r5.js"
      - name: Verify the exact diagnostic identity set and table row counts
        run: |
          python3 - <<'PY'
          import json,os,pathlib
          d=json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'narration-diagnostic/rtm1-browser-0.json').read_text())
          rows={r['caseId']:r for r in d['rows']}
          assert len(d['rows'])==4 and set(rows)=={'AMC8-2001-17','AMC8-2026-02','AMC8-2000-01','RTM-2026-10-DECISION'}
          assert all(r['status']=='PASS' for r in rows.values())
          assert rows['AMC8-2001-17']['statementTableRows']==2
          assert rows['AMC8-2026-02']['statementTableRows']==5
          assert rows['AMC8-2000-01']['statementTableRows']==0
          assert rows['RTM-2026-10-DECISION']['statementTableRows']==0
          print(json.dumps({'result':'PASS','nonGating':True,'nativeCases':4,'authoredTables':2,'tableRows':7,'frozenBuildId':'6ae6256965a7812aa21a103ecaf444eb4090e76a5d8bea37db225b81c41f7b4a','learningEffect':'NOT_MEASURED'}))
          PY
      - name: Preserve the complete diagnostic
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: rc78-r5-narration-diagnostic
          path: ${{ runner.temp }}/narration-diagnostic/
          if-no-files-found: error
          retention-days: 90
