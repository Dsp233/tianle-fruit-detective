name: RC78 native diagnostics
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify and unpack immutable R2 base
        run: python3 source/rc78_ci_unpack.py AMC8_RC78_152_candidate.zip AMC8_RC78_152_candidate.json "$RUNNER_TEMP/rc70-candidate"
      - name: Install pinned native tooling
        run: |
          npm install --prefix "$RUNNER_TEMP/rc78-playwright" --ignore-scripts --no-audit --no-fund playwright@1.62.1
          "$RUNNER_TEMP/rc78-playwright/node_modules/.bin/playwright" install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/rc78-playwright/node_modules" >> "$GITHUB_ENV"
          NODE_PATH="$RUNNER_TEMP/rc78-playwright/node_modules" node -e 'console.log("AMC8_BROWSER_EXECUTABLE="+require("playwright").chromium.executablePath())' >> "$GITHUB_ENV"
      - name: Prepare non-gating diagnostic variants
        run: |
          python3 - <<'PYDIAG'
          from pathlib import Path
          import os
          r=Path(os.environ['RUNNER_TEMP'])/'rc70-candidate/source'
          for name in ['test_joint_extended_browser.js','test_rc78_performance_browser.js']:
              p=r/name;s=p.read_text();s=s.replace("""await page.locator('[data-action="knowledge"]').first().click();""","""await page.locator('details.topic-parent > summary').click();await page.locator('[data-action="knowledge"]').first().click();""")
              if name=='test_joint_extended_browser.js':s=s.replace('families=all.filter((_,i)=>i%shards===shard)','families=all.slice(0,1)')
              p.write_text(s)
          p=r/'test_rtm1_browser.js';s=p.read_text();s=s.replace('cases.filter((_,i)=>i%shards===shard)',"""[cases[0],cases.find(c=>c.kind==='exam'&&c.definition.answerContract.kind==='choice'),cases.find(c=>c.kind==='training'),...cases.filter(c=>c.id.startsWith('CONNECTED-'))]""")
          s=s.replace("await page.content()", "await page.locator('#app').evaluate(el=>el.outerHTML)")
          p.write_text(s)
          print('NON-GATING: diagnostic test variants; original frozen R2 package unchanged')
          PYDIAG
      - name: Diagnose selected original, training and connected paths
        continue-on-error: true
        env:
          AMC8_RC70_EVIDENCE: ${{ runner.temp }}/rc78-diagnostics/rtm
        run: node "$RUNNER_TEMP/rc70-candidate/source/test_rtm1_browser.js"
      - name: Diagnose all five roles in one joint family
        continue-on-error: true
        env:
          AMC8_RC70_EVIDENCE: ${{ runner.temp }}/rc78-diagnostics/joint
        run: |
          node "$RUNNER_TEMP/rc70-candidate/source/test_joint_extended_browser.js"
          cat "$RUNNER_TEMP/rc78-diagnostics/joint/joint-native-0.json"
      - name: Diagnose actual performance and layout
        continue-on-error: true
        env:
          AMC8_RC70_EVIDENCE: ${{ runner.temp }}/rc78-diagnostics/performance
        run: |
          node "$RUNNER_TEMP/rc70-candidate/source/test_rc78_performance_browser.js"
          cat "$RUNNER_TEMP/rc78-diagnostics/performance/performance.json"
      - name: Preserve diagnostic evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: rc78-native-diagnostics
          path: ${{ runner.temp }}/rc78-diagnostics/
          if-no-files-found: error
          retention-days: 90
