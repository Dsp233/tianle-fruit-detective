name: RC78 full joint native diagnostics
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  joint_diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify original frozen base for diagnostic working copy
        run: python3 source/rc78_ci_unpack.py AMC8_RC78_152_candidate.zip AMC8_RC78_152_candidate.json "$RUNNER_TEMP/diagnostic-candidate"
      - name: Install pinned browser on the standard runner image
        run: |
          npm install --prefix "$RUNNER_TEMP/rc78-playwright" --ignore-scripts --no-audit --no-fund playwright@1.62.1
          "$RUNNER_TEMP/rc78-playwright/node_modules/.bin/playwright" install chromium
          echo "NODE_PATH=$RUNNER_TEMP/rc78-playwright/node_modules" >> "$GITHUB_ENV"
          NODE_PATH="$RUNNER_TEMP/rc78-playwright/node_modules" node -e 'console.log("AMC8_BROWSER_EXECUTABLE="+require("playwright").chromium.executablePath())' >> "$GITHUB_ENV"
      - name: Verify diagnostic test-only corrections
        run: |
          python3 - <<'PY'
          import hashlib,os,pathlib,zipfile
          p=pathlib.Path('rc78-native-fixes-r4.zip')
          assert hashlib.sha256(p.read_bytes()).hexdigest()=='ab7a7a21f9c2dd1923b163bd04966ed6b7ec3736d7b05777ec108149daeb6a0c'
          with zipfile.ZipFile(p)as z:
              assert set(z.namelist())=={'source/test_joint_extended_browser.js','source/test_rc78_performance_browser.js','source/test_rtm1_browser.js','source/run_rc70_gates.py','source/test_solutions.js'}
              z.extractall(pathlib.Path(os.environ['RUNNER_TEMP'])/'diagnostic-candidate')
          print('NON-GATING diagnostic working copy; original frozen base archive unchanged')
          PY
      - name: Execute all 420 joint instances in four isolated native workers
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib,subprocess
          temp=pathlib.Path(os.environ['RUNNER_TEMP']);root=temp/'diagnostic-candidate';out=temp/'joint-diagnostics-r4';out.mkdir()
          assert hashlib.sha256((root/'index.html').read_bytes()).hexdigest()=='ea85d2ec1fb590788a1599b2e0121bfde80f2a44fec907e11cf6fb984c890404'
          processes=[]
          for shard in range(4):
              folder=out/str(shard);folder.mkdir();log=(folder/'stdout.log').open('w')
              env={**os.environ,'AMC8_RC70_CANDIDATE':str(root),'AMC8_RC70_EVIDENCE':str(folder),'AMC8_RC70_SHARD':str(shard),'AMC8_RC70_SHARDS':'4'}
              p=subprocess.Popen(['node','--max-old-space-size=768',str(root/'source/test_joint_extended_browser.js')],env=env,stdout=log,stderr=subprocess.STDOUT)
              processes.append((shard,p,log))
          rows=[];codes=[]
          for shard,p,log in processes:
              code=p.wait();log.close();codes.append(code);report=out/str(shard)/('joint-native-'+str(shard)+'.json')
              if report.exists():rows+=json.loads(report.read_text())['rows']
              if code:print((out/str(shard)/'stdout.log').read_text()[-12000:])
          ids=[r['taskId'] for r in rows if r.get('status')=='PASS']
          expected={i['id'] for f in json.loads((root/'source/joint_families.json').read_text())['families'] if f.get('protocol')=='FIVE_ROLE_APPLICATION_152' for i in f['instances']}
          ok=not any(codes) and len(ids)==420 and len(set(ids))==420 and set(ids)==expected and all(r.get('status')=='PASS' for r in rows)
          names=['test_joint_extended_browser.js','test_solutions.js']
          result={'result':'PASS' if ok else 'FAIL','nonGating':True,'expectedInstances':420,'nativePassedInstances':len(ids),'completeIdentitySet':set(ids)==expected,'sourceHashes':{n:hashlib.sha256((root/'source'/n).read_bytes()).hexdigest() for n in names},'rows':rows,'learningEffect':'NOT_MEASURED'}
          (out/'native-joint-diagnostic.json').write_text(json.dumps(result,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps({k:v for k,v in result.items() if k!='rows'},ensure_ascii=False))
          raise SystemExit(0 if ok else 1)
          PY
      - name: Preserve all native diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: rc78-r4-joint-diagnostic
          path: ${{ runner.temp }}/joint-diagnostics-r4/
          if-no-files-found: error
          retention-days: 90
