name: RC79 FIX13 and preview public evidence availability
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/rc79-fix13-v31-evidence.yml
      - muse/rc79/fix13/public-receipt.json
      - muse/rc79/fix13/public-*.json
      - pilot-reading-v3/public-receipt.json
      - pilot-reading-v3/public-public-byte-check.json
      - pilot-reading-v3/public-pilot-browser.json
      - pilot-reading-v3/history/v3-public-receipt.json
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Verify evidence files served publicly match this commit
        run: |
          python3 - <<'PY'
          import hashlib,os,time,urllib.request
          from pathlib import Path
          base='https://dsp233.github.io/tianle-fruit-detective/'
          paths=sorted(str(p) for p in Path('muse/rc79/fix13').glob('public-*.json'))
          paths+=['pilot-reading-v3/public-receipt.json','pilot-reading-v3/public-public-byte-check.json','pilot-reading-v3/public-pilot-browser.json','pilot-reading-v3/history/v3-public-receipt.json']
          assert len(paths)>=16
          hashes={p:hashlib.sha256(Path(p).read_bytes()).hexdigest() for p in paths}
          for attempt in range(45):
              matched=[]
              for p in paths:
                  try:
                      req=urllib.request.Request(base+p+'?evidence='+os.environ['GITHUB_SHA'],headers={'Cache-Control':'no-cache'})
                      with urllib.request.urlopen(req,timeout=15) as r: data=r.read()
                      if hashlib.sha256(data).hexdigest()==hashes[p]: matched.append(p)
                  except Exception: pass
              if len(matched)==len(paths):
                  print('PASS: public evidence files:',len(paths));break
              print('Waiting for public evidence:',len(matched),'/',len(paths),flush=True)
              time.sleep(10)
          else: raise SystemExit('Public evidence did not match expected commit')
          PY
