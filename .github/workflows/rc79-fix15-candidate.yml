name: RC79 FIX15 record safety candidate and staging
on:
  push:
    branches: [rc79-fix15-migration-20261031]
    paths: [github-upload/rc79-fix15/READY.json]
concurrency:
  group: rc79-fix15-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
  actions: read
jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: home-h1-frozen
          run-id: 40294526884
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/fix15-package
      - name: Reconstruct prior release and apply hash-checked route changes
        run: |
          python3 github-upload/unpack_rc79_reading.py "$RUNNER_TEMP/fix15-package/RC79_HOME1_candidate.zip" "$RUNNER_TEMP/fix15-package/RC79_HOME1_candidate.json" "$RUNNER_TEMP/fix15-candidate"
          python3 github-upload/rc79-fix6/build_baseline.py "$RUNNER_TEMP/fix15-candidate/source"
          python3 github-upload/rc79-fix15/ci_prepare.py "$RUNNER_TEMP/fix15-candidate"
          python3 github-upload/rc79-fix13/build_preserve.py "$RUNNER_TEMP/fix15-candidate/source"
          python3 github-upload/rc79-fix6/verify_prior_mappings.py "$RUNNER_TEMP/fix15-candidate/source"
          (cd "$RUNNER_TEMP/fix15-candidate" && python3 source/build_qa.py)
          mkdir -p /tmp/fix15-evidence
          sha256sum "$RUNNER_TEMP/fix15-candidate/index.html" | cut -d' ' -f1 > /tmp/fix15-evidence/raw-build.sha256
      - name: Verify synthetic diagnostic and inherited regressions
        run: |
          node github-upload/rc79-fix15/test_transaction_store.js > /tmp/fix15-evidence/store-unit.json
          node github-upload/rc79-fix15/test_initial_snapshot_race.js > /tmp/fix15-evidence/initial-race.json
          cd "$RUNNER_TEMP/fix15-candidate"
          node source/test_storage_faults_152.js
          node source/test_fix9_diagnostic_c.js
          node source/test_fix9_diagnostic_ui.js
          node source/test_fix7_diagnostic_d.js
          node source/test_fix7_diagnostic_d_ui.js
          node source/reading_engine_test.js
          cp docs/reading/engine_test_results.json /tmp/fix15-evidence/engine-test-results.json
          cp "$GITHUB_WORKSPACE/github-upload/rc79-fix15/test_fix15_migration_engine.js" source/test_fix15_migration_engine.js
          node source/test_fix15_migration_engine.js
          cp docs/reading/engine_test_results.json /tmp/fix15-evidence/engine-migration-test-results.json
          cp "$GITHUB_WORKSPACE/github-upload/rc79-fix15/test_fix15_unified_export.js" source/test_fix15_unified_export.js
          node source/test_fix15_unified_export.js > /tmp/fix15-evidence/unified-export-test.json
          node "$GITHUB_WORKSPACE/github-upload/rc79-fix15/test_transactional_upgrade.js" > /tmp/fix15-evidence/transactional-upgrade-test.json
          node source/reading_media_test.js
          node source/test_fix12_percent_ui.js
          node source/test_rtm1_runtime.js > /tmp/fix15-evidence/math-runtime.json
          node source/test_fix10_reading_routes.js
          node source/test_fix79_reading_challenge.js
          node source/test_fix8_reading_order.js
          node source/test_fix8_reading_storage.js
          node source/test_fix79_storage_retry.js
          node source/test_fix79_family_sources.js
          node source/test_fix2_parent_review.js
          node source/test_fix12_family_projection.js
          node source/test_fix13_exam_selection.js
          node source/test_fix13_home_portal.js
          node source/test_fix79_reading_feedback.js
          node source/test_fix6_reading_feedback.js
          node source/reading_integration_test.js --html source/index.html --out /tmp/fix15-evidence/full-reading-integration.json
      - name: Install isolated browser runtime
        run: |
          npm install --prefix /tmp/fix15-browser playwright@1.57.0
          docker pull mcr.microsoft.com/playwright:v1.57.0-noble
      - name: Verify raw storage and diagnostic interactions
        run: |
          docker run --rm --init --ipc=host -e NODE_PATH=/work/runtime/node_modules \
            -v "$RUNNER_TEMP/fix15-candidate:/work/candidate:ro" -v /tmp/fix15-browser:/work/runtime:ro \
            -v /tmp/fix15-evidence:/tmp/fix15-evidence -w /work/candidate \
            mcr.microsoft.com/playwright:v1.57.0-noble node source/test_fix8_storage_browser.js . /tmp/fix15-evidence
          docker run --rm --init --ipc=host -e NODE_PATH=/work/runtime/node_modules \
            -v "$RUNNER_TEMP/fix15-candidate:/work/candidate:ro" -v /tmp/fix15-browser:/work/runtime:ro \
            -v /tmp/fix15-evidence:/tmp/fix15-evidence -w /work/candidate \
            mcr.microsoft.com/playwright:v1.57.0-noble node source/test_fix9_diagnostic_browser.js . /tmp/fix15-evidence/raw-diagnostic
      - name: Package verified candidate and create identity
        run: |
          python3 github-upload/rc79-fix15/stage_candidate.py "$RUNNER_TEMP/fix15-candidate"
          python3 github-upload/rc79-fix15/ci_stage.py "$RUNNER_TEMP/fix15-candidate"
          python3 github-upload/rc79-fix15/build_manifest.py . "$GITHUB_SHA" "$(cat /tmp/fix15-evidence/raw-build.sha256)"
          python3 github-upload/rc79-fix6/load2-tools/check_payloads.py
          node github-upload/rc79-fix6/test_fix79_loader_window.js
      - name: Verify packaged loading and focused interactions
        run: |
          docker run --rm --init --ipc=host -e NODE_PATH=/work/runtime/node_modules -v "$PWD:/work/site:ro" \
            -v /tmp/fix15-browser:/work/runtime:ro -v /tmp/fix15-evidence:/tmp/fix15-evidence -w /work/site \
            mcr.microsoft.com/playwright:v1.57.0-noble node github-upload/rc79-fix15/test_loader_browser.js . /tmp/fix15-evidence
          docker run --rm --init --ipc=host -e NODE_PATH=/work/runtime/node_modules -e FIX79_LOCAL_ROOT=/work/site -e FIX79_EVIDENCE_DIR=/tmp/fix15-evidence \
            -v "$PWD:/work/site:ro" -v /tmp/fix15-browser:/work/runtime:ro -v /tmp/fix15-evidence:/tmp/fix15-evidence -w /work/site \
            mcr.microsoft.com/playwright:v1.57.0-noble node github-upload/rc79-fix6/public_smoke.js
          docker run --rm --init --ipc=host -e NODE_PATH=/work/runtime/node_modules -v "$PWD:/work/site:ro" \
            -v /tmp/fix15-browser:/work/runtime:ro -v /tmp/fix15-evidence:/tmp/fix15-evidence -w /work/site \
            mcr.microsoft.com/playwright:v1.57.0-noble node github-upload/rc79-fix6/browser_reading_feedback.js . /tmp/fix15-evidence
          docker run --rm --init --ipc=host -e NODE_PATH=/work/runtime/node_modules -v "$PWD:/work/site:ro" \
            -v /tmp/fix15-browser:/work/runtime:ro -v /tmp/fix15-evidence:/tmp/fix15-evidence -w /work/site \
            mcr.microsoft.com/playwright:v1.57.0-noble node github-upload/rc79-fix7/browser_diagnostic_d.js . /tmp/fix15-evidence
          docker run --rm --init --ipc=host -e NODE_PATH=/work/runtime/node_modules -v "$PWD:/work/site:ro" \
            -v /tmp/fix15-browser:/work/runtime:ro -v /tmp/fix15-evidence:/tmp/fix15-evidence -w /work/site \
            mcr.microsoft.com/playwright:v1.57.0-noble node github-upload/rc79-fix10/overlay/source/test_fix10_reading_order_browser.js . /tmp/fix15-evidence
          docker run --rm --init --ipc=host -e NODE_PATH=/work/runtime/node_modules -v "$PWD:/work/site:ro" \
            -v /tmp/fix15-browser:/work/runtime:ro -v /tmp/fix15-evidence:/tmp/fix15-evidence -w /work/site \
            mcr.microsoft.com/playwright:v1.57.0-noble node github-upload/rc79-fix9/overlay/source/test_fix9_diagnostic_browser.js . /tmp/fix15-evidence
      - name: Verify reading route interactions in packaged application
        run: |
          docker run --rm --init --ipc=host -e NODE_PATH=/work/runtime/node_modules -v "$PWD:/work/site:ro" \
            -v /tmp/fix15-browser:/work/runtime:ro -v /tmp/fix15-evidence:/tmp/fix15-evidence -w /work/site \
            mcr.microsoft.com/playwright:v1.57.0-noble node github-upload/rc79-fix15/test_reading_routes_browser.js . /tmp/fix15-evidence
          docker run --rm --init --ipc=host -e NODE_PATH=/work/runtime/node_modules -v "$PWD:/work/site:ro" \
            -v /tmp/fix15-browser:/work/runtime:ro -v /tmp/fix15-evidence:/tmp/fix15-evidence -w /work/site \
            mcr.microsoft.com/playwright:v1.57.0-noble node github-upload/rc79-fix15/test_reading_routes_forced_browser.js . /tmp/fix15-evidence
          docker run --rm --init --ipc=host -e NODE_PATH=/work/runtime/node_modules -v "$PWD:/work/site:ro" \
            -v /tmp/fix15-browser:/work/runtime:ro -v /tmp/fix15-evidence:/tmp/fix15-evidence -w /work/site \
            mcr.microsoft.com/playwright:v1.57.0-noble node github-upload/rc79-fix10/overlay/source/test_fix11_order_drag_browser.js . /tmp/fix15-evidence
      - name: Verify percentage entry in packaged application
        run: |
          docker run --rm --init --ipc=host -e NODE_PATH=/work/runtime/node_modules -v "$PWD:/work/site:ro" \
            -v /tmp/fix15-browser:/work/runtime:ro -v /tmp/fix15-evidence:/tmp/fix15-evidence -w /work/site \
            mcr.microsoft.com/playwright:v1.57.0-noble node github-upload/rc79-fix11/overlay/source/test_fix12_percent_browser.js . /tmp/fix15-evidence
      - name: Verify family record projection in packaged application
        run: |
          docker run --rm --init --ipc=host -e NODE_PATH=/work/runtime/node_modules -v "$PWD:/work/site:ro" \
            -v /tmp/fix15-browser:/work/runtime:ro -v /tmp/fix15-evidence:/tmp/fix15-evidence -w /work/site \
            mcr.microsoft.com/playwright:v1.57.0-noble node github-upload/rc79-fix12/overlay/source/test_fix12_family_browser.js . /tmp/fix15-evidence
      - name: Verify exam selection and preserved attempts in packaged application
        run: |
          docker run --rm --init --ipc=host -e NODE_PATH=/work/runtime/node_modules -v "$PWD:/work/site:ro" \
            -v /tmp/fix15-browser:/work/runtime:ro -v /tmp/fix15-evidence:/tmp/fix15-evidence -w /work/site \
            mcr.microsoft.com/playwright:v1.57.0-noble node github-upload/rc79-fix13/overlay/source/test_fix13_selection_browser.js . /tmp/fix15-evidence
      - name: Verify serialized reading storage and unchanged mathematics fallback
        run: |
          docker run --rm --init --ipc=host -e NODE_PATH=/work/runtime/node_modules -v "$PWD:/work/site:ro" \
            -v /tmp/fix15-browser:/work/runtime:ro -v /tmp/fix15-evidence:/tmp/fix15-evidence -w /work/site \
            mcr.microsoft.com/playwright:v1.57.0-noble node github-upload/rc79-fix15/test_storage_browser.js . /tmp/fix15-evidence
      - name: Verify upgrade and unified export on packaged application
        run: |
          docker run --rm --init --ipc=host -e NODE_PATH=/work/runtime/node_modules -v "$PWD:/work/site:ro" \
            -v /tmp/fix15-browser:/work/runtime:ro -v /tmp/fix15-evidence:/tmp/fix15-evidence -w /work/site \
            mcr.microsoft.com/playwright:v1.57.0-noble node github-upload/rc79-fix15/test_upgrade_app_browser.js . /tmp/fix15-evidence
      - name: Save evidence and stage tested bytes on candidate branch
        run: |
          python3 github-upload/rc79-fix15/ci_receipt.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f index.html source/index.html amc8/index.html qa/index.html qa/normal/index.html qa/history/index.html
          git add -f assets/loading-r1 assets/loading-r2 muse/rc79/index.html muse/rc79/manifest.json muse/rc79/fix15
          git commit -m 'Stage RC79 FIX15 tested diagnostic candidate and evidence' || test -z "$(git status --porcelain)"
          git push origin "HEAD:$GITHUB_REF_NAME"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rc79-fix15-candidate-evidence
          path: /tmp/fix15-evidence
          if-no-files-found: warn
          retention-days: 90
