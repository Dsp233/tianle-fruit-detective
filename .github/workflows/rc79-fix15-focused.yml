name: RC79 FIX15 focused packaged export verification
on:
  push:
    branches: [rc79-fix15-migration-20261031]
    paths: [github-upload/rc79-fix15/READY.json]
concurrency:
  group: rc79-fix15-focused-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  actions: read
jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: home-h1-frozen
          run-id: 40294526884
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/fix15-package
      - name: Reconstruct and package exact candidate
        run: |
          python3 github-upload/unpack_rc79_reading.py "$RUNNER_TEMP/fix15-package/RC79_HOME1_candidate.zip" "$RUNNER_TEMP/fix15-package/RC79_HOME1_candidate.json" "$RUNNER_TEMP/fix15-candidate"
          python3 github-upload/rc79-fix6/build_baseline.py "$RUNNER_TEMP/fix15-candidate/source"
          python3 github-upload/rc79-fix15/ci_prepare.py "$RUNNER_TEMP/fix15-candidate"
          python3 github-upload/rc79-fix13/build_preserve.py "$RUNNER_TEMP/fix15-candidate/source"
          python3 github-upload/rc79-fix6/verify_prior_mappings.py "$RUNNER_TEMP/fix15-candidate/source"
          (cd "$RUNNER_TEMP/fix15-candidate" && python3 source/build_qa.py)
          python3 github-upload/rc79-fix15/stage_candidate.py "$RUNNER_TEMP/fix15-candidate"
          python3 github-upload/rc79-fix15/ci_stage.py "$RUNNER_TEMP/fix15-candidate"
          mkdir -p /tmp/fix15-focused
          node github-upload/rc79-fix15/test_cold_reading_backup.js loader-r2.js > /tmp/fix15-focused/cold-reading-backup.json
      - name: Install isolated browser runtime
        run: |
          npm install --prefix /tmp/fix15-browser playwright@1.57.0
          docker pull mcr.microsoft.com/playwright:v1.57.0-noble
      - name: Check packaged application upgrade and export
        run: |
          docker run --rm --init --ipc=host -e NODE_PATH=/work/runtime/node_modules -v "$PWD:/work/site:ro" \
            -v /tmp/fix15-browser:/work/runtime:ro -v /tmp/fix15-focused:/tmp/fix15-focused -w /work/site \
            mcr.microsoft.com/playwright:v1.57.0-noble node github-upload/rc79-fix15/test_upgrade_app_browser.js . /tmp/fix15-focused
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rc79-fix15-focused-evidence
          path: /tmp/fix15-focused
          if-no-files-found: warn
          retention-days: 90
