name: RC79 FIX8 storage candidate
on:
  push:
    branches: [rc79-fix8-storage-20261029]
    paths: [github-upload/rc79-fix8/READY.json]
permissions:
  contents: read
  actions: read
jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: home-h1-frozen
          run-id: 40294526884
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/fix8-package
      - name: Reconstruct FIX7 and apply hashed candidate
        run: |
          python3 github-upload/unpack_rc79_reading.py "$RUNNER_TEMP/fix8-package/RC79_HOME1_candidate.zip" "$RUNNER_TEMP/fix8-package/RC79_HOME1_candidate.json" "$RUNNER_TEMP/fix8-candidate"
          python3 github-upload/rc79-fix8/ci_prepare.py "$RUNNER_TEMP/fix8-candidate"
          python3 github-upload/rc79-fix6/build_preserve_reading.py "$RUNNER_TEMP/fix8-candidate/source"
          (cd "$RUNNER_TEMP/fix8-candidate" && python3 source/build_qa.py)
          mkdir -p /tmp/fix8-evidence
          sha256sum "$RUNNER_TEMP/fix8-candidate/index.html" > /tmp/fix8-evidence/raw-build.sha256
      - name: Verify synthetic records and focused regressions
        run: |
          cd "$RUNNER_TEMP/fix8-candidate"
          node source/test_fix79_storage_retry.js
          node source/test_fix8_reading_storage.js
          node source/reading_engine_test.js
          node source/test_fix7_diagnostic_d.js
          node source/test_fix7_diagnostic_d_ui.js
          node source/test_fix79_family_sources.js
          node source/test_fix2_parent_review.js
          node source/test_fix79_reading_feedback.js
          node source/test_fix6_reading_feedback.js
          node source/test_fix79_milestones.js
          node source/reading_media_test.js
          node source/fix8_content_inventory.js /tmp/fix8-evidence/content-inventory.json
          cp docs/reading/engine_test_results.json /tmp/fix8-evidence/engine-test-results.json
      - name: Install isolated browser runtime
        run: |
          npm install --prefix /tmp/fix8-browser playwright@1.57.0
          docker pull mcr.microsoft.com/playwright:v1.57.0-noble
      - name: Browser storage and reload checks
        run: |
          docker run --rm --init --ipc=host \
            -e NODE_PATH=/work/runtime/node_modules \
            -v "$RUNNER_TEMP/fix8-candidate:/work/candidate:ro" \
            -v /tmp/fix8-browser:/work/runtime:ro \
            -v /tmp/fix8-evidence:/tmp/fix8-evidence \
            -w /work/candidate mcr.microsoft.com/playwright:v1.57.0-noble \
            node source/test_fix8_storage_browser.js . /tmp/fix8-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rc79-fix8-storage-candidate-evidence
          path: /tmp/fix8-evidence
          if-no-files-found: warn
          retention-days: 90
