name: RC79 H1 actual public website verification
on:
  push:
    branches: [rc79-home-h1-20261026]
    paths: [github-upload/home-r1/PROBE_READY.json]
permissions:
  contents: read
  actions: read
  pages: read
jobs:
  public:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Read exact production and acceptance identities
        run: |
          python3 - <<'PYTHON'
          import json,os,re
          d=json.load(open('github-upload/home-r1/PROBE_READY.json'));assert re.fullmatch('[0-9a-f]{40}',d['expectedMain']);assert isinstance(d['sourceRunId'],int)
          with open(os.environ['GITHUB_ENV'],'a') as f:f.write('EXPECTED_MAIN='+d['expectedMain']+'\nSOURCE_RUN='+str(d['sourceRunId'])+'\n')
          PYTHON
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.EXPECTED_MAIN }}
          path: production
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: home-h1-frozen
          run-id: ${{ env.SOURCE_RUN }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/package
      - run: python3 github-upload/unpack_rc79_reading.py "$RUNNER_TEMP/package/RC79_HOME1_candidate.zip" "$RUNNER_TEMP/package/RC79_HOME1_candidate.json" "$RUNNER_TEMP/candidate"
      - name: Read back all eight actual public entry hashes
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 github-upload/home-r1/verify_public.py
      - name: Install pinned native browser and Chinese fonts
        run: |
          npm install --prefix "$RUNNER_TEMP/browser" --ignore-scripts --no-audit --no-fund playwright@1.62.1
          "$RUNNER_TEMP/browser/node_modules/.bin/playwright" install chromium
          echo "NODE_PATH=$RUNNER_TEMP/browser/node_modules" >> "$GITHUB_ENV"
          NODE_PATH="$RUNNER_TEMP/browser/node_modules" node -e 'console.log("AMC8_BROWSER_EXECUTABLE="+require("playwright").chromium.executablePath())' >> "$GITHUB_ENV"
          sudo timeout 180s apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=30 update -qq
          sudo timeout 180s apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=30 install -y fonts-noto-cjk
      - name: Exercise both doors and actual mixed-module public journey
        env:
          HOME_CANDIDATE: ${{ runner.temp }}/candidate
          HOME_EVIDENCE: ${{ runner.temp }}/public-verification
        run: node "$HOME_CANDIDATE/source/test_home_portal_browser.js"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: home-h1-public
          path: ${{ runner.temp }}/public-verification/
          if-no-files-found: error
          retention-days: 90
