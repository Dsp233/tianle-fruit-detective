name: RC79 LOAD2 channel loading repair
on:
  push:
    # FIX1 production is checked by rc79-fix1-public.yml; keep LOAD2 branch checks.
    branches: [rc79-loading-r2-20261027, rc79-loading-r2-maint-20261027]
    paths: ['github-upload/loading-r2/**', '.github/workflows/rc79-loading-r2.yml', 'assets/loading-r2/**']
permissions:
  contents: write
jobs:
  loading:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install loading-only browser runtime
        run: |
          npm install --prefix /tmp/loading-browser playwright@1.56.1
          docker pull mcr.microsoft.com/playwright:v1.56.1-noble
          mkdir -p /tmp/loading-evidence
      - name: Reproduce LOAD1 startup failures
        if: github.ref == 'refs/heads/rc79-loading-r2-20261027'
        env:
          NODE_PATH: /tmp/loading-browser/node_modules
        run: >-
          docker run --rm --init --ipc=host
          -e NODE_PATH=/work/runtime/node_modules
          -v "$PWD:/work/site:ro" -v /tmp/loading-browser:/work/runtime:ro
          -v /tmp/loading-evidence:/tmp/loading-evidence -w /work/site
          mcr.microsoft.com/playwright:v1.56.1-noble
          node github-upload/loading-r2/baseline.js
      - name: Build bounded delivery resources
        if: github.ref != 'refs/heads/main'
        run: |
          if [ "$GITHUB_REF_NAME" = 'rc79-loading-r2-maint-20261027' ]; then
            git fetch --depth=1 origin ecd6c6a87047378f41629c9b3afdf90f657a3b0c
            python github-upload/loading-r2/restore_load1.py
          fi
          python github-upload/loading-r2/upgrade.py .
      - name: Validate compressed code and inline bootstrap syntax
        run: python github-upload/loading-r2/check_payloads.py
      - name: Verify channel loading only
        env:
          NODE_PATH: /tmp/loading-browser/node_modules
          PUBLIC_BASE: ${{ github.ref == 'refs/heads/main' && 'https://dsp233.github.io/tianle-fruit-detective/' || '' }}
        run: |
          if [ -n "$PUBLIC_BASE" ]; then
            python github-upload/loading-r2/wait_public.py
          fi
          docker run --rm --init --ipc=host \
            -e NODE_PATH=/work/runtime/node_modules -e PUBLIC_BASE \
            -v "$PWD:/work/site:ro" -v /tmp/loading-browser:/work/runtime:ro \
            -v /tmp/loading-evidence:/tmp/loading-evidence -w /work/site \
            mcr.microsoft.com/playwright:v1.56.1-noble \
            node github-upload/loading-r2/test.js . /tmp/loading-evidence
      - name: Record loading evidence
        env:
          STAGE: ${{ github.ref == 'refs/heads/main' && 'public' || 'candidate' }}
        run: python github-upload/loading-r2/receipt.py
      - name: Persist candidate or public evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          git add assets/loading-r2 muse/rc79/loading-r2 third-party-notices/pako-1.0.11.txt
          git commit -m 'Deliver LOAD2 bounded channel resources and loading-only evidence' || test -z "$(git status --porcelain)"
          git push origin "HEAD:$GITHUB_REF_NAME"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: loading-r2-${{ github.ref == 'refs/heads/main' && 'public' || 'candidate' }}
          path: /tmp/loading-evidence
          retention-days: 90
