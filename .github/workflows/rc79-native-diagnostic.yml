name: RC79 R1.2 repaired native test diagnostics
on:
  push:
    branches: [rc79-reading-r1-2-20261026]
    paths: [github-upload/native-retest1/READY.json]
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install the same pinned Chromium and Chinese screenshot fonts
        run: |
          npm install --prefix "$RUNNER_TEMP/native-tools" --ignore-scripts --no-audit --no-fund playwright@1.62.1
          "$RUNNER_TEMP/native-tools/node_modules/.bin/playwright" install chromium
          echo "NODE_PATH=$RUNNER_TEMP/native-tools/node_modules" >> "$GITHUB_ENV"
          NODE_PATH="$RUNNER_TEMP/native-tools/node_modules" node -e 'console.log("AMC8_BROWSER_EXECUTABLE="+require("playwright").chromium.executablePath())' >> "$GITHUB_ENV"
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
      - name: Restore and verify the unchanged full application
        run: |
          python3 github-upload/compact/restore.py github-upload/compact/transport.json "$RUNNER_TEMP/base.zip"
          python3 github-upload/unpack_rc79_reading.py "$RUNNER_TEMP/base.zip" github-upload/AMC8_RC79_A9_Reading_R1_2_candidate.json "$RUNNER_TEMP/native-candidate"
      - name: Run the disclosed 25 targeted and 40 persona diagnostic tests
        run: python3 github-upload/native-retest1/run_diagnostic.py "$RUNNER_TEMP/native-candidate" github-upload/native-retest1 "$RUNNER_TEMP/native-diagnostics"
      - name: Preserve diagnostic observations and screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: rc79-native-retest1-diagnostics
          path: ${{ runner.temp }}/native-diagnostics/
          if-no-files-found: error
          retention-days: 90
