name: RC79 R1.2 NATIVE2 complete immutable acceptance
on:
  push:
    branches: [rc79-reading-r1-2-20261026]
    paths: [github-upload/native-retest2/READY.json]
permissions:
  contents: read
  actions: read
env:
  CANDIDATE_PACKAGE: candidate-package/RC79_A9_R12_NATIVE2_candidate.zip
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Restore and verify the original immutable source
        run: |
          python3 github-upload/compact/restore.py github-upload/compact/transport.json "$RUNNER_TEMP/base.zip"
          python3 github-upload/unpack_rc79_reading.py "$RUNNER_TEMP/base.zip" github-upload/AMC8_RC79_A9_Reading_R1_2_candidate.json "$RUNNER_TEMP/native2-source"
      - name: Install the pinned reading compiler
        run: python3 -m pip install -r "$RUNNER_TEMP/native2-source/source/reading/requirements-build.txt"
      - name: Rebuild and freeze the record-preservation repair and test revision N2
        run: python3 github-upload/native-retest2/prepare_native2.py "$RUNNER_TEMP/native2-source" github-upload/native-retest2 "$RUNNER_TEMP/native2-frozen" "$RUNNER_TEMP/native2-package"
      - name: Preserve the new exact frozen archive and receipt
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: rc79-native2-frozen
          path: ${{ runner.temp }}/native2-package/
          if-no-files-found: error
          retention-days: 90
  core:
    needs: [prepare]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: rc79-native2-frozen
          path: candidate-package
      - name: Verify and unpack the exact archive
        run: |
          python3 github-upload/unpack_rc79_reading.py "$CANDIDATE_PACKAGE" "${CANDIDATE_PACKAGE%.zip}.json" "$RUNNER_TEMP/rc70-candidate"
      - name: Run every CPU gate and complete instance matrix
        run: |
          if test -f "$RUNNER_TEMP/rc70-candidate/source/reading/requirements-build.txt"; then python3 -m pip install -r "$RUNNER_TEMP/rc70-candidate/source/reading/requirements-build.txt"; fi
          python3 "$RUNNER_TEMP/rc70-candidate/source/rc70_ci.py" cpu
      - name: Preserve all CPU attempts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: rc78-raw-core
          path: ${{ runner.temp }}/rc70-run/
          if-no-files-found: error
          retention-days: 90
  browser:
    needs: [prepare]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { kind: browser, shard: 0 }
          - { kind: browser, shard: 1 }
          - { kind: browser, shard: 2 }
          - { kind: browser, shard: 3 }
          - { kind: rtm-browser, shard: 0 }
          - { kind: rtm-browser, shard: 1 }
          - { kind: rtm-browser, shard: 2 }
          - { kind: rtm-browser, shard: 3 }
          - { kind: joint-browser, shard: 0 }
          - { kind: joint-browser, shard: 1 }
          - { kind: joint-browser, shard: 2 }
          - { kind: joint-browser, shard: 3 }
          - { kind: performance, shard: 0 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: rc79-native2-frozen
          path: candidate-package
      - name: Install the pinned browser tooling and its matching Chromium build
        run: |
          npm install --prefix "$RUNNER_TEMP/rc78-playwright" --ignore-scripts --no-audit --no-fund playwright@1.62.1
          "$RUNNER_TEMP/rc78-playwright/node_modules/.bin/playwright" install chromium
          echo "NODE_PATH=$RUNNER_TEMP/rc78-playwright/node_modules" >> "$GITHUB_ENV"
          NODE_PATH="$RUNNER_TEMP/rc78-playwright/node_modules" node -e 'console.log("AMC8_BROWSER_EXECUTABLE="+require("playwright").chromium.executablePath())' >> "$GITHUB_ENV"
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
          node --version
          python3 --version
          dpkg-query -W > "$RUNNER_TEMP/rc78-system-packages.txt"
      - name: Verify and unpack the exact archive
        run: |
          python3 github-upload/unpack_rc79_reading.py "$CANDIDATE_PACKAGE" "${CANDIDATE_PACKAGE%.zip}.json" "$RUNNER_TEMP/rc70-candidate"
      - name: Prove real browser launch, click and screenshot before the assigned gate
        env:
          AMC8_PREFLIGHT: ${{ runner.temp }}/rc70-run/environment
        run: |
          node - <<'JS'
          const N=require(process.env.RUNNER_TEMP+'/rc70-candidate/source/native_browser_support');
          N.start(process.env.RUNNER_TEMP+'/rc70-candidate',process.env.AMC8_PREFLIGHT).then(async e=>{if(!e)process.exitCode=2;else await e.close()}).catch(e=>{console.error(e);process.exitCode=1});
          JS
          cp "$RUNNER_TEMP/rc78-system-packages.txt" "$AMC8_PREFLIGHT/system-packages.txt"
      - name: Execute native events for the complete assigned population
        env:
          CASE_KIND: ${{ matrix.kind }}
          CASE_SHARD: ${{ matrix.shard }}
        run: python3 "$RUNNER_TEMP/rc70-candidate/source/rc70_ci.py" "$CASE_KIND" "$CASE_SHARD"
      - name: Preserve native screenshots, environment and every attempt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: rc78-raw-${{ matrix.kind }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/rc70-run/
          if-no-files-found: error
          retention-days: 90
  collect:
    if: always()
    needs: [core, browser]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: rc79-native2-frozen
          path: candidate-package
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          pattern: rc78-raw-*
          path: ${{ runner.temp }}/rc78-raw
      - name: Verify candidate and all logical populations
        run: |
          python3 github-upload/unpack_rc79_reading.py "$CANDIDATE_PACKAGE" "${CANDIDATE_PACKAGE%.zip}.json" "$RUNNER_TEMP/rc70-candidate"
          python3 "$RUNNER_TEMP/rc70-candidate/source/rc70_ci.py" collect "$RUNNER_TEMP/rc78-raw"
      - name: Preserve the complete acceptance ledger
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: rc78-complete-acceptance
          path: ${{ runner.temp }}/rc70-merged/
          if-no-files-found: error
          retention-days: 90
  reading:
    needs: [prepare]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: rc79-native2-frozen
          path: candidate-package
      - name: Verify exact candidate before executing its code
        env:
          CANDIDATE_PACKAGE: candidate-package/RC79_A9_R12_NATIVE2_candidate.zip
        run: |
          python3 github-upload/unpack_rc79_reading.py "$CANDIDATE_PACKAGE" "${CANDIDATE_PACKAGE%.zip}.json" "$RUNNER_TEMP/reading-r1"
      - name: Install pinned offline pinyin compiler
        run: python3 -m pip install -r "$RUNNER_TEMP/reading-r1/source/reading/requirements-build.txt"
      - name: Run reading acceptance checks
        working-directory: ${{ runner.temp }}/reading-r1
        run: |
          python3 source/build_reading.py --check --report docs/reading/content_validation.json
          python3 source/reading_compiler_test.py
          python3 source/reading_context_test.py --out docs/reading/context_test_results.json
          node source/reading_upgrade_test.js --out docs/reading/upgrade_test_results.json
          node source/reading_engine_test.js
          node source/reading_media_test.js
          node source/reading_recovery_test.js
          python3 source/reading_release_gate_test.py
          node source/reading_integration_test.js
      - name: Preserve actual evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: reading-r1-results
          path: ${{ runner.temp }}/reading-r1/docs/reading/
          if-no-files-found: error
          retention-days: 90
      # No merge, production write or deployment occurs in this workflow.
      # Physical devices, human teaching review and old release gates remain separate.
