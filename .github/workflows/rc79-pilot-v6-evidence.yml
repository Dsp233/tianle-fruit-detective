name: Thirty-five-day preview public evidence availability
on:
  push:
    branches: [main]
    paths: [pilot-reading-v4/public-receipt.json, pilot-reading-v4/public-public-byte-check.json, pilot-reading-v4/public-pilot-browser.json, .github/workflows/rc79-pilot-v6-evidence.yml]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Verify current and historical evidence on public site
        run: |
          python3 - <<'PY'
          import hashlib,os,time,urllib.request
          from pathlib import Path
          base='https://dsp233.github.io/tianle-fruit-detective/'
          paths=['pilot-reading-v4/public-receipt.json','pilot-reading-v4/public-public-byte-check.json','pilot-reading-v4/public-pilot-browser.json','pilot-reading-v4/history/v4-public-receipt.json','pilot-reading-v4/history/v4-public-byte-check.json','pilot-reading-v4/history/v4-public-pilot-browser.json','pilot-reading-v4/history/v4-21day-index.html','pilot-reading-v4/history/v5-public-receipt.json','pilot-reading-v4/history/v5-public-byte-check.json','pilot-reading-v4/history/v5-public-pilot-browser.json','pilot-reading-v4/history/v5-28day-index.html']
          hashes={p:hashlib.sha256(Path(p).read_bytes()).hexdigest() for p in paths}
          for attempt in range(45):
              matched=[]
              for p in paths:
                  try:
                      req=urllib.request.Request(base+p+'?evidence='+os.environ['GITHUB_SHA'],headers={'Cache-Control':'no-cache'})
                      with urllib.request.urlopen(req,timeout=15) as r:data=r.read()
                      if hashlib.sha256(data).hexdigest()==hashes[p]:matched.append(p)
                  except Exception:pass
              if len(matched)==len(paths):
                  print('PASS: public evidence files:',len(paths));break
              print('Waiting for public evidence:',len(matched),'/',len(paths),flush=True);time.sleep(10)
          else:raise SystemExit('Public evidence did not match expected commit')
          PY
