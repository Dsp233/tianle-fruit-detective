name: Reading content migration prototype audit
on:
  push:
    branches: [rc79-reading-migration-audit-20261031]
    paths: [github-upload/rc79-reading-migration-audit/READY.json]
concurrency:
  group: rc79-reading-migration-audit
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  prototype:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check baseline failure modes and synthetic prototype
        run: |
          mkdir -p /tmp/migration-evidence
          node github-upload/rc79-reading-migration-audit/reading_engine_test.js
          cp github-upload/docs/reading/engine_test_results.json /tmp/migration-evidence/baseline-audit.json
          node github-upload/rc79-reading-migration-audit/reading_engine_prototype_test.js
          cp github-upload/docs/reading/engine_test_results.json /tmp/migration-evidence/prototype-engine.json
          READING_STORE_PATH="$PWD/github-upload/rc79-fix14/overlay/source/progress_store.js" node github-upload/rc79-reading-migration-audit/transactional_upgrade_test.js > /tmp/migration-evidence/transactional-mock.json
          node github-upload/rc79-reading-migration-audit/course_isolation_audit_test.js
          cp github-upload/docs/reading/engine_test_results.json /tmp/migration-evidence/course-mixing-baseline.json
          node github-upload/rc79-reading-migration-audit/course_scope_prototype_test.js
          cp github-upload/docs/reading/engine_test_results.json /tmp/migration-evidence/course-scope-engine.json
          python3 github-upload/rc79-reading-migration-audit/week5_formal_mapping.py > /tmp/migration-evidence/week5-mapping-summary.json
          cp github-upload/rc79-reading-migration-audit/week5-formal-mapping-draft.json /tmp/migration-evidence/
          node github-upload/rc79-reading-migration-audit/test_match_engine.js > /tmp/migration-evidence/match-engine.json
      - name: Install isolated browser runtime
        run: |
          npm install --prefix /tmp/migration-browser playwright@1.57.0
          docker pull mcr.microsoft.com/playwright:v1.57.0-noble
      - name: Test backup and failure paths with real IndexedDB
        run: |
          docker run --rm --init --ipc=host -e NODE_PATH=/work/runtime/node_modules \
            -v "$PWD:/work/repo:ro" -v /tmp/migration-browser:/work/runtime:ro \
            -v /tmp/migration-evidence:/tmp/migration-evidence -w /work/repo \
            mcr.microsoft.com/playwright:v1.57.0-noble \
            node github-upload/rc79-reading-migration-audit/browser_migration_test.js /work/repo /tmp/migration-evidence
      - name: Check old and new course scope with real browser storage
        run: |
          docker run --rm --init --ipc=host -e NODE_PATH=/work/runtime/node_modules \
            -v "$PWD:/work/repo:ro" -v /tmp/migration-browser:/work/runtime:ro \
            -v /tmp/migration-evidence:/tmp/migration-evidence -w /work/repo \
            mcr.microsoft.com/playwright:v1.57.0-noble \
            node github-upload/rc79-reading-migration-audit/browser_course_scope_test.js /work/repo /tmp/migration-evidence
      - name: Check parent display and diagnostic routing with scoped UI
        run: |
          docker run --rm --init --ipc=host -e NODE_PATH=/work/runtime/node_modules \
            -v "$PWD:/work/repo:ro" -v /tmp/migration-browser:/work/runtime:ro \
            -v /tmp/migration-evidence:/tmp/migration-evidence -w /work/repo \
            mcr.microsoft.com/playwright:v1.57.0-noble \
            node github-upload/rc79-reading-migration-audit/browser_course_scope_ui_test.js /work/repo /tmp/migration-evidence
      - name: Check direct matching interaction and preserved answers
        run: |
          docker run --rm --init --ipc=host -e NODE_PATH=/work/runtime/node_modules \
            -v "$PWD:/work/repo:ro" -v /tmp/migration-browser:/work/runtime:ro \
            -v /tmp/migration-evidence:/tmp/migration-evidence -w /work/repo \
            mcr.microsoft.com/playwright:v1.57.0-noble \
            node github-upload/rc79-reading-migration-audit/browser_match_prototype_test.js /work/repo /tmp/migration-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rc79-reading-migration-prototype-evidence
          path: /tmp/migration-evidence
          if-no-files-found: warn
          retention-days: 90
