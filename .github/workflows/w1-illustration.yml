name: W1 reading illustration candidate
on:
  push:
    branches: [codex/reading-illustration]
    paths: ['reading-art/**', 'assets/reading-art/**', '.github/workflows/w1-illustration.yml']
  pull_request:
    branches: [main]
    paths: ['reading-art/**', 'assets/reading-art/**', '.github/workflows/w1-illustration.yml']
permissions:
  contents: read
jobs:
  reading-art:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - if: github.event_name == 'push'
        run: python reading-art/build.py --partial-review
      - if: github.event_name == 'pull_request'
        run: python reading-art/build.py
      - run: python -m pip install playwright==1.57.0
      - run: python -m playwright install --with-deps chromium webkit
      - run: python -m http.server 4173 --bind 127.0.0.1 > /tmp/illustration-http.log 2>&1 &
      - run: python reading-art/browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: w1-reading-art-visual
          path: reading-art/browser-evidence
