name: W1 reading visual and language regression
on:
  push:
    branches: [w1-reading-natural-20261115]
  pull_request:
    branches: [main]
    paths: ['reading-quality/**', 'assets/reading-quality/**', 'index.html', '.github/workflows/w1-reading-quality.yml']
permissions:
  contents: read
jobs:
  reading:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright==1.57.0
      - run: python -m playwright install --with-deps chromium webkit
      - name: Serve isolated candidate
        run: python -m http.server 4173 --bind 127.0.0.1 > /tmp/reading-http.log 2>&1 &
      - name: Baseline counterexample and controlled CSS experiments
        run: python reading-quality/diagnose.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reading-quality-evidence
          path: reading-quality/evidence
