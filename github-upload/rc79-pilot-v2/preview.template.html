<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>星空观察簿｜七天阅读试玩</title><style>
:root{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:#163b3b;background:#f2f7ed;font-size:18px}*{box-sizing:border-box}body{margin:0}main{max-width:880px;margin:auto;padding:16px 16px 48px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.brand{font-weight:800;font-size:1.25rem;color:#184f4b}.tag{background:#e5f0db;color:#345a43;border-radius:999px;padding:7px 12px;font-size:.78rem}.panel{background:#fff;border:1px solid #d2e3d4;border-radius:20px;padding:18px;margin:16px 0;box-shadow:0 5px 16px #315e4c0b}.notice{background:#fff8e4;border-color:#eadca5;font-size:.86rem;line-height:1.6}.story-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:18px;align-items:center}.art svg{width:100%;height:auto;display:block;border-radius:16px}.story-text{line-height:2.35;letter-spacing:.03em;font-size:1.14rem}.question{font-size:1.1rem;line-height:2.15}.muted{color:#476762;font-size:.87rem;line-height:1.7}.days{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.days button{min-height:76px;text-align:left}.nav,.controls,.options{display:flex;gap:9px;flex-wrap:wrap}.options{flex-direction:column}button{font:inherit;background:#fff;border:1.5px solid #a9c6b8;color:#164a46;border-radius:13px;padding:10px 14px;min-height:48px;cursor:pointer;line-height:1.8}button:hover{background:#eef7ee}button:focus-visible{outline:3px solid #ecb852;outline-offset:2px}button.primary{background:#126e63;border-color:#126e63;color:#fff}button.primary:hover{background:#0d5b53}button:disabled{opacity:.45;cursor:not-allowed}.choice-row{display:flex;align-items:stretch;gap:8px}.choice{flex:1;text-align:left;min-height:62px}.choice.selected{background:#dff3e8;border:2px solid #147769}.speak{min-width:58px;font-size:.9rem}.hint{background:#eff6ea;border-radius:14px;padding:12px}.feedback{background:#e7f5ed;border-left:4px solid #16806d;padding:12px;margin-top:14px}.feedback.try{background:#fff6e7;border-color:#e3a24c}.activity{background:#f0f6f5;border:1px solid #d2e6e3;border-radius:16px;padding:14px;margin:12px 0}.track{display:flex;gap:5px;flex-wrap:wrap;margin:10px 0}.cell{width:34px;height:34px;display:grid;place-items:center;border:1px solid #adcbc3;border-radius:8px;background:#fff;font-size:.8rem}.cell.active{background:#26786a;color:white}.bar-row{display:flex;align-items:center;gap:10px;margin:8px 0}.bar{height:19px;border-radius:9px;background:#8fbba5}.hidden{display:none!important}ruby{ruby-align:center}.read-char{cursor:pointer;border-radius:4px}.read-char:focus-visible{outline:2px solid #ecb852}rt{font-size:.55em;color:#637e78;line-height:1.2}button.primary rt{color:#d1e9db}h1,h2,h3{line-height:1.7;margin:.4em 0}p{line-height:1.8}details summary{cursor:pointer;min-height:45px;line-height:2}#status{min-height:1.5em}footer{color:#607c70;font-size:.8rem;margin-top:24px}@media(max-width:600px){.story-grid{grid-template-columns:1fr}.art{max-width:320px;margin:auto}.panel{padding:14px}main{padding:12px 12px 36px}}
</style></head><body><main><header class="top"><div class="brand">星空观察簿</div><div class="tag">七天试玩草稿</div></header><div id="app"></div><footer>试玩记录只存在当前页面。正式课程和原有学习记录不会被修改。</footer></main>
<script>window.__PILOT_DATA__=__PILOT_DATA_PAYLOAD__;</script>
<script>__MEDIA_SOURCE__</script>
<script>
'use strict';
(()=>{
 const data=window.__PILOT_DATA__,root=document.getElementById('app'),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 window.__AMC8_READING_DATA={phrases:data.phrases||{},contextReviewedPositions:{}};
 const state={screen:'map',day:0,panel:0,question:0,selected:null,showHint:false,showExplanation:false,pinyin:true,pinyinEver:true,audioEver:false,explorationEver:false,robot:0,bags:[],box:null,records:{},message:'',sound:'idle'};
 let speech,readSequence=0;const readTexts=new Map();
 const pin=(text,i)=>data.pinyinTexts[text]?.[i]??data.pinyinMap[Array.from(text)[i]]??'';
 function rt(v,clickable=true){const text=String(v??''),key='t'+(++readSequence);if(clickable)readTexts.set(key,text);return Array.from(text).map((c,i)=>/[\u3400-\u9fff]/u.test(c)?`<ruby ${clickable?`class="read-char" role="button" tabindex="0" data-action="readChar" data-key="${key}" data-index="${i}" aria-label="${esc(c)}，点字听读"`:''}><rb>${esc(c)}</rb><rt>${state.pinyin?esc(pin(text,i)):''}</rt></ruby>`:esc(c)).join('');}
 const button=(act,label,extra='',cls='')=>`<button type="button" data-action="${act}" ${extra} class="${cls}">${rt(label,false)}</button>`;
 const day=()=>data.days[state.day], question=()=>[...day().questions,day().extra][state.question];
 function currentRecord(){const id=question().id;return state.records[id]??(state.records[id]={questionId:id,first:null,attempts:[],help:[]});}
 const say=(text,kind,meta={})=>{state.audioEver=true;if(state.screen==='question')currentRecord().help.push({type:'audio',kind});speech.speak(text,{kind,...meta});};
 function storyArt(){const scenes=[['library',['box','paper','book']],['library',['book','paper','map']],['garden',['sprout','paper','seed']],['station',['robot','map','paper']],['workshop',['box','paper','box']],['workshop',['glove','box','book']],['space',['telescope','paper','map']]];const [scene,props]=scenes[state.day],action=['observe','compare','plan'][state.panel%3];return window.ReadingComic.panel({scene,prop:props[state.panel%3],cast:['tianle','xiaohe','tuantuan'],action},state.panel);}
 function map(){return `<section class="panel notice"><p>${rt('试玩草稿，建议家长陪同；关闭后试玩记录不会自动保存。')}</p><details><summary>${rt('查看试玩说明')}</summary><p>${rt('拼音、画面和朗读还需核对。本页不会改动原来的学习记录。')}</p><p>${rt('每篇先看几格故事，再自由尝试三道任务；挑战可以不做。拼音和朗读随时可以使用。')}</p></details></section><section class="panel"><h1>${rt('找回星空观察簿')}</h1><p class="muted">${rt('选择一篇开始，也可以随时回来。')}</p><div class="days">${data.days.map((d,i)=>button('start','第 '+d.day+' 天 · '+d.title,`data-index="${i}"`)).join('')}</div></section>`;}
 function story(){const d=day();return `<section class="panel"><div class="top"><span class="muted">${rt('第 '+d.day+' 天 · '+d.title)}</span><span class="muted">${rt('故事第 '+(state.panel+1)+' 格，共 '+d.panels.length+' 格')}</span></div><div class="story-grid"><div class="art">${storyArt()}</div><div><p class="story-text">${rt(d.panels[state.panel])}</p>${button('speakStory','听这一格')}</div></div><div class="nav">${button('prevPanel','上一格',state.panel===0?'disabled':'')}${state.panel<d.panels.length-1?button('nextPanel','下一格','','primary'):button('startQuestions','我读好了，开始任务','','primary')}${button('map','返回地图')}</div></section>`;}
 function activity(){if(state.day===2)return `<div class="activity"><h3>${rt('两盆苗的记录')}</h3><p>${rt('甲盆：开始 4 厘米，后来 7 厘米。')}</p><p>${rt('乙盆：开始 5 厘米，后来 7 厘米。')}</p></div>`;
 if(state.day===3)return `<div class="activity"><h3>${rt('让机器人试着走一走')}</h3><div class="track">${Array.from({length:8},(_,i)=>`<span class="cell ${i===state.robot?'active':''}">${i}</span>`).join('')}</div><p>${rt('现在在第 '+state.robot+' 格')}</p><div class="nav">${button('move','走 2 格','data-amount="2"')}${button('move','走 3 格','data-amount="3"')}${button('resetRobot','重新开始')}</div></div>`;
 if(state.day===4){const truth=state.box===null?'':(() =>{const k=['红','蓝','绿'][state.box],facts=[k!=='红',k==='绿',k!=='绿'];return `<p>${rt('假设钥匙在'+k+'盒，三张纸条依次是：'+facts.map(v=>v?'真':'假').join('、'))}</p>`})();return `<div class="activity"><h3>${rt('试着假设钥匙的位置')}</h3><div class="nav">${['红','蓝','绿'].map((x,i)=>button('box','假设在'+x+'盒',`data-index="${i}"`)).join('')}</div>${truth}</div>`;}
 if(state.day===5){const weight=state.bags.reduce((a,i)=>a+[2,3,4][i],0);return `<div class="activity"><h3>${rt('把袋子放上升降机')}</h3><div class="nav">${['A 袋 2 千克','B 袋 3 千克','C 袋 4 千克'].map((x,i)=>button('bag',x,`data-index="${i}" aria-pressed="${state.bags.includes(i)}"`,state.bags.includes(i)?'selected':'')).join('')}</div><p>${rt('已放 '+state.bags.length+' 只，总重 '+weight+' 千克。')}</p></div>`;}
 if(state.day===6)return `<div class="activity"><h3>${rt('三晚观察记录')}</h3>${[3,5,1].map((n,i)=>`<div class="bar-row"><span>${rt('第 '+(i+1)+' 晚')}</span><div class="bar" style="width:${n*12}%"></div><span>${n}</span></div>`).join('')}</div>`;
 return '';}
 function quiz(){const d=day(),q=question(),r=currentRecord(),options=q.type==='order'?(Array.isArray(state.selected)?[...state.selected,...q.options.map((_,i)=>i).filter(i=>!state.selected.includes(i))]:q.options.map((_,i)=>i)):q.options.map((_,i)=>i),valid=q.type==='order'?Array.isArray(state.selected)&&state.selected.length===q.options.length:Number.isInteger(state.selected),latest=r.attempts.at(-1);
 const feedback=latest?`<div class="feedback ${latest.correct?'':'try'}" role="status"><strong>${rt(latest.correct?'这次找到了，再说说你的理由。':'再回到故事找找线索，也可以试试提示。')}</strong><p>${rt('第一次选择会保留在本次试玩中。')}</p><div class="nav">${button('retry','再试一次')}${button('explain','看讲解')}${state.question<2?button('nextQuestion','下一题','','primary'):button('finishCore','今天的任务完成了','','primary')}</div></div>`:'';
 return `<section class="panel"><div class="top"><span class="muted">${rt('第 '+d.day+' 天 · '+d.title)}</span><span class="muted">${rt(state.question===3?'自愿挑战':'核心任务 '+(state.question+1)+' / 3')}</span></div><details><summary>${rt('回看故事')}</summary>${d.story.map(p=>`<p>${rt(p)}</p>`).join('')}${button('speakAll','听故事')}</details>${activity()}<h2 class="question">${rt(q.prompt)}</h2>${button('speakQuestion','听问题')}<div class="options">${options.map(i=>{const selected=q.type==='order'?Array.isArray(state.selected)&&state.selected.includes(i):state.selected===i,n=q.type==='order'&&selected?(state.selected.indexOf(i)+1)+' · ':'';return `<div class="choice-row">${button('pick',n+q.options[i],`data-index="${i}" aria-pressed="${selected}"`,'choice '+(selected?'selected':''))}${button('speakOption','听',`data-index="${i}"`,'speak')}</div>`}).join('')}</div>${q.type==='order'?`<p>${rt('按顺序点卡片；已选卡片会移到上面。')}</p>${button('undo','撤回一张卡')}`:''}<div class="nav">${button('hint','看看提示')}${button('submit','我选好了',valid?'':'disabled','primary')}${button('backStory','回看这一篇')}</div>${state.showHint?`<p class="hint">${rt(q.hint)}</p>`:''}${feedback}${state.showExplanation?`<div class="hint"><h3>${rt('一起看依据')}</h3><p>${rt(q.reason)}</p><p>${rt('答案')}：${Array.isArray(q.answer)?q.answer.map(i=>rt(q.options[i])).join(' → '):rt(q.options[q.answer])}</p></div>`:''}</section>`;}
 function finish(){return `<section class="panel"><h2>${rt('今天先到这里')}</h2><p>${rt('你可以试一道自愿挑战，也可以返回地图。')}</p><div class="nav">${button('challenge','试试自愿挑战','','primary')}${button('map','返回地图')}${button('export','下载本次试玩记录')}</div><p class="muted">${rt('下载只在本机进行，不会发送到服务器。刷新或关闭页面后，未下载的试玩记录会消失。')}</p></section>`;}
 function render(){readTexts.clear();readSequence=0;const body=state.screen==='map'?map():state.screen==='story'?story():state.screen==='question'?quiz():finish();root.innerHTML=`<div class="controls">${button('pinyin',state.pinyin?'隐藏拼音':'显示拼音')}${button('speakPage','听本页')}${button('stop','停止朗读')}<span id="status" class="muted" role="status">${rt(state.message)}</span></div>${body}`;}
 speech=window.ReadingSpeech.create({getRemoteConsent:()=>false,getRate:()=>.85,onStatus:info=>{state.sound=info.state;const messages={requested:'正在准备朗读。',started:'正在朗读。',ended:'朗读结束。',stopped:'朗读已停止。',blocked:'没有可用的本地普通话音色，请家长代读。',no_voice:'没有可用的本地普通话音色，请家长代读。',unsupported:'本设备暂不支持朗读，请家长代读。',failed:'这次朗读没有完成，请再试或请家长代读。'};state.message=messages[info.state]||'';const el=document.getElementById('status');if(el)el.textContent=state.message;}});
 root.addEventListener('click',event=>{const b=event.target.closest('[data-action]');if(!b||b.disabled)return;const a=b.dataset.action,i=Number(b.dataset.index);state.message='';
 if(a==='map'){speech.stop();state.screen='map';}
 else if(a==='start'){speech.stop();state.day=i;state.panel=0;state.question=0;state.selected=null;state.showHint=false;state.showExplanation=false;state.pinyinEver=state.pinyin;state.audioEver=false;state.explorationEver=false;state.robot=0;state.bags=[];state.box=null;state.screen='story';}
 else if(a==='prevPanel')state.panel=Math.max(0,state.panel-1);
 else if(a==='nextPanel')state.panel=Math.min(day().panels.length-1,state.panel+1);
 else if(a==='startQuestions'){speech.stop();state.screen='question';}
 else if(a==='backStory'){speech.stop();state.panel=0;state.screen='story';}
 else if(a==='pinyin'){state.pinyin=!state.pinyin;if(state.pinyin)state.pinyinEver=true;if(state.screen==='question'&&state.pinyin)currentRecord().help.push({type:'pinyin'});}
 else if(a==='stop')speech.stop();
 else if(a==='speakPage'){const copy=root.cloneNode(true);copy.querySelectorAll('rt').forEach(n=>n.remove());copy.querySelectorAll('details:not([open])').forEach(n=>{const summary=n.querySelector('summary');n.replaceWith(summary||'');});say(copy.textContent,'page');}
 else if(a==='readChar'){const text=readTexts.get(b.dataset.key),index=Number(b.dataset.index),char=Array.from(text||'')[index];if(char)say(char,'character',{contextText:text,charIndex:index});}
 else if(a==='speakStory')say(day().panels[state.panel],'sentence');
 else if(a==='speakAll')say(day().story.join(''),'story');
 else if(a==='speakQuestion')say(question().prompt,'question');
 else if(a==='speakOption')say(question().options[i],'option');
 else if(a==='pick'){const q=question();if(q.type==='order'){if(!Array.isArray(state.selected))state.selected=[];if(!state.selected.includes(i))state.selected.push(i);}else state.selected=i;}
 else if(a==='undo'){if(Array.isArray(state.selected))state.selected.pop();}
 else if(a==='hint'){state.showHint=true;currentRecord().help.push({type:'hint'});}
 else if(a==='submit'){const q=question(),r=currentRecord(),selected=Array.isArray(state.selected)?[...state.selected]:state.selected,valid=q.type==='order'?Array.isArray(selected)&&selected.length===q.options.length:Number.isInteger(selected);if(valid){const attempt={selected,correct:JSON.stringify(selected)===JSON.stringify(q.answer),pinyinEver:state.pinyinEver,audioEver:state.audioEver,explorationEver:state.explorationEver,hintEver:state.showHint,at:new Date().toISOString()};r.attempts.push(attempt);if(!r.first)r.first={...attempt};}}
 else if(a==='retry'){state.selected=null;state.showExplanation=false;}
 else if(a==='explain'){state.showExplanation=true;currentRecord().help.push({type:'explanation'});}
 else if(a==='nextQuestion'){speech.stop();state.question++;state.selected=null;state.showHint=false;state.showExplanation=false;}
 else if(a==='finishCore'){speech.stop();state.screen='finish';}
 else if(a==='challenge'){state.screen='question';state.question=3;state.selected=null;state.showHint=false;state.showExplanation=false;}
 else if(a==='move'){const next=state.robot+Number(b.dataset.amount);if(next<=7)state.robot=next;else state.message='这一步会走出轨道，先换一种走法。';state.explorationEver=true;currentRecord().help.push({type:'explore'});}
 else if(a==='resetRobot')state.robot=0;
 else if(a==='bag'){state.bags=state.bags.includes(i)?state.bags.filter(x=>x!==i):[...state.bags,i];state.explorationEver=true;currentRecord().help.push({type:'explore'});}
 else if(a==='box'){state.box=i;state.explorationEver=true;currentRecord().help.push({type:'explore'});}
 else if(a==='export'){const payload={format:'reading-pilot-v2-local-preview',scope:'exploratory; not formal learning evidence',createdAt:new Date().toISOString(),records:state.records},url=URL.createObjectURL(new Blob([JSON.stringify(payload,null,2)],{type:'application/json'})),link=document.createElement('a');link.href=url;link.download='reading-pilot-preview.json';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
 render();});
 root.addEventListener('keydown',e=>{if(!e.isComposing&&['Enter',' '].includes(e.key)&&e.target.matches('[data-action=readChar]')){e.preventDefault();e.target.click();}});
 render();
})();
</script></body></html>
