<script>'use strict';
const LEVELS=[{"icon":"🍎","name":"水果侦探","topic":"集合与重复计数","tier":"思维闭环","intro":"今天只研究同一组7位小朋友。先涂颜色找出三个不重叠的部分，再自己决定怎么数人。","questions":[{"kind":"people","question":"【先涂浅红色】点出所有喜欢苹果的小朋友。","correct":[1,2,4,5,7],"hint":"“喜欢苹果”没有说只能喜欢苹果。","clue":"所有卡片上有🍎的人都要选，包括同时有🍌的。","explain":"苹果组有5人。选中的人会涂上浅红色，下一步继续使用同一组人。","stage":"观察与上色","guide":"每张卡片代表1个人；先只找苹果组。"},{"kind":"people","question":"【再涂浅黄色】保持刚才的浅红底，继续点出所有喜欢香蕉的小朋友。","correct":[2,3,4,5,6],"hint":"已经是浅红底的人，若也拿着香蕉，还能选吗？","clue":"只要卡片上有🍌就要选。有人会被两种底色覆盖。","explain":"香蕉组也是5人。红黄两色重合的卡片表示同一个人同时属于两个组。","stage":"重叠上色","guide":"苹果组的红底会保留；香蕉组再叠加浅黄色。"},{"kind":"people","question":"【分清第一部分】只喜欢苹果的是哪几位？","correct":[1,7],"hint":"“只喜欢”不能同时喜欢另一种水果。","clue":"只选浅红色、没有叠加浅黄色的人。","explain":"第1号和第7号，只喜欢苹果，共2人。","stage":"三部分分类","guide":"只红＝只喜欢苹果；红黄重叠＝两种都喜欢；只黄＝只喜欢香蕉。"},{"kind":"people","question":"【分清第二部分】只喜欢香蕉的是哪几位？","correct":[3,6],"hint":"不能把拿着🍎🍌的人归入“只喜欢香蕉”。","clue":"只选浅黄色、没有叠加浅红色的人。","explain":"第3号和第6号，只喜欢香蕉，共2人。","stage":"三部分分类","guide":null},{"kind":"people","question":"【找到共同部分】红黄两色都覆盖的是哪几位？","correct":[2,4,5],"hint":"寻找拿着两种水果的卡片。","clue":"这些卡片既在苹果组，也在香蕉组。","explain":"第2、4、5号，两种都喜欢，共3人。注意：他们是3个真实的人，不是6个人。","stage":"三部分分类","guide":null},{"kind":"choice","question":"“喜欢苹果的5人”实际由哪两部分组成？","options":["只喜欢苹果2人＋两种都喜欢3人","只喜欢苹果2人＋只喜欢香蕉2人","只有两种都喜欢的3人"],"correct":0,"hint":"“喜欢苹果”是不是包含拿着两种水果的人？","clue":"看红底：只红有2人，红黄重叠有3人。","explain":"喜欢苹果＝只喜欢苹果2人＋两种都喜欢3人＝5人。","stage":"理解整个组","visual":"venn","guide":null},{"kind":"choice","question":"“喜欢香蕉的5人”实际由哪两部分组成？","options":["只喜欢香蕉2人＋只喜欢苹果2人","只喜欢香蕉2人＋两种都喜欢3人","只有两种都喜欢3人"],"correct":1,"hint":"香蕉组包含哪两种底色的卡片？","clue":"只黄有2人，红黄重叠有3人。","explain":"喜欢香蕉＝只喜欢香蕉2人＋两种都喜欢3人＝5人。","stage":"理解整个组","visual":"venn","guide":null},{"kind":"build","question":"【自己组装】请用三块互不重叠的人数组装“不同小朋友的总人数”。","slots":[["5（苹果组）","2（只苹果）","3（都喜欢）"],["×","－","＋"],["2（只香蕉）","5（香蕉组）","3（都喜欢）"],["×","＋","－"],["3（都喜欢）","5（苹果组）","2（只香蕉）"]],"correct":[1,2,2,1,2],"hint":"每个真实的小朋友只能出现一遍。","clue":"依次使用“只苹果”“两种都喜欢”“只香蕉”三块人数。","explain":"2＋3＋2＝7人。三块互不重叠，直接相加；你不必先记任何去重公式。","stage":"选择运算符","visual":"venn","guide":null},{"kind":"choice","question":"已经知道苹果组5人、香蕉组5人、两种都喜欢3人。哪种总人数算法正确？","options":["5＋5＝10","5＋5＋3＝13","5＋5－3＝7"],"correct":2,"hint":"5＋5时，共同部分的3人被算了几遍？","clue":"每人多算了一遍，所以要减去一次共同部分。","explain":"5＋5－3＝7人；这与2＋3＋2得到同一个总人数。","stage":"尝试第二条路线","visual":"venn","guide":null},{"kind":"teachback","question":"请指着颜色图向家长讲：为什么“喜欢苹果”不等于“只喜欢苹果”？为什么总人数只能把红黄重叠的人算一次？","checks":["可以按2＋3＋2，也可以按5＋5－3，结果都为7。","红黄重叠的3人，在不同人数里应该算作6人。","红黄重叠的3人，也属于喜欢苹果和喜欢香蕉两个组。"],"correct":[0,2],"hint":"先指着红黄重叠区域，再解释每位小朋友在总人数中出现几次。","clue":"你可以说：“喜欢苹果有只苹果和两种都喜欢；两组相加会重复数到同一批人。”","explain":"你能说明：每个人只能算一次；2＋3＋2＝7与5＋5－3＝7是同一件事。","stage":"讲清楚与自检","guide":"请真正说给家长听：家长确认后再通关。"}]},{"icon":"🧩","name":"三种解法","topic":"集合的分拆与多条路线","tier":"思维闭环","intro":"沿用上一关的同一批人物和三种底色。不要另换人物或突然跳到大数字。","questions":[{"kind":"choice","question":"【下一页，先认底色】图中哪一种颜色表示“两种都喜欢”？","options":["只浅红色","浅红色与浅黄色重合","只浅黄色"],"correct":1,"hint":"回想刚才同时在苹果组和香蕉组里的3个人。","clue":"他们的卡片同时被红黄两种颜色覆盖。","explain":"重叠色对应3人；只红2人，只黄2人。","stage":"衔接上一关","visual":"venn","guide":null},{"kind":"choice","question":"【方法A】先数“全部喜欢苹果”的5人，再加上哪一部分才不会重复？","options":["两种都喜欢的3人","只喜欢香蕉的2人","全部喜欢香蕉的5人"],"correct":1,"hint":"苹果组已经包括那3位两种都喜欢的人。","clue":"只需要再补上没有出现在苹果组里的“只喜欢香蕉”2人。","explain":"苹果组5人＋只喜欢香蕉2人＝7人。","stage":"第一条路线","visual":"venn","guide":null},{"kind":"build","question":"【方法B】不数完整水果组，而是把三个不重叠的部分拼成总人数。","slots":[["2（只苹果）","5（苹果组）","3（都喜欢）"],["－","＋","×"],["3（都喜欢）","2（只香蕉）","5（香蕉组）"],["＋","×","－"],["2（只香蕉）","3（都喜欢）","5（苹果组）"]],"correct":[0,1,0,0,0],"hint":"三个部分互不重叠，使用哪种运算符？","clue":"依次选2、＋、3、＋、2。","explain":"方法B：2＋3＋2＝7人。","stage":"第二条路线","visual":"venn","guide":null},{"kind":"build","question":"【方法C】直接数两个完整水果组，要怎样消除重复计数？","slots":[["3（都喜欢）","5（苹果组）","2（只苹果）"],["－","＋","×"],["5（香蕉组）","3（都喜欢）","2（只香蕉）"],["－","×","＋"],["2（只香蕉）","3（都喜欢）","5（苹果组）"]],"correct":[1,1,0,0,1],"hint":"先数苹果组5人和香蕉组5人，再处理共同部分。","clue":"加上两个组之后，把重复计算的3人减去一遍。","explain":"方法C：5＋5－3＝7人。三种解法都让每人出现一次。","stage":"第三条路线","visual":"venn","guide":null},{"kind":"choice","question":"哪一个算法把红黄重叠的人多算了，没有得到真实总人数？","options":["5＋2＝7","2＋3＋2＝7","5＋5＝10"],"correct":2,"hint":"共同部分出现在两个完整水果组中。","clue":"没有减去重叠3人的5＋5，会把这3人多算一遍。","explain":"错误发生在“直接相加两个有重叠的组”。不要机械地认为看见“总人数”就一定相加。","stage":"找出错误路线","visual":"venn","guide":null},{"kind":"choice","question":"新情境：苹果组18人，香蕉组14人，两种都喜欢5人。至少喜欢一种水果的有多少人？","options":["27人","32人","37人"],"correct":0,"hint":"先用你喜欢的路线：全部苹果组＋只喜欢香蕉的人。","clue":"只喜欢香蕉的有14－5＝9人；18＋9＝27。","explain":"18＋14－5＝27，也可以18＋(14－5)＝27。数字变了，分组方式没变。","stage":"迁移到原始大题","visual":"fruit18","guide":null},{"kind":"teachback","question":"请给家长展示三条求总人数的路线：完整苹果组＋只香蕉；三个独立部分相加；苹果组＋香蕉组－重叠。","checks":["改变算式可以，不能改变每位小朋友只能算一次的原则。","直接5＋5不会重复计算任何人。","5＋2、2＋3＋2、5＋5－3都表示同一批7人。"],"correct":[0,2],"hint":"说清三条路线各数了哪些人。","clue":"任选两条路线，用手指指颜色区域解释。","explain":"三条算式得到7，原因不是巧合，而是把同一批人以不同但不重复的方式数清楚。","stage":"讲清楚与自检","guide":"家长只在孩子能指出三部分时确认。"}]},{"icon":"🔍","name":"审题雷达","topic":"条件是否充分与错误分析","tier":"思维闭环","intro":"学习在计算前先问“信息够不够”，避免见到数字就套公式。","questions":[{"kind":"choice","question":"只知道苹果组5人、香蕉组5人，不知道两种都喜欢几人。能求出唯一总人数吗？","options":["一定10人","一定5人","不能，还缺少共同部分人数"],"correct":2,"hint":"试想两组完全不重叠时有几人？完全一样时又有几人？","clue":"总人数会随着共同部分改变，不可能只凭5和5确定。","explain":"缺少重叠人数，总人数可以不同；条件不足时应当说“不能确定”。","stage":"判断信息","visual":"venn","guide":null},{"kind":"choice","question":"若两组完全没有任何相同的人，苹果5人、香蕉5人，总人数是多少？","options":["5人","10人","无法确定"],"correct":1,"hint":"“没有任何相同的人”已经补充了什么条件？","clue":"重叠人数为0。","explain":"5＋5－0＝10人。","stage":"补全条件","visual":null,"guide":null},{"kind":"choice","question":"若苹果组5人、香蕉组5人，五个人都同时喜欢两种，真实总人数是多少？","options":["5人","10人","15人"],"correct":0,"hint":"现在每个组实际上是不是同一批人？","clue":"重叠人数5人。","explain":"5＋5－5＝5人。同样的组人数，重叠不同，总人数就不同。","stage":"对比极端情况","visual":null,"guide":null},{"kind":"choice","question":"苹果5人、香蕉5人、总人数7人。哪句话能说明重叠人数是3？","options":["5＋5比7多3次，正是重复计数","7比5多2，所以重叠是2","5＋5就是真实总人数"],"correct":0,"hint":"先比较“按两组计数之和10”和“真实不同人数7”。","clue":"10－7＝3次，多出来的计数对应共同部分。","explain":"共同部分3人。反过来，也可以从总人数求重叠。","stage":"反向推理","visual":null,"guide":null},{"kind":"choice","question":"有12人只喜欢苹果、5人两种都喜欢，但没有“只喜欢香蕉”的人数。能算出至少喜欢一种水果的总人数吗？","options":["一定17人","不能，还需只喜欢香蕉的人数","一定12人"],"correct":1,"hint":"三块互不重叠的部分，目前少了哪块？","clue":"只红12、重叠5都有，但只黄未知。","explain":"没有只香蕉的人数，就不能算出全部不同人数。","stage":"迁移判断","visual":null,"guide":null},{"kind":"teachback","question":"请举两个可能的例子说明：同样是“苹果5人、香蕉5人”，总人数却可能不一样。","checks":["如果重叠0人，总人数10人；如果重叠5人，总人数5人。","不管两组怎样重叠，总人数一定10人。","不知道一个关键条件时，不能装作已经知道唯一答案。"],"correct":[0,2],"hint":"改变重叠人数，检查真实总人数。","clue":"你可以说“重叠3时是7；重叠0时是10”。","explain":"你不再把每道题都当成一定能算出唯一数的题。","stage":"讲清楚与自检","guide":null}]},{"icon":"⚪","name":"奇偶机关","topic":"奇偶与不变量","tier":"思维闭环","intro":"用“配对有没有剩余”解释奇偶，不靠死记结论。","questions":[{"kind":"choice","question":"把7颗星两两配对，最后会怎样？","options":["全部配完","剩下一颗","剩下两颗"],"correct":1,"hint":"7是奇数吗？","clue":"3对用了6颗，还有1颗。","explain":"奇数两两配对会剩下1个；偶数可以配完。","stage":"动手想象","visual":null,"guide":null},{"kind":"choice","question":"原本有7颗星，又放入5颗。现在12颗，能够全部两两配对吗？","options":["能","不能","条件不够"],"correct":0,"hint":"7＋5＝12。","clue":"把12颗按2个一组分。","explain":"12是偶数，能够分成6对。","stage":"理解定义","visual":null,"guide":null},{"kind":"build","question":"给“奇数＋奇数＝偶数”选一个具体例子并组装算式。","slots":[["2","4","3"],["＋","×","－"],["6","2","5"],["＞","＝","＜"],["7","9","8"]],"correct":[2,0,2,1,2],"hint":"两个奇数各剩1个，两颗剩余星可以再配成一对。","clue":"3＋5＝8。","explain":"配对解释了为什么奇数加奇数是偶数。","stage":"自己组装","visual":null,"guide":null},{"kind":"choice","question":"谁的解释有问题？","options":["2＋5＝7，偶数加奇数为奇数","3＋5＝8，两个奇数相加为偶数","因为7＋5＝12，所以所有奇数加奇数都等于12"],"correct":2,"hint":"规律说的是奇偶类型，不是说和的具体数字一样。","clue":"1＋1＝2，3＋3＝6，也都符合类型规律。","explain":"结论“奇＋奇＝偶”正确，但不能由一个例子推出固定的和。","stage":"识别错误","visual":null,"guide":null},{"kind":"choice","question":"不开计算器，101＋103的结果是奇数还是偶数？","options":["奇数","偶数","无法判断"],"correct":1,"hint":"两数都是奇数。","clue":"两个奇数相加，剩下的两个单个可配成一对。","explain":"奇数＋奇数＝偶数。","stage":"变式迁移","visual":null,"guide":null},{"kind":"teachback","question":"给家长讲：为什么“奇数＋奇数”一定是偶数？","checks":["只要是奇数加奇数，结果一定是12。","每个奇数都多出一个，两份多出的单个能配成一对。","可以用配对解释，不必把大数完整算出来。"],"correct":[1,2],"hint":"用两堆一一配对。","clue":"先说3＋5，再试101＋103。","explain":"你掌握的是配对结构，而不是记住某一道题的数字。","stage":"讲清楚与自检","guide":null}]},{"icon":"🔢","name":"规律密码","topic":"寻找、检验与反驳规律","tier":"思维闭环","intro":"发现规律后，要让同一条规律解释所有已知项，还要分清“一个可能”与“唯一”。","questions":[{"kind":"choice","question":"2，5，8，11。每相邻两个数的差是多少？","options":["2","3","4"],"correct":1,"hint":"先看5－2。","clue":"每次都增加3。","explain":"差都是3，+3是一种符合这几项的规则。","stage":"观察变化","visual":null,"guide":null},{"kind":"choice","question":"按“每次＋3”的规则，11后面应当是什么？","options":["12","14","16"],"correct":1,"hint":"用同一条规则继续。","clue":"11＋3。","explain":"14是按已指定规则的下一项。","stage":"使用规则","visual":null,"guide":null},{"kind":"build","question":"把从8到14的两个变化动作组装出来。","slots":[["11","5","8"],["×","＋","－"],["4","3","2"],["×","－","＋"],["3","2","4"]],"correct":[2,1,1,2,0],"hint":"8＋3＝11，再＋3＝14。","clue":"按+3连续执行两次。","explain":"8＋3＋3＝14。","stage":"自己构建","visual":null,"guide":null},{"kind":"choice","question":"哪种说法最准确？","options":["看到2、5、8、11就能证明所有未来项只能按＋3","题目若明确要求按每次＋3，下一项就确定是14","只要前面几项一样，后面每项一定只有一种可能"],"correct":1,"hint":"有限个例子可能符合不止一种复杂规则。","clue":"如果题目先指定规则，才有唯一的后续项。","explain":"找规律题要区分“合理模式”和“被唯一确定的规律”。","stage":"识别假设","visual":null,"guide":null},{"kind":"choice","question":"另一串数明确要求“每次乘2”：1，2，4，8，下一项是什么？","options":["10","12","16"],"correct":2,"hint":"不再是每次加同一个数。","clue":"8×2。","explain":"16。学习先识别变化方式，不能机械套“加3”。","stage":"迁移","visual":null,"guide":null},{"kind":"teachback","question":"告诉家长：你怎样确认自己找的规律不是只碰巧解释了前两项？","checks":["如果题目没有限定规则，要承认可能不止一种续法。","检查这条规则是否适用于每一个相邻步骤。","找到一对数字符合，就不用看剩下的。"],"correct":[0,1],"hint":"逐对检查。","clue":"口头解释+3与×2两种不同变化。","explain":"你会检验规律，也会注意信息是否足够。","stage":"讲清楚与自检","guide":null}]},{"icon":"↩️","name":"倒着想","topic":"逆向操作与核验","tier":"思维闭环","intro":"做过的动作可以反向撤销；用正向代回检查自己。","questions":[{"kind":"choice","question":"盒里原来有一些球，拿走4个后剩9个。要还原原来的数量，应先做什么？","options":["再拿走4个","把4个球放回","把9个球分成4份"],"correct":1,"hint":"如果把拿走的球放回，会发生什么？","clue":"9＋4。","explain":"逆向还原先把拿走的4个放回。","stage":"观察动作","visual":null,"guide":null},{"kind":"choice","question":"原来有多少个球？","options":["5个","13个","36个"], try{const p=JSON.parse(localStorage.getItem(VOICE_STORAGE)||'null');if(p&&typeof p==='object'){voiceSettings={...voiceSettings,...p}}}catch(e){}
let voiceList=[],voiceRun=0,voiceStarted=false;
function saveVoicePrefs(){try{localStorage.setItem(VOICE_STORAGE,JSON.stringify(voiceSettings))}catch(e){}}
function chineseNumber(n){n=Number(n);if(!Number.isInteger(n)||n<0||n>9999)return String(n);if(n===0)return '零';const digits='零一二三四五六七八九';let result='',unit=['','十','百','千'],zero=false;for(let i=3;i>=0;i--){const d=Math.floor(n/10**i)%10;if(d){if(zero&&result)result+='零';if(!(d===1&&i===1&&!result))result+=digits[d];result+=unit[i];zero=false}else if(result){zero=true}}return result}
function speakFriendly(text){return String(text).replace(/🍎🍌/g,'苹果和香蕉').replace(/🍎/g,'苹果').replace(/🍌/g,'香蕉').replace(/✏️/g,'铅笔').replace(/×/g,'乘以').replace(/÷/g,'除以').replace(/[+＋]/g,'加').replace(/[－−-]/g,'减').replace(/[=＝]/g,'等于').replace(/(\d+)\/(\d+)/g,(_,a,b)=>`${chineseNumber(b)}分之${chineseNumber(a)}`).replace(/\d+/g,m=>chineseNumber(m)).replace(/([。？！])/g,'$1 ')}
function speechQuestion(){const q=LEVELS[level].questions[qIndex];let sentence=q.question.replace(/喜欢苹果18人，喜欢香蕉14人，两种都喜欢5人。/g,'喜欢苹果的，有十八人。喜欢香蕉的，有十四人。其中，有五人两种都喜欢。');return speakFriendly(sentence)}
function speechOptions(){const q=LEVELS[level].questions[qIndex];if(q.kind!=='choice')return '';return q.options.map((o,i)=>`选项${'一二三'[i]}。${speakFriendly(o)}。`).join(' ')}
function voiceText(part='question'){const q=LEVELS[level].questions[qIndex];if(part==='options'){if(q.kind==='choice')return q.options.map((v,i)=>`${'甲乙丙'[i]}，${v}`).join('。');if(q.kind==='build')return '请依次为每一块选择合适的人数、数字或运算符。';return '请观察卡片上的水果，按照题目选择人物。'}return `${q.question}。`;}
function loadVoiceList(){if(!('speechSynthesis' in window))return;try{voiceList=window.speechSynthesis.getVoices().filter(v=>/^zh(?:-|_)/i.test(v.lang));const el=$('voice-select');if(!el)return;const opts=[`<option value="auto">自动选择中文声音（优先本地语音）</option>`].concat(voiceList.map(v=>`<option value="${esc(v.voiceURI)}">${esc(v.name)} · ${esc(v.lang)}${v.localService?' · 本地':''}</option>`));el.innerHTML=opts.join('');if(voiceSettings.voice!=='auto'&&voiceList.some(v=>v.voiceURI===voiceSettings.voice))el.value=voiceSettings.voice;else el.value='auto';const c=$('voice-count');if(c)c.textContent=voiceList.length?'此设备 Safari 提供 '+voiceList.length+' 种中文声音，网站无法增加系统未开放的声音。':'Safari 尚未列出中文声音；会尝试系统默认中文语音。'}catch(e){speechStatus('无法读取语音列表：'+String(e.message||e))}}
function selectedVoice(){if(voiceSettings.voice!=='auto'){const v=voiceList.find(v=>v.voiceURI===voiceSettings.voice);if(v)return v}return voiceList.slice().sort((a,b)=>{const quality=v=>((/premium|enhanced|natural|高质量|增强/i.test(v.name)?12:0)+(v.localService?4:0)+(/^zh[-_]CN$/i.test(v.lang)?2:0)+(v.default?1:0));return quality(b)-quality(a)})[0]||null}
function task(){const l=LEVELS[level],q=l.questions[qIndex],total=l.questions.length,ready=q.kind==='people'?picked.size>0:q.kind==='choice'?option>=0:q.kind==='build'?built.length===q.slots.length&&built.every(v=>v>=0):q.kind==='teachback'?sayDone&&picked.size===2:true;const showFriends=level<=1;let controls='';if(q.kind==='choice'){controls=`<div class="choices">${q.options.map((v,i)=>`<button class="choice ${option===i?'chosen':''}" ${solved?'disabled':''} data-act="option" data-option="${i}" aria-pressed="${option===i}"><span class="option-letter">${'ABC'[i]}</span>${esc(v)}</button>`).join('')}</div>`}
if(q.kind==='build'){controls=`<div class="builder">${q.slots.map((slot,i)=>`<div class="buildrow"><strong>第${i+1}块 · ${i%2?'选运算符':'选数量/数字'}</strong><div class="buildchoices">${slot.map((v,j)=>`<button type="button" data-act="build" data-slot="${i}" data-pick="${j}" class="${built[i]===j?'chosen':''}" ${solved?'disabled':''} aria-pressed="${built[i]===j}">${esc(v)}</button>`).join('')}</div></div>`).join('')}<div class="builtline">${q.slots.map((slot,i)=>built[i]===undefined||built[i]<0?'□':esc(slot[built[i]])).join(' ')}</div></div>`}
if(q.kind==='teachback'){controls=`<div class="teachback"><p><strong>🗣️ 先用自己的话讲给家长听。</strong>不要照着正确算式念答案。请先指出下面哪些说法合理，再由家长听你的解释。</p><div class="teachchecks">${q.checks.map((line,i)=>`<button type="button" class="teachcheck ${picked.has(i)?'selected':''}" ${solved?'disabled':''} data-act="teachcheck" data-check="${i}" aria-pressed="${picked.has(i)}"><span class="checkmark">${picked.has(i)?'☑️':'☐'}</span>${esc(line)}</button>`).join('')}</div><div class="speakpledge"><label><input type="checkbox" data-saydone="1" ${sayDone?'checked':''} ${solved?'disabled':''}>我已经指着图、算式或实物向家长讲清楚“为什么”。</label></div></div>`}
const speechQuestion=`<div class="rowbtn"><button class="btn secondary" data-act="speak">🔊 听题目</button>${q.kind==='choice'?'<button class="btn secondary" data-act="speakoptions">🔉 听选项</button>':''}<button class="btn ghost" data-act="stopvoice">停止</button></div><div class="speakinfo" id="speech-note" role="status">朗读由 iPad Safari 提供；家长可在下方设置声音和语速。</div><details class="speech-tools"><summary>🎙️ 家长设置 · 声音与语速</summary><label for="voice-select">中文朗读声音</label><select id="voice-select" data-voice="voice"><option value="auto">自动选择中文声音</option></select><p class="voice-help" id="voice-count">可选的中文声音由当前设备提供。</p><label for="voice-rate">朗读语速</label><div class="voice-row"><select id="voice-rate" data-voice="rate"><option value="0.88">舒缓 0.88倍</option><option value="0.98">自然 0.98倍</option><option value="1.08">稍快 1.08倍</option></select><button class="btn secondary" data-act="testvoice">▶ 试听</button></div><p class="voice-help">网页无法强制启用未开放给 Safari 的 Siri 自然语音。如需要更自然的音色，需要预先制作固定的中文音频。</p></details>`;
return `<section class="panel"><div class="row lesson-short"><span class="chip">${l.icon} 第${level+1}站 · ${esc(l.topic)}</span><span class="chip">第${qIndex+1}/${total}步</span></div><h2>${esc(l.name)}</h2><p class="muted">${esc(l.intro)}</p><div class="progress"><i style="width:${(qIndex+(solved?1:0))/total*100}%"></i></div><div class="question"><span class="phase-badge">🕵️ ${esc(q.stage||'侦探任务')}</span><strong>${esc(q.question)}</strong></div>${q.guide?`<div class="page-guide">${esc(q.guide)}</div>`:''}${speechQuestion}${showFriends?drawPeople():''}${q.visual?`<div class="visual" aria-label="辅助观察图">${visual(q.visual)}</div>`:''}${controls}${feedback?`<div class="message ${solved?'right':'wrong'}" role="status"><strong>${solved?'✅ 发现了！':'🔍 再检查：'}</strong> ${esc(feedback)}</div>`:''}${hintStage>0&&!solved?`<div class="message hint"><strong>💡 第${hintStage}级提示</strong><br>${esc(hintStage===1?q.hint:q.clue)}</div>`:''}${solved?`<button class="btn primary expand" data-act="advance">${qIndex===total-1?'🏅 完成本专题 · 解锁下一站':'继续探索下一步 →'}</button>`:`<div class="rowbtn"><button class="btn secondary expand" data-act="hint">💡 ${hintStage===0?'给我一点提示':hintStage===1?'再给一点提示':'看看提示'}</button><button class="btn primary expand" data-act="check" ${ready?'':'disabled'}>✅ 检查思路</button></div>`}<p class="stage">${wrongCount?'已重新尝试 '+wrongCount+' 次；没有惩罚。':'先说出自己看到的人物或图形，再选择解法。'}</p></section>`}
function cleared(){const done=level===LEVELS.length-1;return `<section class="panel"><div class="cleared-fx"><span class="big-medal">${done?'🏆':'🏅'}</span>${['⭐','✨','🎉','⭐','🎊'].map((v,i)=>`<span class="particle" style="--dx:${Math.round(120*Math.cos(i*Math.PI/3))}px;--dy:${Math.round(55*Math.sin(i*Math.PI/3))}px;animation-delay:${i*0.13}s">${v}</span>`).join('')}</div><h2 style="text-align:center">${done?'13站数学冒险全部完成！':'第'+(level+1)+'站 · 知识闭环完成！'}</h2><p style="text-align:center">${esc(LEVELS[level].topic)} · 已完成${LEVELS[level].questions.length}步：观察、拆解、组装、找错误、迁移、讲清楚。</p>${done?`<div class="message right">你不只会算答案，还学会先看对象与条件，比较多种方法，并解释自己的思路。</div><div class="rowbtn"><button class="btn primary expand" data-act="lab">🧪 进入数学实验室</button><button class="btn secondary expand" data-act="map">返回闯关地图</button></div>`:`<div class="message right">🔓 下一站开放：${esc(LEVELS[level+1].name)}。<br>${esc(LEVELS[level+1].intro)}</div><div class="rowbtn"><button class="btn primary expand" data-act="nextlevel">解锁下一站 →</button><button class="btn secondary expand" data-act="map">返回闯关地图</button></div>`}</section>`}
function laboratory(){const a=lab.onlyA,b=lab.both,c=lab.onlyB;return `<section class="panel"><div class="row"><span class="chip">🧪 自己创造数学题</span><button class="btn secondary" data-act="map">返回闯关地图</button></div><h2>三部分人数实验室</h2><p>拖动三个滑块，自己改变只有苹果、两种都喜欢、只有香蕉的人数。看一看总人数会怎样变化。</p>${[['onlyA','🍎 只喜欢苹果',a],['both','🍎🍌 两种都喜欢',b],['onlyB','🍌 只喜欢香蕉',c]].map(([id,label,n])=>`<label class="labrow" for="${id}"><strong>${label}</strong><span class="chip">${n}人</span><input type="range" min="0" max="10" step="1" id="${id}" data-lab="${id}" value="${n}"></label>`).join('')}<div class="diagram"><div class="left">只苹果<br>${a}人</div><div class="both">都喜欢<br>${b}人</div><div class="right">只香蕉<br>${c}人</div></div><div class="labresults" style="margin:14px 0"><div>苹果组<strong>${a+b}</strong></div><div>不同的人<strong>${a+b+c}</strong></div><div>香蕉组<strong>${b+c}</strong></div></div><div class="message right"><strong>方法一</strong>：${a+b}＋${b+c}－${b}＝${a+b+c}<br><strong>方法二</strong>：${a+b}＋${c}＝${a+b+c}</div><p class="muted">解释给家长听：为什么两种方法的结果总是一样？</p></section>`}
function draw(){const view=mode==='map'?map():mode==='cleared'?cleared():mode==='lab'?laboratory():task();$('app').innerHTML=header()+view;if(mode==='task'){loadVoiceList();const rate=$('voice-rate');if(rate)rate.value=voiceSettings.rate;}save()}
function openLevel(n){if(!Number.isInteger(n)||n<0||n>progress.unlocked)return;stopVoice(true);level=n;qIndex=0;picked.clear();option=-1;built=[];sayDone=false;solved=false;wrongCount=0;hintStage=0;feedback='';mode='task';draw()}
function check(){if(mode!=='task'||solved)return;const q=LEVELS[level].questions[qIndex];let ready=false,right=false;if(q.kind==='people'){ready=picked.size>0;right=picked.size===q.correct.length&&q.correct.every(x=>picked.has(x));}else if(q.kind==='choice'){ready=option>=0;right=option===q.correct;}else if(q.kind==='build'){ready=built.length===q.slots.length&&built.every(x=>x>=0);right=ready&&q.correct.every((x,i)=>built[i]===x);}else if(q.kind==='teachback'){ready=sayDone&&picked.size===q.correct.length;right=ready&&q.correct.every(i=>picked.has(i));}if(!ready)return;if(right){solved=true;feedback=q.explain;}else{wrongCount++;progress.attempts[level]=(progress.attempts[level]||0)+1;feedback=q.kind==='people'?'再看看图中每个人属于哪一个组，检查是否多选或漏选。':q.kind==='build'?'你组装的算式还不能正确表示题意。请先说每一块数字代表谁，再选运算符。':q.kind==='teachback'?'请再向家长解释，找出不符合图或算式的说法。':'还没有答对。先看清楚问题在数什么、已知条件是什么。';}draw()}
function advance(){if(!solved)return;stopVoice(true);if(qIndex<LEVELS[level].questions.length-1){qIndex++;picked.clear();option=-1;built=[];sayDone=false;solved=false;wrongCount=0;hintStage=0;feedback='';draw();return}if(!progress.passed.includes(level))progress.passed.push(level);progress.unlocked=Math.max(progress.unlocked,Math.min(LEVELS.length-1,level+1));mode='cleared';save();draw()}
function stopVoice(silent=false){voiceRun++;try{window.speechSynthesis&&window.speechSynthesis.cancel()}catch(e){}clearTimeout(voiceTimeout);voiceUtterance=null;voiceStarted=false;if(!silent&&$('speech-note'))$('speech-note').textContent='已停止朗读。'}
function speechStatus(s){const e=$('speech-note');if(e)e.textContent=s}
function speak(part='question'){if(!('speechSynthesis'in window)||!('SpeechSynthesisUtterance'in window)){speechStatus('❗ Safari 不支持系统朗读。请由家长读题。');return}const synth=window.speechSynthesis;const text=part==='test'?'天乐，你好！今天我们一起开启数学侦探大冒险。':voiceText(part);if(!text)return;try{stopVoice(true);const run=voiceRun;loadVoiceList();const utter=new SpeechSynthesisUtterance(text);utter.lang='zh-CN';utter.rate=Math.min(1.15,Math.max(0.75,Number(voiceSettings.rate)||0.98));utter.volume=1;utter.pitch=1;const v=selectedVoice();if(v){utter.voice=v;utter.lang=v.lang}voiceUtterance=utter;utter.onstart=()=>{if(run!==voiceRun)return;voiceStarted=true;speechStatus('🔊 正在朗读'+(v?' · '+v.name:' · 系统默认中文语音'))};utter.onerror=e=>{if(run!==voiceRun)return;voiceUtterance=null;clearTimeout(voiceTimeout);if(e.error!=='canceled'&&e.error!=='interrupted')speechStatus('❗ 朗读失败：'+(e.error||'语音服务不可用')+'。可换一种中文声音重试。')};utter.onend=()=>{if(run!==voiceRun)return;voiceUtterance=null;clearTimeout(voiceTimeout);speechStatus('朗读结束。觉得声音生硬？展开下方设置，换一个中文声音试听。')};speechStatus('🔊 正在启动中文朗读…');synth.speak(utter);if(synth.paused)synth.resume();voiceTimeout=setTimeout(()=>{if(run===voiceRun&&!voiceStarted)speechStatus('❗ 朗读暂未启动。请点“试听”换声音，也可检查 iPad 音量和蓝牙输出。')},3800)}catch(e){voiceUtterance=null;speechStatus('❗ 无法启动朗读：'+String(e.message||e))}}
$('app').addEventListener('click',e=>{const b=e.target.closest('button[data-act]');if(!b||b.disabled)return;const action=b.dataset.act;if(action==='map'){stopVoice(true);mode='map';draw()}else if(action==='open'){openLevel(Number(b.dataset.level))}else if(action==='person'){if(mode!=='task'||solved||LEVELS[level].questions[qIndex].kind!=='people')return;const n=Number(b.dataset.id);picked.has(n)?picked.delete(n):picked.add(n);feedback='';draw()}else if(action==='teachcheck'){if(mode!=='task'||solved)return;const n=Number(b.dataset.check);picked.has(n)?picked.delete(n):picked.add(n);feedback='';draw()}else if(action==='build'){if(mode!=='task'||solved)return;const i=Number(b.dataset.slot),j=Number(b.dataset.pick);built[i]=j;feedback='';draw()}else if(action==='option'){if(mode!=='task'||solved)return;option=Number(b.dataset.option);feedback='';draw()}else if(action==='check')check();else if(action==='hint'){hintStage=Math.min(2,hintStage+1);draw()}else if(action==='advance')advance();else if(action==='nextlevel')openLevel(level+1);else if(action==='speak')speak('question');else if(action==='speakoptions')speak('options');else if(action==='testvoice')speak('test');else if(action==='stopvoice')stopVoice();else if(action==='lab'){stopVoice(true);mode='lab';draw()}else if(action==='reset'){if(confirm('确定清空V4学习进度吗？旧版网站记录不会因此删除。')){stopVoice(true);progress={unlocked:0,passed:[],lastLevel:0,attempts:Array(LEVELS.length).fill(0)};level=0;mode='map';draw()}}});

$('app').addEventListener('change',e=>{const chk=e.target.closest('[data-saydone]');if(!chk)return;sayDone=chk.checked;const checkBtn=$('app').querySelector('[data-act=check]');if(checkBtn)checkBtn.disabled=!(sayDone&&picked.size===2);});
$('app').addEventListener('change',e=>{const sel=e.target.closest('[data-voice]');if(!sel)return;voiceSettings[sel.dataset.voice]=sel.value;saveVoicePrefs();speechStatus('已保存朗读偏好。点击“试听”或“听题目”听听效果。')});
if('speechSynthesis'in window){try{window.speechSynthesis.addEventListener('voiceschanged',()=>{if(mode==='task')loadVoiceList()})}catch(e){}}
$('app').addEventListener('change',e=>{const inp=e.target.closest('input[data-lab]');if(!inp)return;lab[inp.dataset.lab]=Number(inp.value);draw()});
window.__tianleSelfTest=()=>{if(LEVELS.length!==13||LEVELS.some(x=>x.questions.length<6))throw Error('课程数量异常');let count=0;for(const l of LEVELS)for(const q of l.questions){count++;if(q.kind==='choice'){if(q.options.length!==3||q.correct<0||q.correct>2)throw Error('单选题错误');}else if(q.kind==='people'){if(!q.correct.every(x=>PEOPLE.some(p=>p.id===x)))throw Error('人物选择错误');}else if(q.kind==='build'){if(q.correct.length!==q.slots.length||!q.correct.every((v,i)=>v>=0&&v<q.slots[i].length))throw Error('组装题错误');}else if(q.kind==='teachback'){if(!q.correct.every(i=>i>=0&&i<q.checks.length))throw Error('讲解题错误');}else throw Error('未知题型');}if(18+14-5!==27)throw Error('原题答案错误');return {levels:LEVELS.length,questions:count,first:LEVELS[0].questions.length,second:LEVELS[1].questions.length,kinds:[...new Set(LEVELS.flatMap(l=>l.questions.map(q=>q.kind)))],passed:true};};
draw();
</script></body></html>
