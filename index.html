function drawPeople(){return `<p class="muted" style="font-size:13px">观察下方7位小朋友：每张卡片代表1个人。${LEVELS[level].questions[qIndex].kind==='people'?'点击人物卡片选择，再点击可取消。':''}</p><div class="people">${PEOPLE.map(x=>`<button type="button" class="person ${x.a&&x.b?'ab':x.a?'a':'b'} ${picked.has(x.id)?'chosen':''}" ${LEVELS[level].questions[qIndex].kind==='people'&&!solved?'':'disabled'} data-act="person" data-id="${x.id}" aria-pressed="${picked.has(x.id)}"><small>${x.id}号</small><span class="face">${x.face}</span><span class="fruit">${x.fruit}</span><span class="personstate">${picked.has(x.id)?'✓ 已选':LEVELS[level].questions[qIndex].kind==='people'?'点我选择':'观察卡片'}</span></button>`).join('')}</div>${LEVELS[level].questions[qIndex].kind==='people'?`<p class="muted" style="font-size:13px">你已选择 ${picked.size} 位小朋友。</p>`:''}`}
function visual(t){switch(t){case 'venn':return `<div class="diagram"><div class="left">🍎<br>只喜欢苹果</div><div class="both">🍎🍌<br>两种都喜欢</div><div class="right">🍌<br>只喜欢香蕉</div></div>`;case 'fruit18':return `<div class="diagram"><div class="left">🍎<br>苹果组 18人</div><div class="both">🍎🍌<br>重叠 5人</div><div class="right">🍌<br>香蕉组 14人</div></div>`;case 'unknown':return `<span class="bubble red">苹果组</span><span class="bubble middle">共同部分 ❔</span><span class="bubble yellow">香蕉组</span>`;case 'dots':return `<span class="dots">● ● ● ● ● ● ●</span><span class="bubble">＋</span><span class="dots">● ● ● ● ●</span>`;case 'pattern':return `<span class="bubble">🔢</span><span class="bubble">→</span><span class="bubble">🔍 找变化</span>`;case 'reverse':return `<span class="bubble">❔</span><span class="bubble">→</span><span class="bubble">🔄</span><span class="bubble">→</span><span class="bubble">🎯</span>`;case 'match':return `<span class="bubble">🎩 🎩</span><span class="bubble">×</span><span class="bubble">🧣 🧣 🧣</span>`;case 'route':return `<span class="bubble">🏠</span><span class="bubble">→</span><span class="bubble">🌳</span><span class="bubble">→</span><span class="bubble">📚</span>`;case 'square':return `<div class="gridtiles"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div><span class="bubble">沿外边走一圈</span>`;case 'rectangle':return `<div class="gridtiles four"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div><span class="bubble">周长＝四条边相加</span>`;case 'tiles':return `<div class="gridtiles"><i></i><i></i><i></i><i></i><i></i><i></i></div><span class="bubble">数里面的小格</span>`;case 'clock':return `<div class="clock" aria-label="钟表图形"></div><span class="bubble">⏰ 60分钟</span>`;case 'cookies':return `<span class="dots">🍪 🍪 🍪 🍪 🍪 🍪</span>`;case 'fraction':return `<span class="bubble">⬜⬜ | ⬜⬜ | ⬜⬜ | ⬜⬜</span><span class="bubble">8格分成4份</span>`;case 'candies':return `<span class="dots">🍬 🍬 🍬</span><span class="bubble">一袋</span>`;case 'balls31':return `<span class="dots">🔴 🔴 🔴 🔵</span>`;case 'balls22':return `<span class="dots">🔴 🔴 🔵 🔵</span>`;case 'socks':return `<span class="dots">🧦 🔴 🧦 🔵</span>`;case 'blocks':return `<span class="dots">🔴 🟡 🔵</span>`;case 'pencils':return `<span class="dots">✏️ ✏️ ✏️ ✏️ ✏️</span><span class="bubble">4个笔筒</span>`;default:return ''}}
const VOICE_STORAGE='tianle-math-voice-v2';
let voiceSettings={voice:'auto',rate:'0.98',mode:'question'};
try{const p=JSON.parse(localStorage.getItem(VOICE_STORAGE)||'null');if(p&&typeof p==='object'){voiceSettings={...voiceSettings,...p}}}catch(e){}
let voiceList=[],voiceRun=0,voiceStarted=false;
function saveVoicePrefs(){try{localStorage.setItem(VOICE_STORAGE,JSON.stringify(voiceSettings))}catch(e){}}
function chineseNumber(n){n=Number(n);if(!Number.isInteger(n)||n<0||n>9999)return String(n);if(n===0)return '零';const digits='零一二三四五六七八九';let result='',unit=['','十','百','千'],zero=false;for(let i=3;i>=0;i--){const d=Math.floor(n/10**i)%10;if(d){if(zero&&result)result+='零';if(!(d===1&&i===1&&!result))result+=digits[d];result+=unit[i];zero=false}else if(result){zero=true}}return result}
function speakFriendly(text){return String(text).replace(/🍎🍌/g,'苹果和香蕉').replace(/🍎/g,'苹果').replace(/🍌/g,'香蕉').replace(/✏️/g,'铅笔').replace(/×/g,'乘以').replace(/÷/g,'除以').replace(/[+＋]/g,'加').replace(/[－−-]/g,'减').replace(/[=＝]/g,'等于').replace(/(\d+)\/(\d+)/g,(_,a,b)=>`${chineseNumber(b)}分之${chineseNumber(a)}`).replace(/\d+/g,m=>chineseNumber(m)).replace(/([。？！])/g,'$1 ')}
function speechQuestion(){const q=LEVELS[level].questions[qIndex];let sentence=q.question.replace(/喜欢苹果18人，喜欢香蕉14人，两种都喜欢5人。/g,'喜欢苹果的，有十八人。喜欢香蕉的，有十四人。其中，有五人两种都喜欢。');return speakFriendly(sentence)}
function speechOptions(){const q=LEVELS[level].questions[qIndex];if(q.kind!=='choice')return '';return q.options.map((o,i)=>`选项${'一二三'[i]}。${speakFriendly(o)}。`).join(' ')}
function voiceText(part='question'){return part==='options'?speechOptions():speechQuestion()}
function loadVoiceList(){if(!('speechSynthesis' in window))return;try{voiceList=window.speechSynthesis.getVoices().filter(v=>/^zh(?:-|_)/i.test(v.lang));const el=$('voice-select');if(!el)return;const opts=[`<option value="auto">自动选择中文声音（优先本地语音）</option>`].concat(voiceList.map(v=>`<option value="${esc(v.voiceURI)}">${esc(v.name)} · ${esc(v.lang)}${v.localService?' · 本地':''}</option>`));el.innerHTML=opts.join('');if(voiceSettings.voice!=='auto'&&voiceList.some(v=>v.voiceURI===voiceSettings.voice))el.value=voiceSettings.voice;else el.value='auto';const c=$('voice-count');if(c)c.textContent=voiceList.length?'此设备 Safari 提供 '+voiceList.length+' 种中文声音，网站无法增加系统未开放的声音。':'Safari 尚未列出中文声音；会尝试系统默认中文语音。'}catch(e){speechStatus('无法读取语音列表：'+String(e.message||e))}}
function selectedVoice(){if(voiceSettings.voice!=='auto'){const v=voiceList.find(v=>v.voiceURI===voiceSettings.voice);if(v)return v}return voiceList.slice().sort((a,b)=>{const quality=v=>((/premium|enhanced|natural|高质量|增强/i.test(v.name)?12:0)+(v.localService?4:0)+(/^zh[-_]CN$/i.test(v.lang)?2:0)+(v.default?1:0));return quality(b)-quality(a)})[0]||null}
function task(){const l=LEVELS[level],q=l.questions[qIndex];return `<section class="panel"><div class="row"><span class="chip">${l.icon} 第${level+1}关 · ${esc(l.tier)}</span><span class="chip">第${qIndex+1}/3题</span></div><h2>${esc(l.name)} · ${esc(l.topic)}</h2><p class="muted">${esc(l.intro)}</p><div class="progress"><i style="width:${(qIndex+(solved?1:0))/3*100}%"></i></div><div class="question"><span class="number">🕵️ 侦探任务 ${qIndex+1}</span><strong>${esc(q.question)}</strong></div><div class="rowbtn"><button class="btn secondary" data-act="speak">🔊 听题目</button>${q.kind==='choice'?`<button class="btn secondary" data-act="speakoptions">🔉 听选项</button>`:''}<button class="btn ghost" data-act="stopvoice">停止</button></div><div class="speakinfo" id="speech-note" role="status">点「听题目」会使用 iPad 系统朗读；下面可以调节语速及选择 Safari 提供的声音。</div><details class="speech-tools"><summary>🎙️ 家长设置 · 声音与语速</summary><label for="voice-select">中文朗读声音</label><select id="voice-select" data-voice="voice"><option value="auto">自动选择中文声音</option></select><p class="voice-help" id="voice-count">点击后列出这台设备开放给 Safari 的中文声音。</p><label for="voice-rate">朗读语速</label><div class="voice-row"><select id="voice-rate" data-voice="rate"><option value="0.88">舒缓 0.88倍</option><option value="0.98">自然 0.98倍</option><option value="1.08">稍快 1.08倍</option></select><button class="btn secondary" data-act="testvoice">▶ 试听</button></div><p class="voice-help">你这台设备目前显示的三种中文声音由 iOS Safari 提供，网页无法额外解锁 Siri 的自然语音。若都不满意，必须换成事先制作的自然中文音频。</p></details>${q.kind==='people'||(level<=1&&qIndex<2)?drawPeople():''}${q.visual?`<div class="visual" aria-label="辅助观察图">${visual(q.visual)}</div>`:''}${q.kind==='choice'?`<div class="choices">${q.options.map((v,i)=>`<button class="choice ${option===i?'chosen':''}" ${solved?'disabled':''} data-act="option" data-option="${i}" aria-pressed="${option===i}"><span class="option-letter">${'ABC'[i]}</span>${esc(v)}</button>`).join('')}</div>`:''}${feedback?`<div class="message ${solved?'right':'wrong'}" role="status">${solved?'✅ 做对啦！':'🔍 再想一想：'} ${esc(feedback)}</div>`:''}${hintStage>0&&!solved?`<div class="message hint"><strong>💡 思路提示 ${hintStage}/2</strong><br>${esc(hintStage===1?q.hint:q.clue)}</div>`:''}${solved?`<button class="btn primary expand" data-act="advance">${qIndex===2?'🏅 完成本关，解锁下一关':'下一题 →'}</button>`:`<div class="rowbtn"><button class="btn secondary expand" data-act="hint">💡 ${hintStage===0?'给我一点提示':hintStage===1?'再给一点提示':'重新看提示'}</button><button class="btn primary expand" data-act="check" ${(q.kind==='people'?picked.size===0:option===-1)?'disabled':''}>✅ 检查答案</button></div>`}<p class="stage">${wrongCount?'本题已尝试调整 '+wrongCount+' 次。答错不扣分，也不锁关。':'先说出自己的想法，再点击检查。'}</p></section>`}
function cleared(){const done=level===LEVELS.length-1;return `<section class="panel"><div class="cleared-fx" aria-label="通关奖励"><span class="big-medal">${done?'🏆':'🏅'}</span>${['⭐','✨','🎉','⭐','🎊','✨','⭐','🎉'].map((v,i)=>`<span class="particle" style="--dx:${Math.round(115*Math.cos(i*Math.PI/4))}px;--dy:${Math.round(55*Math.sin(i*Math.PI/4))}px;animation-delay:${i*0.13}s">${v}</span>`).join('')}</div><h2 style="text-align:center">${done?'全部13关通关！':'第'+(level+1)+'关，通关！'}</h2><p style="text-align:center">${esc(LEVELS[level].topic)} · 已完成3道题</p>${done?`<div class="message right">你已经练习了观察分类、选择运算、列举、逆推和证明。可以返回闯关地图复习，也可以进入数学实验室自己创造新题。</div><div class="rowbtn"><button class="btn primary expand" data-act="lab">🧪 打开数学实验室</button><button class="btn secondary expand" data-act="map">返回闯关地图</button></div>`:`<div class="message right">🔓 第${level+2}关解锁：${esc(LEVELS[level+1].name)}。<br>${esc(LEVELS[level+1].intro)}</div><div class="rowbtn"><button class="btn primary expand" data-act="nextlevel">进入下一关 →</button><button class="btn secondary expand" data-act="map">返回闯关地图</button></div>`}</section>`}
function laboratory(){const a=lab.onlyA,b=lab.both,c=lab.onlyB;return `<section class="panel"><div class="row"><span class="chip">🧪 自己创造数学题</span><button class="btn secondary" data-act="map">返回闯关地图</button></div><h2>三部分人数实验室</h2><p>拖动三个滑块，自己改变只有苹果、两种都喜欢、只有香蕉的人数。看一看总人数会怎样变化。</p>${[['onlyA','🍎 只喜欢苹果',a],['both','🍎🍌 两种都喜欢',b],['onlyB','🍌 只喜欢香蕉',c]].map(([id,label,n])=>`<label class="labrow" for="${id}"><strong>${label}</strong><span class="chip">${n}人</span><input type="range" min="0" max="10" step="1" id="${id}" data-lab="${id}" value="${n}"></label>`).join('')}<div class="diagram"><div class="left">只苹果<br>${a}人</div><div class="both">都喜欢<br>${b}人</div><div class="right">只香蕉<br>${c}人</div></div><div class="labresults" style="margin:14px 0"><div>苹果组<strong>${a+b}</strong></div><div>不同的人<strong>${a+b+c}</strong></div><div>香蕉组<strong>${b+c}</strong></div></div><div class="message right"><strong>方法一</strong>：${a+b}＋${b+c}－${b}＝${a+b+c}<br><strong>方法二</strong>：${a+b}＋${c}＝${a+b+c}</div><p class="muted">解释给家长听：为什么两种方法的结果总是一样？</p></section>`}
function draw(){const view=mode==='map'?map():mode==='cleared'?cleared():mode==='lab'?laboratory():task();$('app').innerHTML=header()+view;if(mode==='task'){loadVoiceList();const rate=$('voice-rate');if(rate)rate.value=voiceSettings.rate;}save()}
function openLevel(n){if(!Number.isInteger(n)||n<0||n>progress.unlocked)return;stopVoice(true);level=n;qIndex=0;picked.clear();option=-1;solved=false;wrongCount=0;hintStage=0;feedback='';mode='task';draw()}
function check(){if(mode!=='task'||solved)return;const q=LEVELS[level].questions[qIndex];if(q.kind==='people'&&picked.size===0||q.kind==='choice'&&option<0)return;const right=q.kind==='people'?picked.size===q.correct.length&&q.correct.every(x=>picked.has(x)):option===q.correct;if(right){solved=true;feedback=q.explain}else{wrongCount++;progress.attempts[level]=(progress.attempts[level]||0)+1;feedback=q.kind==='people'?'请重新看清卡片上的水果，有没有漏选或多选？':'还没有答对。先区分问题问的是哪一种数量，再尝试另一种方法。';}draw()}
function advance(){if(!solved)return;stopVoice(true);if(qIndex<2){qIndex++;picked.clear();option=-1;solved=false;wrongCount=0;hintStage=0;feedback='';draw();return}if(!progress.passed.includes(level))progress.passed.push(level);progress.unlocked=Math.max(progress.unlocked,Math.min(LEVELS.length-1,level+1));mode='cleared';save();draw()}
function stopVoice(silent=false){voiceRun++;try{window.speechSynthesis&&window.speechSynthesis.cancel()}catch(e){}clearTimeout(voiceTimeout);voiceUtterance=null;voiceStarted=false;if(!silent&&$('speech-note'))$('speech-note').textContent='已停止朗读。'}
function speechStatus(s){const e=$('speech-note');if(e)e.textContent=s}
function speak(part='question'){if(!('speechSynthesis'in window)||!('SpeechSynthesisUtterance'in window)){speechStatus('❗ Safari 不支持系统朗读。请由家长读题。');return}const synth=window.speechSynthesis;const text=part==='test'?'天乐，你好！今天我们一起开启数学侦探大冒险。':voiceText(part);if(!text)return;try{stopVoice(true);const run=voiceRun;loadVoiceList();const utter=new SpeechSynthesisUtterance(text);utter.lang='zh-CN';utter.rate=Math.min(1.15,Math.max(0.75,Number(voiceSettings.rate)||0.98));utter.volume=1;utter.pitch=1;const v=selectedVoice();if(v){utter.voice=v;utter.lang=v.lang}voiceUtterance=utter;utter.onstart=()=>{if(run!==voiceRun)return;voiceStarted=true;speechStatus('🔊 正在朗读'+(v?' · '+v.name:' · 系统默认中文语音'))};utter.onerror=e=>{if(run!==voiceRun)return;voiceUtterance=null;clearTimeout(voiceTimeout);if(e.error!=='canceled'&&e.error!=='interrupted')speechStatus('❗ 朗读失败：'+(e.error||'语音服务不可用')+'。可换一种中文声音重试。')};utter.onend=()=>{if(run!==voiceRun)return;voiceUtterance=null;clearTimeout(voiceTimeout);speechStatus('朗读结束。觉得声音生硬？展开下方设置，换一个中文声音试听。')};speechStatus('🔊 正在启动中文朗读…');synth.speak(utter);if(synth.paused)synth.resume();voiceTimeout=setTimeout(()=>{if(run===voiceRun&&!voiceStarted)speechStatus('❗ 朗读暂未启动。请点“试听”换声音，也可检查 iPad 音量和蓝牙输出。')},3800)}catch(e){voiceUtterance=null;speechStatus('❗ 无法启动朗读：'+String(e.message||e))}}
$('app').addEventListener('click',e=>{const b=e.target.closest('button[data-act]');if(!b||b.disabled)return;const action=b.dataset.act;if(action==='map'){stopVoice(true);mode='map';draw()}else if(action==='open'){openLevel(Number(b.dataset.level))}else if(action==='person'){if(mode!=='task'||solved||LEVELS[level].questions[qIndex].kind!=='people')return;const n=Number(b.dataset.id);picked.has(n)?picked.delete(n):picked.add(n);feedback='';draw()}else if(action==='option'){if(mode!=='task'||solved)return;option=Number(b.dataset.option);feedback='';draw()}else if(action==='check')check();else if(action==='hint'){hintStage=Math.min(2,hintStage+1);draw()}else if(action==='advance')advance();else if(action==='nextlevel')openLevel(level+1);else if(action==='speak')speak('question');else if(action==='speakoptions')speak('options');else if(action==='testvoice')speak('test');else if(action==='stopvoice')stopVoice();else if(action==='lab'){stopVoice(true);mode='lab';draw()}else if(action==='reset'){if(confirm('确定清空这台设备里的闯关进度吗？此操作无法撤销。')){stopVoice(true);progress={unlocked:0,passed:[],lastLevel:0,attempts:Array(LEVELS.length).fill(0)};level=0;mode='map';draw()}}});

$('app').addEventListener('change',e=>{const sel=e.target.closest('[data-voice]');if(!sel)return;voiceSettings[sel.dataset.voice]=sel.value;saveVoicePrefs();speechStatus('已保存朗读偏好。点击“试听”或“听题目”听听效果。')});
if('speechSynthesis'in window){try{window.speechSynthesis.addEventListener('voiceschanged',()=>{if(mode==='task')loadVoiceList()})}catch(e){}}
$('app').addEventListener('change',e=>{const inp=e.target.closest('input[data-lab]');if(!inp)return;lab[inp.dataset.lab]=Number(inp.value);draw()});
window.__tianleSelfTest=()=>{if(LEVELS.length!==13||LEVELS.some(x=>x.questions.length!==3))throw Error('课程数量异常');for(const l of LEVELS)for(const q of l.questions){if(q.kind==='choice'){if(q.options.length!==3||q.correct<0||q.correct>2)throw Error('选项异常')}else if(q.kind==='people'){if(!q.correct.every(x=>PEOPLE.some(p=>p.id===x)))throw Error('人物数据异常')}else throw Error('题型异常')}if(18+14-5!==27)throw Error('原题结果异常');if(chineseNumber(18)!=='十八'||speakFriendly('18＋14－5＝27')!=='十八加十四减五等于二十七')throw Error('数学朗读转换异常');return {levels:LEVELS.length,questions:LEVELS.reduce((s,x)=>s+x.questions.length,0),originalAnswer:27,passed:true}};
draw();
</script></body></html>
