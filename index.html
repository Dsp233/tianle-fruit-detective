<script>
'use strict';
const LEVELS=[{"icon":"🍎","name":"水果侦探","topic":"集合与重复计数","tier":"入门","intro":"一个人可以属于两个组，但计算不同人数时只能算一次。","questions":[{"kind":"people","question":"请点出所有喜欢苹果的小朋友。","correct":[1,2,4,5,7],"hint":"有🍎的人都算，拿着两种水果的人也喜欢苹果。","clue":"检查一下拿着🍎🍌的三个人，你选中了吗？","explain":"一共5人喜欢苹果。拿着🍎🍌的人也属于苹果组。"},{"kind":"people","question":"请点出两种水果都喜欢的小朋友。","correct":[2,4,5],"hint":"寻找同一张卡片上同时出现🍎和🍌的人。","clue":"共同部分既属于苹果组，又属于香蕉组。","explain":"共同部分有3人，这3个人在数两个组时会出现两次。"},{"kind":"choice","question":"喜欢苹果5人，喜欢香蕉5人，其中3人两种都喜欢。不同的小朋友一共有几人？","options":["5人","7人","10人"],"correct":1,"hint":"5＋5得到的数字中，哪些人被数了两次？","clue":"两个组相加得到10，再减去重复计算的3次。","explain":"5＋5－3＝7人。减去的是多算的那一遍。","visual":"venn"}]},{"icon":"🧩","name":"一个组，三部分","topic":"“喜欢”与“只喜欢”","tier":"入门","intro":"先看清题目问的是整个组，还是这个组里独有的一部分。","questions":[{"kind":"people","question":"请点出只喜欢苹果的小朋友。","correct":[1,7],"hint":"“只喜欢苹果”允许同时喜欢香蕉吗？","clue":"有🍎但没有🍌的小朋友是谁？","explain":"只喜欢苹果的是1号和7号，共2人。"},{"kind":"people","question":"请点出只喜欢香蕉的小朋友。","correct":[3,6],"hint":"看清楚“只”字。","clue":"有🍌但没有🍎的小朋友是谁？","explain":"只喜欢香蕉的有2人。三部分分别是2、3、2人。"},{"kind":"choice","question":"喜欢苹果18人，喜欢香蕉14人，两种都喜欢5人。至少喜欢一种水果的有多少人？","options":["27人","32人","37人"],"correct":0,"hint":"把两个组相加时，共同部分被数了几次？","clue":"18＋14－5。","explain":"18＋14－5＝27人。不要把“两种都喜欢”看成额外的第三组。","visual":"fruit18"}]},{"icon":"🔍","name":"条件够不够","topic":"审题与信息充分性","tier":"入门","intro":"先判断条件能否得到唯一答案，再选择算法。","questions":[{"kind":"choice","question":"只知道喜欢苹果5人、喜欢香蕉5人，不知道两种都喜欢的有几人。能确定总人数吗？","options":["能，一定是10人","能，一定是5人","不能，还缺少信息"],"correct":2,"hint":"两个组如果没有重叠，和完全重叠，结果会一样吗？","clue":"缺少“两种都喜欢的人数”，就无法得到唯一总人数。","explain":"不能确定。既可能没有重叠，也可能有重叠；不能凭两个5猜出总人数。","visual":"unknown"},{"kind":"choice","question":"喜欢苹果5人，喜欢香蕉5人，两种都喜欢3人。只喜欢苹果的有几人？","options":["2人","3人","5人"],"correct":0,"hint":"苹果组5人里有3人也喜欢香蕉。","clue":"用苹果组人数减去共同部分。","explain":"5－3＝2人。","visual":"venn"},{"kind":"choice","question":"喜欢苹果5人，喜欢香蕉5人，至少喜欢一种的共7人。两种都喜欢的有几人？","options":["2人","3人","7人"],"correct":1,"hint":"两个组相加得到10，比实际不同人数7多了多少？","clue":"多出来的是重复算的那一遍。","explain":"5＋5－7＝3人。这一次是反过来求共同部分。","visual":"unknown"}]},{"icon":"⚪","name":"奇偶机关","topic":"奇数、偶数与规律","tier":"数感","intro":"有时不用算很多步，观察奇偶性就能判断答案。","questions":[{"kind":"choice","question":"7个小朋友又来了5个小朋友，现在总人数是奇数还是偶数？","options":["奇数","偶数","无法判断"],"correct":1,"hint":"先计算7＋5。","clue":"能两两配对没有剩下的数，是偶数。","explain":"7＋5＝12，12是偶数。","visual":"dots"},{"kind":"choice","question":"从3开始，每次加2：3，5，7，9，……下一个是什么数？","options":["10","11","12"],"correct":1,"hint":"相邻两个数差多少？","clue":"9再加2。","explain":"下一个是11。奇数每次加2仍是奇数。","visual":"pattern"},{"kind":"choice","question":"一个偶数加上一个奇数，结果一定是什么？","options":["奇数","偶数","有时奇有时偶"],"correct":0,"hint":"试试2＋3和4＋5。","clue":"偶数可以两两配对，额外加一个奇数会剩下一人。","explain":"偶数＋奇数＝奇数。","visual":"dots"}]},{"icon":"🔢","name":"数字密码","topic":"数列与模式识别","tier":"数感","intro":"不仅找下一个数，还要能解释为什么。","questions":[{"kind":"choice","question":"2，5，8，11，□。方框里是什么数？","options":["12","13","14"],"correct":2,"hint":"相邻两个数的差是多少？","clue":"每次加3。","explain":"11＋3＝14。","visual":"pattern"},{"kind":"choice","question":"1，2，4，8，□。方框里是什么数？","options":["10","12","16"],"correct":2,"hint":"这次不是每次加同一个数。","clue":"每次变成前一个数的2倍。","explain":"8×2＝16。","visual":"pattern"},{"kind":"choice","question":"把1、2、3、4配成两对，每对的和相同。应该怎样配？","options":["1和2；3和4","1和4；2和3","1和3；2和4"],"correct":1,"hint":"试试最小数与最大数配成一对。","clue":"比较1＋4和2＋3。","explain":"1＋4＝5，2＋3＝5。","visual":"pattern"}]},{"icon":"↩️","name":"倒着想","topic":"逆推与还原","tier":"方法","intro":"从结果返回起点，把做过的运算倒过来。","questions":[{"kind":"choice","question":"一个数加7得到15。原来的数是多少？","options":["8","15","22"],"correct":0,"hint":"怎样撤销“加7”？","clue":"从15里减去7。","explain":"15－7＝8。","visual":"reverse"},{"kind":"choice","question":"一个数乘3得到18。原来的数是多少？","options":["3","6","15"],"correct":1,"hint":"几个相同的数相加等于18？","clue":"把18平均分成3份。","explain":"18÷3＝6。","visual":"reverse"},{"kind":"choice","question":"盒子里原有一些球，拿走4个后还剩9个。原来有多少个？","options":["5个","9个","13个"],"correct":2,"hint":"把拿走的球放回去。","clue":"9＋4。","explain":"9＋4＝13个。","visual":"reverse"}]},{"icon":"🎩","name":"搭配工厂","topic":"有序枚举与乘法计数","tier":"方法","intro":"固定一种选择，再按顺序列出另一种，不漏不重。","questions":[{"kind":"choice","question":"有2顶帽子、3条围巾，每次选1顶帽子和1条围巾，有多少种搭配？","options":["5种","6种","8种"],"correct":1,"hint":"固定一顶帽子，围巾有几种可选？","clue":"每顶帽子都能配3条不同围巾。","explain":"2×3＝6种。","visual":"match"},{"kind":"choice","question":"从家到公园有2条路，从公园到图书馆有3条路。必须经过公园，有几种路线？","options":["5种","6种","9种"],"correct":1,"hint":"选定第一段后，第二段仍有3种走法。","clue":"第一段2种，第二段每次有3种。","explain":"2×3＝6种，与帽子围巾搭配是同一种结构。","visual":"route"},{"kind":"choice","question":"用数字1和2组成两位数，两个位置都可以重复使用数字，一共有多少个？","options":["2个","3个","4个"],"correct":2,"hint":"十位选1时，个位还能选什么？","clue":"按顺序列出11、12、21、22。","explain":"共有4个两位数。按十位分类，不漏不重。","visual":"match"}]},{"icon":"📐","name":"图形建筑师","topic":"周长与面积初步","tier":"空间","intro":"周长是外边界的长度，面积是内部占了多少格。","questions":[{"kind":"choice","question":"正方形每条边长3厘米，它的周长是多少？","options":["6厘米","9厘米","12厘米"],"correct":2,"hint":"正方形有几条相等的边？","clue":"把四条3厘米的边加起来。","explain":"3＋3＋3＋3＝12厘米。","visual":"square"},{"kind":"choice","question":"长方形长4厘米、宽2厘米。它的周长是多少？","options":["6厘米","8厘米","12厘米"],"correct":2,"hint":"要沿着长方形的外边走一圈。","clue":"四条边依次是4、2、4、2。","explain":"4＋2＋4＋2＝12厘米。","visual":"rectangle"},{"kind":"choice","question":"用相同的小正方形铺满一个长3格、宽2格的长方形，需要几块？","options":["5块","6块","8块"],"correct":1,"hint":"每行3块，一共2行。","clue":"数两行：3＋3。","explain":"3×2＝6块。数的是内部方格，不是外边一圈的长度。","visual":"tiles"}]},{"icon":"🕒","name":"时间与分数","topic":"单位与部分—整体","tier":"概念","intro":"把整体平均分成同样多的部分，再看其中几份。","questions":[{"kind":"choice","question":"一小时有60分钟。半小时是多少分钟？","options":["20分钟","30分钟","40分钟"],"correct":1,"hint":"半小时是把一小时平均分成几份？","clue":"把60平均分成2份。","explain":"60÷2＝30分钟。","visual":"clock"},{"kind":"choice","question":"12块饼干平均分给2个人，每人得到几块？","options":["4块","6块","8块"],"correct":1,"hint":"两个人分到的数量必须相同。","clue":"12÷2。","explain":"12÷2＝6块，每人得到整体的一半。","visual":"cookies"},{"kind":"choice","question":"8个相同方格平均分成4份，涂其中3份，需要涂几格？","options":["3格","6格","7格"],"correct":1,"hint":"先求每份几个小方格。","clue":"8÷4＝2，每份2格，取3份。","explain":"2×3＝6格。这是8的四分之三。","visual":"fraction"}]},{"icon":"🔐","name":"整除密码","topic":"整除与余数 ">🔴 🔴 🔴 🔵</span>`;case 'balls22':return `<span class="dots">🔴 🔴 🔵 🔵</span>`;case 'socks':return `<span class="dots">🧦 🔴 🧦 🔵</span>`;case 'blocks':return `<span class="dots">🔴 🟡 🔵</span>`;case 'pencils':return `<span class="dots">✏️ ✏️ ✏️ ✏️ ✏️</span><span class="bubble">4个笔筒</span>`;default:return ''}}
function voiceText(){const q=LEVELS[level].questions[qIndex];return `第${level+1}关，第${qIndex+1}题。${q.question}。${q.kind==='choice'?q.options.map((v,i)=>`${'甲乙丙'[i]}，${v}`).join('。'):''}`}
function task(){const l=LEVELS[level],q=l.questions[qIndex];return `<section class="panel"><div class="row"><span class="chip">${l.icon} 第${level+1}关 · ${esc(l.tier)}</span><span class="chip">第${qIndex+1}/3题</span></div><h2>${esc(l.name)} · ${esc(l.topic)}</h2><p class="muted">${esc(l.intro)}</p><div class="progress"><i style="width:${(qIndex+(solved?1:0))/3*100}%"></i></div><div class="question"><span class="number">🕵️ 侦探任务 ${qIndex+1}</span><strong>${esc(q.question)}</strong></div><div class="rowbtn"><button class="btn secondary" data-act="speak">🔊 听题</button><button class="btn ghost" data-act="stopvoice">停止朗读</button></div><div class="speakinfo" id="speech-note" role="status">朗读使用设备内置中文语音；若没有声音，页面会提供排查提示。</div>${q.kind==='people'||(level<=1&&qIndex<2)?drawPeople():''}${q.visual?`<div class="visual" aria-label="辅助观察图">${visual(q.visual)}</div>`:''}${q.kind==='choice'?`<div class="choices">${q.options.map((v,i)=>`<button class="choice ${option===i?'chosen':''}" ${solved?'disabled':''} data-act="option" data-option="${i}" aria-pressed="${option===i}"><span class="option-letter">${'ABC'[i]}</span>${esc(v)}</button>`).join('')}</div>`:''}${feedback?`<div class="message ${solved?'right':'wrong'}" role="status">${solved?'✅ 做对啦！':'🔍 再想一想：'} ${esc(feedback)}</div>`:''}${hintStage>0&&!solved?`<div class="message hint"><strong>💡 思路提示 ${hintStage}/2</strong><br>${esc(hintStage===1?q.hint:q.clue)}</div>`:''}${solved?`<button class="btn primary expand" data-act="advance">${qIndex===2?'🏅 完成本关，解锁下一关':'下一题 →'}</button>`:`<div class="rowbtn"><button class="btn secondary expand" data-act="hint">💡 ${hintStage===0?'给我一点提示':hintStage===1?'再给一点提示':'重新看提示'}</button><button class="btn primary expand" data-act="check" ${(q.kind==='people'?picked.size===0:option===-1)?'disabled':''}>✅ 检查答案</button></div>`}<p class="stage">${wrongCount?'本题已尝试调整 '+wrongCount+' 次。答错不扣分，也不锁关。':'先说出自己的想法，再点击检查。'}</p></section>`}
function cleared(){const done=level===LEVELS.length-1;return `<section class="panel"><div class="confetti">${done?'🏆🎉🏆':'🏅✨🎊'}</div><h2 style="text-align:center">${done?'全部13关通关！':'第'+(level+1)+'关，通关！'}</h2><p style="text-align:center">${esc(LEVELS[level].topic)} · 已完成3道题</p>${done?`<div class="message right">你已经练习了观察分类、选择运算、列举、逆推和证明。可以返回闯关地图复习，也可以进入数学实验室自己创造新题。</div><div class="rowbtn"><button class="btn primary expand" data-act="lab">🧪 打开数学实验室</button><button class="btn secondary expand" data-act="map">返回闯关地图</button></div>`:`<div class="message right">🔓 第${level+2}关解锁：${esc(LEVELS[level+1].name)}。<br>${esc(LEVELS[level+1].intro)}</div><div class="rowbtn"><button class="btn primary expand" data-act="nextlevel">进入下一关 →</button><button class="btn secondary expand" data-act="map">返回闯关地图</button></div>`}</section>`}
function laboratory(){const a=lab.onlyA,b=lab.both,c=lab.onlyB;return `<section class="panel"><div class="row"><span class="chip">🧪 自己创造数学题</span><button class="btn secondary" data-act="map">返回闯关地图</button></div><h2>三部分人数实验室</h2><p>拖动三个滑块，自己改变只有苹果、两种都喜欢、只有香蕉的人数。看一看总人数会怎样变化。</p>${[['onlyA','🍎 只喜欢苹果',a],['both','🍎🍌 两种都喜欢',b],['onlyB','🍌 只喜欢香蕉',c]].map(([id,label,n])=>`<label class="labrow" for="${id}"><strong>${label}</strong><span class="chip">${n}人</span><input type="range" min="0" max="10" step="1" id="${id}" data-lab="${id}" value="${n}"></label>`).join('')}<div class="diagram"><div class="left">只苹果<br>${a}人</div><div class="both">都喜欢<br>${b}人</div><div class="right">只香蕉<br>${c}人</div></div><div class="labresults" style="margin:14px 0"><div>苹果组<strong>${a+b}</strong></div><div>不同的人<strong>${a+b+c}</strong></div><div>香蕉组<strong>${b+c}</strong></div></div><div class="message right"><strong>方法一</strong>：${a+b}＋${b+c}－${b}＝${a+b+c}<br><strong>方法二</strong>：${a+b}＋${c}＝${a+b+c}</div><p class="muted">解释给家长听：为什么两种方法的结果总是一样？</p></section>`}
function draw(){const view=mode==='map'?map():mode==='cleared'?cleared():mode==='lab'?laboratory():task();$('app').innerHTML=header()+view;save()}
function openLevel(n){if(!Number.isInteger(n)||n<0||n>progress.unlocked)return;stopVoice(true);level=n;qIndex=0;picked.clear();option=-1;solved=false;wrongCount=0;hintStage=0;feedback='';mode='task';draw()}
function check(){if(mode!=='task'||solved)return;const q=LEVELS[level].questions[qIndex];if(q.kind==='people'&&picked.size===0||q.kind==='choice'&&option<0)return;const right=q.kind==='people'?picked.size===q.correct.length&&q.correct.every(x=>picked.has(x)):option===q.correct;if(right){solved=true;feedback=q.explain}else{wrongCount++;progress.attempts[level]=(progress.attempts[level]||0)+1;feedback=q.kind==='people'?'请重新看清卡片上的水果，有没有漏选或多选？':'还没有答对。先区分问题问的是哪一种数量，再尝试另一种方法。';}draw()}
function advance(){if(!solved)return;stopVoice(true);if(qIndex<2){qIndex++;picked.clear();option=-1;solved=false;wrongCount=0;hintStage=0;feedback='';draw();return}if(!progress.passed.includes(level))progress.passed.push(level);progress.unlocked=Math.max(progress.unlocked,Math.min(LEVELS.length-1,level+1));mode='cleared';save();draw()}
function stopVoice(silent=false){try{window.speechSynthesis&&window.speechSynthesis.cancel()}catch(e){}clearTimeout(voiceTimeout);voiceUtterance=null;if(!silent&&$('speech-note'))$('speech-note').textContent='已停止朗读。'}
function speechStatus(s){const e=$('speech-note');if(e)e.textContent=s}
function speak(){if(!('speechSynthesis'in window)||!('SpeechSynthesisUtterance'in window)){speechStatus('❗ 本浏览器不支持系统朗读。请用 Safari 打开，或由家长读题。');return}const synth=window.speechSynthesis;try{clearTimeout(voiceTimeout);synth.cancel();const utter=new SpeechSynthesisUtterance(voiceText());utter.lang='zh-CN';utter.rate=0.85;utter.volume=1;utter.pitch=1;const vs=synth.getVoices();const cn=vs.find(v=>/^zh[-_]CN$/i.test(v.lang))||vs.find(v=>/^zh[-_]/i.test(v.lang));if(cn){utter.voice=cn;utter.lang=cn.lang}voiceUtterance=utter;let started=false;utter.onstart=()=>{if(voiceUtterance===utter){started=true;speechStatus('🔊 已启动朗读。若仍听不到，请检查 iPad 媒体音量、蓝牙音频输出和中文语音设置。')}};utter.onerror=e=>{if(voiceUtterance===utter){voiceUtterance=null;clearTimeout(voiceTimeout);speechStatus('❗ 朗读失败（'+(e.error||'语音服务不可用')+'）。请用 iPad Safari 打开，并检查媒体音量和中文语音设置。')}};utter.onend=()=>{if(voiceUtterance===utter){voiceUtterance=null;clearTimeout(voiceTimeout);speechStatus('朗读已结束。若没有听到声音，说明本设备的系统朗读未正常发声，请让家长读题。')}};speechStatus('🔊 正在请求系统朗读…');synth.speak(utter);if(synth.paused)synth.resume();voiceTimeout=setTimeout(()=>{if(voiceUtterance===utter&&!started)speechStatus('❗ 系统语音暂未启动。请检查 Safari、音量、蓝牙输出与中文语音；也可以请家长读题。')},3200)}catch(e){voiceUtterance=null;speechStatus('❗ 无法启动朗读：'+String(e.message||e))}}
$('app').addEventListener('click',e=>{const b=e.target.closest('button[data-act]');if(!b||b.disabled)return;const action=b.dataset.act;if(action==='map'){stopVoice(true);mode='map';draw()}else if(action==='open'){openLevel(Number(b.dataset.level))}else if(action==='person'){if(mode!=='task'||solved||LEVELS[level].questions[qIndex].kind!=='people')return;const n=Number(b.dataset.id);picked.has(n)?picked.delete(n):picked.add(n);feedback='';draw()}else if(action==='option'){if(mode!=='task'||solved)return;option=Number(b.dataset.option);feedback='';draw()}else if(action==='check')check();else if(action==='hint'){hintStage=Math.min(2,hintStage+1);draw()}else if(action==='advance')advance();else if(action==='nextlevel')openLevel(level+1);else if(action==='speak')speak();else if(action==='stopvoice')stopVoice();else if(action==='lab'){stopVoice(true);mode='lab';draw()}else if(action==='reset'){if(confirm('确定清空这台设备里的闯关进度吗？此操作无法撤销。')){stopVoice(true);progress={unlocked:0,passed:[],lastLevel:0,attempts:Array(LEVELS.length).fill(0)};level=0;mode='map';draw()}}});
$('app').addEventListener('change',e=>{const inp=e.target.closest('input[data-lab]');if(!inp)return;lab[inp.dataset.lab]=Number(inp.value);draw()});
window.__tianleSelfTest=()=>{if(LEVELS.length!==13||LEVELS.some(x=>x.questions.length!==3))throw Error('课程数量异常');for(const l of LEVELS)for(const q of l.questions){if(q.kind==='choice'){if(q.options.length!==3||q.correct<0||q.correct>2)throw Error('选项异常')}else if(q.kind==='people'){if(!q.correct.every(x=>PEOPLE.some(p=>p.id===x)))throw Error('人物数据异常')}else throw Error('题型异常')}if(18+14-5!==27)throw Error('原题结果异常');return {levels:LEVELS.length,questions:LEVELS.reduce((s,x)=>s+x.questions.length,0),originalAnswer:27,passed:true}};
draw();
</script></body></html>
