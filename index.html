if(t.kind==='build'){const orig=t.route==='original';return `<div class="tip">${orig?'🍎 18　 🍌 14　 🍎🍌 5':'🍎 红＋橙＝5　🍌 橙＋黄＝5'} ${speechButton(orig?'苹果组十八人，香蕉组十四人，共同部分五人。':'红色两人，橙色三人，黄色两人。苹果整组五人，香蕉整组五人。','听人数')}</div>${orig?'<div class="parts"><div class="part part-red">🍎<span class="count">❔</span><span class="label">只苹果</span></div><div class="part part-orange">🍎🍌<span class="count">5</span><span class="label">都喜欢</span></div><div class="part part-yellow">🍌<span class="count">❔</span><span class="label">只香蕉</span></div></div>':partCards()+groups()}<div class="tip">👆 先点一张人数卡，再点 ＋ 或 －；顺序可以自由选。${speechButton('请选择人数卡下面的加号或减号，拼出你的算式。顺序可以自由选择。')}</div>${buildButtons(orig)}<div class="formula" id="expr" aria-live="polite">${expression.length?expression.map((x,i)=>`${i===0?(x.sign<0?'－':''):x.sign<0?'－':'＋'}${count(terms[x.id],orig)}<small>(${terms[x.id].label})</small>`).join(''):'把人数卡放到这里…'}</div><div class="row"><button class="secondary" data-act="undo" ${expression.length?'':'disabled'}>↩ 撤销</button><button class="secondary" data-act="clear" ${expression.length?'':'disabled'}>清空</button>${speechButton('目前选了'+(expression.length?expression.map(x=>(x.sign<0?'减去':'加上')+describeTerm(x.id,orig)).join('，'):'零个部分'),'听当前算式')}</div>`}
return `<div class="tip">${t.id==='L11'?'🎨 9　🎵 8　🎨🎵 3':t.id==='L12'?'🍎 5　🍌 5　🍎🍌 ❔':t.id==='L09'?'🍎 5 ＋ 🍌 5 ＝ 10 ❓':''} ${speechButton(t.say,'听问题情境')}</div>${choiceCards(t)}`}
function renderTask(){const t=task();const visuals=t.kind==='choice'?(t.id==='L11'||t.id==='L12'?scenarioArt(t):partCards()+groups()):'';return `<section class="panel">${progressHeader(state.taskIndex,tasks.length,'🍎 学')}<div class="tasktop"><span class="tag">${t.id}　${esc(t.title)}</span>${speechButton(t.title,'听任务名称')}</div><div class="focus-card"><b>${lessonProgress(t)} · 知识点：${skillFor(t.id)}</b>${t.id==='L01'?'先看老师示范：一张人物卡就是一个人。接下来你来判断他属于哪些水果组。':t.id==='L07'?'跟着图把三个互不重叠的区域各数一次。':t.id==='L10'?'现在自己把题目中的已知数拼成方法；家长不提示。':'先观察图，再自己选择、检查和说明。'}</div><div class="speakline" style="margin:12px 0"><div class="big">${esc(t.say)}</div>${speechButton(t.say,'听完整任务')}</div>${t.kind==='choice'?visuals:''}${taskSpecific(t)}<div id="feedback">${wrong?feedbackHtml(wrong,false):''}${hint?feedbackHtml(hint===1?t.help:'先看图，再把小朋友分别数一数。',true):''}</div>${complete?`<div class="tip ok"><div class="speakline"><strong>🎉 ${esc(t.answer)}</strong>${speechButton(t.answer,'听完成讲解')}</div></div><button class="primary green" style="width:100%" data-act="next">${state.taskIndex===tasks.length-1?'🏆 学习岛完成 →':'下一步 ➜'}</button>`:`<div class="row"><button class="secondary" data-act="hint">💡 小提示 🔊</button><button class="primary" data-act="check">检查答案 ✓</button></div>`}<div id="voice-status" class="voice-state"></div></section>`}
function feedbackHtml(txt,isHint){return `<div class="tip ${isHint?'':'no'}"><div class="speakline"><span>${esc(txt)}</span>${speechButton(txt,isHint?'听提示':'听反馈')}</div></div>`}
function scenarioArt(t){const id=t.id;const nums={L11:['🎨 9','🎵 8','🎨🎵 3'],L12:['🍎 5','🍌 5','🍎🍌 ❔'],P01:['🏃 10','🪢 7','🏃🪢 4'],P02:['📚 8','🔬 6','📚🔬 2'],P03:['🍎 4','🍌 3','🍎🍌 ❔'],P04:['📖 9','⚽ 只运动 6'],E01:['🚴 9','🏊 7','🚴🏊 2'],E02:['🍎 8','🍎🍌 3','🍎单独 ❔'],E03:['🎨 5','🎤 4','🎨🎤 ❔'],E04:['📖 8','🔬只借 3'],E05:['🍎 6','🍌 5','👥 共9'],E06:['👥 5','👥 6','🤝 2'],E07:['🍐 7','🍑 8','🍐🍑 4'],E08:['🍎 2','🍎🍌 3','🍌 4'],E09:['🍎 5','🍌 5','🍎🍌 3'],E10:['💃 10','🎤 8','💃🎤 3']}[id];return nums?`<div class="parts" style="grid-template-columns:repeat(${nums.length},minmax(0,1fr))">${nums.map((n,i)=>`<div class="part" style="background:#f1f6ff;border-color:#cadbf1"><strong style="font-size:clamp(17px,4vw,25px)">${esc(n)}</strong></div>`).join('')}</div>`:''}
function renderPractice(){const t=PRACTICE[state.practiceIndex];return `<section class="panel">${progressHeader(state.practiceIndex,PRACTICE.length,'🧩 练')}${stageStrip('practice')}<div class="tag">换个情境 · 自己想办法 · 知识点：${skillFor(t.id)}</div><div class="speakline" style="margin:10px 0"><div class="big">${esc(t.say)}</div>${speechButton(t.say,'听练习题')}</div>${scenarioArt(t)}${choiceCards(t)}<div id="feedback">${wrong?feedbackHtml(wrong,false):''}${hint?feedbackHtml(t.help,true):''}</div>${complete?`<div class="tip ok">${esc(t.answer)}　${speechButton(t.answer,'听解题解释')}</div><button class="primary green" data-act="next">${state.practiceIndex===PRACTICE.length-1?'解锁10题样卷 🏆':'下一题 →'}</button>`:`<div class="row"><button class="secondary" data-act="hint">💡 提示 🔊</button><button class="primary" data-act="check">检查答案 ✓</button></div>`}<div id="voice-status" class="voice-state"></div></section>`}
function renderExam(){const qs=activeExam(),t=qs[state.examIndex];return `<section class="panel">${progressHeader(state.examIndex,qs.length,'🏆 测 · 双周独立测')}${stageStrip('exam')}<div class="tag">10题 · 无提示 · 交卷前不公布答案</div><div class="source-tag">${esc(t.source||'教学原创变式')}｜知识点：${skillFor(t.id)}</div><div class="speakline" style="margin:12px 0"><div class="big">${esc(t.say)}</div>${speechButton(t.say,'听测试题')}</div>${t.visual?`<div class="parts" style="grid-template-columns:repeat(${t.visual.length},minmax(0,1fr))">${t.visual.map(x=>`<div class="part" style="background:#f1f6ff;border-color:#cadbf1"><strong style="font-size:clamp(17px,4vw,25px)">${esc(x)}</strong></div>`).join('')}</div>`:scenarioArt(t)}${!examReveal?`<div class="exam-prompt">👨‍👩‍👦 家长只读题。孩子先自己看图、想一想或列式；准备好后再看选项。</div><button class="primary green" style="width:100%" data-act="revealExam">我想好了，显示选项</button>`:`${choiceCards(t)}<p class="muted">先独立想过，再选择。测试中没有提示，也不会提前公布答案。</p><button class="primary green" data-act="examSubmit" ${choice<0?'disabled':''}>${state.examIndex===qs.length-1?'交卷 📋':'下一题 →'}</button>`}<div id="voice-status" class="voice-state"></div></section>`}
function renderExamDone(){const qs=activeExam(),correct=state.examAnswers.filter((x,i)=>x===qs[i]?.correct).length;return `<section class="panel home"><h1>🏆 完成10题双周测！</h1><p>你完成了一次独立挑战！去找家长看看下一步探索方向。</p>${speechButton('天乐，十道题都完成了。你很认真！现在请爸爸妈妈来查看学习报告。','听通关鼓励')}<div class="scene" style="height:150px"><div class="island main">🏅</div><div class="path">⭐ ✦ ⭐</div></div><button class="primary green" style="width:100%;margin-top:15px" data-go="home">回冒险地图</button></section><section class="panel"><strong>家长查看报告</strong><p class="muted">首次独立作答 ${correct}/10；下次双周测：${examDueText()}。数据保存在本机。</p><button class="secondary" data-go="parent">打开家长报告</button></section>`}
function report(){const ev=state.events,by={};ev.forEach(e=>{if(!e.task)return;by[e.task]??={attempts:0,hints:0,correct:0,methods:[]};if(e.type==='submit'){by[e.task].attempts++;if(e.ok)by[e.task].correct++}if(e.type==='hint')by[e.task].hints++;if(e.method)by[e.task].methods.push(e.method)});const qs=activeExam(),wrongExam=state.examAnswers.map((ans,i)=>({id:qs[i]?.id,topic:qs[i]?.topic,skill:qs[i]?.skill,answer:ans,correct:qs[i]?.correct,ok:ans===qs[i]?.correct})).filter(x=>x.id&&!x.ok);return {version:6,mode:'local_adaptive_prototype',learning:{completed:state.learnDone,progress:Math.min(state.taskIndex+1,tasks.length),total:tasks.length,knowledge:knowledgeSummary().map(x=>x[0])},practice:{completed:state.practiceDone,progress:Math.min(state.practiceIndex+1,PRACTICE.length),total:PRACTICE.length},exam:{done:state.examDone,firstTryCorrect:state.examDone?10-wrongExam.length:null,total:10,wrong:wrongExam,nextExamAt:state.nextExamAt,selectedItems:state.examSet},monthly:monthlyAnalysis(),byTask:by,caveat:'仅本机记录；组卷按近14天本机练习错误与提示优先排序，题目来自固定本地题库，已做算术与逻辑校验，仍需教学者复核，不是AI临时生成；月度错因是线索，不是诊断；无云同步。'} }
function renderParent(){const r=report(),m=r.monthly;return `<section class="panel parent"><div class="row spread"><h2>👨‍👩‍👦 家长专区 · 透</h2><button class="secondary" data-go="home">返回儿童首页</button></div>${stageStrip('parent')}<div class="tip">学习记录只保存在当前浏览器。本地双周测按近14天作答情况从固定题库抽题并优先安排弱项；月度结果是复习线索，不是 AI 诊断。换设备不会同步。</div><h3>本次学到的知识点</h3><div class="knowledge-list">${knowledgeSummary().map(([a,b])=>`<div class="knowledge-item"><b>${state.learnDone?'✅':'📘'} ${a}</b>${b}</div>`).join('')}</div><div class="row"><span class="tag">学 ${state.learnDone?'完成':Math.min(state.taskIndex+1,tasks.length)+'/'+tasks.length}</span><span class="tag">练 ${state.practiceDone?'完成':Math.min(state.practiceIndex+1,PRACTICE.length)+'/'+PRACTICE.length}</span><span class="tag">测 ${state.examDone?'已完成':'未完成'}</span></div><h3 style="margin-top:17px">📊 双周测</h3><div class="report-block"><b class="${state.practiceDone&&isExamDue()?'due':'not-due'}">${state.practiceDone?examDueText():'完成变形练习后开放首测'}</b><p>测试前先让孩子自己看图、想方法或列式，家长只读题。系统不提供提示或即时答案反馈。</p>${state.examDone?`<p>最近一次首次作答：${r.exam.firstTryCorrect}/10；下次：${examDueText()}</p>`:''}<p class="small-note">题库含 V5 固定样题及新增原创变式，共20题；根据本机近14天错误与提示优先选10题。题目已做算术与逻辑校验，仍需教学者复核；不是经核验的AMC8历年真题。AMC8近十届频率尚未完成250题逐题复核。</p></div><h3>🔎 近30天错题复盘</h3><div class="report-block">${m.events<3?`目前近30天记录${m.events}条、来自${m.days}天；证据不足，不给出确定错因。继续记录学习和测试过程。`:`近30天记录${m.events}条，首次错误${m.wrong}次，覆盖${m.days}天。${m.days<2?'目前集中在少数日期，以下只作复习假设。':'以下是可复核的薄弱点线索。'}`} ${m.suggestions.length?`<ul>${m.suggestions.map(x=>`<li><b>${esc(x.label)}</b>：${x.count}次错误${x.reasons.length?'（线索：'+esc(x.reasons.join('；'))+'）':''}；建议回看 ${x.skill==='union'?'L07–L08':x.skill==='double_count'?'L08–L09':x.skill==='partition'?'L04–L06':x.skill==='sufficiency'?'L12':x.skill==='membership'?'L01–L03':'L10–L11'}；候选变式：${esc(x.questions.join('、'))||'继续积累数据'}</li>`).join('')}</ul>`:'尚无可用错因记录。'}<p class="small-note">本地只按题目技能标签归类“漏选/重复计数/条件不足”等线索。单次答错不能证明原因；建议家长让孩子讲一遍想法后再确认。本站不会读取姓名、学校或录音。</p></div><div class="row"><button class="secondary" data-act="download">⬇ 导出学习记录</button><button class="secondary" data-act="copy">复制摘要</button></div><details><summary>查看结构化学习记录</summary><pre>${esc(JSON.stringify(r,null,2))}</pre></details><div class="divider"></div><button class="secondary" data-act="reset" style="color:#a22">清除本机学习数据（需再次确认）</button></section>`}
function renderExamWait(){return `<section class="panel">${stageStrip('exam')}<h1>双周测试暂未到期</h1><p>${esc(examDueText())}</p><p>到期后会根据最近14天的本机练习记录，优先抽取需要巩固的知识点。</p><button class="secondary" data-go="home">返回地图</button></section>`}
function render(){let m=state.mode; $('app').innerHTML=m==='home'?renderHome():m==='learn'?renderTask():m==='learnSummary'?renderLearnSummary():m==='practice'?renderPractice():m==='exam'?renderExam():m==='examWait'?renderExamWait():m==='examDone'?renderExamDone():renderParent();}
function targetPeople(w){return people.filter(p=>w==='a'?p.g!=='y':w==='b'?p.g!=='r':p.g===w).map(p=>p.id)}
function submitLearning(){const t=task();let ok=false,method='',reason='';if(t.kind==='observe'){ok=observed;reason='先点一个小朋友，观察他手里有什么水果。'}else if(t.kind==='pick'){const ex=targetPeople(t.want);ok=picks.size===ex.length&&[...picks].every(id=>ex.includes(id));reason='再看一看水果和颜色，检查有没有少选或多选的小朋友。'}else if(t.kind==='choice'){ok=choice===t.correct;reason='先看看三个彩色区域代表谁，再试一次。'}else if(t.kind==='build'){const result=validExpression(expression,t.route);ok=result.ok;method=expression.map(x=>`${x.sign<0?'-':'+'}${x.id}`).join('');reason=result.reason||relationFeedback(result.vector);if(!expression.length)reason='先点下面的人数卡片。';if(!ok&&result.vector.every(v=>v===1)&&result.val!==(t.route==='original'?27:7))reason='人数卡片的数学关系还需要检查。'}
const skill=TASK_SKILL[t.id];let misconception='';if(!ok){if(t.kind==='build'){const v=buildVector(expression);misconception=v.some(x=>x>1)?'共同部分或区域重复计数':v.some(x=>x===0)?'有区域漏数':'算式路线需要复核'}else misconception=TASK_ERROR[t.id]||'需复核解题过程'}log('submit',{task:t.id,skill,ok,choice:t.kind==='choice'?choice:undefined,picked:t.kind==='pick'?[...picks]:undefined,method,reason:ok?undefined:reason,misconception:ok?undefined:misconception});if(ok){complete=true;wrong='';log('completion',{task:t.id,method})}else wrong=reason;render();if(ok)speak(t.answer);else speak(reason)}
function submitPractice(){const t=PRACTICE[state.practiceIndex],ok=choice===t.correct;log('submit',{task:t.id,skill:TASK_SKILL[t.id],ok,choice,misconception:ok?undefined:TASK_ERROR[t.id]});if(ok){complete=true;wrong=''}else wrong='这一次还不对。你可以先看图，或者点击小提示。';render();speak(ok?t.answer:wrong)}
function next(){if(!complete)return;if(state.mode==='learn'){if(state.taskIndex===tasks.length-1){state.learnDone=true;state.mode='learnSummary';log('learn_finished',{knowledge:knowledgeSummary().map(x=>x[0])});}else state.taskIndex++}else if(state.mode==='practice'){if(state.practiceIndex===PRACTICE.length-1){state.practiceDone=true;state.mode='home';log('practice_finished')}else state.practiceIndex++}resetTask();save();render();window.scrollTo({top:0,behavior:'instant'})}
function go(dest){if(dest==='learn'){if(state.learnDone){state.taskIndex=0;log('learn_revisit')}state.mode='learn'}else if(dest==='practice'){if(!state.learnDone)return;if(state.practiceDone){state.practiceIndex=0;log('practice_revisit')}state.mode='practice'}else if(dest==='exam'){if(!state.practiceDone)return;if(!isExamDue()){state.mode='examWait'}else{state.examSet=chooseExamSet();state.examAnswers=[];state.examIndex=0;state.examDone=false;state.mode='exam';state.examHistory=state.examHistory||[];state.examHistory.push({time:new Date().toISOString(),ids:[...state.examSet]});log('exam_started',{ids:[...state.examSet]})}}else if(dest==='parent')state.mode='parent';else state.mode=dest;resetTask();save();render();window.scrollTo({top:0,behavior:'instant'})}
function handleClick(e){const speakBtn=e.target.closest('[data-speak]');if(speakBtn){speak(speakBtn.dataset.speak);return}let node=e.target.closest('[data-go]');if(node){go(node.dataset.go);return}node=e.target.closest('[data-person]');if(node&&!complete){const id=+node.dataset.person;const t=task();if(t.kind==='observe'){observed=true;focus='person:'+id;speak(`${id}号小朋友，${people[id-1].g==='r'?'只喜欢苹果':people[id-1].g==='o'?'两种都喜欢':'只喜欢香蕉'}。`);log('observe',{task:t.id,person:id})}else if(t.kind==='pick'){picks.has(id)?picks.delete(id):picks.add(id);wrong='';log('select',{task:t.id,person:id})}render();return}node=e.target.closest('[data-choice]');if(node&&!complete){choice=+node.dataset.choice;wrong='';if(state.mode==='exam')state.examAnswers[state.examIndex]=choice;render();return}node=e.target.closest('[data-term]');if(node&&!complete){expression.push({id:node.dataset.term,sign:+node.dataset.sign});wrong='';log('build',{task:task().id,term:node.dataset.term,sign:+node.dataset.sign});render();return}node=e.target.closest('[data-act]');if(!node)return;let act=node.dataset.act;if(act==='undo'){expression.pop();render()}else if(act==='clear'){expression=[];render()}else if(act==='revealExam'&&state.mode==='exam'){examReveal=true;log('exam_reveal',{task:activeExam()[state.examIndex].id,independentFirst:true});render()}else if(act==='check'){state.mode==='learn'?submitLearning():submitPractice()}else if(act==='next'){next()}else if(act==='hint'){hint=Math.min(2,hint+1);const text=(state.mode==='learn'?task():PRACTICE[state.practiceIndex]).help;log('hint',{task:state.mode==='learn'?task().id:PRACTICE[state.practiceIndex].id,level:hint});render();speak(text)}else if(act==='examSubmit'&&choice>=0){const qs=activeExam(),t=qs[state.examIndex];state.examAnswers[state.examIndex]=choice;log('exam_answer',{task:t.id,skill:t.skill,choice,ok:choice===t.correct,misconception:choice===t.correct?undefined:(t.errorKinds?.[choice]||'需要复核解题过程')});if(state.examIndex===qs.length-1){state.examDone=true;state.lastExamAt=new Date().toISOString();state.nextExamAt=new Date(Date.now()+14*86400000).toISOString();state.mode='examDone';log('exam_finished',{score:state.examAnswers.filter((x,i)=>x===qs[i].correct).length,nextExamAt:state.nextExamAt})}else{state.examIndex++;choice=-1;examReveal=false}save();render();window.scrollTo({top:0,behavior:'instant'})}else if(act==='download'){const blob=new Blob([JSON.stringify(report(),null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='tianle_learning_local_report.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1500)}else if(act==='copy'){const txt=JSON.stringify(report(),null,2);navigator.clipboard?.writeText(txt).then(()=>alert('已复制本机学习报告')).catch(()=>alert('此浏览器无法复制，请使用导出 JSON'))}else if(act==='reset'&&confirm('确定清除本机学习记录吗？此操作无法撤销。')){state=empty();resetTask();save();render()}}
$('app').addEventListener('click',handleClick);$('parentOpen').addEventListener('click',()=>go('parent'));render();
window.__tianleTest={terms,tasks,practice:PRACTICE,examBank:EXAM_BANK,activeExam,chooseExamSet,validExpression,buildVector,targetPeople,report,monthlyAnalysis,getState:()=>state,setState:s=>{state=s;render()},setExpression:a=>{expression=a;render()}};
</script></body></html>
