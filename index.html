<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fbf8ef">
<title>天乐的水果侦探｜数学思维闯关</title>
<style>
:root{--ink:#263348;--soft:#66758b;--paper:#fff;--bg:#fbf8ef;--apple:#ef5d66;--banana:#edb840;--purple:#9060d7;--green:#1a9472;--line:#e8e5dc;--shadow:0 14px 34px rgba(46,55,65,.075)}
*{box-sizing:border-box}html{font-size:16px;-webkit-text-size-adjust:100%}body{margin:0;background:radial-gradient(ellipse at 18% 0%,#fff0dc 0,transparent 32%),radial-gradient(ellipse at 100% 20%,#e9f8ee 0,transparent 32%),var(--bg);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink);min-height:100dvh}button{font:inherit;-webkit-tap-highlight-color:transparent;touch-action:manipulation;cursor:pointer}button:focus-visible{outline:4px solid #7eabff;outline-offset:2px}button:disabled{opacity:.4;cursor:default}.shell{max-width:880px;margin:auto;padding:18px clamp(12px,4vw,30px) 50px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-weight:900;letter-spacing:.03em;font-size:clamp(18px,3.3vw,27px)}.chip{background:#fff;border:1px solid var(--line);padding:9px 13px;border-radius:30px;font-size:13px;font-weight:750;color:var(--soft)}.progress{height:9px;border-radius:30px;background:#ecebe4;overflow:hidden;margin:15px 0 21px}.progress>div{height:100%;width:0;background:linear-gradient(90deg,#f8b74b,#ef6f75);border-radius:30px;transition:width .3s}.main{background:var(--paper);border-radius:28px;border:1px solid #efede7;box-shadow:var(--shadow);padding:clamp(20px,4.5vw,36px);min-height:570px}.kicker{font-size:14px;color:var(--green);font-weight:900;letter-spacing:.08em;margin-bottom:9px}.heading{font-size:clamp(25px,5.1vw,37px);line-height:1.35;font-weight:900;margin:0 0 10px}.lead{font-size:clamp(16px,3vw,20px);line-height:1.7;margin:0 0 18px;color:#445368}.muted{color:var(--soft)}.center{text-align:center}.hero{font-size:clamp(55px,10vw,94px);padding:14px 0}.note{background:#f5f8fc;border:1px solid #dfe9f5;padding:16px 18px;border-radius:18px;line-height:1.7;font-size:16px}.note strong{color:#385ba2}.note.green{background:#eaf8f1;border-color:#c4e9d9}.note.warn{background:#fff6e5;border-color:#f4deb8}.button{border:0;border-radius:16px;padding:16px 23px;background:#2669c7;color:white;font-size:18px;font-weight:850;min-height:54px;box-shadow:0 4px 0 #174f9c}.button:active{transform:translateY(2px);box-shadow:0 2px 0 #174f9c}.button.subtle{background:#f3f6fa;color:#355476;box-shadow:none;border:1px solid #dee5ee}.button.green{background:var(--green);box-shadow:0 4px 0 #126b52}.button.green:active{box-shadow:0 2px 0 #126b52}.actions{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-top:22px}.actions .button{flex:1;min-width:160px}.cards3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:20px 0}.person{background:#f7f8fc;border:2px solid #edf0f5;border-radius:20px;padding:14px 7px;text-align:center;min-height:120px}.person .face{font-size:36px;line-height:1.25}.person .fruit{font-size:28px;white-space:nowrap;margin:6px 0}.person .who{font-size:14px;font-weight:800}.person .desc{font-size:12px;color:var(--soft);margin-top:4px}.bigPerson{border-radius:22px;text-align:center;background:#f6f7fc;padding:24px;margin:16px auto 23px;max-width:360px}.bigPerson .face{font-size:65px}.bigPerson .fruit{font-size:55px;margin:5px 0}.bigPerson .desc{font-size:20px;font-weight:850}.question{font-size:clamp(19px,3.5vw,26px);font-weight:850;margin:18px 0 13px;line-height:1.45}.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.choice{background:#f8fafc;border:2px solid #e5eaf2;border-radius:17px;min-height:62px;padding:14px;font-size:19px;font-weight:850;color:var(--ink)}.choice.wide{grid-column:1/-1}.choice.good{border-color:#29a77d;background:#e7f9f0}.choice.bad{border-color:#e5a0a0;background:#fff1f0}.choice:active{transform:scale(.98)}.feedback{margin-top:15px;padding:15px 17px;border-radius:16px;line-height:1.65;font-size:17px;background:#e9f8ee;border:1px solid #bfe6cf;font-weight:650}.feedback.try{background:#fff4e1;border-color:#f4ddb1}.tileGrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px;margin:17px 0}.tile{background:#f8fafc;border:2px solid #e5eaf2;border-radius:15px;padding:9px 3px;min-height:93px;color:var(--ink)}.tile .emoji{display:block;font-size:27px}.tile .fruit{display:block;font-size:23px;white-space:nowrap}.tile .small{display:block;font-size:12px;color:#627289}.tile.selected{background:#e8f5eb;border-color:var(--green)}.tile.selected:after{content:"✓ 已选";display:block;font-weight:850;color:var(--green);font-size:12px}.hint{border-radius:15px;border:1px dashed #a8bad0;padding:12px 15px;margin-top:13px;color:#556985;line-height:1.7}.groupbox{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;margin:22px 0}.zone{background:#fff3f1;border:2px solid #ffd0ca;border-radius:17px;padding:13px 4px;text-align:center}.zone.middle{background:#f3edff;border-color:#dacaf5}.zone.right{background:#fff8e4;border-color:#f5e0a8}.zone .kind{font-size:14px;font-weight:850;min-height:43px;display:flex;align-items:center;justify-content:center}.zone .value{font-size:clamp(31px,6vw,45px);font-weight:950;line-height:1.15}.counter{display:flex;justify-content:center;align-items:center;gap:11px;margin-top:9px}.counter button{width:38px;height:38px;border-radius:12px;border:1px solid #dbdfeb;background:white;font-size:27px;font-weight:700;line-height:1}.counts{display:flex;justify-content:space-around;gap:8px;border:1px solid #e5e8ed;border-radius:15px;padding:14px 4px;background:#fafbfd}.counts div{font-size:15px;text-align:center}.counts strong{display:block;font-size:27px}.stepNum{font-size:13px;color:var(--soft);font-weight:850}.little{font-size:13px;color:#657386;line-height:1.6}.mini-tag{display:inline-block;border-radius:9px;padding:4px 9px;background:#eef7f1;color:var(--green);font-weight:850;font-size:13px;margin-bottom:11px}.final{background:#fff7e1;border:1px solid #f8e2ab;border-radius:20px;text-align:center;padding:22px;margin:16px 0}.final .star{font-size:55px}.final .huge{font-size:36px;font-weight:950;margin:7px 0}.foot{font-size:12px;color:#798294;margin:15px 4px;text-align:center}.parent{margin-top:17px;padding:15px;border:1px dashed #d7dfec;border-radius:15px;background:#fafcff}.parent summary{cursor:pointer;font-weight:800;color:#466183}.parent p{line-height:1.7;margin-bottom:0;font-size:14px;color:#506075}@media(max-width:510px){.shell{padding:12px 10px 33px}.main{border-radius:19px;padding:18px 14px;min-height:unset}.tileGrid{grid-template-columns:repeat(3,minmax(0,1fr))}.cards3{gap:6px}.person{padding:11px 2px}.person .fruit{font-size:23px}.person .desc{font-size:11px}.zone .kind{font-size:12px}.zone{padding:11px 2px}.counter{gap:4px}.counter button{width:33px;height:35px}.chip{font-size:11px;padding:8px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="shell"><header class="top"><div class="brand">🍎 天乐的水果侦探 🍌</div><div class="chip" id="levelName">准备出发</div></header><div class="progress" aria-label="闯关进度"><div id="bar"></div></div><main id="screen" class="main" aria-live="polite"></main><div class="foot">专门练习：喜欢苹果 ≠ 只喜欢苹果 · 每次玩 5～10 分钟就好</div></div>
<script>
'use strict';
const $=id=>document.getElementById(id);
let level=0,conceptIndex=0,conceptAnswer=null,conceptMistake=false;
const people=[
 {id:0,name:'小明',face:'👦',fruit:'🍎',type:'apple'},
 {id:1,name:'小红',face:'👧',fruit:'🍎🍌',type:'both'},
 {id:2,name:'小刚',face:'👦',fruit:'🍌',type:'banana'},
 {id:3,name:'小美',face:'👧',fruit:'🍎',type:'apple'},
 {id:4,name:'小乐',face:'🧒',fruit:'🍎🍌',type:'both'},
 {id:5,name:'小雨',face:'👧',fruit:'🍌',type:'banana'},
 {id:6,name:'小华',face:'👦',fruit:'🍎',type:'apple'}
];
const concept=[
 {type:'both',q:'她喜欢苹果吗？',yes:true,why:'她喜欢苹果，也喜欢香蕉。当然属于“喜欢苹果的人”。'},
 {type:'both',q:'她只喜欢苹果吗？',yes:false,why:'“只喜欢”表示除了苹果，不喜欢另一种。她也喜欢香蕉，所以不是“只喜欢苹果”。'},
 {type:'apple',q:'他喜欢苹果吗？',yes:true,why:'他喜欢苹果，所以属于“喜欢苹果的人”。'},
 {type:'banana',q:'他喜欢苹果吗？',yes:false,why:'他只喜欢香蕉，不属于“喜欢苹果的人”。'},
 {type:'apple',q:'他只喜欢苹果吗？',yes:true,why:'他喜欢苹果，而且不喜欢香蕉，所以是“只喜欢苹果”。'},
 {type:'both',q:'她是“喜欢苹果的人”吗？',yes:true,why:'记住：喜欢苹果的人，包括“只喜欢苹果”和“两种都喜欢”。'}
];
let selected=new Set(),groupChecked=false,groupAnswer=null, left=0,right=0,numberStage=0,numberAnswer=null,numberWrong=false,transferStage=0,transferAnswer=null,transferWrong=false;
function say(text){if(!('speechSynthesis' in window))return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='zh-CN';u.rate=.82;speechSynthesis.speak(u);}catch(e){}}
function listen(text){return `<button class="button subtle" style="min-width:unset;padding:10px 16px;font-size:15px;min-height:42px" onclick="say('${text.replace(/'/g,'')}')" aria-label="朗读题目">🔊 听题</button>`;}
function head(k,title,subtitle=''){return `<div class="kicker">${k}</div><h1 class="heading">${title}</h1>${subtitle?`<p class="lead">${subtitle}</p>`:''}`;}
function action(label,func,cls=''){return `<button class="button ${cls}" onclick="${func}">${label}</button>`;}
function render(){
 const steps=['准备出发','第 1 关 · 懂词语','第 2 关 · 找人','第 3 关 · 摆圆圈','第 4 关 · 水果题','第 5 关 · 换个场景','闯关完成'];
 $('levelName').textContent=steps[level];$('bar').style.width=(level/6*100)+'%';
 if(level===0)intro();else if(level===1)renderConcept();else if(level===2)renderSelect();else if(level===3)renderGroups();else if(level===4)renderNumbers();else if(level===5)renderTransfer();else done();
}
function next(n){level=n;window.scrollTo({top:0,behavior:'smooth'});render();}
function intro(){ $('screen').innerHTML=`<div class="center">${head('给宋天乐的数学小游戏','今天当水果侦探！','你不用抢着做算术，先帮每个小朋友找到自己的位置。')}<div class="hero">👧 🍎 🍌 👦</div><div class="note green"><strong>今天只记住一句话：</strong><br>喜欢苹果的人，里面可以有“两种水果都喜欢”的人。</div><div class="actions">${action('开始闯关 →','next(1)','green')}</div><p class="little">不用计时，也不用追求满分。答错可以自己再试一次。</p></div><details class="parent"><summary>家长看这里：怎么玩？</summary><p>第一关专门区分“喜欢苹果”和“只喜欢苹果”，第二关从7个小朋友中找出5个喜欢苹果的，第三关才加入两个圈和人数。先让孩子说出“都喜欢的人也算喜欢苹果的人”，再去算18、14、5。无需注册、无需联网，内容和结果都在本机运行。</p></details>`;}
function renderConcept(){const c=concept[conceptIndex];const p=people.find(x=>x.type===c.type && (c.type!=='both'|| conceptIndex!==5||x.name==='小红'));let msg='';if(conceptAnswer!==null){const good=conceptAnswer===c.yes;msg=`<div class="feedback ${good?'':'try'}" role="status">${good?'🎉 答对了！':'再看看水果，再试一次。'}<br>${good?c.why:'看看她／他手里有没有苹果；“只喜欢”还要看是否喜欢香蕉。'}</div>`;}
 $('screen').innerHTML=`${head('第一关 · 听懂词语','“喜欢”和“只喜欢”，一样吗？','先认清小朋友喜欢什么，不用算数。')}<div class="stepNum">第 ${conceptIndex+1} / ${concept.length} 题</div><div class="bigPerson"><div class="face">${p.face}</div><div class="fruit">${p.fruit}</div><div class="desc">${p.name}：${c.type==='both'?'苹果和香蕉都喜欢':c.type==='apple'?'只喜欢苹果':'只喜欢香蕉'}</div></div><div class="question">${c.q}</div>${listen(c.q)}<div class="choices" style="margin-top:14px"><button class="choice ${conceptAnswer===true?(c.yes?'good':'bad'):''}" onclick="answerConcept(true)">✅ 是</button><button class="choice ${conceptAnswer===false?(!c.yes?'good':'bad'):''}" onclick="answerConcept(false)">❌ 不是</button></div>${msg}${conceptAnswer===c.yes?`<div class="actions">${action(conceptIndex===concept.length-1?'下一关：找小朋友 →':'下一题 →','nextConcept()','green')}</div>`:''}`;
}
function answerConcept(v){conceptAnswer=v;conceptMistake=v!==concept[conceptIndex].yes;renderConcept();}
function nextConcept(){conceptIndex++;conceptAnswer=null;conceptMistake=false;if(conceptIndex>=concept.length)next(2);else renderConcept();}
function renderSelect(){const count=selected.size,correct=[0,1,3,4,6].every(x=>selected.has(x))&&count===5;let msg=groupChecked?(correct?'你找到了全部5个人：3个只喜欢苹果，2个两种都喜欢。':'再看看：两种都喜欢的小朋友，也应该选进苹果组哦。'):'';
 $('screen').innerHTML=`${head('第二关 · 找小朋友','谁是“喜欢苹果的人”？','下面7个人中，有5个人喜欢苹果。点选所有喜欢苹果的小朋友。')}<div class="note"><strong>小提示：</strong>题目没有说“只”喜欢苹果。两种都喜欢的人，也算在里面。</div><div class="tileGrid">${people.map(p=>`<button class="tile ${selected.has(p.id)?'selected':''}" aria-pressed="${selected.has(p.id)}" onclick="togglePerson(${p.id})"><span class="emoji">${p.face}</span><span class="fruit">${p.fruit}</span><span class="small">${p.name}</span></button>`).join('')}</div><div class="note green">已选 <strong>${count}</strong> 人，目标 <strong>5</strong> 人。<br>可以反复点击，取消选择。</div>${groupChecked?`<div class="feedback ${correct?'':'try'}">${msg}</div>`:''}<div class="actions">${correct? action('下一关：摆圆圈 →','next(3)','green'):action('检查我选的人','checkPeople()')}</div>`;
}
function togglePerson(id){if(selected.has(id))selected.delete(id);else selected.add(id);groupChecked=false;renderSelect();}
function checkPeople(){groupChecked=true;renderSelect();}
function countControl(side,delta){if(side==='left')left=Math.max(0,Math.min(9,left+delta));else right=Math.max(0,Math.min(9,right+delta));groupAnswer=null;renderGroups();}
function renderGroups(){const ok=left===3&&right===2;const check=groupAnswer==='check', total=left+2+right;
 $('screen').innerHTML=`${head('第三关 · 摆圆圈','苹果组有5人，香蕉组有4人','其中2个人两种都喜欢。先把这2个人放在中间，再把剩下的人摆在两边。')}<div class="note warn">注意：“喜欢苹果的5人”里面，<strong>已经有</strong>中间的2个人了；不是在5人外面再加2人。</div><div class="groupbox"><div class="zone"><div class="kind">🍎<br>只喜欢苹果</div><div class="value">${left}</div><div class="counter"><button aria-label="减少只喜欢苹果人数" onclick="countControl('left',-1)">−</button><button aria-label="增加只喜欢苹果人数" onclick="countControl('left',1)">+</button></div></div><div class="zone middle"><div class="kind">🍎🍌<br>两种都喜欢</div><div class="value">2</div><div class="little">已经摆好</div></div><div class="zone right"><div class="kind">🍌<br>只喜欢香蕉</div><div class="value">${right}</div><div class="counter"><button aria-label="减少只喜欢香蕉人数" onclick="countControl('right',-1)">−</button><button aria-label="增加只喜欢香蕉人数" onclick="countControl('right',1)">+</button></div></div></div><div class="counts"><div>苹果组<strong>${left+2}</strong>人</div><div>香蕉组<strong>${right+2}</strong>人</div><div>不同的小朋友<strong>${total}</strong>人</div></div><div class="hint">苹果组 = 左边 + 中间（目标5人）<br>香蕉组 = 中间 + 右边（目标4人）</div>${check?`<div class="feedback ${ok?'':'try'}">${ok?'🎉 摆对了！苹果组3+2=5人，香蕉组2+2=4人。中间这2人只摆一次，所以一共有7个不同的小朋友。':'再检查：左边加中间要等于5；中间加右边要等于4。'}</div>`:''}<div class="actions">${ok&&check?action('下一关：挑战水果题 →','next(4)','green'):action('检查圆圈','checkGroups()')}</div>`;}
function checkGroups(){groupAnswer='check';renderGroups();}
const numberQuestions=[
 {q:'喜欢苹果的有18人，其中5人两种都喜欢。只喜欢苹果的有几人？',ops:[18,13,23],right:13,why:'喜欢苹果的18人里面，已经有5人两种都喜欢，所以只喜欢苹果的有18−5＝13人。'},
 {q:'喜欢香蕉的有14人，其中5人两种都喜欢。只喜欢香蕉的有几人？',ops:[19,14,9],right:9,why:'喜欢香蕉的14人里面，也已经有5人两种都喜欢，所以只喜欢香蕉的有14−5＝9人。'},
 {q:'只喜欢苹果13人，两种都喜欢5人，只喜欢香蕉9人。一共有几个不同的小朋友？',ops:[32,27,37],right:27,why:'三个区域各数一次：13＋5＋9＝27人。中间的5人不能数两次。'}
];
function quiz(questions,index,answer,callback,who){const q=questions[index];const good=answer===q.right;return `<div class="stepNum">第 ${index+1} / ${questions.length} 题</div><div class="question">${q.q}</div>${listen(q.q)}<div class="choices" style="margin-top:18px">${q.ops.map(x=>`<button class="choice ${answer===x?(good?'good':'bad'):''}" onclick="${callback}(${x})">${x} 人</button>`).join('')}</div>${answer!==null?`<div class="feedback ${good?'':'try'}">${good?'🌟 对了！'+q.why:'没关系，再想想：“都喜欢”的人，原来算在哪一组里面？'}</div>`:''}${good?`<div class="actions">${action(index===questions.length-1?(who==='fruit'?'下一关：运动侦探 →':'完成闯关 →'):'下一题 →',who==='fruit'?'nextNumber()':'nextTransfer()','green')}</div>`:''}`;}
function renderNumbers(){$('screen').innerHTML=`${head('第四关 · 水果题','现在挑战原题！','刚才我们学会了：喜欢一种水果的人，里面已经包含两种都喜欢的人。')}<div class="note">🍎 喜欢苹果：<strong>18人</strong>　🍌 喜欢香蕉：<strong>14人</strong><br>🍎🍌 两种都喜欢：<strong>5人</strong><br>每个人至少喜欢一种水果。</div><div style="margin-top:22px">${quiz(numberQuestions,numberStage,numberAnswer,'answerNumber','fruit')}</div>`;}
function answerNumber(v){numberAnswer=v;renderNumbers();}function nextNumber(){numberStage++;numberAnswer=null;if(numberStage>=numberQuestions.length)next(5);else renderNumbers();}
const transferQuestions=[
 {q:'喜欢足球16人，其中5人两种运动都喜欢。只喜欢足球有几人？',ops:[16,21,11],right:11,why:'喜欢足球的16人里面，已经有5人两种都喜欢：16−5＝11人。'},
 {q:'喜欢篮球13人，其中5人两种都喜欢。只喜欢篮球有几人？',ops:[8,13,18],right:8,why:'喜欢篮球的13人里面，已经有5人两种都喜欢：13−5＝8人。'},
 {q:'只喜欢足球11人，两种都喜欢5人，只喜欢篮球8人。一共有几人？',ops:[29,24,19],right:24,why:'11＋5＋8＝24人。同一个人喜欢两种运动，仍然只算一个人。'}
];
function renderTransfer(){$('screen').innerHTML=`${head('第五关 · 换个场景','水果变成了运动！','只换名字，不换道理。看看你是不是真的理解了。')}<div class="note">⚽ 喜欢足球：<strong>16人</strong>　🏀 喜欢篮球：<strong>13人</strong><br>⚽🏀 两种都喜欢：<strong>5人</strong><br>每个人至少喜欢一种运动。</div><div style="margin-top:22px">${quiz(transferQuestions,transferStage,transferAnswer,'answerTransfer','sport')}</div>`;}
function answerTransfer(v){transferAnswer=v;renderTransfer();}function nextTransfer(){transferStage++;transferAnswer=null;if(transferStage>=transferQuestions.length)next(6);else renderTransfer();}
