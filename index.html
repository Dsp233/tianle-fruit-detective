function peopleCards(){return `<div class="people">${people.map(p=>`<button class="person ${p.g==='r'?'red':p.g==='o'?'orange':'yellow'} ${picks.has(p.id)?'on':''}" data-person="${p.id}" aria-label="${p.id}号，${p.g==='r'?'只喜欢苹果':p.g==='o'?'两种都喜欢':'只喜欢香蕉'}，${picks.has(p.id)?'已选':'未选'}"><span class="num">${p.id}号</span><span class="face">${p.f}</span><span class="fruit">${p.icon}</span><span class="mini">${picks.has(p.id)?'✓ 已选':'点我'}</span></button>`).join('')}</div>`}
function task(){return tasks[state.taskIndex]}
function count(t,original=false){if(original)return ({a:18,b:14,o:5,r:13,y:9})[t.id];return t.vector.reduce((n,c,i)=>n+c*[2,3,2][i],0)}
function describeTerm(id,original){const t=terms[id];return `${t.icon} ${original?({a:'喜欢苹果',b:'喜欢香蕉',o:'两种都喜欢',r:'只喜欢苹果',y:'只喜欢香蕉'})[id]:t.label}${count(t,original)}人`}
function buildButtons(original){const ids=original?['a','b','o']:['r','o','y','a','b'];return `<div class="term-buttons">${ids.map(id=>{const t=terms[id];return `<div class="chip ${t.cls}"><span>${t.icon}</span><b>${count(t,original)}</b><small>${original?({a:'苹果整组',b:'香蕉整组',o:'两种都喜欢',r:'只苹果',y:'只香蕉'})[id]:t.label}</small><div class="row"><button class="secondary" data-term="${id}" data-sign="1" aria-label="加上${esc(describeTerm(id,original))}">＋</button><button class="secondary" data-term="${id}" data-sign="-1" aria-label="减去${esc(describeTerm(id,original))}">－</button></div></div>`}).join('')}</div>`}
function buildVector(seq){return [0,1,2].map(i=>seq.reduce((s,x)=>s+x.sign*terms[x.id].vector[i],0))}
function validExpression(seq,mode){const vector=buildVector(seq);const exact=vector.every(v=>v===1);const val=seq.reduce((s,x)=>s+x.sign*count(terms[x.id],mode==='original'),0);const target=mode==='original'?27:7;if(!exact||val!==target)return {ok:false,vector,val};if(mode==='three'){const ids=seq.map(x=>x.id);if(seq.length!==3||seq.some(x=>x.sign!==1)||['r','o','y'].some(id=>ids.filter(x=>x===id).length!==1))return {ok:false,vector,val,reason:'这一步请把红、橙、黄三个独立区域各放一次。'} }
if(mode==='alternative'){if(seq.length===3&&seq.every(x=>x.sign===1)&&['r','o','y'].every(id=>seq.some(x=>x.id===id)))return {ok:false,vector,val,reason:'这一题请换一条和刚才不同的路线。'}; if(!seq.some(x=>x.id==='a'||x.id==='b'))return {ok:false,vector,val,reason:'这一次试着先选一个完整的水果组。'} }
if(mode==='original'&&!seq.some(x=>x.id==='a'||x.id==='b'))return {ok:false,vector,val,reason:'请先找苹果或香蕉的完整一组。'};
return {ok:true,vector,val};}
function relationFeedback(vec){const names=['红色只苹果','橙色都喜欢','黄色只香蕉'];let errors=vec.map((n,i)=>n===1?'':`${names[i]}${n<1?'还没算到':'被算了'+n+'次'}`).filter(Boolean);return errors.length?errors.join('；')+'。每个人应该恰好数一次。':'请检查这一步要求使用哪种方法。'}
function progressHeader(i,total,section){return `<div class="row spread"><span class="tag">${section} · ${i+1}/${total}</span><button class="secondary" id="homeGo">🗺️ 地图</button></div><div class="bar"><i style="width:${((i+1)/total*100).toFixed(1)}%"></i></div>`}
function renderHome(){const learned=state.learnDone, practiced=state.practiceDone;return `<section class="panel home"><div class="row spread"><span class="tag">🧭 数学冒险岛</span>${speechButton('天乐，欢迎来到数学侦探学院。今天先学会看清楚每个人属于哪一组。点击亮起来的小岛，开始冒险。','朗读首页')}</div><h1 style="margin:15px 0 6px">天乐，出发！ 🚀</h1><div class="light">看图 · 动手 · 找秘密</div><div class="scene" aria-label="冒险地图，第一座岛屿已开放"><div class="path">···➜···</div><button class="island main" data-go="learn" aria-label="进入水果集合岛">🍎</button><button class="island second" data-go="practice" ${learned?'':'disabled'} aria-label="练习岛${learned?'已解锁':'未解锁'}">${learned?'🧩':'🔒'}</button><button class="island third" data-go="exam" ${practiced?'':'disabled'} aria-label="测试岛${practiced?'已解锁':'未解锁'}">${practiced?'🏆':'🔒'}</button></div><p class="light" style="margin:12px 0">${learned?'第一座岛屿已经点亮！下一站继续探索。':'✨ 第一座岛屿亮起来了！点击苹果，开始探索。'}</p><button class="primary" style="width:100%" data-go="${learned?(practiced?'exam':'practice'):'learn'}">${learned?(practiced?'🏆 进入10题测试':'🧩 进入变形练习'):'🍎 进入水果集合岛 →'}</button></section><section class="panel"><h2>我的冒险日记 ${speechButton('先学，再练，最后独立测一测。月度错题复盘在家长专区。')}</h2><div class="mapitem"><strong>🍎 学</strong><span class="status">${learned?'✅ 已探索':'12个动手任务'}</span></div><div class="mapitem"><strong>🧩 练</strong><span class="status">${practiced?'✅ 已练习':learned?'已解锁':'🔒 先学再练'}</span></div><div class="mapitem"><strong>🏆 测</strong><span class="status">${state.examDone?'✅ 已完成':practiced?'10题样卷已解锁':'🔒 练习后开放'}</span></div></section><div id="voice-status" class="voice-state"></div>`}
function choiceCards(t){return `<div class="option-grid">${t.options.map((o,i)=>{const text=typeof o==='string'?o:o.t,voice=typeof o==='string'?o:o.s;return `<div class="row" style="flex-wrap:nowrap"><button class="answer ${choice===i?'chosen':''}" data-choice="${i}" style="flex:1">${esc(text)} ${choice===i?'✓':''}</button>${speechButton(voice,'听选项'+(i+1))}</div>`}).join('')}</div>`}
function taskSpecific(t){if(t.kind==='observe'||t.kind==='pick')return `<div class="tip">🧒 每张卡片代表1个人。${speechButton('每张卡片代表一个人。请观察水果。','听观察提示')}</div>${peopleCards()}<div class="row"><span>已点 ${t.kind==='observe'?observed?1:0:picks.size} 位</span><span class="mini">${t.kind==='pick'?'再点一次可取消':''}</span></div>`;
if(t.kind==='build'){const orig=t.route==='original';return `<div class="tip">${orig?'🍎 18　 🍌 14　 🍎🍌 5':'🍎 红＋橙＝5　🍌 橙＋黄＝5'} ${speechButton(orig?'苹果组十八人，香蕉组十四人，共同部分五人。':'红色两人，橙色三人，黄色两人。苹果整组五人，香蕉整组五人。','听人数')}</div>${orig?'<div class="parts"><div class="part part-red">🍎<span class="count">❔</span><span class="label">只苹果</span></div><div class="part part-orange">🍎🍌<span class="count">5</span><span class="label">都喜欢</span></div><div class="part part-yellow">🍌<span class="count">❔</span><span class="label">只香蕉</span></div></div>':partCards()+groups()}<div class="tip">👆 先点一张人数卡，再点 ＋ 或 －；顺序可以自由选。${speechButton('请选择人数卡下面的加号或减号，拼出你的算式。顺序可以自由选择。')}</div>${buildButtons(orig)}<div class="formula" id="expr" aria-live="polite">${expression.length?expression.map((x,i)=>`${i===0?(x.sign<0?'－':''):x.sign<0?'－':'＋'}${count(terms[x.id],orig)}<small>(${terms[x.id].label})</small>`).join(''):'把人数卡放到这里…'}</div><div class="row"><button class="secondary" data-act="undo" ${expression.length?'':'disabled'}>↩ 撤销</button><button class="secondary" data-act="clear" ${expression.length?'':'disabled'}>清空</button>${speechButton('目前选了'+(expression.length?expression.map(x=>(x.sign<0?'减去':'加上')+describeTerm(x.id,orig)).join('，'):'零个部分'),'听当前算式')}</div>`}
return `<div class="tip">${t.id==='L11'?'🎨 9　🎵 8　🎨🎵 3':t.id==='L12'?'🍎 5　🍌 5　🍎🍌 ❔':t.id==='L09'?'🍎 5 ＋ 🍌 5 ＝ 10 ❓':''} ${speechButton(t.say,'听问题情境')}</div>${choiceCards(t)}`}
function renderTask(){const t=task();const visuals=t.kind==='choice'?(t.id==='L11'||t.id==='L12'?scenarioArt(t):partCards()+groups()):'';return `<section class="panel">${progressHeader(state.taskIndex,tasks.length,'🍎 学')}<div class="tasktop"><span class="tag">${t.id}　${esc(t.title)}</span>${speechButton(t.title,'听任务名称')}</div><div class="speakline" style="margin:12px 0"><div class="big">${esc(t.say)}</div>${speechButton(t.say,'听完整任务')}</div>${t.kind==='choice'?visuals:''}${taskSpecific(t)}<div id="feedback">${wrong?feedbackHtml(wrong,false):''}${hint?feedbackHtml(hint===1?t.help:'先看图，再把小朋友分别数一数。',true):''}</div>${complete?`<div class="tip ok"><div class="speakline"><strong>🎉 ${esc(t.answer)}</strong>${speechButton(t.answer,'听完成讲解')}</div></div><button class="primary green" style="width:100%" data-act="next">${state.taskIndex===tasks.length-1?'🏆 学习岛完成 →':'下一步 ➜'}</button>`:`<div class="row"><button class="secondary" data-act="hint">💡 小提示 🔊</button><button class="primary" data-act="check">检查答案 ✓</button></div>`}<div id="voice-status" class="voice-state"></div></section>`}
function feedbackHtml(txt,isHint){return `<div class="tip ${isHint?'':'no'}"><div class="speakline"><span>${esc(txt)}</span>${speechButton(txt,isHint?'听提示':'听反馈')}</div></div>`}
function scenarioArt(t){const id=t.id;const nums={L11:['🎨 9','🎵 8','🎨🎵 3'],L12:['🍎 5','🍌 5','🍎🍌 ❔'],P01:['🏃 10','🪢 7','🏃🪢 4'],P02:['📚 8','🔬 6','📚🔬 2'],P03:['🍎 4','🍌 3','🍎🍌 ❔'],P04:['📖 9','⚽ 只运动 6'],E01:['🚴 9','🏊 7','🚴🏊 2'],E02:['🍎 8','🍎🍌 3','🍎单独 ❔'],E03:['🎨 5','🎤 4','🎨🎤 ❔'],E04:['📖 8','🔬只借 3'],E05:['🍎 6','🍌 5','👥 共9'],E06:['👥 5','👥 6','🤝 2'],E07:['🍐 7','🍑 8','🍐🍑 4'],E08:['🍎 2','🍎🍌 3','🍌 4'],E09:['🍎 5','🍌 5','🍎🍌 3'],E10:['💃 10','🎤 8','💃🎤 3']}[id];return nums?`<div class="parts" style="grid-template-columns:repeat(${nums.length},minmax(0,1fr))">${nums.map((n,i)=>`<div class="part" style="background:#f1f6ff;border-color:#cadbf1"><strong style="font-size:clamp(17px,4vw,25px)">${esc(n)}</strong></div>`).join('')}</div>`:''}
function renderPractice(){const t=PRACTICE[state.practiceIndex];return `<section class="panel">${progressHeader(state.practiceIndex,PRACTICE.length,'🧩 练')}<div class="tag">换个情境 · 自己想办法</div><div class="speakline" style="margin:10px 0"><div class="big">${esc(t.say)}</div>${speechButton(t.say,'听练习题')}</div>${scenarioArt(t)}${choiceCards(t)}<div id="feedback">${wrong?feedbackHtml(wrong,false):''}${hint?feedbackHtml(t.help,true):''}</div>${complete?`<div class="tip ok">${esc(t.answer)}　${speechButton(t.answer,'听解题解释')}</div><button class="primary green" data-act="next">${state.practiceIndex===PRACTICE.length-1?'解锁10题样卷 🏆':'下一题 →'}</button>`:`<div class="row"><button class="secondary" data-act="hint">💡 提示 🔊</button><button class="primary" data-act="check">检查答案 ✓</button></div>`}<div id="voice-status" class="voice-state"></div></section>`}
function renderExam(){const t=EXAM[state.examIndex];return `<section class="panel">${progressHeader(state.examIndex,EXAM.length,'🏆 测 · 样卷')}<div class="tag">独立10题 · 不显示提示</div><div class="speakline" style="margin:12px 0"><div class="big">${esc(t.say)}</div>${speechButton(t.say,'听测试题')}</div>${scenarioArt(t)}${choiceCards(t)}<p class="muted">本题选择后直接进入下一题；交卷前不显示答案。</p><button class="primary green" data-act="examSubmit" ${choice<0?'disabled':''}>${state.examIndex===EXAM.length-1?'交卷 📋':'下一题 →'}</button><div id="voice-status" class="voice-state"></div></section>`}
function renderExamDone(){const correct=state.examAnswers.filter((x,i)=>x===EXAM[i].correct).length;return `<section class="panel home"><h1>🏆 完成10题测试！</h1><p>你完成了一次独立挑战！去找家长看看下一步去哪里探索。</p>${speechButton('天乐，十道题都完成了。你很认真！现在请爸爸妈妈来查看学习报告。','听通关鼓励')}<div class="scene" style="height:150px"><div class="island main">🏅</div><div class="path">⭐ ✦ ⭐</div></div><button class="primary green" style="width:100%;margin-top:15px" data-go="home">回冒险地图</button></section><section class="panel"><strong>家长查看报告</strong><p class="muted">首次作答 ${correct}/10；只记录本地，不会自动上传或声称已完成真实 AI 诊断。</p><button class="secondary" data-go="parent">打开家长报告</button></section>`}
function report(){const ev=state.events,by={};ev.forEach(e=>{if(!e.task)return;by[e.task]??={attempts:0,hints:0,correct:0,methods:[]};if(e.type==='submit'){by[e.task].attempts++;if(e.ok)by[e.task].correct++}if(e.type==='hint')by[e.task].hints++;if(e.method)by[e.task].methods.push(e.method)});const wrongExam=state.examAnswers.map((ans,i)=>({id:EXAM[i].id,topic:EXAM[i].topic,answer:ans,correct:EXAM[i].correct,ok:ans===EXAM[i].correct})).filter(x=>!x.ok);return {version:5,mode:'local_prototype',learning:{completed:state.learnDone,progress:state.taskIndex+1,total:tasks.length},practice:{completed:state.practiceDone,progress:state.practiceIndex+1,total:PRACTICE.length},exam:{done:state.examDone,firstTryCorrect:state.examDone?10-wrongExam.length:null,total:10,wrong:wrongExam},byTask:by,caveat:'浏览器本地记录；仅凭一次错题不能判断错因。无AI自适应或跨设备同步。'}}
function renderParent(){const r=report();return `<section class="panel parent"><div class="row spread"><h2>👨‍👩‍👦 家长专区</h2><button class="secondary" data-go="home">返回儿童首页</button></div><div class="tip">当前仅在本机浏览器保存数据。双周自动组卷、月度 AI 错因诊断与云端同步尚未接入。</div><div class="row"><span class="tag">学 ${state.taskIndex+1}/${tasks.length}</span><span class="tag">练 ${state.practiceIndex+1}/${PRACTICE.length}</span><span class="tag">测 ${state.examDone?'已完成':'未完成'}</span></div><h3 style="margin-top:17px">📊 本机练习记录</h3><p>操作事件：${state.events.length}条。使用提示与重新尝试均分别记录；完成任务不等于独立掌握。</p><div class="row"><button class="secondary" data-act="download">⬇ 导出 JSON</button><button class="secondary" data-act="copy">复制摘要</button></div><h3 style="margin-top:17px">双周样卷（固定题，非 AI 出题）</h3><p>${state.examDone?'首次独立正确 '+r.exam.firstTryCorrect+'/10；错题涉及：'+(r.exam.wrong.map(x=>x.topic).join('、')||'暂无'):'尚未完成。学和练结束后，儿童端将解锁固定10题样卷。'}</p><h3>月度“透”功能</h3><p>原型仅提供可用于诊断的过程记录；尚无足够时序证据，不生成确定的错因结论。后续系统应以诊断题区分审题、集合关系与计算失误。</p><details><summary>查看结构化学习记录（家长可展开）</summary><pre>${esc(JSON.stringify(r,null,2))}</pre></details><div class="divider"></div><button class="secondary" data-act="reset" style="color:#a22">清除本机学习数据（需再次确认）</button></section>`}
function render(){let m=state.mode; $('app').innerHTML=m==='home'?renderHome():m==='learn'?renderTask():m==='practice'?renderPractice():m==='exam'?renderExam():m==='examDone'?renderExamDone():renderParent();}
function targetPeople(w){return people.filter(p=>w==='a'?p.g!=='y':w==='b'?p.g!=='r':p.g===w).map(p=>p.id)}
function submitLearning(){const t=task();let ok=false,method='',reason='';if(t.kind==='observe'){ok=observed;reason='先点一个小朋友，观察他手里有什么水果。'}else if(t.kind==='pick'){const ex=targetPeople(t.want);ok=picks.size===ex.length&&[...picks].every(id=>ex.includes(id));reason='再看一看水果和颜色，检查有没有少选或多选的小朋友。'}else if(t.kind==='choice'){ok=choice===t.correct;reason='先看看三个彩色区域代表谁，再试一次。'}else if(t.kind==='build'){const result=validExpression(expression,t.route);ok=result.ok;method=expression.map(x=>`${x.sign<0?'-':'+'}${x.id}`).join('');reason=result.reason||relationFeedback(result.vector);if(!expression.length)reason='先点下面的人数卡片。';if(!ok&&result.vector.every(v=>v===1)&&result.val!==(t.route==='original'?27:7))reason='人数卡片的数学关系还需要检查。'}
log('submit',{task:t.id,ok,choice:t.kind==='choice'?choice:undefined,picked:t.kind==='pick'?[...picks]:undefined,method,reason:ok?undefined:reason});if(ok){complete=true;wrong='';log('completion',{task:t.id,method})}else wrong=reason;render();if(ok)speak(t.answer);else speak(reason)}
function submitPractice(){const t=PRACTICE[state.practiceIndex],ok=choice===t.correct;log('submit',{task:t.id,ok,choice});if(ok){complete=true;wrong=''}else wrong='这一次还不对。你可以先看图，或者点击小提示。';render();speak(ok?t.answer:wrong)}
function next(){if(!complete)return;if(state.mode==='learn'){if(state.taskIndex===tasks.length-1){state.learnDone=true;state.mode='home';log('learn_finished');}else state.taskIndex++}else if(state.mode==='practice'){if(state.practiceIndex===PRACTICE.length-1){state.practiceDone=true;state.mode='home';log('practice_finished')}else state.practiceIndex++}resetTask();save();render();window.scrollTo({top:0,behavior:'instant'})}
function go(dest){if(dest==='learn'){if(state.learnDone){state.taskIndex=0;log('learn_revisit')}state.mode='learn'}else if(dest==='practice'){if(!state.learnDone)return;if(state.practiceDone){state.practiceIndex=0;log('practice_revisit')}state.mode='practice'}else if(dest==='exam'){if(!state.practiceDone)return;state.mode=state.examDone?'examDone':'exam'}else state.mode=dest;resetTask();save();render();window.scrollTo({top:0,behavior:'instant'})}
function handleClick(e){const speakBtn=e.target.closest('[data-speak]');if(speakBtn){speak(speakBtn.dataset.speak);return}let node=e.target.closest('[data-go]');if(node){go(node.dataset.go);return}node=e.target.closest('[data-person]');if(node&&!complete){const id=+node.dataset.person;const t=task();if(t.kind==='observe'){observed=true;focus='person:'+id;speak(`${id}号小朋友，${people[id-1].g==='r'?'只喜欢苹果':people[id-1].g==='o'?'两种都喜欢':'只喜欢香蕉'}。`);log('observe',{task:t.id,person:id})}else if(t.kind==='pick'){picks.has(id)?picks.delete(id):picks.add(id);wrong='';log('select',{task:t.id,person:id})}render();return}node=e.target.closest('[data-choice]');if(node&&!complete){choice=+node.dataset.choice;wrong='';if(state.mode==='exam')state.examAnswers[state.examIndex]=choice;render();return}node=e.target.closest('[data-term]');if(node&&!complete){expression.push({id:node.dataset.term,sign:+node.dataset.sign});wrong='';log('build',{task:task().id,term:node.dataset.term,sign:+node.dataset.sign});render();return}node=e.target.closest('[data-act]');if(!node)return;let act=node.dataset.act;if(act==='undo'){expression.pop();render()}else if(act==='clear'){expression=[];render()}else if(act==='check'){state.mode==='learn'?submitLearning():submitPractice()}else if(act==='next'){next()}else if(act==='hint'){hint=Math.min(2,hint+1);const text=(state.mode==='learn'?task():PRACTICE[state.practiceIndex]).help;log('hint',{task:state.mode==='learn'?task().id:PRACTICE[state.practiceIndex].id,level:hint});render();speak(text)}else if(act==='examSubmit'&&choice>=0){const t=EXAM[state.examIndex];state.examAnswers[state.examIndex]=choice;log('exam_answer',{task:t.id,choice,ok:choice===t.correct});if(state.examIndex===EXAM.length-1){state.examDone=true;state.mode='examDone';log('exam_finished')}else{state.examIndex++;choice=-1}save();render();window.scrollTo({top:0,behavior:'instant'})}else if(act==='download'){const blob=new Blob([JSON.stringify(report(),null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='tianle_learning_local_report.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1500)}else if(act==='copy'){const txt=JSON.stringify(report(),null,2);navigator.clipboard?.writeText(txt).then(()=>alert('已复制本机学习报告')).catch(()=>alert('此浏览器无法复制，请使用导出 JSON'))}else if(act==='reset'&&confirm('确定清除本机学习记录吗？此操作无法撤销。')){state=empty();resetTask();save();render()}}
$('app').addEventListener('click',handleClick);$('parentOpen').addEventListener('click',()=>go('parent'));render();
window.__tianleTest={terms,tasks,validExpression,buildVector,targetPeople,report,getState:()=>state,setState:s=>{state=s;render()},setExpression:a=>{expression=a;render()}};
</script></body></html>
