function shuffled(a){const x=[...a];for(let i=x.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[x[i],x[j]]=[x[j],x[i]]}return x}
function balancedOptionOrders(qs){const positions=shuffled(qs.filter(q=>q.kind!=='build').map((_,i)=>i%3));let n=0;return qs.map(q=>{if(q.kind==='build')return null;const order=Array(q.options.length),wrong=shuffled(q.options.map((_,j)=>j).filter(j=>j!==q.correct));order[positions[n++]]=q.correct;let k=0;for(let j=0;j<order.length;j++)if(order[j]===undefined)order[j]=wrong[k++];return order})}
function oneOptionOrder(q){const p=Math.floor(Math.random()*q.options.length),wrong=shuffled(q.options.map((_,j)=>j).filter(j=>j!==q.correct)),order=Array(q.options.length);order[p]=q.correct;let k=0;for(let j=0;j<order.length;j++)if(order[j]===undefined)order[j]=wrong[k++];return order}
function withOptionOrder(q,order){return {...q,options:order.map(i=>q.options[i]),correct:order.indexOf(q.correct)}}

function chooseDailyQuestionId(){const recent=(state.dailyHistory||[]).filter(x=>Date.now()-Date.parse(x.time)<7*86400000);let pool=EXAM_BANK.filter(q=>q.kind!=='build'&&!recent.some(x=>x.id===q.id));if(!pool.length)pool=EXAM_BANK.filter(q=>q.kind!=='build');const weak=monthlyAnalysis().suggestions[0]?.skill;if(weak){const targeted=pool.filter(q=>q.skill===weak);if(targeted.length)pool=targeted}return pool[Math.floor(Math.random()*pool.length)].id}
function activeDailyQuestion(){const q=EXAM_BANK.find(x=>x.id===state.dailyQuestionId);return q?withOptionOrder(q,state.dailyOrder?.length?state.dailyOrder:q.options.map((_,j)=>j)):null}
function chooseExamSet(){const cutoff=Date.now()-14*86400000,score={};for(const e of state.events){if(!e.time||Date.parse(e.time)<cutoff)continue;const k=e.skill||TASK_SKILL[e.task];if(!k)continue;if(e.type==='submit'&&e.ok===false)score[k]=(score[k]||0)+3;if(e.type==='hint')score[k]=(score[k]||0)+1;if(e.type==='exam_answer'&&e.ok===false)score[k]=(score[k]||0)+2}const used=new Set((state.examHistory||[]).filter(x=>Date.now()-Date.parse(x.time)<60*86400000).flatMap(x=>x.ids||[]));let pool=EXAM_BANK.filter(q=>q.kind!=='build'&&!used.has(q.id));if(pool.length<8)pool=EXAM_BANK.filter(q=>q.kind!=='build');const chosen=[...EXAM_BUILD],counts={union:1,transfer:1};while(chosen.length<10){pool.sort((a,b)=>((score[b.skill]||0)*10+4/(1+(counts[b.skill]||0)))-((score[a.skill]||0)*10+4/(1+(counts[a.skill]||0))));const q=pool.shift();chosen.push(q);counts[q.skill]=(counts[q.skill]||0)+1}return shuffled(chosen).map(q=>q.id)}

function buildButtons(original){const ids=original?['a','b','o']:['r','o','y','a','b'];return `<div class="term-buttons">${ids.map(id=>{const t=terms[id];return `<div class="chip ${t.cls}"><span>${t.icon}</span><b>${count(t,original)}</b><small>${original?({a:'苹果整组',b:'香蕉整组',o:'两种都喜欢',r:'只苹果',y:'只香蕉'})[id]:t.label}</small><div class="row"><button class="secondary" data-term="${id}" data-sign="1" aria-label="加上${esc(describeTerm(id,original))}">＋</button><button class="secondary" data-term="${id}" data-sign="-1" aria-label="减去${esc(describeTerm(id,original))}">－</button></div></div>`}).join('')}</div>`}
function buildVector(seq){return [0,1,2].map(i=>seq.reduce((s,x)=>s+x.sign*terms[x.id].vector[i],0))}
function validExpression(seq,mode){const vector=buildVector(seq);const exact=vector.every(v=>v===1);const val=seq.reduce((s,x)=>s+x.sign*count(terms[x.id],mode==='original'),0);const target=mode==='original'?27:7;if(!exact||val!==target)return {ok:false,vector,val};if(mode==='three'){const ids=seq.map(x=>x.id);if(seq.length!==3||seq.some(x=>x.sign!==1)||['r','o','y'].some(id=>ids.filter(x=>x===id).length!==1))return {ok:false,vector,val,reason:'这一步请把红、橙、黄三个独立区域各放一次。'} }
if(mode==='alternative'){if(seq.length===3&&seq.every(x=>x.sign===1)&&['r','o','y'].every(id=>seq.some(x=>x.id===id)))return {ok:false,vector,val,reason:'这一题请换一条和刚才不同的路线。'}; if(!seq.some(x=>x.id==='a'||x.id==='b'))return {ok:false,vector,val,reason:'这一次试着先选一个完整的水果组。'} }
if(mode==='original'&&!seq.some(x=>x.id==='a'||x.id==='b'))return {ok:false,vector,val,reason:'请先找苹果或香蕉的完整一组。'};
return {ok:true,vector,val};}
function relationFeedback(vec){const names=['红色只苹果','橙色都喜欢','黄色只香蕉'];let errors=vec.map((n,i)=>n===1?'':`${names[i]}${n<1?'还没算到':'被算了'+n+'次'}`).filter(Boolean);return errors.length?errors.join('；')+'。每个人应该恰好数一次。':'请检查这一步要求使用哪种方法。'}

function monthlyAnalysis(){const cutoff=Date.now()-30*86400000,events=state.events.filter(e=>e.time&&Date.parse(e.time)>=cutoff);const wrong=events.filter(e=>(e.type==='submit'||e.type==='exam_answer'||e.type==='daily_answer')&&e.ok===false);const firstWrong=wrong.filter(e=>e.type==='exam_answer'||e.attemptNo===1);const by={};for(const e of wrong){const k=e.skill||TASK_SKILL[e.task]||EXAM_BANK.find(q=>q.id===e.task)?.skill||'transfer';by[k]=(by[k]||0)+1}const days=new Set(events.map(e=>e.time.slice(0,10)));const ranked=Object.entries(by).sort((a,b)=>b[1]-a[1]);const suggestions=ranked.slice(0,3).map(([skill,n])=>({skill,label:SKILL_LABELS[skill]||skill,count:n,reasons:[...new Set(wrong.filter(e=>(e.skill||TASK_SKILL[e.task]||EXAM_BANK.find(q=>q.id===e.task)?.skill)===skill).map(e=>e.misconception).filter(Boolean))].slice(0,2),questions:EXAM_BANK.filter(q=>q.skill===skill).slice(0,2).map(q=>q.title)}));return {events:events.length,wrong:wrong.length,firstWrong:firstWrong.length,olderUnclassified:wrong.filter(e=>e.type==='submit'&&e.attemptNo==null).length,days:days.size,suggestions}}

function masteryStatus(skill){
 const ev=state.events.filter(e=>(e.skill||TASK_SKILL[e.task])===skill),
   independent=ev.filter(e=>['submit','exam_answer','daily_answer'].includes(e.type)&&e.ok===true&&
     (e.type==='exam_answer'||e.attemptNo===1&&e.hintUsed===false));
 const contexts=new Set(independent.map(e=>e.task).filter(Boolean));
 const times=independent.map(e=>Date.parse(e.time)).filter(Number.isFinite);
 if(contexts.size>=2&&times.length>=2&&Math.max(...times)-Math.min(...times)>=86400000)return '有跨日、不同题目的独立正确记录；仍需继续巩固';
 if(contexts.size>=2)return '有不同题目的独立正确记录；尚需跨日复习';
 if(ev.some(e=>e.type==='completion')||independent.length)return '已接触；尚不足以判断掌握';
 return '待探索';
}

   if(!ok){state.englishError=i===3?'再按句子里的顺序拼一拼；先听一遍也可以。':i===5?'回到英文句子，找出表示水果的那几个词。':'再听一遍，找出句子里说到的水果或词。';save();render();return}
   state.englishError='';state.englishChoice=-1;state.englishEvidence=-1;state.englishBuild=[];
   if(i===EN_STEPS.length-1){state.englishDone=true;state.englishIndex=0;state.mode='home';log('english_finished')}
   else state.englishIndex++;
 }
 else if(el.dataset.sciChoice!==undefined){const j=+el.dataset.sciChoice;if(state.scienceIndex===0){state.sciencePicked=state.sciencePicked.includes(j)?state.sciencePicked.filter(n=>n!==j):[...state.sciencePicked,j]}else state.scienceChoice=j;state.scienceError=''}
 else if(el.dataset.sciAct==='submit'){
   const i=state.scienceIndex,t=SC_STEPS[i],ok=i===0?state.sciencePicked.length===t.correct.length&&t.correct.every(j=>state.sciencePicked.includes(j)):state.scienceChoice===t.correct;
   log('science_submit',{task:`SC${i+1}`,ok,attemptNo:nextAttemptNo(`SC${i+1}`,'science_submit')});
   if(!ok){state.scienceError=i===0?'想想人要呼吸、饮水、进食，还需要安全的住处；电视不是生存必需。':'再看看问题中的环境限制，哪些条件还没有解决？';save();render();return}
   state.scienceError='';state.scienceChoice=-1;state.sciencePicked=[];
   if(i===SC_STEPS.length-1){state.scienceDone=true;state.scienceIndex=0;state.mode='home';log('science_finished')}
   else state.scienceIndex++;
 }
 save();render();window.scrollTo({top:0,behavior:'instant'});
}

function render(){let m=state.mode; $('app').innerHTML=m==='home'?renderHome():m==='english'?renderEnglish():m==='science'?renderScience():m==='learn'?renderTask():m==='learnSummary'?renderLearnSummary():m==='practice'?renderPractice():m==='exam'?renderExam():m==='daily'?renderDaily():m==='examWait'?renderExamWait():m==='examDone'?renderExamDone():renderParent();}
function targetPeople(w){return people.filter(p=>w==='a'?p.g!=='y':w==='b'?p.g!=='r':p.g===w).map(p=>p.id)}
function submitLearning(){const t=task();let ok=false,method='',reason='';if(t.kind==='observe'){ok=observed;reason='先点一个小朋友，观察他手里有什么水果。'}else if(t.kind==='pick'){const ex=targetPeople(t.want);ok=picks.size===ex.length&&[...picks].every(id=>ex.includes(id));reason='再看一看水果和颜色，检查有没有少选或多选的小朋友。'}else if(t.kind==='choice'){ok=choice===t.correct;reason='先看看三个彩色区域代表谁，再试一次。'}else if(t.kind==='build'){const result=validExpression(expression,t.route);ok=result.ok;method=expression.map(x=>`${x.sign<0?'-':'+'}${x.id}`).join('');reason=result.reason||relationFeedback(result.vector);if(!expression.length)reason='先点下面的人数卡片。';if(!ok&&result.vector.every(v=>v===1)&&result.val!==(t.route==='original'?27:7))reason='人数卡片的数学关系还需要检查。'}
const skill=TASK_SKILL[t.id];let misconception='';if(!ok){if(t.kind==='build'){const v=buildVector(expression);misconception=v.some(x=>x>1)?'共同部分或区域重复计数':v.some(x=>x===0)?'有区域漏数':'算式路线需要复核'}else misconception=TASK_ERROR[t.id]||'需复核解题过程'}log('submit',{task:t.id,skill,ok,attemptNo:nextAttemptNo(t.id),hintUsed:hint>0,choice:t.kind==='choice'?choice:undefined,picked:t.kind==='pick'?[...picks]:undefined,method,reason:ok?undefined:reason,misconception:ok?undefined:misconception});if(ok){complete=true;wrong='';log('completion',{task:t.id,method})}else wrong=reason;render();if(ok)speak(t.answer);else speak(reason)}
function submitPractice(){const t=PRACTICE[state.practiceIndex],ok=choice===t.correct;log('submit',{task:t.id,skill:TASK_SKILL[t.id],ok,attemptNo:nextAttemptNo(t.id),hintUsed:hint>0,choice,misconception:ok?undefined:TASK_ERROR[t.id]});if(ok){complete=true;wrong='';log('completion',{task:t.id})}else wrong='这一次还不对。你可以先看图，或者点击小提示。';render();speak(ok?t.answer:wrong)}
function next(){if(!complete)return;if(state.mode==='learn'){if(state.taskIndex===tasks.length-1){state.learnDone=true;state.mode='learnSummary';log('learn_finished',{knowledge:knowledgeSummary().map(x=>x[0])});}else state.taskIndex++}else if(state.mode==='practice'){if(state.practiceIndex===PRACTICE.length-1){state.practiceDone=true;state.mode='home';log('practice_finished')}else state.practiceIndex++}resetTask();save();render();window.scrollTo({top:0,behavior:'instant'})}
function finishDaily(){if(!complete)return;state.dailyActive=false;state.dailyDoneAt=new Date().toISOString();state.dailyHistory.push({id:state.dailyQuestionId,time:state.dailyDoneAt});if(state.dailyHistory.length>60)state.dailyHistory=state.dailyHistory.slice(-60);log('daily_finished',{task:state.dailyQuestionId});state.dailyQuestionId=null;state.dailyOrder=[];state.dailyAnswer=-1;state.dailyComplete=false;state.mode='home';resetTask();save();render();window.scrollTo({top:0,behavior:'instant'})}
function submitDaily(){const q=activeDailyQuestion();if(!q||choice<0)return;const ok=choice===q.correct;log('daily_answer',{task:q.id,skill:q.skill,choice,ok,attemptNo:nextAttemptNo(q.id,'daily_answer'),misconception:ok?undefined:'需复核解题过程'});if(ok){complete=true;state.dailyComplete=true;wrong=''}else wrong='再看图和题目中的已知条件，想一想哪一部分重复或没有数到，再试一次。';save();render();speak(ok?(q.explain||'答对了！'):wrong)}
function go(dest){const resumeExam=dest==='exam'&&state.examActive,resumeDaily=dest==='daily'&&state.dailyActive;if(dest==='english'){state.mode='english'}else if(dest==='science'){state.mode='science'}else if(dest==='learn'){if(state.learnDone){state.taskIndex=0;log('learn_revisit')}state.mode='learn'}else if(dest==='practice'){if(!state.learnDone)return;if(state.practiceDone){state.practiceIndex=0;log('practice_revisit')}state.mode='practice'}else if(dest==='exam'){if(!state.practiceDone)return;if(resumeExam){state.mode='exam'}else if(!isExamDue()){state.mode='examWait'}else{state.examSet=chooseExamSet();state.examOrder=balancedOptionOrders(state.examSet.map(id=>EXAM_BANK.find(q=>q.id===id)));state.examAnswers=[];state.examBuilds=[];state.examIndex=0;state.examReveal=false;state.examActive=true;state.examStartedAt=new Date().toISOString();state.examDone=false;state.mode='exam';log('exam_started',{ids:[...state.examSet]})}}else if(dest==='daily'){if(!state.learnDone)return;if(resumeDaily){state.mode='daily'}else{state.dailyQuestionId=chooseDailyQuestionId();const q=EXAM_BANK.find(x=>x.id===state.dailyQuestionId);state.dailyOrder=oneOptionOrder(q);state.dailyAnswer=-1;state.dailyComplete=false;state.dailyActive=true;state.mode='daily';log('daily_started',{task:state.dailyQuestionId,skill:q?.skill})}}else if(dest==='parent')state.mode='parent';else state.mode=dest;resetTask();if(resumeExam){examReveal=!!state.examReveal;const q=activeExam()[state.examIndex];if(q?.kind==='build')expression=state.examBuilds[state.examIndex]||[];else choice=state.examAnswers[state.examIndex]??-1}else if(resumeDaily){choice=state.dailyAnswer??-1;complete=!!state.dailyComplete}save();render();window.scrollTo({top:0,behavior:'instant'})}
function handleClick(e){if(e.target.closest('#homeGo')){go('home');return}const speakBtn=e.target.closest('[data-speak]');if(speakBtn){speak(speakBtn.dataset.speak,speakBtn.dataset.lang);return}let node=e.target.closest('[data-go]');if(node){go(node.dataset.go);return}node=e.target.closest('[data-person]');if(node&&!complete){const id=+node.dataset.person;const t=task();if(t.kind==='observe'){observed=true;focus='person:'+id;speak(`${id}号小朋友，${people[id-1].g==='r'?'只喜欢苹果':people[id-1].g==='o'?'两种都喜欢':'只喜欢香蕉'}。`);log('observe',{task:t.id,person:id})}else if(t.kind==='pick'){picks.has(id)?picks.delete(id):picks.add(id);wrong='';log('select',{task:t.id,person:id})}render();return}node=e.target.closest('[data-choice]');if(node&&!complete){choice=+node.dataset.choice;wrong='';if(state.mode==='exam'){state.examAnswers[state.examIndex]=choice;save()}else if(state.mode==='daily'){state.dailyAnswer=choice;save()}render();return}node=e.target.closest('[data-term]');if(node&&!complete){expression.push({id:node.dataset.term,sign:+node.dataset.sign});wrong='';if(state.mode==='exam'){state.examBuilds[state.examIndex]=[...expression];save()}else log('build',{task:task().id,term:node.dataset.term,sign:+node.dataset.sign});render();return}node=e.target.closest('[data-act]');if(!node)return;let act=node.dataset.act;if(act==='undo'){expression.pop();if(state.mode==='exam'){state.examBuilds[state.examIndex]=[...expression];save()}render()}else if(act==='clear'){expression=[];if(state.mode==='exam'){state.examBuilds[state.examIndex]=[];save()}render()}else if(act==='revealExam'&&state.mode==='exam'){examReveal=true;state.examReveal=true;log('exam_reveal',{task:activeExam()[state.examIndex].id,independentFirst:true});render()}else if(act==='check'){state.mode==='learn'?submitLearning():submitPractice()}else if(act==='checkDaily'&&state.mode==='daily'){submitDaily()}else if(act==='finishDaily'&&state.mode==='daily'){finishDaily()}else if(act==='next'){next()}else if(act==='hint'){hint=Math.min(2,hint+1);const text=(state.mode==='learn'?task():PRACTICE[state.practiceIndex]).help;log('hint',{task:state.mode==='learn'?task().id:PRACTICE[state.practiceIndex].id,level:hint});render();speak(text)}else if(act==='examSubmit'&&(choice>=0||activeExam()[state.examIndex]?.kind==='build'&&expression.length)){const qs=activeExam(),t=qs[state.examIndex],answer=t.kind==='build'?[...expression]:choice,ok=examCorrect(t,answer);state.examAnswers[state.examIndex]=answer;log('exam_answer',{task:t.id,skill:t.skill,choice:t.kind==='build'?undefined:choice,method:t.kind==='build'?answer.map(x=>`${x.sign<0?'-':'+'}${x.id}`).join(''):undefined,ok,misconception:ok?undefined:(t.kind==='build'?relationFeedback(buildVector(answer)):(t.errorKinds?.[choice]||'需要复核解题过程'))});if(state.examIndex===qs.length-1){state.examDone=true;state.examActive=false;state.examReveal=false;state.lastExamAt=new Date().toISOString();state.nextExamAt=new Date(Date.now()+14*86400000).toISOString();state.examHistory.push({time:state.lastExamAt,ids:[...state.examSet]});state.mode='examDone';log('exam_finished',{score:state.examAnswers.filter((x,i)=>examCorrect(qs[i],x)).length,nextExamAt:state.nextExamAt})}else{state.examIndex++;choice=-1;expression=state.examBuilds[state.examIndex]||[];examReveal=false;state.examReveal=false}save();render();window.scrollTo({top:0,behavior:'instant'})}else if(act==='download'){const blob=new Blob([JSON.stringify(report(),null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='tianle_learning_local_report.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1500)}else if(act==='copy'){const txt=JSON.stringify(report(),null,2);navigator.clipboard?.writeText(txt).then(()=>alert('已复制本机学习报告')).catch(()=>alert('此浏览器无法复制，请使用导出 JSON'))}else if(act==='reset'&&confirm('确定清除本机学习记录吗？此操作无法撤销。')){state=empty();resetTask();save();render()}}
$('app').addEventListener('click',handleSupplementClick,true);$('app').addEventListener('click',handleClick);$('parentOpen').addEventListener('click',()=>go('parent'));render();
