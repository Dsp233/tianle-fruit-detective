/* V8 cross-subject cards and simple step lessons */
.subject-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:12px 0}
.subject-card{display:flex;flex-direction:column;align-items:flex-start;gap:8px;min-width:0;min-height:105px;text-align:left;border:2px solid #c5d7f2;border-radius:20px;padding:14px;background:#fff;color:#243756;box-shadow:0 4px 14px #24417e12}

.lesson-card{max-width:800px;margin-inline:auto}.lesson-card .big{line-height:1.5}.sample{font-size:clamp(26px,6vw,39px);font-weight:800;background:#edf6ff;border:2px solid #d6e7f5;border-radius:18px;padding:18px;margin:16px 0;overflow-wrap:anywhere}

/* V8.1: show mutually exclusive regions and complete sets separately. */

.whole-card{border:2px solid #bdd2e9;border-radius:17px;background:#fff;overflow:hidden;min-width:0}

<script>

  {id:'double_count',label:'发现并减去重复',prerequisites:['union'],family:'计数',level:4,activities:['L09','L10'],variants:['5＋5－3','18＋14－5']},
  {id:'sufficiency',label:'已知条件够不够',prerequisites:['membership'],family:'推理',level:4,activities:['L12'],variants:['共同人数未知','只求可能范围']},
  {id:'transfer',label:'组合迁移',prerequisites:['difference','double_count'],family:'推理',level:5,activities:['L10','L11'],variants:['水果','兴趣','图书']}

function validateConceptGraph(nodes){

 if(by.size!==nodes.length)throw Error('知识点编号重复');

  const n=by.get(id);if(!n)throw Error(`缺少前置知识点：${id}`);
  visiting.add(id);(n.prerequisites||[]).forEach(visit);visiting.delete(id);done.add(id)}

}
validateConceptGraph(CONCEPT_GRAPH);
function conceptConnections(nodes=CONCEPT_GRAPH){return nodes.flatMap(n=>(n.prerequisites||[]).map(from=>({from,to:n.id,kind:'前置'}))).concat(nodes.flatMap(n=>nodes.filter(m=>m.id!==n.id&&m.family===n.family&&m.level>n.level).map(m=>({from:n.id,to:m.id,kind:'同类加深'}))))}

const REGION={a:[1,1,0],b:[0,1,1],o:[0,1,0],r:[1,0,0],y:[0,0,1]};
const CONTEXTS={seven:{a:5,b:5,o:3,r:2,y:2},original:{a:18,b:14,o:5,r:13,y:9}};
const addVector=(a,b,sign=1)=>a.map((v,i)=>v+b[i]*sign);

function formulaNumber(id,context){const counts=contextCounts(context);if(!(id in REGION)||!counts||!(id in counts))throw Error('未知的人数卡');return {value:counts[id],vector:[...REGION[id]],terms:[id]}}
// Grammar: expression := primary ((+|-) primary)*, primary := number | '(' expression ')'.
// Evaluation tracks *people*, in addition to the arithmetic value: accidental 27 does not pass.
function evaluateFormula(tokens,context='original'){
 if(!Array.isArray(tokens)||tokens.length>64)return {ok:false,reason:'算式太长'};
 let at=0;
 function primary(){const t=tokens[at++];if(!t)throw Error('算式没有完成');
  if(t.type==='number')return formulaNumber(t.id,context);
  if(t.type==='open'){const inner=expr(true);if(tokens[at]?.type!=='close')throw Error('括号未合上');at++;return inner}
  throw Error('这里需要人数卡或左括号')}
 function expr(inGroup=false){let out=primary();while(at<tokens.length&&tokens[at].type!=='close'){
  const token=tokens[at++];if(token.type!=='operator'||!['+','-'].includes(token.op))throw Error('人数卡之间需要运算符');
  const right=primary(),sign=token.op==='+'?1:-1;
  out={value:out.value+sign*right.value,vector:addVector(out.vector,right.vector,sign),terms:out.terms.concat(right.terms)};
 }return out}
 try{const v=expr();if(at!==tokens.length)throw Error('括号位置不正确');return {...v,ok:true}}
 catch(e){return {ok:false,reason:e.message}}
}
function checkFormula(tokens,context='original',target=[1,1,1]){
 const counts=contextCounts(context),result=evaluateFormula(tokens,context),expected=target.reduce((n,x,i)=>n+x*[counts.r,counts.o,counts.y][i],0);
 if(!result.ok)return result;
 const same=result.vector.every((v,i)=>v===target[i]);
 return {...result,ok:same&&result.value===expected,reason:same&&result.value===expected?'':result.value===expected?'数字对了，但有人被数了两次或漏掉了。':'检查各块人数是否恰好数了一次。'};
}
const FORMULA_LABEL={a:'苹果整组',b:'香蕉整组',o:'两种都喜欢',r:'只苹果',y:'只香蕉'};
function formulaDisplay(tokens,context='original'){
 return tokens.map(t=>t.type==='number'?`${contextCounts(context)[t.id]}（${FORMULA_LABEL[t.id]}）`:t.type==='operator'?t.op==='+'?'＋':'－':t.type==='open'?'（':'）').join('');
}
function nextFormulaTokens(tokens,action){
 const next=[...tokens],last=next.at(-1),needValue=!last||last.type==='operator'||last.type==='open';
 if(action.type==='undo')return next.slice(0,-1);
 if(action.type==='clear')return [];
 if(action.type==='number'&&needValue&&action.id in REGION)next.push({type:'number',id:action.id});
 else if(action.type==='open'&&needValue)next.push({type:'open'});
 else if(action.type==='operator'&&!needValue&&last.type!=='close'&&['+','-'].includes(action.op))next.push({type:'operator',op:action.op});
 else if(action.type==='operator'&&last?.type==='close'&&['+','-'].includes(action.op))next.push({type:'operator',op:action.op});
 else if(action.type==='close'&&!needValue&&next.filter(t=>t.type==='open').length>next.filter(t=>t.type==='close').length)next.push({type:'close'});

}
function formulaFromSigned(seq){return seq.flatMap((t,i)=>i?[{type:'operator',op:t.sign<0?'-':'+'},{type:'number',id:t.id}]:[{type:'number',id:t.id}])}
const splitBothTokens=[
 {type:'open'},{type:'number',id:'a'},{type:'operator',op:'-'},{type:'number',id:'o'},{type:'close'},
 {type:'operator',op:'+'},{type:'number',id:'o'},{type:'operator',op:'+'},
 {type:'open'},{type:'number',id:'b'},{type:'operator',op:'-'},{type:'number',id:'o'},{type:'close'}
];
function isSplitBoth(tokens){
 const text=tokens.map(t=>t.type==='number'?t.id:t.type==='operator'?t.op:t.type==='open'?'(':')').join('');
 const chunks=text.split('+');
 return chunks.length===3&&chunks.includes('(a-o)')&&chunks.includes('(b-o)')&&chunks.includes('o')&&checkFormula(tokens,'original').ok;
}

/* Reviewed local teaching templates and a strict schema for user-authored lessons. */
'use strict';
const WEEKLY_SEEDS=[{r:3,o:2,y:4},{r:4,o:3,y:2},{r:5,o:2,y:3}];

 if(ids.has('double_count'))result.push({id:'WK-duplicate',kind:'formula',counts:n,target:[1,1,1],skills:['double_count'],prompt:`苹果完整组${n.a}人、香蕉完整组${n.b}人，其中共同${n.o}人。不同的朋友共有几人？`,hint:'两完整组相加时共同的人出现两次。',version:1,source:'原创参数题'});

}
function validateLocalPackage(pkg,base=CONCEPT_GRAPH){
 if(!pkg||pkg.schema!==1||!Array.isArray(pkg.nodes)||pkg.nodes.length<1||pkg.nodes.length>30)throw Error('内容包需有 schema:1 和1到30个知识点');
 const original=new Set(base.map(n=>n.id)),out=[];
 for(const n of pkg.nodes){
  if(typeof n.id!=='string'||!/^[a-z][a-z0-9_-]{2,39}$/.test(n.id)||original.has(n.id))throw Error('自编知识点编号无效或与现有编号重复');
  if(typeof n.label!=='string'||!n.label.trim()||n.label.length>60||typeof n.family!=='string'||!n.family.trim()||n.family.length>30||!Number.isInteger(n.level)||n.level<1||n.level>10)throw Error('知识点名称、主题或难度级别无效');
  if(n.subject!==undefined&&n.subject!=='math')throw Error('当前审核题工作台只支持数学任务；英语和科学资料请作为参考文本导入');
  if(!Array.isArray(n.prerequisites)||n.prerequisites.length>8||n.prerequisites.some(x=>typeof x!=='string'))throw Error('前置知识点格式无效');
  if(!n.lesson||typeof n.lesson.prompt!=='string'||n.lesson.prompt.length>350||!n.lesson.prompt.trim())throw Error('自编任务需要简短题目');
  if(n.lesson.visual!==undefined&&(!Array.isArray(n.lesson.visual)||n.lesson.visual.length>8||n.lesson.visual.some(x=>typeof x!=='string'||x.length>36)))throw Error('图示标签最多8个，每个不超过36字');
  const kind=n.lesson.kind||'choice';
  if(kind==='choice'&&(!Array.isArray(n.lesson.choices)||n.lesson.choices.length<2||n.lesson.choices.length>5||n.lesson.choices.some(x=>typeof x!=='string'||!x.trim()||x.length>90)||!Number.isInteger(n.lesson.correct)||n.lesson.correct<0||n.lesson.correct>=n.lesson.choices.length))throw Error('选择任务需要2到5个选项及有效答案');
  if(kind==='formula'&&(!n.lesson.counts||!['r','o','y'].every(k=>Number.isInteger(n.lesson.counts[k])&&n.lesson.counts[k]>=0&&n.lesson.counts[k]<=50)||!Array.isArray(n.lesson.target)||n.lesson.target.length!==3||n.lesson.target.some(v=>v!==0&&v!==1)||!n.lesson.target.some(Boolean)))throw Error('列式任务需要经核对的红橙黄人数和目标区域');

  out.push({id:n.id,subject:'math',label:n.label.trim(),family:n.family.trim(),level:n.level,prerequisites:[...n.prerequisites],skills:n.skills||[n.id],source:n.source.trim(),rights:n.rights,reviewer:String(n.reviewer||'家长审核').slice(0,60),reviewed:true,lesson:{kind,prompt:n.lesson.prompt.trim(),visual:(n.lesson.visual||[]).map(x=>x.trim()),choices:kind==='choice'?n.lesson.choices.map(x=>x.trim()):[],correct:kind==='choice'?n.lesson.correct:null,counts:kind==='formula'?toCounts(n.lesson.counts):null,target:kind==='formula'?[...n.lesson.target]:null,help:String(n.lesson.help||'').slice(0,150)},version:Number.isInteger(n.version)&&n.version>0?n.version:1});
 }
 validateConceptGraph([...base,...out]);const known=new Set([...base,...out].map(n=>n.id));for(const n of out){if(!Array.isArray(n.skills)||n.skills.length<1||n.skills.length>6||!n.skills.includes(n.id)||n.skills.some(id=>typeof id!=='string'||!known.has(id)))throw Error('关联知识点必须包含当前知识点，且只能引用已有编号')}return out;
}
function authoredWeeklyTasks(nodes,selected){const by=new Map(nodes.map(n=>[n.id,n])),ordered=[],added=new Set();function visit(n){if(added.has(n.id))return;for(const dep of n.prerequisites||[]){const prerequisite=by.get(dep);if(prerequisite&&selected.includes(dep))visit(prerequisite)}added.add(n.id);ordered.push(n)}nodes.filter(n=>selected.includes(n.id)&&n.reviewed).forEach(visit);return ordered.map(n=>({id:`WK-${n.id}`,kind:n.lesson.kind||'choice',skills:n.skills||[n.id],prompt:n.lesson.prompt,visual:n.lesson.visual,counts:n.lesson.counts,target:n.lesson.target,choices:n.lesson.choices,correct:n.lesson.correct,hint:n.lesson.help,source:n.source,version:n.version}))}
function expandWeekSelection(selected,nodes){const by=new Map(nodes.map(n=>[n.id,n])),included=new Set();function add(id){const n=by.get(id);if(!n)throw Error('选择了不存在的知识点');if(included.has(id))return;(n.prerequisites||[]).forEach(add);included.add(id)}selected.forEach(add);return nodes.filter(n=>included.has(n.id)).map(n=>n.id)}
function omitWithDependents(selected,removed,nodes){const active=new Set(selected);function depends(id,visiting=new Set()){if(id===removed)return true;if(visiting.has(id))return false;visiting.add(id);return (nodes.find(n=>n.id===id)?.prerequisites||[]).some(x=>depends(x,visiting))}return [...active].filter(id=>!depends(id))}
function conceptEvidence(node,events){
 const relevant=events.filter(e=>e.skill===node.id||e.skills?.includes(node.id));
 const attempts=relevant.filter(e=>['submit','exam_answer','weekly_answer','daily_answer'].includes(e.type));

 const contexts=new Set(solved.map(e=>e.task?.replace(/-v\d+-s\d+$/,'')).filter(Boolean));

onceptLevel" min="1" max="10" value="3"></label><label>配套简短图文题目<input type="text" id="newConceptPrompt" maxlength="350" placeholder="例如：图中哪组人数最多？"></label><label>图示标签（可选，用 | 分隔）<input type="text" id="newConceptVisual" placeholder="🍎 完整组5 | 🍎🍌 共同3"></label><label>任务类型<select id="newConceptKind"><option value="choice">短图示选择题</option><option value="formula">红橙黄集合列式题</option></select></label><label>列式三块人数（依次填红、橙、黄）<input type="number" id="newRed" min="0" max="50" value="2"><input type="number" id="newOrange" min="0" max="50" value="3"><input type="number" id="newYellow" min="0" max="50" value="2"></label><label>列式要找的区域<select id="newConceptTarget"><option value="1,1,1">不同人数合计</option><option value="1,0,0">只红色</option><option value="0,1,0">只橙色</option><option value="0,0,1">只黄色</option></select></label><label>选项（选择题填写，用竖线 | 分开）<input type="text" id="newConceptChoices" placeholder="选项甲 | 选项乙 | 选项丙"></label><label>正确选项序号（从1开始）<input type="number" id="newConceptCorrect" min="1" max="5" value="1"></label><label>关联知识编号（可选，多个用逗号分开，必须包含新知识编号时可由系统自动补入）<input id="newConceptSkills" type="text" placeholder="例如：union,double_count"></label><label>原创来源或使用权依据<input type="text" id="newConceptSource" maxlength="150" placeholder="例：家长原创"></label><label>审题人或家长称呼<input id="newConceptReviewer" type="text" maxlength="60" placeholder="家长审核"></label><label><input id="newConceptReviewed" type="checkbox"> 我已核对题意、答案及材料的使用权</label><button class="secondary" data-work-action="add-concept">保存知识点和审核题</button><p class="small-note">任意知识点可手动编写带来源的任务；算法不会为不熟悉的内容猜测正确答案。</p></fieldset>${contentStagesHtml()}${parentSourcesHtml()}${state.parentNotice?`<div class="tip" role="status">${esc(state.parentNotice)}</div>`:''}`}
function parentSourcesHtml(){return `<fieldset><legend>📚 本机资料来源</legend><p class="small-note">可导入 UTF-8 的 .txt/.md/.html/.json 内容包，也可归档 PDF、EPUB、DOCX 原文件或保存 https 地址。原文件仅存放在这台设备的浏览器；PDF 等内容需要人工提取、审题后才进入儿童任务。</p><label>资料名称<input id="sourceName" type="text" maxlength="100" placeholder="教材或自编知识单元"></label><label>学科<select id="sourceSubject"><option value="math">数学</option><option value="english">英语</option><option value="science">科学</option></select></label><label>授权状态<select id="sourceRights"><option value="原创">原创</option><option value="已获许可">已获许可</option><option value="公共领域">公共领域</option></select></label><label>资料链接<input id="sourceLink" type="url" placeholder="https://..."></label><button class="secondary" data-work-action="add-link">保存资料地址</button><label>导入文本、审核任务包或归档原文件<input id="sourceFile" type="file" accept=".txt,.md,.html,.json,.pdf,.epub,.docx,application/json,text/plain,text/html,application/pdf,application/epub+zip,application/vnd.openxmlformats-officedocument.wordprocessingml.document"></label><details><summary>查看审核任务包格式</summary><p class="small-note">内容包格式：schema 1，nodes 中填写 id、label、family、level、prerequisites、lesson、source、rights、reviewed；无人工核对标记的任务不能进入儿童端。</p></details>${state.localSources.length?`<ul>${state.localSources.map(x=>`<li>${esc(x.title)} · ${esc(x.rights)}${x.url?` · <a target="_blank" rel="noopener noreferrer" href="${esc(x.url)}">打开来源</a>`:''}${x.text?' · 已保存文本，可用于人工编题':''}${x.assetId?` · 原文件 ${Math.round(x.bytes/1024)} KB <button class="secondary" data-source-preview="${esc(x.assetId)}">读取本机原文件</button>${sourcePreview?.id===x.assetId?` <a href="${esc(sourcePreview.url)}" target="_blank" rel="noopener noreferrer">查看原文件</a>`:''}`:''}</li>`).join('')}</ul>`:''}</fieldset>`}

function weeklyFormulaPad(q){const current=state.weeklyDraft.tokens||[],preview=current.length?formulaDisplay(current,q.counts):'先选人数卡…';return `<div class="build-instruction">人数卡 → 运算符 → 人数卡；括号可以先算独有部分。${speechButton('先选择人数卡，再选择加号或减号，再选下一张人数卡。','听列式方法')}</div><div class="formula-keys">${['r','o','y','a','b'].map(id=>`<button class="chip" data-week-number="${id}" aria-label="${esc(FORMULA_LABEL[id])}${q.counts[id]}人">${q.counts[id]}<small>${esc(FORMULA_LABEL[id])}</small></button>`).join('')}<button class="secondary" data-week-op="+">＋</button><button class="secondary" data-week-op="-">－</button><button class="secondary" data-week-bracket="open">（</button><button class="secondary" data-week-bracket="close">）</button></div><div class="formula-preview" aria-live="polite">${esc(preview)}</div><div class="row"><button class="secondary" data-week-action="undo">↩ 撤销</button><button class="secondary" data-week-action="clear">清空</button>${speechButton(preview,'听算式')}</div>`}
function renderWeekly(){const tasks=currentWeekTasks(),i=state.weeklyIndex,q=tasks[i];if(!q)return `<section class="panel"><h1>🧭 本周知识路线</h1><p>${tasks.length?'本周任务已完成，可以回地图或请家长换一组数字。':'家长先在知识工作台勾选本周学习点。'}</p><button class="secondary" data-go="home">回地图</button></section>`;if(i<state.weeklyFrontier){const prior=state.weeklyAnswers.findLast(a=>a.id===q.id&&a.seed===state.weeklySeed&&a.ok);return `<section class="panel">${progressHeader(i,tasks.length,'🧭 本周知识 · 回看')}<h1>${esc(q.prompt)}</h1><div class="tip ok">这题已经完成。${prior?.method?esc(prior.method):''}</div><button class="secondary" data-week-action="current">回当前题 →</button></section>`}const draft=state.weeklyDraft||{},covered=q.skills.map(id=>allConcepts().find(n=>n.id===id)?.label||id).join('＋');return `<section class="panel">${progressHeader(i,tasks.length,'🧭 本周知识')}<span class="tag">${esc(covered)} · 第${i+1}/${tasks.length}题</span><div class="task-instruction speakline"><div class="big">${esc(q.prompt)}</div>${speechButton(q.prompt,'听本周题')}</div>${weeklyDiagram(q)}${q.kind==='formula'?weeklyFormulaPad(q):q.kind==='pick'?`<div class="selection-status">已选 ${(draft.picks||[]).length} 位；再点可取消。</div>${peopleCards(new Set(draft.picks||[]))}`:`<div class="option-grid">${q.choices.map((c,j)=>`<div class="row"><button class="answer ${draft.choice===j?'chosen':''}" data-week-choice="${j}" style="flex:1">${esc(c)}</button>${speechButton(c,'听选项'+(j+1))}</div>`).join('')}</div>`}${draft.hint?`<div class="tip">${esc(q.hint)} ${speechButton(q.hint,'听提示')}</div>`:''}${draft.error?`<div class="tip no" role="status">${esc(draft.error)} ${speechButton(draft.error,'听反馈')}</div>`:''}${state.weeklyPassed?`<div class="tip ok">✅ 你把这题的人数关系弄清楚了。${speechButton('这道题完成了，请继续下一题。','听结果')}</div><button class="primary green" data-week-action="next">${i===tasks.length-1?'完成本周路线':'下一题 →'}</button>`:`<div class="task-actions"><div class="row"><button class="secondary" data-week-action="hint">💡 提示</button><button class="primary" data-week-action="ch function workspaceElement(id){return document.getElementById(id)}

function contentStagesHtml(){return `<div class="report-block"><h3>人工核对与发布</h3><p class="small-note">先核对题意、使用权与答案，再手动发布到本机儿童任务。撤回后，历史作答仍可追溯；它不会再出现在新任务中。</p>${state.draftTasks.map(pkg=>`<div class="concept-card"><b>${pkg.nodes.map(n=>esc(n.label)).join('、')}</b> · 第 ${pkg.nodes.map(n=>esc(n.version)).join('、')} 版 · ${pkg.status==='published'?'已发布':pkg.status==='withdrawn'?'已撤回':'待发布'}<div class="small-note">${pkg.nodes.map(n=>`${esc(n.source)} · ${esc(n.rights)} · ${esc(n.reviewer||'家长审核')}`).join('；')}</div>${pkg.status==='reviewed'?`<button class="secondary" data-content-publish="${esc(pkg.id)}">确认发布到本机儿童任务</button>`:pkg.status==='published'?`<button class="secondary" data-content-withdraw="${esc(pkg.id)}">撤回这组任务</button>`:''}</div>`).join('')||'<p>尚无待发布的审核内容。</p>'}</div>`}
function stageLocalPackage(nodes,message){
 const seen=new Set(state.draftTasks.flatMap(p=>p.nodes.map(n=>n.id)));
 if(nodes.some(n=>seen.has(n.id)))throw Error('内容包编号已在待发布或历史记录中使用；请为新版另取编号');
 const pkg={id:'review-'+Date.now()+'-'+Math.random().toString(36).slice(2),nodes,status:'reviewed',createdAt:new Date().toISOString()};
 state.draftTasks.push(pkg);
 if(!save()){state.draftTasks.pop();throw Error('存储空间不足，未能保存待发布题目')}
 notifyParent(message+' 请在下方确认后再发布。');
}
function publishLocalPackage(pkg){
 const nodes=validateLocalPackage({schema:1,nodes:pkg.nodes},allConcepts());
 state.customNodes.push(...nodes);pkg.status='published';pkg.publishedAt=new Date().toISOString();
 if(!save()){state.customNodes.splice(state.customNodes.length-nodes.length,nodes.length);pkg.status='reviewed';delete pkg.publishedAt;throw Error('本机存储空间不足，未能发布')}
 notifyParent('已发布审核任务；家长选择相应知识点后，孩子才能开始。');
}
function withdrawLocalPackage(pkg){
 const ids=new Set(pkg.nodes.map(n=>n.id));
 if(state.customNodes.some(n=>!ids.has(n.id)&&(n.prerequisites||[]).some(id=>ids.has(id))))throw Error('另一个已发布任务依赖此知识点，请先撤回它');
 const prev=state.customNodes;state.customNodes=prev.filter(n=>!ids.has(n.id));pkg.status='withdrawn';pkg.withdrawnAt=new Date().toISOString();
 state.weeklySelected=state.weeklySelected.filter(id=>!ids.has(id));state.weeklyIndex=0;state.weeklyFrontier=0;state.weeklyDraft={};state.weeklyPassed=false;
 if(!save()){state.customNodes=prev;pkg.status='published';delete pkg.withdrawnAt;throw Error('本机存储空间不足，未能撤回')}
 notifyParent('已从本机儿童新任务中撤回，既有作答记录未被删除。');
}
function persistSourceImport(source,nodes=[],message){

 if(!save()){
  state.localSources.pop();state.customNodes.splice(state.customNodes.length-nodes.length,nodes.length);
  throw Error('浏览器存储空间不足，本次导入没有保存；请先导出学习记录并清理本机空间');
 }
 notifyParent(message);
}

 node=e.target.closest('[data-content-publish],[data-content-withdraw]');if(node&&state.mode==='parent'){const pkg=state.draftTasks.find(x=>x.id===(node.dataset.contentPublish||node.dataset.contentWithdraw));try{if(!pkg)throw Error('内容记录不存在');if(node.dataset.contentPublish&&pkg.status==='reviewed')publishLocalPackage(pkg);if(node.dataset.contentWithdraw&&pkg.status==='published'){if(confirm('确认撤回这组本机儿童题目？历史答题记录会保留。'))withdrawLocalPackage(pkg)}}catch(ex){notifyParent(ex.message)}return true}
 node=e.target.closest('[data-work-action]');if(node){const action=node.dataset.workAction;if(action==='new-seed'){state.weeklySeed++;state.weeklyIndex=0;state.weeklyFrontier=0;state.weeklyPassed=false;state.weeklyDraft={};notifyParent('已从审核过的数字模板切换到下一组。');return true}
  if(action==='add-link'){const raw=workspaceElement('sourceLink').value.trim();try{const u=new URL(raw);if(u.protocol!=='https:')throw Error('资料网址需使用 https');state.localSources.push({title:workspaceElement('sourceName').value.trim()||u.hostname,url:u.href,rights:workspaceElement('sourceRights').value,subject:workspaceElement('sourceSubject').value});notifyParent('已保存资料链接；需要人工提取知识点、确认使用权。')}catch(ex){notifyParent(ex.message)}return true}
  if(action==='add-concept'){const name=workspaceElement('newConceptName').value.trim(),ids=workspaceElement('newConceptRequires').value.split(',').map(x=>x.trim()).filter(Boolean),opts=workspaceElement('newConceptChoices').value.split('|').map(x=>x.trim()).filter(Boolean),candidate={id:'custom-'+(state.customNodes.length+state.draftTasks.reduce((n,p)=>n+p.nodes.length,0)+1),label:name,family:workspaceElement('newConceptFamily').value.trim()||'家长自编',level:Number(workspaceElement('newConceptLevel').value),prerequisites:ids,skills:['custom-'+(state.customNodes.length+state.draftTasks.reduce((n,p)=>n+p.nodes.length,0)+1),...workspaceElement('newConceptSkills').value.split(',').map(x=>x.trim()).filter(Boolean)],source:workspaceElement('newConceptSource').value.trim(),reviewer:workspaceElement('newConceptReviewer').value.trim()||'家长审核',rights:workspaceElement('sourceRights').value,reviewed:workspaceElement('newConceptReviewed').checked,lesson:{kind:workspaceElement('newConceptKind').value,prompt:workspaceElement('newConceptPrompt').value.trim(),visual:workspaceElement('newConceptVisual').value.split('|').map(x=>x.trim()).filter(Boolean),choices:opts,correct:Number(workspaceElement('newConceptCorrect').value)-1,counts:{r:Number(workspaceElement('newRed').value),o:Number(workspaceElement('newOrange').value),y:Number(workspaceElement('newYellow').value)},target:workspaceElement('newConceptTarget').value.split(',').map(Number)}};try{const accepted=validateLocalPackage({schema:1,nodes:[candidate]},allConcepts());stageLocalPackage(accepted,'知识点和题目已通过结构检查并进入待发布区。')}catch(ex){notifyParent(ex.message)}return true}}
 node=e.target.closest('[data-week-number],[data-week-op],[data-week-bracket],[data-week-action],[data-week-choice]');if(node&&state.mode==='weekly'){const q=currentWeekTasks()[state.weeklyIndex];if(!q||state.weeklyPassed&&!['next','prev','current'].includes(node.dataset.weekAction)||state.weeklyIndex<state.weeklyFrontier&&!['prev','current'].includes(node.dataset.weekAction))return true;const d=state.weeklyDraft;if(node.dataset.weekNumber) d.tokens=nextFormulaTokens(d.tokens||[],{type:'number',id:node.dataset.weekNumber});else if(node.dataset.weekOp)d.tokens=nextFormulaTokens(d.tokens||[],{type:'operator',op:node.dataset.weekOp});else if(node.dataset.weekBracket)d.tokens=nextFormulaTokens(d.tokens||[],{type:node.dataset.weekBracket});else if(node.dataset.weekChoice!==undefined)d.choice=Number(node.dataset.weekChoice);else if(node.dataset.weekAction==='undo'||node.dataset.weekAction==='clear')d.tokens=nextFormulaTokens(d.tokens||[],{type:node.dataset.weekAction});else if(node.dataset.weekAction==='hint'){d.hint=true;log('hint',{task:q.id,skills:q.skills})}else if(node.dataset.weekAction==='check')checkWeekly(q);else if(node.dataset.weekAction==='next'&&state.weeklyPassed){state.weeklyIndex++;state.weeklyFrontier=Math.max(state.weeklyFrontier,state.weeklyIndex);state.weeklyPassed=false;state.weeklyDraft={}}else if(node.dataset.weekAction==='prev'&&state.weeklyIndex>0){state.weeklyIndex--}else if(node.dataset.weekAction==='current'){state.weeklyIndex=state.weeklyFrontier}

 const years=Array.from({length:10},(_,i)=>pkg.latestYear-9+i),wanted=new Set(years),seen=new Set(),known=new Set(concepts.map(n=>n.id));
 for(const item of pkg.items){
  if(!Number.isInteger(item.year)||!wanted.has(item.year)||!Number.isInteger(item.number)||item.number<1||item.number>25)throw Error('年份和题号须覆盖连续十届、每届1至25题');

  if(item.localSkill!==null&&item.localSkill!==undefined&&!known.has(item.localSkill))throw Error(key+' 的本地知识点编号尚不存在');
  if(typeof item.source!=='string'||!item.source.trim()||typeof item.reviewer!=='string'||!item.reviewer.trim()||item.reviewed!==true||!['原创','已获许可','仅元数据标注','公共领域'].includes(item.rights))throw Error(key+' 缺少来源、审核人、审核声明或授权标注');

}
function amcFrequency(){if(!state.amcAudit?.items||state.amcAudit.items.length!==250)return null;const topics={},skills={};for(const i of state.amcAudit.items){topics[i.primaryTopic]=(topics[i.primaryTopic]||0)+1;if(i.localSkill)skills[i.localSkill]=(skills[i.localSkill]||0)+1}return {topics:Object.entries(topics).sort((a,b)=>b[1]-a[1]).map(([label,count])=>({label,count,share:count/250})),skills};}

     (e.type==='exam_answer'||e.attemptNo===1&&e.hintUsed===false));
 const contexts=new Set(independent.map(e=>e.task).filter(Boolean));
 const times=independent.map(e=>Date.parse(e.time)).filter(Number.isFinite);
