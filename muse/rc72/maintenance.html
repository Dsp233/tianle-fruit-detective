<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RC72 只读进度导出</title><style>body{max-width:1000px;margin:32px auto;padding:0 18px;font:17px/1.7 system-ui;color:#163b43}a{color:#12697d}code{overflow-wrap:anywhere}table{border-collapse:collapse;width:100%}td,th{border:1px solid #c7d8d5;padding:8px;text-align:left}nav{display:flex;gap:18px;flex-wrap:wrap}.status{padding:14px;background:#edf7f4;border-radius:9px}.scroll{overflow:auto}</style><h1>RC72 只读进度导出</h1><p>导出本浏览器保存的完整原文，不修改或降级进度。</p><button id=export>导出完整进度原文</button><p id=status role=status></p><script>document.getElementById('export').onclick=()=>{try{const raw=localStorage.getItem("tianle_amc8_question_design_v1");if(raw===null){document.getElementById('status').textContent='当前浏览器没有对应进度。';return}const a=document.createElement('a'),url=URL.createObjectURL(new Blob([raw],{type:'application/json'}));a.href=url;a.download='amc8-progress-original.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);document.getElementById('status').textContent='已导出原文，原记录保持不变。'}catch(e){document.getElementById('status').textContent='无法读取进度，请保留原浏览器与页面。'}}</script></html>
