<script>window.__PILOT_DATA__={"version":"story-preview-v2","status":"DRAFT_SUPERVISED_PREVIEW_NOT_FORMAL_COURSE","days":[{"day":1,"title":"空展柜和一张收据","story":["周末，天乐和小禾要办一场“看见夜空”的小展览。最重要的观察簿却不见了，空展柜里只剩一张收据。","收据背后写着：下午 4 点，登记员送来一个绿盒。4 点 10 分，小禾打开绿盒，里面只有放大镜；她随后把盒子合上。到 4 点 20 分天乐搬走盒子时，盒子一直没有再打开。","“一定是搬盒子的时候弄丢的！”团团说。天乐摇摇头：“先别急着认定。”收据底下还有一行小字：请到图书馆修复台查询。"],"questions":[{"id":"S01-1","prompt":"根据记录，团团的说法哪里有问题？","options":["搬盒子时，观察簿已经不在绿盒里。","小禾一定把观察簿藏了起来。","绿盒从来没有装过观察簿。"],"answer":0,"reason":"4 点 10 分打开时盒里只有放大镜，此后到搬走一直未打开；这不能证明更早的情况。","hint":"先看搬走之前，盒子里有什么。","ability":"时间线与证据","relatedTo":null,"type":"choice"},{"id":"S01-2","prompt":"把记录中发生的事按先后排好。","options":["登记员送来绿盒","天乐搬走绿盒","小禾打开并合上绿盒"],"answer":[0,2,1],"reason":"三个时间分别是 4:00、4:10、4:20。","hint":"找到每件事对应的时间。","ability":"事件排序","relatedTo":"S01-1","type":"order"},{"id":"S01-3","prompt":"接下来怎样寻找最有依据？","options":["只核对绿盒里放大镜的颜色。","先假定最后搬盒的人弄丢了观察簿。","查修复台的登记记录，核对观察簿编号。"],"answer":2,"reason":"收据给出了修复台这一线索；核对编号可以判断记录说的是不是同一本簿。","hint":"收据给出了哪个可继续查找的地方？","ability":"根据线索选择行动","relatedTo":null,"type":"choice"}],"extra":{"id":"S01-X","prompt":"如果又查到：绿盒从 4 点封好后，直到小禾打开前都没打开过，那么 4 点封盒时观察簿在里面吗？","options":["不在。","一定在。","还是无法判断盒里有什么。"],"answer":0,"reason":"已知 4 点 10 分打开时只有放大镜，中间没有打开，因此 4 点封盒时也没有观察簿。","hint":"利用新增的“中间没有打开”这一条件。","ability":"条件变化","relatedTo":"S01-1","type":"choice"},"panels":["周末，天乐和小禾要办一场“看见夜空”的小展览。最重要的观察簿却不见了，空展柜里只剩一张收据。","收据背后写着：下午 4 点，登记员送来一个绿盒。4 点 10 分，","小禾打开绿盒，里面只有放大镜；她随后把盒子合上。到 4 点 20 分天乐搬走盒子时，盒子一直没有再打开。","“一定是搬盒子的时候弄丢的！”团团说。天乐摇摇头：“先别急着认定。”","收据底下还有一行小字：请到图书馆修复台查询。"]},{"day":2,"title":"两本画着星星的簿子","story":["修复台的登记册里有两张照片：照片上的簿子都画了星星，封面几乎一样。管理员说：“别光看封面，看编号。”","天乐带来的展览清单写着：观察簿编号 47。两张照片里的标签分别是 47 和 74。编号 47 的登记卡夹着便条：“请送到温室，借给记录小组。”登记册没有写送出时间，也没有签收记录。","小禾已经朝门口跑去。天乐叫住她：“先问清楚，便条能告诉我们多少。”"],"questions":[{"id":"S02-1","prompt":"哪张照片上簿子的编号与展览清单相同？","options":["编号 74 的簿子","编号 47 的簿子","两本都能确定是展览要找的簿子"],"answer":1,"reason":"清单写的是 47；两本封面相似不足以说明它们是同一本。","hint":"比较清单和两张标签上的数字。","ability":"核对信息","relatedTo":null,"type":"choice"},{"id":"S02-2","prompt":"便条和登记册能支持哪种判断？","options":["簿子一定已经由温室签收。","簿子一定还在修复台，没有人借走。","温室值得去查，但还不能确定簿子已经送到。"],"answer":2,"reason":"便条提出了送往温室，但缺少送出和签收记录；下一处可以查温室，不应把便条当成送达证明。","hint":"便条说了什么？登记册又缺了什么？","ability":"区分线索与结论","relatedTo":null,"type":"choice"},{"id":"S02-3","prompt":"为了判断编号 47 的簿子后来去了哪里，哪项新证据最有帮助？","options":["查编号 47 的借出时间和温室签收记录。","再数一数封面画了几颗星。","只问两本簿子的封面颜色。"],"answer":0,"reason":"与同一编号相关的交接记录能帮助追踪去向；封面细节不能证明交接。","hint":"需要找能追踪“同一本”的记录。","ability":"选择证据","relatedTo":"S02-2","type":"choice"}],"extra":{"id":"S02-X","prompt":"如果温室有一本也画着星星的簿子，但编号被遮住，能确定就是编号 47 吗？","options":["能，画星星的簿子只有这一本。","不能，需要再核对编号或其他可靠记录。","不能，因为温室里不可能有簿子。"],"answer":1,"reason":"前面已经看到不同编号可以有相似封面；遮住编号时需要补充识别信息。","hint":"想起登记照片上两本相似的簿子。","ability":"迁移与信息不足","relatedTo":"S02-1","type":"choice"},"panels":["修复台的登记册里有两张照片：照片上的簿子都画了星星，封面几乎一样。","管理员说：“别光看封面，看编号。”","天乐带来的展览清单写着：观察簿编号 47。两张照片里的标签分别是 47 和 74。","编号 47 的登记卡夹着便条：“请送到温室，借给记录小组。”","登记册没有写送出时间，也没有签收记录。","小禾已经朝门口跑去。天乐叫住她：“先问清楚，便条能告诉我们多少。”"]},{"day":3,"title":"温室里的两盆苗","story":["温室的记录小组说，他们把一本旧簿子装进蓝袋，交给了运输机器人；小禾还不能确定是不是编号 47 的观察簿。小组请他们去轨道打印台查看运输单。桌上还留着两张小苗记录卡。","两盆苗使用同种种子、同样的盆和土，每次浇水也一样；甲盆放在亮处，乙盆放在较暗处。一段时间后，甲从 4 厘米长到 7 厘米，乙从 5 厘米长到 7 厘米。","“它们现在一样高，所以长得一样多。”团团说。小禾指着起始数字：“等一下，还要看这里。”"],"questions":[{"id":"S03-1","prompt":"哪盆在这段时间里长得更多？","options":["乙盆多长了 1 厘米。","两盆长得一样多。","甲盆多长了 1 厘米。"],"answer":2,"reason":"甲长了 7－4＝3 厘米，乙长了 7－5＝2 厘米。","hint":"分别用现在的高度减去开始的高度。","ability":"比较变化量","relatedTo":null,"type":"choice"},{"id":"S03-2","prompt":"如果想比较光照的影响，这次记录里哪个条件有意不同？","options":["两盆放置位置的光照。","两盆浇水量。","两盆使用的种子种类。"],"answer":0,"reason":"记录说明种子、盆、土和浇水相同，光照不同。","hint":"对照记录里“相同”和“不同”的条件。","ability":"识别变量","relatedTo":null,"type":"choice"},{"id":"S03-3","prompt":"仅凭这两盆苗的一次记录，能得出什么结论？","options":["所有植物在亮处一定长得更快。","这次甲盆长得更多，但还不能断言所有植物都如此。","因为最后一样高，所以光照没有任何影响。"],"answer":1,"reason":"一次观察可以描述这次结果，但不足以推广到所有植物。","hint":"把“这一次”与“所有情况”分开。","ability":"证据边界","relatedTo":"S03-1","type":"choice"}],"extra":{"id":"S03-X","prompt":"下次怎样补充观察，更有助于检查这个发现？","options":["只量最后高度，把开始高度省略。","换成不同种子和不同浇水量后，只比较最后高度。","用更多同类小苗重复比较，并继续记录起始与结束高度。"],"answer":2,"reason":"增加重复观察并保留起止数据，有助于比较结果是否稳定。","hint":"想想需要重复什么、记录什么。","ability":"设计验证","relatedTo":"S03-2","type":"choice"},"panels":["温室的记录小组说，他们把一本旧簿子装进蓝袋，交给了运输机器人；","小禾还不能确定是不是编号 47 的观察簿。小组请他们去轨道打印台查看运输单。","桌上还留着两张小苗记录卡。","两盆苗使用同种种子、同样的盆和土，每次浇水也一样；甲盆放在亮处，","乙盆放在较暗处。一段时间后，甲从 4 厘米长到 7 厘米，","乙从 5 厘米长到 7 厘米。","“它们现在一样高，所以长得一样多。”团团说。小禾指着起始数字：“等一下，还要看这里。”"]},{"day":4,"title":"机器人要走几步","story":["轨道入口的屏幕显示，机器人曾把蓝袋送往仓库。轨道从第 0 格开始，打印台在第 7 格。","机器人一次只能向前走 2 格或 3 格，不能后退，也不能走出轨道后折返。它想尽快到打印台，请天乐设计路线。打印台里有张尚未取出的仓库通行卡。","团团拍下“3 格”的按钮，又犹豫起来：“两次能到吗？”"],"questions":[{"id":"S04-1","prompt":"机器人最少走几次，才能刚好到第 7 格？","options":["3 次","2 次","4 次"],"answer":0,"reason":"两次最多走 6 格；三次可以走 2＋2＋3＝7 格。","hint":"先看两次最多能走多远。","ability":"最少步数","relatedTo":null,"type":"choice"},{"id":"S04-2","prompt":"哪一组动作能让它刚好停在第 7 格？","options":["3 格、3 格、3 格","2 格、2 格、3 格","2 格、2 格、2 格"],"answer":1,"reason":"三组分别走到 7、9、6 格；只有第一组恰好到 7 格。","hint":"把每组走的格数加起来。","ability":"核对方案","relatedTo":"S04-1","type":"choice"},{"id":"S04-3","prompt":"为什么不能只用两次就到第 7 格？","options":["因为每次都必须走 2 格。","因为打印台不在轨道上。","每次最多 3 格，两次最多 6 格。"],"answer":2,"reason":"可选步长中最大的是 3，两次最多 3＋3＝6。","hint":"找到一次能走的最大格数。","ability":"解释边界","relatedTo":"S04-1","type":"choice"}],"extra":{"id":"S04-X","prompt":"如果打印台改在第 8 格，从第 0 格出发最少要走几次？","options":["3 次","2 次","4 次"],"answer":0,"reason":"两次最多 6 格；3＋3＋2＝8，三次能到。","hint":"先判断两次够不够，再试三次。","ability":"条件变化","relatedTo":"S04-1","type":"choice"},"panels":["轨道入口的屏幕显示，机器人曾把蓝袋送往仓库。轨道从第 0 格开始，打印台在第 7 格。","机器人一次只能向前走 2 格或 3 格，不能后退，也不能走出轨道后折返。","它想尽快到打印台，请天乐设计路线。打印台里有张尚未取出的仓库通行卡。","团团拍下“3 格”的按钮，又犹豫起来：“两次能到吗？”"]},{"day":5,"title":"仓库里的三张纸条","story":["通行卡打开了仓库门。仓库里有红、蓝、绿三个盒子，只有一个装着干燥柜的钥匙。管理员留下三张纸条，并说明三句话中恰好只有一句是真的。","红盒纸条：“钥匙不在红盒。”蓝盒纸条：“钥匙在绿盒。”绿盒纸条：“钥匙不在绿盒。”","团团伸手想拿蓝盒。小禾说：“先比较后面两张纸条，它们可能同时为假吗？”"],"questions":[{"id":"S05-1","prompt":"钥匙在哪个盒子里？","options":["蓝盒","红盒","绿盒"],"answer":1,"reason":"蓝、绿两张纸条互相矛盾，恰有一句真；因此红盒纸条是假话，钥匙在红盒。","hint":"先比较蓝盒和绿盒两句话。","ability":"多条件推理","relatedTo":null,"type":"choice"},{"id":"S05-2","prompt":"为什么蓝盒和绿盒的纸条恰有一句是真的？","options":["因为它们都贴在盒子上。","因为三只盒子颜色不同。","一句说在绿盒，一句说不在绿盒，两句正好相反。"],"answer":2,"reason":"“在绿盒”和“不在绿盒”是相反的陈述；对于同一把钥匙，一真一假。","hint":"把两句话中关于绿盒的部分放在一起。","ability":"解释矛盾","relatedTo":"S05-1","type":"choice"},{"id":"S05-3","prompt":"既然蓝、绿纸条中已有一句真，红盒纸条应当怎样？","options":["是假话，因此钥匙在红盒。","是真话，因此钥匙不在红盒。","真假无法判断，不能使用管理员的说明。"],"answer":0,"reason":"总共恰有一句真，蓝绿之间已占去这一句，所以红盒所说“不在红盒”为假。","hint":"再用上“总共只有一句真”。","ability":"组合证据","relatedTo":"S05-1","type":"choice"}],"extra":{"id":"S05-X","prompt":"如果其他内容不变，改成“三句话中恰好两句是真的”，钥匙可能在哪？","options":["只可能在红盒","可能在蓝盒或绿盒","三个盒子都可能"],"answer":1,"reason":"分别假设钥匙在红、蓝、绿盒，真话数是 1、2、2，因此可能在蓝盒或绿盒。","hint":"分别假设钥匙在三个盒子里，数真话。","ability":"改变条件","relatedTo":"S05-1","type":"choice"},"panels":["通行卡打开了仓库门。仓库里有红、蓝、绿三个盒子，只有一个装着干燥柜的钥匙。","管理员留下三张纸条，并说明三句话中恰好只有一句是真的。","红盒纸条：“钥匙不在红盒。”蓝盒纸条：“钥匙在绿盒。”绿盒纸条：“钥匙不在绿盒。”","团团伸手想拿蓝盒。小禾说：“先比较后面两张纸条，它们可能同时为假吗？”"]},{"day":6,"title":"升降机的第一趟","story":["钥匙打开干燥柜，柜里有三只纸袋：A 袋是手套，重 2 千克；蓝色的 B 袋装着编号 47 的观察簿，重 3 千克；C 袋是展板，重 4 千克。","升降机每趟最多装两只袋子，总重不能超过 6 千克。观察簿必须第一趟上楼。管理员还叮嘱：拿到手套之前，不要打开装观察簿的袋子。","“我想把展板和观察簿一起带上去。”天乐说。团团看了看限重牌。"],"questions":[{"id":"S06-1","prompt":"如果第一趟要装两只袋子，哪种搭配符合条件？","options":["B 袋和 C 袋","A 袋和 C 袋","A 袋和 B 袋"],"answer":2,"reason":"第一趟必须有 B。A＋B 为 5 千克，符合限重；B＋C 为 7 千克，超重。","hint":"先找必须带的袋子，再算总重量。","ability":"综合限制","relatedTo":null,"type":"choice"},{"id":"S06-2","prompt":"为什么不能按天乐的想法第一趟带 B 和 C？","options":["两袋总重 7 千克，超过 6 千克。","两袋加起来只有 5 千克。","规定第一趟不能运观察簿。"],"answer":0,"reason":"B 和 C 重 3＋4＝7 千克，超过每趟 6 千克的上限。","hint":"把 B、C 两袋的重量相加。","ability":"解释条件","relatedTo":"S06-1","type":"choice"},{"id":"S06-3","prompt":"拿到手套之前，应该怎样处理观察簿的袋子？","options":["立刻打开，否则不能上楼。","先保持封好，拿到手套后再打开。","只要两只袋子一起运，就可以不管这条叮嘱。"],"answer":1,"reason":"管理员的叮嘱限制的是打开时间；运输与打开是两件事。","hint":"区分“搬运”和“打开”。","ability":"理解规则","relatedTo":null,"type":"choice"}],"extra":{"id":"S06-X","prompt":"如果限重改为 4 千克，仍要求第一趟运观察簿，下面哪种方式可行？","options":["第一趟运 A 袋和 B 袋。","第一趟运 B 袋和 C 袋。","第一趟只运 B 袋。"],"answer":2,"reason":"B 袋 3 千克可以单独运；A＋B 为 5、B＋C 为 7，均超过 4 千克。","hint":"“最多两只”允许只运一只。","ability":"条件变化","relatedTo":"S06-1","type":"choice"},"panels":["钥匙打开干燥柜，柜里有三只纸袋：A 袋是手套，重 2 千克；","蓝色的 B 袋装着编号 47 的观察簿，重 3 千克；C 袋是展板，重 4 千克。","升降机每趟最多装两只袋子，总重不能超过 6 千克。观察簿必须第一趟上楼。","管理员还叮嘱：拿到手套之前，不要打开装观察簿的袋子。","“我想把展板和观察簿一起带上去。”天乐说。团团看了看限重牌。"]},{"day":7,"title":"展览开门以前","story":["观察簿终于回到展厅。天乐戴上手套，翻开记录页：第一晚看到 3 颗，第二晚看到 5 颗，第三晚看到 1 颗；每晚都观察了 20 分钟。记录还写着第三晚有云。","小禾准备展签：“第三晚有云，看来只要有云就一定看得少。”天乐把笔递给她：“我们把看到的写清楚，再说哪些还不能确定。”","展厅的门外，第一批参观者已经到了。团团把找到观察簿的路线画成一张地图，贴在展柜旁。"],"questions":[{"id":"S07-1","prompt":"这三次同样长的观察中，哪一次看到的数量最多？","options":["第二晚","第一晚","第三晚"],"answer":0,"reason":"三次分别记录 3、5、1 颗；5 是最多的。","hint":"对照三晚的记录数字。","ability":"读取并比较记录","relatedTo":null,"type":"choice"},{"id":"S07-2","prompt":"哪句展签既符合记录，也没有把一次观察说成普遍规律？","options":["只要有云，就一定比没云时看到得少。","这三次中第二晚看到的最多；是否与云有关还需继续观察。","三晚都看到了同样多的星星。"],"answer":1,"reason":"记录可以比较三次数量，但没有足够证据证明所有有云的夜晚都怎样。","hint":"哪些是记录到的事实，哪些需要更多证据？","ability":"事实与推断","relatedTo":"S07-1","type":"choice"},{"id":"S07-3","prompt":"如果想继续研究云量是否影响观测，哪种记录更有帮助？","options":["只记有云的夜晚，不记看到的数量。","只把第二晚的结果重复写三遍。","多记录几个夜晚的云量、观察时长和看到的数量。"],"answer":2,"reason":"增加不同夜晚的记录，并保留可能影响比较的条件，才能进一步分析。","hint":"除了星星数量，还要记录什么条件？","ability":"设计后续观察","relatedTo":"S07-2","type":"choice"}],"extra":{"id":"S07-X","prompt":"第四晚同样观察了 20 分钟，看到 4 颗。四晚一共记录了多少颗？","options":["13 颗","12 颗","14 颗"],"answer":0,"reason":"3＋5＋1＋4＝13；这是四次记录的合计，不表示四晚看见的是不同的星星。","hint":"把四晚的记录数量相加。","ability":"汇总与解释","relatedTo":"S07-1","type":"choice"},"panels":["观察簿终于回到展厅。天乐戴上手套，翻开记录页：第一晚看到 3 颗，","第二晚看到 5 颗，第三晚看到 1 颗；每晚都观察了 20 分钟。记录还写着第三晚有云。","小禾准备展签：“第三晚有云，看来只要有云就一定看得少。”","天乐把笔递给她：“我们把看到的写清楚，再说哪些还不能确定。”","展厅的门外，第一批参观者已经到了。团团把找到观察簿的路线画成一张地图，贴在展柜旁。"]}],"pinyinMap":{"一":"yī","七":"qī","三":"sān","上":"shàng","下":"xià","不":"bù","与":"yǔ","丢":"diū","两":"liǎng","个":"gè","中":"zhōng","为":"wèi","么":"me","之":"zhī","乎":"hū","乐":"lè","乙":"yǐ","也":"yě","习":"xí","书":"shū","了":"le","事":"shì","二":"èr","于":"yú","云":"  return '';}
 function quiz(){const d=day(),q=question(),r=currentRecord(),options=q.type==='order'?(Array.isArray(state.selected)?[...state.selected,...q.options.map((_,i)=>i).filter(i=>!state.selected.includes(i))]:q.options.map((_,i)=>i)):q.options.map((_,i)=>i),valid=q.type==='order'?Array.isArray(state.selected)&&state.selected.length===q.options.length:Number.isInteger(state.selected),latest=r.attempts.at(-1);
 const feedback=latest?`<div class="feedback ${latest.correct?'':'try'}" role="status"><strong>${rt(latest.correct?'这次找到了，再说说你的理由。':'再回到故事找找线索，也可以试试提示。')}</strong><p>${rt('第一次选择会保留在本次试玩中。')}</p><div class="nav">${button('retry','再试一次')}${button('explain','看讲解')}${state.question<2?button('nextQuestion','下一题','','primary'):button('finishCore','今天的任务完成了','','primary')}</div></div>`:'';
 return `<section class="panel"><div class="top"><span class="muted">${rt('第 '+d.day+' 天 · '+d.title)}</span><span class="muted">${rt(state.question===3?'自愿挑战':'核心任务 '+(state.question+1)+' / 3')}</span></div><details><summary>${rt('回看故事')}</summary>${d.story.map(p=>`<p>${rt(p)}</p>`).join('')}${button('speakAll','听故事')}</details>${activity()}<h2 class="question">${rt(q.prompt)}</h2>${button('speakQuestion','听问题')}<div class="options">${options.map(i=>{const selected=q.type==='order'?Array.isArray(state.selected)&&state.selected.includes(i):state.selected===i,n=q.type==='order'&&selected?(state.selected.indexOf(i)+1)+' · ':'';return `<div class="choice-row">${button('pick',n+q.options[i],`data-index="${i}" aria-pressed="${selected}"`,'choice '+(selected?'selected':''))}${button('speakOption','听',`data-index="${i}"`,'speak')}</div>`}).join('')}</div>${q.type==='order'?`<p>${rt('按顺序点卡片；已选卡片会移到上面。')}</p>${button('undo','撤回一张卡')}`:''}<div class="nav">${button('hint','看看提示')}${button('submit','我选好了',valid?'':'disabled','primary')}${button('backStory','回看这一篇')}</div>${state.showHint?`<p class="hint">${rt(q.hint)}</p>`:''}${feedback}${state.showExplanation?`<div class="hint"><h3>${rt('一起看依据')}</h3><p>${rt(q.reason)}</p><p>${rt('答案')}：${Array.isArray(q.answer)?q.answer.map(i=>rt(q.options[i])).join(' → '):rt(q.options[q.answer])}</p></div>`:''}</section>`;}
 function finish(){return `<section class="panel"><h2>${rt('今天先到这里')}</h2><p>${rt('你可以试一道自愿挑战，也可以返回地图。')}</p><div class="nav">${button('challenge','试试自愿挑战','','primary')}${button('map','返回地图')}${button('export','下载本次试玩记录')}</div><p class="muted">${rt('下载只在本机进行，不会发送到服务器。刷新或关闭页面后，未下载的试玩记录会消失。')}</p></section>`;}
 function render(){readTexts.clear();readSequence=0;const body=state.screen==='map'?map():state.screen==='story'?story():state.screen==='question'?quiz():finish();root.innerHTML=`<div class="controls">${button('pinyin',state.pinyin?'隐藏拼音':'显示拼音')}${button('speakPage','听本页')}${button('stop','停止朗读')}<span id="status" class="muted" role="status">${rt(state.message)}</span></div>${body}`;}
 speech=window.ReadingSpeech.create({getRemoteConsent:()=>false,getRate:()=>.85,onStatus:info=>{state.sound=info.state;const messages={requested:'正在准备朗读。',started:'正在朗读。',ended:'朗读结束。',stopped:'朗读已停止。',blocked:'没有可用的本地普通话音色，请家长代读。',no_voice:'没有可用的本地普通话音色，请家长代读。',unsupported:'本设备暂不支持朗读，请家长代读。',failed:'这次朗读没有完成，请再试或请家长代读。'};state.message=messages[info.state]||'';const el=document.getElementById('status');if(el)el.textContent=state.message;}});
 root.addEventListener('click',event=>{const b=event.target.closest('[data-action]');if(!b||b.disabled)return;const a=b.dataset.action,i=Number(b.dataset.index);state.message='';
 if(a==='map'){speech.stop();state.screen='map';}
 else if(a==='start'){speech.stop();state.day=i;state.panel=0;state.question=0;state.selected=null;state.showHint=false;state.showExplanation=false;state.pinyinEver=state.pinyin;state.audioEver=false;state.explorationEver=false;state.robot=0;state.bags=[];state.box=null;state.screen='story';}
 else if(a==='prevPanel')state.panel=Math.max(0,state.panel-1);
 else if(a==='nextPanel')state.panel=Math.min(day().panels.length-1,state.panel+1);
 else if(a==='startQuestions'){speech.stop();state.screen='question';}
 else if(a==='backStory'){speech.stop();state.panel=0;state.screen='story';}
 else if(a==='pinyin'){state.pinyin=!state.pinyin;if(state.pinyin)state.pinyinEver=true;if(state.screen==='question'&&state.pinyin)currentRecord().help.push({type:'pinyin'});}
 else if(a==='stop')speech.stop();
 else if(a==='speakPage'){const copy=root.cloneNode(true);copy.querySelectorAll('rt').forEach(n=>n.remove());say(copy.textContent,'page');}
 else if(a==='readChar'){const text=readTexts.get(b.dataset.key),index=Number(b.dataset.index),char=Array.from(text||'')[index];if(char)say(char,'character',{contextText:text,charIndex:index});}
 else if(a==='speakStory')say(day().panels[state.panel],'sentence');
 else if(a==='speakAll')say(day().story.join(''),'story');
 else if(a==='speakQuestion')say(question().prompt,'question');
 else if(a==='speakOption')say(question().options[i],'option');
 else if(a==='pick'){const q=question();if(q.type==='order'){if(!Array.isArray(state.selected))state.selected=[];if(!state.selected.includes(i))state.selected.push(i);}else state.selected=i;}
 else if(a==='undo'){if(Array.isArray(state.selected))state.selected.pop();}
 else if(a==='hint'){state.showHint=true;currentRecord().help.push({type:'hint'});}
 else if(a==='submit'){const q=question(),r=currentRecord(),selected=Array.isArray(state.selected)?[...state.selected]:state.selected,valid=q.type==='order'?Array.isArray(selected)&&selected.length===q.options.length:Number.isInteger(selected);if(valid){const attempt={selected,correct:JSON.stringify(selected)===JSON.stringify(q.answer),pinyinEver:state.pinyinEver,audioEver:state.audioEver,explorationEver:state.explorationEver,hintEver:state.showHint,at:new Date().toISOString()};r.attempts.push(attempt);if(!r.first)r.first={...attempt};}}
 else if(a==='retry'){state.selected=null;state.showExplanation=false;}
 else if(a==='explain'){state.showExplanation=true;currentRecord().help.push({type:'explanation'});}
 else if(a==='nextQuestion'){speech.stop();state.question++;state.selected=null;state.showHint=false;state.showExplanation=false;}
 else if(a==='finishCore'){speech.stop();state.screen='finish';}
 else if(a==='challenge'){state.screen='question';state.question=3;state.selected=null;state.showHint=false;state.showExplanation=false;}
 else if(a==='move'){const next=state.robot+Number(b.dataset.amount);if(next<=7)state.robot=next;else state.message='这一步会走出轨道，先换一种走法。';state.explorationEver=true;currentRecord().help.push({type:'explore'});}
 else if(a==='resetRobot')state.robot=0;
 else if(a==='bag'){state.bags=state.bags.includes(i)?state.bags.filter(x=>x!==i):[...state.bags,i];state.explorationEver=true;currentRecord().help.push({type:'explore'});}
 else if(a==='box'){state.box=i;state.explorationEver=true;currentRecord().help.push({type:'explore'});}
 else if(a==='export'){const payload={format:'reading-pilot-v2-local-preview',scope:'exploratory; not formal learning evidence',createdAt:new Date().toISOString(),records:state.records},url=URL.createObjectURL(new Blob([JSON.stringify(payload,null,2)],{type:'application/json'})),link=document.createElement('a');link.href=url;link.download='reading-pilot-preview.json';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
 render();});
 root.addEventListener('keydown',e=>{if(!e.isComposing&&['Enter',' '].includes(e.key)&&e.target.matches('[data-action=readChar]')){e.preventDefault();e.target.click();}});
 render();
})();
</script></body></html>
