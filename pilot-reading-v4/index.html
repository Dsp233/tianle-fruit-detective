<script>window.__PILOT_DATA__={"version":"story-preview-v4","contentHash":"c5a1090c4a44f38f3af030349b85599b9a39ff53882a30c8ebbfe51d7a1ac53a","status":"DRAFT_SUPERVISED_PREVIEW_NOT_FORMAL_COURSE","days":[{"day":1,"title":"空展柜和一张收据","story":["周末，天乐和小禾要办一场“看见夜空”的小展览。最重要的观察簿却不见了，空展柜里只剩一张收据。","收据背后写着：下午 4 点，登记员送来一个绿盒。4 点 10 分，小禾打开绿盒，里面只有放大镜；她随后把盒子合上。到 4 点 20 分天乐搬走盒子时，盒子一直没有再打开。","“一定是搬盒子的时候弄丢的！”团团说。天乐摇摇头：“先别急着认定。”收据底下还有一行小字：请到图书馆修复台查询。"],"questions":[{"id":"S01-1","prompt":"根据记录，团团的说法哪里有问题？","options":["搬盒子时，观察簿已经不在绿盒里。","小禾一定把观察簿藏了起来。","绿盒从来没有装过观察簿。"],"answer":0,"reason":"4 点 10 分打开时盒里只有放大镜，此后到搬走一直未打开；这不能证明更早的情况。","hint":"先看搬走之前，盒子里有什么。","ability":"时间线与证据","relatedTo":null,"type":"choice"},{"id":"S01-2","prompt":"把记录中发生的事按先后排好。","options":["登记员送来绿盒","天乐搬走绿盒","小禾打开并合上绿盒"],"answer":[0,2,1],"reason":"4 点送来绿盒，4 点 10 分小禾打开并随后合上，4 点 20 分天乐搬走。","hint":"找到每件事对应的时间。","ability":"事件排序","relatedTo":"S01-1","type":"order"},{"id":"S01-3","prompt":"接下来怎样寻找最有依据？","options":["只核对绿盒里放大镜的颜色。","先假定最后搬盒的人弄丢了观察簿。","查修复台的登记记录，核对观察簿编号。"],"answer":2,"reason":"收据给出了修复台这一线索；核对编号可以判断记录说的是不是同一本簿。","hint":"收据给出了哪个可继续查找的地方？","ability":"根据线索选择行动","relatedTo":null,"type":"choice"}],"extra":{"id":"S01-X","prompt":"如果又查到：绿盒从 4 点封好后，直到小禾打开前都没打开过，那么 4 点封盒时观察簿在里面吗？","options":["不在。","一定在。","还是无法判断盒里有什么。"],"answer":0,"reason":"已知 4 点 10 分打开时只有放大镜，中间没有打开，因此 4 点封盒时也没有观察簿。","hint":"利用新增的“中间没有打开”这一条件。","ability":"条件变化","relatedTo":"S01-1","type":"choice"},"panels":["周末，天乐和小禾要办一场“看见夜空”的小展览。最重要的观察簿却不见了，空展柜里只剩一张收据。","收据背后写着：下午 4 点，登记员送来一个绿盒。4 点 10 分，","小禾打开绿盒，里面只有放大镜；她随后把盒子合上。到 4 点 20 分天乐搬走盒子时，盒子一直没有再打开。","“一定是搬盒子的时候弄丢的！”团团说。天乐摇摇头：“先别急着认定。”","收据底下还有一行小字：请到图书馆修复台查询。"]},{"day":2,"title":"两本画着星星的簿子","story":["修复台的登记册里有两张照片：照片上的簿子都画了星星，封面几乎一样。管理员说：“别光看封面，看编号。”","天乐带来的展览清单写着：观察簿编号 47。两张照片里的标签分别是 47 和 74。编号 47 的登记卡夹着便条：“请送到温室，借给记录小组。”登记册没有写送出时间，也没有签收记录。","小禾已经朝门口跑去。天乐叫住她：“先问清楚，便条能告诉我们多少。”"],"questions":[{"id":"S02-1","prompt":"哪张照片上簿子的编号与展览清单相同？","options":["编号 74 的簿子","编号 47 的簿子","两本都能确定是展览要找的簿子"],"answer":1,"reason":"清单写的是 47；两本封面相似，不足以说明它们是同一本。","hint":"比较清单和两张标签上的数字。","ability":"核对信息","relatedTo":null,"type":"choice"},{"id":"S02-2","prompt":"便条和登记册能支持哪种判断？","options":["簿子一定已经由温室签收。","簿子一定还在修复台，没有人借走。","温室值得去查，但还不能确定簿子已经送到。"],"answer":2,"reason":"便条提出了送往温室，但缺少送出和签收记录；下一处可以查温室，不应把便条当成送达证明。","hint":"便条说了什么？登记册又缺了什么？","ability":"区分线索与结论","relatedTo":null,"type":"choice"},{"id":"S02-3","prompt":"为了判断编号 47 的簿子后来去了哪里，哪项新证据最有帮助？","options":["查编号 47 的借出时间和温室签收记录。","再数一数封面画了几颗星。","只问两本簿子的封面颜色。"],"answer":0,"reason":"与同一编号相关的交接记录能帮助追踪去向；封面细节不能证明交接。","hint":"需要找能追踪“同一本”的记录。","ability":"选择证据","relatedTo":"S02-2","type":"choice"}],"extra":{"id":"S02-X","prompt":"如果温室有一本也画着星星的簿子，但编号被遮住，能确定就是编号 47 吗？","options":["能，画星星的簿子只有这一本。","不能，需要再核对编号或其他可靠记录。","不能，因为温室里不可能有簿子。"],"answer":1,"reason":"前面已经看到，编号不同的簿子也可能有相似的封面；遮住编号时需要补充识别信息。","hint":"想起登记照片上两本相似的簿子。","ability":"迁移与信息不足","relatedTo":"S02-1","type":"choice"},"panels":["修复台的登记册里有两张照片：照片上的簿子都画了星星，封面几乎一样。","管理员说：“别光看封面，看编号。”","天乐带来的展览清单写着：观察簿编号 47。两张照片里的标签分别是 47 和 74。","编号 47 的登记卡夹着便条：“请送到温室，借给记录小组。”","登记册没有写送出时间，也没有签收记录。","小禾已经朝门口跑去。天乐叫住她：“先问清楚，便条能告诉我们多少。”"]},{"day":3,"title":"温室里的两盆苗","story":["温室的记录小组说，他们把一本旧簿子装进蓝袋，交给了运输机器人；小禾还不能确定是不是编号 47 的观察簿。小组请他们去轨道打印台查看运输单。桌上还留着两张小苗记录卡。","两盆苗使用同种种子、同样的盆和土，每次浇水也一样；甲盆放在亮处，乙盆放在较暗处。一段时间后，甲从 4 厘米长到 7 厘米，乙从 5 厘米长到 7 厘米。","“它们现在一样高，所以长得一样多。”团团说。小禾指着起始数字：“等一下，还要看这里。”"],"questions":[{"id":"S03-1","prompt":"哪盆在这段时间里长得更多？","options":["乙盆多长了 1 厘米。","两盆长得一样多。","甲盆多长了 1 厘米。"],"answer":2,"reason":"甲长了 7－4＝3 厘米，乙长了 7－5＝2 厘米。","hint":"分别用现在的高度减去开始的高度。","ability":"比较变化量","relatedTo":null,"type":"choice"},{"id":"S03-2","prompt":"如果想比较光照的影响，这次记录里哪个条件有意不同？","options":["两盆放置位置的光照。","两盆浇水量。","两盆使用的种子种类。"],"answer":0,"reason":"记录说明种子、盆、土和浇水相同，光照不同。","hint":"对照记录里“相同”和“不同”的条件。","ability":"识别变量","relatedTo":null,"type":"choice"},{"id":"S03-3","prompt":"仅凭这两盆苗的一次记录，能得出什么结论？","options":["所有植物在亮处一定长得更快。","这次甲盆长得更多，但还不能断言所有植物都如此。","因为最后一样高，所以光照没有任何影响。"],"answer":1,"reason":"一次观察可以描述这次结果，但不足以推广到所有植物。","hint":"把“这一次”与“所有情况”分开。","ability":"证据边界","relatedTo":"S03-1","type":"choice"}],"extra":{"id":"S03-X","prompt":"下次怎样补充观察，更有助于检查这个发现？","options":["只测量最后的高度，把开始高度省略。","换成不同种子和不同浇水量后，只比较最后高度。","用更多同类小苗重复比较，并继续记录起始与结束高度。"],"answer":2,"reason":"增加重复观察并保留起止数据，有助于比较结果是否稳定。","hint":"想想需要重复什么、记录什么。","ability":"设计验证","relatedTo":"S03-2","type":"choice"},"panels":["温室的记录小组说，他们把一本旧簿子装进蓝袋，交给了运输机器人；","小禾还不能确定是不是编号 47 的观察簿。小组请他们去轨道打印台查看运输单。","桌上还留着两张小苗记录卡。","两盆苗使用同种种子、同样的盆和土，每次浇水也一样；甲盆放在亮处，","乙盆放在较暗处。一段时间后，甲从 4 厘米长到 7 厘米，","乙从 5 厘米长到 7 厘米。","“它们现在一样高，所以长得一样多。”团团说。小禾指着起始数字：“等一下，还要看这里。”"]},{"day":4,"title":"机器人要走几步","story":["轨道入口的屏幕显示，机器人曾把蓝袋送往仓库。轨道从第 0 格开始，打印台在第 7 格。","机器人一次只能向前走 2 格或 3 格，不能后退，也不能走出轨道后折返。它想尽快到打印台，请天乐设计路线。打印台里有张尚未取出的仓库通行卡。","团团正要按“3 格”按钮，又犹豫起来：“两次能到吗？”"],"questions":[{"id":"S04-1","prompt":"机器人最少走几次，才能刚好到第 7 格？","options":["3 次","2 次","4 次"],"answer":0,"reason":"两次最多走 6 格；三次可以走 2＋2＋3＝7 格。","hint":"先看两次最多能走多远。","ability":"最少步数","relatedTo":null,"type":"choice"},{"id":"S04-2","prompt":"哪一组动作能让它刚好停在第 7 格？","options":["3 格、3 格、3 格","2 格、2 格、3 格","2 格、2 格、2 格"],"answer":1,"reason":"2＋2＋3＝7，刚好到第 7 格；3＋3＋3＝9，2＋2＋2＝6，都不等于 7。","hint":"把每组走的格数加起来。","ability":"核对方案","relatedTo":"S04-1","type":"choice"},{"id":"S04-3","prompt":"为什么不能只用两次就到第 7 格？","options":["因为每次都必须走 2 格。","因为打印台不在轨道上。","每次最多 3 格，两次最多 6 格。"],"answer":2,"reason":"可选步长中最大的是 3，两次最多 3＋3＝6。","hint":"找到一次能走的最大格数。","ability":"解释边界","relatedTo":"S04-1","type":"choice"}],"extra":{"id":"S04-X","prompt":"如果打印台改在第 8 格，从第 0 格出发最少要走几次？","options":["3 次","2 次","4 次"],"answer":0,"reason":"两次最多 6 格；3＋3＋2＝8，三次能到。","hint":"先判断两次够不够，再试三次。","ability":"条件变化","relatedTo":"S04-1","type":"choice"},"panels":["轨道入口的屏幕显示，机器人曾把蓝袋送往仓库。轨道从第 0 格开始，打印台在第 7 格。","机器人一次只能向前走 2 格或 3 格，不能后退，也不能走出轨道后折返。","它想尽快到打印台，请天乐设计路线。打印台里有张尚未取出的仓库通行卡。","团团正要按“3 格”按钮，又犹豫起来：“两次能到吗？”"]},{"day":5,"title":"仓库里的三张纸条","story":["通行卡打开了仓库门。仓库里有红、蓝、绿三个盒子，只有一个装着干燥柜的钥匙。管理员留下三张纸条，并说明三句话中恰好只有一句是真的。","红盒纸条：“钥匙不在红盒。”蓝盒纸条：“钥匙在绿盒。”绿盒纸条：“钥匙不在绿盒。”","团团伸手想拿蓝盒。小禾说：“先比较后面两张纸条，它们可能同时为假吗？”"],"questions":[{"id":"S05-1","prompt":"钥匙在哪个盒子里？","options":["蓝盒","红盒","绿盒"],"answer":1,"reason":"蓝、绿两张纸条互相矛盾，恰有一句真；因此红盒纸条是假话，钥匙在红盒。","hint":"先比较蓝盒和绿盒两句话。","ability":"多条件推理","relatedTo":null,"type":"choice"},{"id":"S05-2","prompt":"为什么蓝盒和绿盒的纸条恰有一句是真的？","options":["因为它们都贴在盒子上。","因为三只盒子颜色不同。","一句说在绿盒，一句说不在绿盒，两句正好相反。"],"answer":2,"reason":"“在绿盒”和“不在绿盒”是相反的陈述；对于同一把钥匙，一真一假。","hint":"把两句话中关于绿盒的部分放在一起。","ability":"解释矛盾","relatedTo":"S05-1","type":"choice"},{"id":"S05-3","prompt":"既然蓝、绿纸条中已有一句真，红盒纸条应当怎样？","options":["是假话，因此钥匙在红盒。","是真话，因此钥匙不在红盒。","真假无法判断，不能使用管理员的说明。"],"answer":0,"reason":"总共恰有一句真，蓝绿之间已占去这一句，所以红盒所说“不在红盒”为假。","hint":"再用上“总共只有一句真”。","ability":"组合证据","relatedTo":"S05-1","type":"choice"}],"extra":{"id":"S05-X","prompt":"如果其他内容不变，改成“三句话中恰好两句是真的”，钥匙可能在哪？","options":["只可能在红盒","可能在蓝盒或绿盒","三个盒子都可能"],"answer":1,"reason":"分别假设钥匙在红、蓝、绿盒，真话数是 1、2、2，因此可能在蓝盒或绿盒。","hint":"分别假设钥匙在每个盒子里，再数一数有几句真话。","ability":"改变条件","relatedTo":"S05-1","type":"choice"},"panels":["通行卡打开了仓库门。仓库里有红、蓝、绿三个盒子，只有一个装着干燥柜的钥匙。","管理员留下三张纸条，并说明三句话中恰好只有一句是真的。","红盒纸条：“钥匙不在红盒。”蓝盒纸条：“钥匙在绿盒。”绿盒纸条：“钥匙不在绿盒。”","团团伸手想拿蓝盒。小禾说：“先比较后面两张纸条，它们可能同时为假吗？”"]},{"day":6,"title":"升降机的第一趟","story":["钥匙打开干燥柜，柜里有三只纸袋：A 袋是手套，重 2 千克；蓝色的 B 袋装着编号 47 的观察簿，重 3 千克；C 袋是展板，重 4 千克。","升降机每趟最多装两只袋子，总重不能超过 6 千克。观察簿必须第一趟上楼。管理员还叮嘱：拿到手套之前，不要打开装观察簿的袋子。","“我想把展板和观察簿一起带上去。”天乐说。团团看了看限重牌。"],"questions":[{"id":"S06-1","prompt":"如果第一趟要装两只袋子，哪种搭配符合条件？","options":["B 袋和 C 袋","A 袋和 C 袋","A 袋和 B 袋"],"answer":2,"reason":"第一趟必须有 B。A＋B 为 5 千克，符合限重；B＋C 为 7 千克，超重。","hint":"先找必须带的袋子，再算总重量。","ability":"综合限制","relatedTo":null,"type":"choice"},{"id":"S06-2","prompt":"为什么不能按天乐的想法第一趟带 B 和 C？","options":["两袋总重 7 千克，超过 6 千克。","两袋加起来只有 5 千克。","规定第一趟不能运观察簿。"],"answer":0,"reason":"B 和 C 重 3＋4＝7 千克，超过每趟 6 千克的上限。","hint":"把 B、C 两袋的重量相加。","ability":"解释条件","relatedTo":"S06-1","type":"choice"},{"id":"S06-3","prompt":"拿到手套之前，应该怎样处理观察簿的袋子？","options":["立刻打开，否则不能上楼。","先保持封好，拿到手套后再打开。","只要两只袋子一起运，就可以不管这条叮嘱。"],"answer":1,"reason":"管理员的叮嘱限制的是打开时间；运输与打开是两件事。","hint":"区分“搬运”和“打开”。","ability":"理解规则","relatedTo":null,"type":"choice"}],"extra":{"id":"S06-X","prompt":"如果限重改为 4 千克，仍要求第一趟运观察簿，下面哪种方式可行？","options":["第一趟运 A 袋和 B 袋。","第一趟运 B 袋和 C 袋。","第一趟只运 B 袋。"],"answer":2,"reason":"B 袋 3 千克可以单独运；A＋B 为 5、B＋C 为 7，均超过 4 千克。","hint":"“最多两只”允许只运一只。","ability":"条件变化","relatedTo":"S06-1","type":"choice"},"panels":["钥匙打开干燥柜，柜里有三只纸袋：A 袋是手套，重 2 千克；","蓝色的 B 袋装着编号 47 的观察簿，重 3 千克；C 袋是展板，重 4 千克。","升降机每趟最多装两只袋子，总重不能超过 6 千克。观察簿必须第一趟上楼。","管理员还叮嘱：拿到手套之前，不要打开装观察簿的袋子。","“我想把展板和观察簿一起带上去。”天乐说。团团看了看限重牌。"]},{"day":7,"title":"展览开门以前","story":["观察簿终于回到展厅。天乐戴上手套，翻开记录页：第一晚看到 3 颗，第二晚看到 5 颗，第三晚看到 1 颗；每晚都观察了 20 分钟。记录还写着第三晚有云。","小禾准备展签：“第三晚有云，看来只要有云就一定看得少。”天乐把笔递给她：“我们把看到的写清楚，再说哪些还不能确定。”","展厅的门外，第一批参观者已经到了。团团把找到观察簿的路线画成一张地图，贴在展柜旁。"],"questions":[{"id":"S07-1","prompt":"这三次同样长的观察中，哪一次看到的数量最多？","options":["第二晚","第一晚","第三晚"],"answer":0,"reason":"第一晚 3 颗、第二晚 5 颗、第三晚 1 颗；第二晚的 5 颗最多。","hint":"对照三晚的记录数字。","ability":"读取并比较记录","relatedTo":null,"type":"choice"},{"id":"S07-2","prompt":"哪句展签既符合记录，也没有把一次观察说成普遍规律？","options":["只要有云，看到的星星就一定比没云时少。","这三次中第二晚看到的最多；是否与云有关还需继续观察。","三晚都看到了同样多的星星。"],"answer":1,"reason":"记录可以比较三次数量，但没有足够证据证明所有有云的夜晚都怎样。","hint":"哪些是记录到的事实，哪些需要更多证据？","ability":"事实与推断","relatedTo":"S07-1","type":"choice"},{"id":"S07-3","prompt":"如果想继续研究云量是否影响观测，哪种记录更有帮助？","options":["只记有云的夜晚，不记看到的数量。","只把第二晚的结果重复写三遍。","多记录几个夜晚的云量、观察时长和看到的数量。"],"answer":2,"reason":"增加不同夜晚的记录，并保留可能影响比较的条件，才能进一步分析。","hint":"除了星星数量，还要记录什么条件？","ability":"设计后续观察","relatedTo":"S07-2","type":"choice"}],"extra":{"id":"S07-X","prompt":"第四晚同样观察了 20 分钟，看到 4 颗。四晚一共记录了多少颗？","options":["13 颗","12 颗","14 颗"],"answer":0,"reason":"3＋5＋1＋4＝13；这是四次记录的合计，不表示四晚看见的是不同的星星。","hint":"把四晚的记录数量相加。","ability":"汇总与解释","relatedTo":"S07-1","type":"choice"},"panels":["观察簿终于回到展厅。天乐戴上手套，翻开记录页：第一晚看到 3 颗，","第二晚看到 5 颗，第三晚看到 1 颗；每晚都观察了 20 分钟。记录还写着第三晚有云。","小禾准备展签：“第三晚有云，看来只要有云就一定看得少。”","天乐把笔递给她：“我们把看到的写清楚，再说哪些还不能确定。”","展厅的门外，第一批参观者已经到了。团团把找到观察簿的路线画成一张地图，贴在展柜旁。"]},{"day":8,"title":"为观星夜选地方","story":["展览结束后，天乐想邀请邻居一起看夜空。他、小禾和团团在地图上圈出操场、屋顶和小山坡。大家约定晚上 8 点开始观察，8 点 20 分结束。","从集合点出发，走到操场要 20 分钟，屋顶要 10 分钟，小山坡要 15 分钟。操场和小山坡视野开阔；操场的灯晚上 8 点半才亮，屋顶有一半天空被遮住。","大家计划不早于 7 点 40 分出发，步行不超过 15 分钟，还希望视野开阔。下过雨后，去山坡之前要请大人确认路面不滑。团团拿起笔：“先按条件找，再确认安全。”"],"activity":"地点比较板：显示出发时间、步行时间、视野与安全确认；允许试换条件，不直接揭示答案。","questions":[{"id":"S08-1","prompt":"如果大人确认山坡路面安全，哪个地方符合大家现在的计划？","options":["操场","屋顶","小山坡"],"answer":2,"reason":"操场步行 20 分钟，超过现定上限；屋顶有遮挡；安全的小山坡 15 分钟可到、视野开阔。","hint":"先比较步行上限，再看视野。","ability":"综合条件","relatedTo":null,"type":"choice"},{"id":"S08-2","prompt":"出发前，哪条新消息最能帮助决定能不能去山坡？","options":["大人刚检查过，雨后的坡道不滑。","白天有人看见屋顶上的鸟。","操场的灯晚上 8 点半才亮。"],"answer":0,"reason":"材料要求雨后先由大人确认坡道不滑，因此最新的路面检查直接关系到能否出发。","hint":"找一找故事里写明的出发前条件。","ability":"选择证据","relatedTo":"S08-1","type":"choice"},{"id":"S08-3","prompt":"把去山坡的安排按先后排好。","options":["到山坡观察夜空","请大人确认坡道安全","从集合点出发"],"answer":[1,2,0],"reason":"先确认安全，再出发，到达后才能观察。","hint":"先想一想哪一步必须在出发前完成。","ability":"计划顺序","relatedTo":null,"type":"order"}],"extra":{"id":"S08-X","prompt":"如果只把步行上限改成 20 分钟，其他条件不变，又确认山坡安全，哪些地方符合计划？","options":["只有屋顶","操场和小山坡","三个地方都符合"],"answer":1,"reason":"操场和小山坡分别走 20、15 分钟；观察在 8 点 20 分结束，早于操场开灯；屋顶仍有遮挡。","hint":"重新检查操场的步行时间、观察结束时间和开灯时间。","ability":"条件变化","relatedTo":"S08-1","type":"choice"},"reflection":"如果你还可以增加一条选地点的条件，会选什么？为什么？","panels":["展览结束后，天乐想邀请邻居一起看夜空。他、小禾和团团在地图上圈出操场、屋顶和小山坡。","大家约定晚上 8 点开始观察，8 点 20 分结束。","从集合点出发，走到操场要 20 分钟，屋顶要 10 分钟，","小山坡要 15 分钟。操场和小山坡视野开阔；操场的灯晚上 8 点半才亮，屋顶有一半天空被遮住。","大家计划不早于 7 点 40 分出发，步行不超过 15 分钟，","还希望视野开阔。下过雨后，去山坡之前要请大人确认路面不滑。","团团拿起笔：“先按条件找，再确认安全。”"]},{"day":9,"title":"云多的时候一定看得少吗","story":["地点还没最后定，小禾找来三次观察卡。每次都从同一个位置、用同一种方法数天空中能看见的星星。","甲卡：观察 20 分钟，云量记为 2，看到 4 颗。乙卡：观察 20 分钟，云量记为 7，看到 2 颗。丙卡：观察 10 分钟，云量记为 2，看到 2 颗。","团团指着甲、乙两张卡：“云越多，看见的星星就一定越少。”天乐想了想：“这两张卡有个条件相同，但我们还需要更多记录。”"],"activity":"观察卡对照：选择两张卡，并并排查看时长、云量和数量；不自动补出未记录的天气。","questions":[{"id":"S09-1","prompt":"想先比较云量不同的两次记录，哪一组的观察时长相同？","options":["甲和乙","甲和丙","乙和丙"],"answer":0,"reason":"甲、乙都观察了 20 分钟，云量分别记为 2 和 7。","hint":"先找观察时长相同、云量不同的两张。","ability":"比较条件","relatedTo":null,"type":"choice"},{"id":"S09-2","prompt":"哪些说法既符合记录，又没有把三次观察当成普遍规律？","options":["这三次证明云多时永远看不到星星。","甲比乙看到的多，但云量是不是原因还要继续观察。","丙看到 2 颗，说明观察时间不影响计数。"],"answer":1,"reason":"甲记录 4 颗、乙记录 2 颗；这些记录不足以排除其他原因，也不能证明所有夜晚都一样。","hint":"把卡片上的事实和原因猜测分开。","ability":"事实与推断","relatedTo":"S09-1","type":"choice"},{"id":"S09-3","prompt":"下一次记录什么，最有助于继续研究？","options":["只写“看得多”或“看得少”","只记录看到的数量，其他都省略","记录多个夜晚的云量、观察时长、地点和数量"],"answer":2,"reason":"更多夜晚及观察条件可以帮助比较；结果是否支持猜想仍要再分析。","hint":"想一想除了数量，还要记下哪些可能影响比较的条件。","ability":"设计观察","relatedTo":null,"type":"choice"}],"extra":{"id":"S09-X","prompt":"如果有一张丁卡：同一地点、观察 20 分钟、云量记为 2、看到 3 颗，它说明什么？","options":["云量为 2 时每次一定看到 4 颗。","相同云量下记录到的数量也可能不同。","乙卡一定抄错了。"],"answer":1,"reason":"甲、丁的云量和时长相同，记录数量却是 4 和 3；仅凭这些记录不能判断乙卡是否抄错。","hint":"对照甲卡和丁卡，注意两张卡相同和不同的地方。","ability":"反例与不确定性","relatedTo":"S09-2","type":"choice"},"reflection":"你觉得还可能有哪些条件影响看到的数量？","panels":["地点还没最后定，小禾找来三次观察卡。每次都从同一个位置、用同一种方法数天空中能看见的星星。","甲卡：观察 20 分钟，云量记为 2，看到 4 颗。乙卡：观察 20 分钟，","云量记为 7，看到 2 颗。丙卡：观察 10 分钟，云量记为 2，看到 2 颗。","团团指着甲、乙两张卡：“云越多，看见的星星就一定越少。”","天乐想了想：“这两张卡有个条件相同，但我们还需要更多记录。”"]},{"day":10,"title":"先运哪一袋","story":["观星夜要把物资从集合点送到观察处。A 袋装手电，重 2 千克；B 袋装饮水，重 4 千克；C 袋装记录本，重 3 千克。","运输车每趟最多装两袋，总重不能超过 5 千克。饮水必须第一趟送到。工作人员到达后再打开记录本袋。","团团把 B 袋搬到车边，又想把手电一起放上车。天乐指着限重牌：“我们先算一算，再安排第二趟。”"],"activity":"装车板：点选袋子，显示数量和总重；超重时保留用户选择并标明超出多少。","questions":[{"id":"S10-1","prompt":"按现在的限制，第一趟怎样装车可行？","options":["B 袋和 A 袋","B 袋和 C 袋","只运 B 袋"],"answer":2,"reason":"B 与 A 合重 6 千克、B 与 C 合重 7 千克，都超过 5；B 单独重 4 千克。","hint":"先放入必须第一趟运的 B，再检查还能不能加一袋。","ability":"约束规划","relatedTo":null,"type":"choice"},{"id":"S10-2","prompt":"如果第二趟要把 A、C 两袋都运走，是否符合限重？","options":["符合，总重正好 5 千克。","不符合，两袋总重 6 千克。","不符合，每趟只能运一袋。"],"answer":0,"reason":"A、C 合重 2＋3＝5 千克，且两袋没有超过每趟两袋的上限。","hint":"同时检查袋数和重量。","ability":"核对方案","relatedTo":"S10-1","type":"choice"},{"id":"S10-3","prompt":"记录本袋送到后，哪种处理符合工作人员的要求？","options":["送到就立刻打开，不用等工作人员。","等工作人员到达后再打开。","只要手电也到了，就能提前打开。"],"answer":1,"reason":"要求限制的是打开时间：工作人员到达后才打开。","hint":"区分“送到”和“打开”。","ability":"理解规则","relatedTo":null,"type":"choice"}],"extra":{"id":"S10-X","prompt":"如果只把每趟限重提高到 6 千克，第一趟仍要运 B，哪种两袋搭配可行？","options":["B 和 C","A 和 C","A 和 B"],"answer":2,"reason":"A＋B＝6 千克，符合新限重；B＋C＝7 千克；A＋C 没有包含必须第一趟运的 B。","hint":"既要包含 B，也要不超过新限重。","ability":"条件变化","relatedTo":"S10-1","type":"choice"},"reflection":"如果你负责安排运输，还想知道什么？","panels":["观星夜要把物资从集合点送到观察处。A 袋装手电，重 2 千克；","B 袋装饮水，重 4 千克；C 袋装记录本，重 3 千克。","运输车每趟最多装两袋，总重不能超过 5 千克。饮水必须第一趟送到。","工作人员到达后再打开记录本袋。","团团把 B 袋搬到车边，又想把手电一起放上车。天乐指着限重牌：“我们先算一算，再安排第二趟。”"]},{"day":11,"title":"观星夜能准时开始吗","story":["场地确定后，大家排练开场。两套方案都从晚上 7 点整开始，而且每一步都紧接着进行：先布置，再检查，再向客人介绍，最后观察。","甲方案依次用 10、5、10、20 分钟；乙方案依次用 5、10、15、20 分钟。负责人要求整个安排最晚在 7 点 45 分结束。","团团在钟面上贴了两条时间线：“先把每一步走完，再看哪条没有超过结束时间。”"],"activity":"时间线拼板：拖动或点选阶段，按顺序显示起止时间；允许撤回和重新排列。","questions":[{"id":"S11-1","prompt":"哪套方案按原安排能在截止时间前或恰好结束？","options":["只有甲方案","只有乙方案","两套方案都可以"],"answer":0,"reason":"甲共 10＋5＋10＋20＝45 分钟，7:45 结束；乙共 50 分钟，7:50 才结束。","hint":"分别求两套方案的总时长。","ability":"比较方案","relatedTo":null,"type":"choice"},{"id":"S11-2","prompt":"按甲方案，观察从什么时候开始？","options":["晚上 7 点 15 分","晚上 7 点 25 分","晚上 7 点 45 分"],"answer":1,"reason":"观察前先用 10＋5＋10＝25 分钟，因此从 7:25 开始。","hint":"只把观察之前的三个阶段相加。","ability":"时间推算","relatedTo":"S11-1","type":"choice"},{"id":"S11-3","prompt":"甲方案如果临时多耽误 5 分钟、起点和其他时长都不变，会怎样？","options":["仍在 7:45 结束","7:40 就能结束","7:50 结束，会超过截止时间"],"answer":2,"reason":"甲原来恰好在 7:45 结束，多耽误 5 分钟就到 7:50。","hint":"甲方案原来留了多少空余时间？","ability":"判断余量","relatedTo":"S11-1","type":"choice"}],"extra":{"id":"S11-X","prompt":"如果截止时间改为 7 点 50 分，起点和两个方案都不变，哪些方案可以按时结束？","options":["只有甲","只有乙","甲和乙都可以"],"answer":2,"reason":"甲在 7:45 结束，乙在 7:50 结束；“最晚在 7:50”包括恰好 7:50。","hint":"比较每套方案的结束时刻与新的截止时刻。","ability":"条件变化","relatedTo":"S11-1","type":"choice"},"reflection":"如果不能改截止时间，你会怎么处理临时耽误？哪些信息还不够？","panels":["场地确定后，大家排练开场。两套方案都从晚上 7 点整开始，","而且每一步都紧接着进行：先布置，再检查，再向客人介绍，最后观察。","甲方案依次用 10、5、10、20 分钟；乙方案依次用 5、10、15、20 分钟。","负责人要求整个安排最晚在 7 点 45 分结束。","团团在钟面上贴了两条时间线：“先把每一步走完，再看哪条没有超过结束时间。”"]},{"day":12,"title":"雨后的路线图","story":["到观察处有几条小路。地图上写着：集合点 S 可以到 A 或 B；A 可以到 C 或 D；B 只能到 C；C、D 都可以到观察处 T。","路线只能沿图上写出的连接走，不走回头路。出发前，工作人员发现 C 点积水，暂时不能经过 C；A、B、D 和 T 都可以走。","团团想从 S 经过 B 再到 D。小禾把地图转过来：“别只看点的位置，先找有没有连着的路。”"],"activity":"路线板：点相连节点形成路径，允许撤回；积水可切换为已排除，且缺失连线不可走。","questions":[{"id":"S12-1","prompt":"C 点不能经过时，哪条路线符合地图？","options":["S → B → D → T","S → A → D → T","S → B → C → T"],"answer":1,"reason":"S 连 A，A 连 D，D 连 T；地图没有 B 到 D 的连接，也不能经过积水的 C。","hint":"从 S 开始，逐段检查每条连接。","ability":"路径规划","relatedTo":null,"type":"choice"},{"id":"S12-2","prompt":"如果 C 点的积水处理好了，所有列出的连接都能走，不走回头路，一共有几条从 S 到 T 的路线？","options":["2 条","3 条","4 条"],"answer":1,"reason":"可以走 S-A-C-T、S-A-D-T 和 S-B-C-T，共 3 条。","hint":"先按第一步走到 A 还是 B 分类，再列出后面的路。","ability":"分类枚举","relatedTo":"S12-1","type":"choice"},{"id":"S12-3","prompt":"如果 C、D 两点都不能经过，按这张地图还能到 T 吗？","options":["能，只要先走到 B。","能，从 A 直接到 T。","不能；到 T 的已列连接都要经过 C 或 D。"],"answer":2,"reason":"地图上到 T 的连接来自 C 和 D；两点都不能经过时，列出的路线都走不通。","hint":"看一看到 T 的最后一段有哪些。","ability":"关键条件","relatedTo":null,"type":"choice"}],"extra":{"id":"S12-X","prompt":"如果 C 可以通行，但从 A 到 C 的那段路关闭，其他连接都可走，有几条不走回头路的路线？","options":["1 条","2 条","3 条"],"answer":1,"reason":"剩下 S-A-D-T 和 S-B-C-T 两条；S-A-C-T 因 A-C 关闭而不可走。","hint":"从原来的三条路线中划掉用到 A-C 的路线。","ability":"条件变化","relatedTo":"S12-2","type":"choice"},"reflection":"你会怎样向没看过地图的人说明为什么 B 不能直接到 D？","panels":["到观察处有几条小路。地图上写着：集合点 S 可以到 A 或 B；","A 可以到 C 或 D；B 只能到 C；C、D 都可以到观察处 T。","路线只能沿图上写出的连接走，不走回头路。出发前，工作人员发现 C 点积水，","暂时不能经过 C；A、B、D 和 T 都可以走。","团团想从 S 经过 B 再到 D。小禾把地图转过来：“别只看点的位置，先找有没有连着的路。”"]},{"day":13,"title":"开始前的安全卡","story":["观星夜开始前，工作人员给团团一张安全卡：只要出现闪电，就暂停户外观察；没有闪电时，还要等大人确认地面不滑，才能开始。","下雨本身没有写成自动取消条件，但雨后仍要检查地面。检查时，小禾发现对讲机里只传来“暂时没有闪电”，还没收到路面检查结果。","团团把手放在开始按钮上。天乐说：“我们先看看卡上还有哪一项没有确认。”"],"activity":"安全卡：分别选择闪电状态与地面确认状态，展示符合的规则；未知状态不自动当作安全。","questions":[{"id":"S13-1","prompt":"现在还没有收到路面检查结果，团团应当怎么做？","options":["立即开始，因为没有闪电。","先等大人确认地面不滑。","直接取消整个观星夜，因为下过雨。"],"answer":1,"reason":"没有闪电只满足一项条件；开始前还需要大人确认地面不滑。","hint":"安全卡写了哪两项开始前条件？","ability":"识别未确认条件","relatedTo":null,"type":"choice"},{"id":"S13-2","prompt":"大人确认地面不滑后，如果又出现闪电，应该怎样？","options":["暂停户外观察。","照常开始，因为地面已经确认。","只要下雨就能继续。"],"answer":0,"reason":"安全卡明确写着出现闪电就暂停；地面确认不能取消这一条。","hint":"找到安全卡里优先处理闪电的规则。","ability":"规则优先级","relatedTo":"S13-1","type":"choice"},{"id":"S13-3","prompt":"收到哪条消息后，可以按安全卡开始？","options":["“地面还没检查，暂时没有闪电。”","“地面不滑，但远处刚出现闪电。”","“没有闪电，大人刚确认地面不滑。”"],"answer":2,"reason":"“没有闪电，大人刚确认地面不滑”同时满足两项条件。","hint":"逐条检查两项条件。","ability":"综合条件","relatedTo":null,"type":"choice"}],"extra":{"id":"S13-X","prompt":"雨停了、没有闪电，但大人说“路面正在检查，还不能确定”，这时呢？","options":["可以开始，因为雨已经停了。","继续等待路面确认。","可以开始，因为大人已经出发去检查。"],"answer":1,"reason":"雨停和开始检查都不等于已经确认不滑；还要等待结果。","hint":"把“正在检查”和“已经确认”分开。","ability":"未知状态","relatedTo":"S13-1","type":"choice"},"reflection":"你能用自己的话把这张安全卡讲给第一次来的客人听吗？","panels":["观星夜开始前，工作人员给团团一张安全卡：只要出现闪电，就暂停户外观察；","没有闪电时，还要等大人确认地面不滑，才能开始。","下雨本身没有写成自动取消条件，但雨后仍要检查地面。检查时，","小禾发现对讲机里只传来“暂时没有闪电”，还没收到路面检查结果。","团团把手放在开始按钮上。天乐说：“我们先看看卡上还有哪一项没有确认。”"]},{"day":14,"title":"给观星夜留一条回家的路","story":["晚上 8 点，大家安全到达观察处。回集合点的路通常要走 10 分钟，负责人要求大家最晚在 8 点 40 分回到集合点。","天乐准备了三个观察方案：观察 15 分钟、25 分钟或 35 分钟，观察一结束就立刻返程。大家想在按时返回的前提下，尽量多观察一会儿。","刚要开始，对讲机又传来消息：有一段路可能需要绕行。天乐把计划卡留在桌上，决定先按现有路况做安排，再看看变化会怎样影响计划。"],"activity":"计划卡：选择观察时长和返程时间，显示预计回到集合点的时刻；允许改变条件后重算。","questions":[{"id":"S14-1","prompt":"按通常的 10 分钟返程，既按时返回又观察最久，应选哪个方案？","options":["观察 15 分钟","观察 25 分钟","观察 35 分钟"],"answer":1,"reason":"25＋10＝35 分钟，8:35 返回；35＋10＝45 分钟，要到 8:45，超过截止时间。","hint":"把每个观察时长与返程时间相加，再比较截止时刻。","ability":"优化方案","relatedTo":null,"type":"choice"},{"id":"S14-2","prompt":"如果返程确定要 20 分钟，截止时间仍为 8:40，哪个方案能按时返回且观察最久？","options":["观察 15 分钟","观察 25 分钟","观察 35 分钟"],"answer":0,"reason":"15＋20＝35 分钟，可以在 8:35 返回；25＋20＝45 分钟，超过 8:40。","hint":"把返程时间换成 20 分钟后重新比较。","ability":"调整方案","relatedTo":"S14-1","type":"choice"},{"id":"S14-3","prompt":"这次实际看到 3 颗，比团团猜的 6 颗少。哪句记录更准确？","options":["今天记录到 3 颗；数量比预想少，原因还需要更多信息。","今天只看到 3 颗，证明观察地点永远不适合观星。","既然猜的是 6 颗，就把记录改成 6 颗。"],"answer":0,"reason":"记录应保留实际看到的 3 颗；仅凭一次结果不能确定原因或所有夜晚的情况。","hint":"区分猜测、实际记录和尚未确定的原因。","ability":"记录与证据","relatedTo":null,"type":"choice"}],"extra":{"id":"S14-X","prompt":"如果返程只要 5 分钟，截止时间仍是 8:40，哪个方案能按时返回且观察最久？","options":["观察 15 分钟","观察 25 分钟","观察 35 分钟"],"answer":2,"reason":"35＋5＝40 分钟，从 8:00 开始计算，恰好在 8:40 回到集合点。","hint":"试着把最长的方案和新的返程时间相加。","ability":"条件变化","relatedTo":"S14-1","type":"choice"},"reflection":"如果观察前又有新的天气消息，你会先检查什么，再决定是否调整计划？","panels":["晚上 8 点，大家安全到达观察处。回集合点的路通常要走 10 分钟，","负责人要求大家最晚在 8 点 40 分回到集合点。","天乐准备了三个观察方案：观察 15 分钟、25 分钟或 35 分钟，","观察一结束就立刻返程。大家想在按时返回的前提下，尽量多观察一会儿。","刚要开始，对讲机又传来消息：有一段路可能需要绕行。天乐把计划卡留在桌上，","决定先按现有路况做安排，再看看变化会怎样影响计划。"]},{"day":15,"title":"断续的呼叫","story":["观星夜结束后，社区广播站邀请天乐和小禾帮忙准备一期节目。傍晚 6:04，录音里传来一句断断续续的话：“我们到……之前……”；后半句听不清。","6:06，值班员转动天线后，广播站音箱里的声音变清楚了。6:12，又收到一段声音：“……七点……见。”记录上没有写两段是否属于同一句话。","团团想立刻播报：“大家七点前一定能到！”小禾拦住他：“先把听见的、看见的和猜出来的分开。”"],"activity":"可撤回的事件时间线；把记录拖到时间位置，并将猜测卡与观察卡分开。","questions":[{"id":"S15-1","prompt":"把已经记录的三件事按时间排好。","options":["6:12 收到第二段声音","6:04 收到第一段声音","6:06 转动天线"],"answer":[1,2,0],"reason":"记录的时间依次为 6:04、6:06、6:12。","hint":"先找每张卡上的时间。","ability":"事件顺序","relatedTo":null,"type":"order"},{"id":"S15-2","prompt":"下面哪句只描述了记录，没有把原因或缺失的内容补进去？","options":["声音一定是因为天线才断续。","两段话合起来一定是“七点前到”。","转动天线后，音箱里的声音变清楚了。"],"answer":2,"reason":"记录提到调整天线和随后声音变清楚，但没有排除其他变化，也没有记录完整句子。","hint":"观察能直接听到或看到什么；再看哪里加入了“一定”。","ability":"事实与推断","relatedTo":"S15-1","type":"choice"},{"id":"S15-3","prompt":"要弄清原话到底是什么，先查哪项最直接？","options":["联系发送者，核对两段原话和发送时间。","检查广播站桌子的颜色。","只根据“七点”和“见”补全句子。"],"answer":0,"reason":"发送者可以核对缺失内容以及两段之间的关系；其他选项不能补足原始信息。","hint":"哪项能核对缺失的句子？","ability":"选择证据","relatedTo":null,"type":"choice"}],"extra":{"id":"S15-X","prompt":"后来发现，6:03 广播站的音箱里也有杂音。现在可以确定什么？","options":["6:06 转天线肯定是杂音消失的唯一原因。","至少在 6:03，音箱里已经出现杂音。","发送者肯定要求大家七点前到。"],"answer":1,"reason":"新记录只说明杂音在 6:03 已出现；它没有单独证明原因，也没有补全原话。","hint":"只用新增记录能直接支持的部分。","ability":"限制结论","relatedTo":"S15-2","type":"choice"},"reflection":"如果暂时联系不到发送者，你会怎样向听众说明现有信息？","panels":["观星夜结束后，社区广播站邀请天乐和小禾帮忙准备一期节目。","傍晚 6:04，录音里传来一句断断续续的话：“我们到……之前……”；后半句听不清。","6:06，值班员转动天线后，广播站音箱里的声音变清楚了。","6:12，又收到一段声音：“……七点……见。”记录上没有写两段是否属于同一句话。","团团想立刻播报：“大家七点前一定能到！”小禾拦住他：“先把听见的、看见的和猜出来的分开。”"]},{"day":16,"title":"两张不同的录音单","story":["广播站找到两份针对 6:04 同一句话的文字记录。这句话只说了一个集合地点：甲单写“在东门集合”，乙单写“在北门集合”。两张单都标了 6:04，记录人不同。","保留下来的片段只能听清“……门集合”。甲、乙记录人都说自己是边听边记的；现场没有其他能确认 6:04 原话的人。","团团指着两张单：“总有一个人在骗人！”天乐摇头：“记录互相冲突，可能听错，也可能记错。先找能核对原话的材料。”"],"activity":"并排记录板：标注相同的时间、互相冲突的地点与缺失的原声。","questions":[{"id":"S16-1","prompt":"两张记录最明确的冲突是什么？","options":["记录的通话时间不同。","记录的集合地点不同。","一张说有人到场，另一张说没有人到场。"],"answer":1,"reason":"两张都标 6:04；一张写东门，一张写北门。","hint":"先找相同项，再找不同项。","ability":"比较记录","relatedTo":null,"type":"choice"},{"id":"S16-2","prompt":"仅凭这两张记录，哪种判断更稳妥？","options":["甲记录人一定在说谎。","乙记录人一定在说谎。","至少有一份文字记录不准确；原因还要核对。"],"answer":2,"reason":"这句话只说了一个地点，“东门”和“北门”不可能都记录准确；冲突本身不能证明谁故意说谎。","hint":"两种转写能同时准确吗？能否据此判断动机？","ability":"冲突与原因","relatedTo":"S16-1","type":"choice"},{"id":"S16-3","prompt":"哪项新材料最有助于核对 6:04 的原话？","options":["保留完整声音的 6:04 原始录音。","第二天的天气预报。","某人对广播站装饰的记忆。"],"answer":0,"reason":"如果原始录音中的门名清晰，就能直接核对两份文字记录；仍需确认录音确为该次通话。","hint":"找与同一次通话直接相关的材料。","ability":"证据选择","relatedTo":null,"type":"choice"}],"extra":{"id":"S16-X","prompt":"如果甲改为记录 6:04 的东门，乙改为记录 6:09 的北门，又有 6:09 的改地点通知，怎样理解？","options":["两份记录一定相互矛盾。","两份记录可能分别记下了改动前和改动后的地点。","可以确定两处已经同时有人集合。"],"answer":1,"reason":"时间不同且存在改地点通知，两份记录可能反映不同阶段；它们本身不证明有人到场。","hint":"比较记录时间和通知时间。","ability":"信息更新","relatedTo":"S16-1","type":"choice"},"reflection":"你会给两张未核实的记录加什么标记，让下一位编辑不把它们当成定论？","panels":["广播站找到两份针对 6:04 同一句话的文字记录。这句话只说了一个集合地点：甲单写“在东门集合”，","乙单写“在北门集合”。两张单都标了 6:04，记录人不同。","保留下来的片段只能听清“……门集合”。甲、乙记录人都说自己是边听边记的；","现场没有其他能确认 6:04 原话的人。","团团指着两张单：“总有一个人在骗人！”天乐摇头：“记录互相冲突，可能听错，也可能记错。先找能核对原话的材料。”"]},{"day":17,"title":"跳过的电报码","story":["发送者告诉广播站：备用信号每组有两次闪光，然后停一下。短闪记 1，长闪记 2，把一组两次的数相加。","约定的结果是：2 表示北门，3 表示西门，4 表示暂缓。监测器保存了一组“短闪、长闪、停顿”，但另一段录像只保存了解码结果“西门”。","团团说：“既然都是西门，就能知道录像里先闪了什么。”小禾把两张闪光卡倒过来，发现事情没那么简单。"],"activity":"编码卡：点选两次闪光，显示两次的值和总和；允许调换顺序再比较。","questions":[{"id":"S17-1","prompt":"“短闪、长闪”这一组表示什么？","options":["北门","西门","暂缓"],"answer":1,"reason":"短闪记 1、长闪记 2，总和为 3；约定 3 表示西门。","hint":"把两次闪光对应的数相加。","ability":"按规则解码","relatedTo":null,"type":"choice"},{"id":"S17-2","prompt":"只知道一组解码结果是“西门”，能确定两次闪光的先后吗？","options":["能，一定先短后长。","能，一定先长后短。","不能；短长与长短都能得到 3。"],"answer":2,"reason":"短长是 1＋2，长短是 2＋1，两种先后都得到 3。","hint":"把两种顺序分别代入规则。","ability":"唯一性","relatedTo":"S17-1","type":"choice"},{"id":"S17-3","prompt":"要发出“暂缓”，应使用哪组？","options":["短闪、短闪","短闪、长闪","长闪、长闪"],"answer":2,"reason":"暂缓对应 4；只有两次长闪的和是 2＋2＝4。","hint":"先找到暂缓对应的总和。","ability":"编码与核对","relatedTo":null,"type":"choice"}],"extra":{"id":"S17-X","prompt":"如果录像又显示：这组表示“西门”，并且第一下是长闪，那么第二下是什么？","options":["短闪","长闪","仍不能确定"],"answer":0,"reason":"西门的总和是 3，第一下长闪为 2，所以第二下必须是 1，即短闪。","hint":"从 3 中扣除第一下的值。","ability":"条件补充","relatedTo":"S17-2","type":"choice"},"reflection":"你能想出一条新约定，让“短长”和“长短”表达不同意思吗？说明为什么。","panels":["发送者告诉广播站：备用信号每组有两次闪光，然后停一下。短闪记 1，","长闪记 2，把一组两次的数相加。","约定的结果是：2 表示北门，3 表示西门，4 表示暂缓。","监测器保存了一组“短闪、长闪、停顿”，但另一段录像只保存了解码结果“西门”。","团团说：“既然都是西门，就能知道录像里先闪了什么。”小禾把两张闪光卡倒过来，发现事情没那么简单。"]},{"day":18,"title":"干扰从哪里来","story":["广播站用来检查声音的音箱又出现杂音。问题可能来自远端收音、传输途中，或台内的监听设备；目前还没有足够证据确定是哪一处。","小禾找到一段确认清晰的测试录音。她让同一段录音同时进入耳机和音箱，保持同一音源与音量设置。耳机听起来清楚，音箱仍有杂音。","团团想马上宣布远端话筒坏了。天乐说：“先看这次比较改变了什么。我们可以继续检查音箱这一支路。”"],"activity":"检查路径板：将同一测试音源接到两条输出，标记耳机和音箱的实际结果。","questions":[{"id":"S18-1","prompt":"这次比较里，两边刻意使用了什么相同条件？","options":["同一段测试录音和音源设置。","同一个播放设备。","远端发送者说话时的天气。"],"answer":0,"reason":"两路使用同一段录音及相同音源设置，但分别经过耳机和音箱输出。","hint":"看故事里明确保持相同的部分。","ability":"控制条件","relatedTo":null,"type":"choice"},{"id":"S18-2","prompt":"耳机清楚、音箱有杂音，下一步最有依据的方向是什么？","options":["优先检查音箱及其连接处。","断定远端话筒一定损坏。","断定广播内容已经完整无误。"],"answer":0,"reason":"同一测试音源在耳机输出清楚而音箱输出有杂音，值得先检查音箱和连接处；这仍不是对所有故障的最终结论。","hint":"两路结果不同，先检查哪一段？","ability":"依据选择行动","relatedTo":"S18-1","type":"choice"},{"id":"S18-3","prompt":"如果换用另一只音箱后声音清楚了，下面哪句最准确？","options":["原音箱或原来的连接处值得进一步检查。","远端所有设备永远不会再出问题。","所有曾经丢失的字都能自动恢复。"],"answer":0,"reason":"更换后的结果为原音箱和连接处提供了线索，但不能排除其他时段或其他设备的问题。","hint":"区分本次比较的线索和没有测试过的范围。","ability":"证据范围","relatedTo":"S18-2","type":"choice"}],"extra":{"id":"S18-X","prompt":"如果同一测试音源经耳机和音箱都出现杂音，能立即确定只有音箱损坏吗？","options":["能，因为音箱也有杂音。","不能，还要检查两路共用的音源或连接。","能，因为耳机听到了杂音。"],"answer":1,"reason":"两路都出现杂音时，只有音箱损坏无法解释耳机的结果；应继续核查共用部分和其他可能。","hint":"先看哪项事实不能由“只有音箱损坏”解释。","ability":"排查与反例","relatedTo":"S18-2","type":"choice"},"reflection":"为了不漏掉间歇性问题，你还想怎样重复或记录这次检查？","panels":["广播站用来检查声音的音箱又出现杂音。问题可能来自远端收音、传输途中，","或台内的监听设备；目前还没有足够证据确定是哪一处。","小禾找到一段确认清晰的测试录音。她让同一段录音同时进入耳机和音箱，","保持同一音源与音量设置。耳机听起来清楚，音箱仍有杂音。","团团想马上宣布远端话筒坏了。天乐说：“先看这次比较改变了什么。我们可以继续检查音箱这一支路。”"]},{"day":19,"title":"备用电池分配","story":["广播站要把发射器和监听器同时运行一个完整时段。三块电池的可用容量分别为 9、6、5 单位；每个设备只能接一块电池，一块电池不能同时供给两个设备。","这个时段里，发射器至少需要 6 单位，监听器至少需要 5 单位。还要留一块未使用的电池做应急备用，备用容量不能少于 5 单位。","团团把最大的电池拿给发射器。小禾说：“不一定错，我们把所有条件都检查一下，再看看还能不能留更充足的备用。”"],"activity":"电池装配板：给两个设备分配电池，显示设备需求与未使用电池容量；允许撤回。","questions":[{"id":"S19-1","prompt":"方案甲：9 给发射器、6 给监听器、备用 5。方案乙：6 给发射器、5 给监听器、备用 9。哪些符合现有条件？","options":["只有甲","甲和乙都符合","只有乙"],"answer":1,"reason":"甲的 9≥6、6≥5、备用 5≥5；乙的 6≥6、5≥5、备用 9≥5。","hint":"每个方案都检查两个设备和备用电池。","ability":"多条件比较","relatedTo":null,"type":"choice"},{"id":"S19-2","prompt":"如果要在符合现有条件时留下容量最大的备用电池，应怎样分配？","options":["6 给发射器，5 给监听器，备用 9。","9 给发射器，5 给监听器，备用 6。","5 给发射器，6 给监听器，备用 9。"],"answer":0,"reason":"6 和 5 分别刚好满足两个设备，留下最大的 9；5 不能满足发射器至少 6 的要求。","hint":"先保证两个设备都能运行，再比较备用容量。","ability":"优化与约束","relatedTo":"S19-1","type":"choice"},{"id":"S19-3","prompt":"为什么不能把 5 给发射器、9 给监听器、备用 6？","options":["发射器至少需要 6 单位，5 不够。","监听器不能使用容量大于 5 的电池。","备用电池必须恰好是 5 单位。"],"answer":0,"reason":"规则只说监听器至少需要 5、备用不少于 5；发射器的 6 单位下限没有满足。","hint":"逐一对照“至少”和“不少于”。","ability":"解释不可行","relatedTo":null,"type":"choice"}],"extra":{"id":"S19-X","prompt":"如果取消备用要求，新增一盏至少需要 3 单位的灯；三个设备仍各接一块电池，能同时运行吗？","options":["能：6 给发射器、5 给监听器、9 给灯。","不能：灯只能接容量恰好为 3 的电池。","不能：三块电池无法连接三个设备。"],"answer":0,"reason":"按题目新条件，6、5、9 分别满足 6、5、3 的最低需求，且一块电池只接一个设备。","hint":"检查新增的灯和原有两个设备。","ability":"条件变化","relatedTo":"S19-2","type":"choice"},"reflection":"如果备用电池也要尽可能轻，你还需要哪些信息才能比较？","panels":["广播站要把发射器和监听器同时运行一个完整时段。三块电池的可用容量分别为 9、6、5 单位；","每个设备只能接一块电池，一块电池不能同时供给两个设备。","这个时段里，发射器至少需要 6 单位，监听器至少需要 5 单位。","还要留一块未使用的电池做应急备用，备用容量不能少于 5 单位。","团团把最大的电池拿给发射器。小禾说：“不一定错，我们把所有条件都检查一下，再看看还能不能留更充足的备用。”"]},{"day":20,"title":"信号为什么变弱","story":["广播站想研究开窗是否影响接收。第一次用同一段十字测试录音，在同一位置、同一设备上试听：窗开时正确辨认 8 个字，窗关时正确辨认 9 个字。","两次测试不是同时进行的，当时周围还有其他可能变化的声音。团团指着 8 和 9：“只要关窗，永远都会多听清一个字。”","天乐提议再做多组比较：尽量保持位置、设备和录音相同，交替改变开窗状态，并把每次结果和周围情况记下来。"],"activity":"实验条件板：选择需要保持的条件、改变的条件和记录项；不自动推定结果。","questions":[{"id":"S20-1","prompt":"第一次的记录直接说明什么？","options":["那两次分别辨认出 8 个字和 9 个字。","关窗在所有情况下都能多辨认一个字。","开窗一定是唯一影响听清字数的原因。"],"answer":0,"reason":"记录描述的是两次测试结果；测试时间及周围情况可能不同，不能直接推广到所有情况。","hint":"把这两次发生了什么，与普遍规律分开。","ability":"观察与结论","relatedTo":null,"type":"choice"},{"id":"S20-2","prompt":"哪种后续做法更有助于比较开窗状态？","options":["同位置、同设备、同录音，交替开关窗并多次记录。","开窗时换一个房间，关窗时换一台设备。","只记录最满意的一次，丢掉其他结果。"],"answer":0,"reason":"尽量保持其他条件并重复记录，有助于比较；仍应记录可能影响结果的其他情况。","hint":"尽量只改变想研究的条件。","ability":"设计比较","relatedTo":"S20-1","type":"choice"},{"id":"S20-3","prompt":"如果重复测试里某次出现了与预期相反的结果，应先怎么做？","options":["保留该次记录，核对条件与记录方法。","直接删除，因为它不符合猜想。","只凭这一条就宣布原先所有记录无效。"],"answer":0,"reason":"先保留并核对异常结果，才能判断是否有记录问题或其他值得研究的因素。","hint":"想一想删除记录会丢失什么。","ability":"处理异常","relatedTo":null,"type":"choice"}],"extra":{"id":"S20-X","prompt":"若三组开窗结果为 8、7、9，三组关窗结果也为 8、7、9，下面哪句合理？","options":["这几次记录没有显示两种状态的差别；还不能说明所有环境都一样。","已经证明开窗永远不会产生任何影响。","可以确定前一天的 8 和 9 都记录错了。"],"answer":0,"reason":"所给两组数字相同，不能据此证明所有环境的结果；也没有证据说明之前的记录有误。","hint":"先只比较给出的六个数，再检查结论范围。","ability":"比较与范围","relatedTo":"S20-2","type":"choice"},"reflection":"除了开窗状态，你还会记录什么可能影响听清字数的条件？","panels":["广播站想研究开窗是否影响接收。第一次用同一段十字测试录音，","在同一位置、同一设备上试听：窗开时正确辨认 8 个字，窗关时正确辨认 9 个字。","两次测试不是同时进行的，当时周围还有其他可能变化的声音。","团团指着 8 和 9：“只要关窗，永远都会多听清一个字。”","天乐提议再做多组比较：尽量保持位置、设备和录音相同，交替改变开窗状态，","并把每次结果和周围情况记下来。"]},{"day":21,"title":"恢复后的播报","story":["广播站找回了能核实的原始记录：6:04 的通话提过东门；6:09，活动负责人发来一条更改通知，地点改为北门。两条记录都保留了时间。","6:12 的片段仍只听清“七点……见”，没有说清日期。负责人暂时没有回复确认集合时间，编辑不能把猜测写成已经确认的安排。","节目即将开始。小禾要写一句简短播报：既让听众知道地点有过更新，也把尚未确认的时间和下一步核查说清楚。"],"activity":"播报编辑板：把事实、待确认的问题和下一步核查放入三个区域；自由表达不自动判分。","questions":[{"id":"S21-1","prompt":"哪句播报符合现有证据？","options":["负责人 6:09 通知改到北门；集合时间还在核实。","所有人今天七点已经到齐。","两条记录写了不同地点，所以一定有人故意撒谎。"],"answer":0,"reason":"6:09 的改地点通知有明确记录；“七点”片段的日期和完整含义仍未确认。","hint":"按最新地点通知写事实，再标出不确定的时间。","ability":"事实与不确定性","relatedTo":null,"type":"choice"},{"id":"S21-2","prompt":"播报前若只能做一项核对，哪项最直接帮助确认集合时间？","options":["联系活动负责人，核对日期、时间和当前地点。","查询广播站成立年份。","根据“七点”自行补上日期。"],"answer":0,"reason":"负责人可以核对日期、时间和地点是否仍然有效；其余选项不能确认安排。","hint":"找能确认当前安排的人。","ability":"下一步核查","relatedTo":"S21-1","type":"choice"},{"id":"S21-3","prompt":"把播报前的步骤按合理顺序排好。","options":["把已核实事项和待确认事项分别写清楚","核对记录的时间和来源","播出，并在收到新消息后及时更正"],"answer":[1,0,2],"reason":"先核对记录，再区分事实和待确认内容，最后播出，并在收到新消息后及时更正。","hint":"先确认，再写，最后播出。","ability":"编辑流程","relatedTo":null,"type":"order"}],"extra":{"id":"S21-X","prompt":"如果负责人后来明确回复“今天 19:00 在北门”，接着又在 18:18 通知改为 19:10，怎样更新记录？","options":["保留先前记录，标明 18:18 的最新时间为 19:10。","删除所有先前记录，假装从未变更。","继续播报 19:00，不注明后来的通知。"],"answer":0,"reason":"18:18 的通知更新了时间；保留旧记录与变更时间，才能查清信息先后怎样变化。","hint":"比较通知先后，并保留可追溯的变化。","ability":"版本更新","relatedTo":"S21-1","type":"choice"},"reflection":"请写一条播报，分别说明已知事实、待确认事项和下一步；可以不做这道自由表达。","panels":["广播站找回了能核实的原始记录：6:04 的通话提过东门；","6:09，活动负责人发来一条更改通知，地点改为北门。两条记录都保留了时间。","6:12 的片段仍只听清“七点……见”，没有说清日期。负责人暂时没有回复确认集合时间，","编辑不能把猜测写成已经确认的安排。","节目即将开始。小禾要写一句简短播报：既让听众知道地点有过更新，","也把尚未确认的时间和下一步核查说清楚。"]}],"pinyinMap":{"一":"yī","丁":"dīng","七":"qī","三":"sān","上":"shàng","下":"xià","不":"bù","与":"yǔ","且":"qiě","丙":"bǐng","东":"dōng","丢":"diū","两":"liǎng","个":"gè","中":"zhōng","临":"lín","为":"wèi","举":"jǔ","久":"jiǔ","么":"me","义":"yì","之":"zhī","乎":"hū","乐":"lè","乙":"yǐ","九":"jiǔ","也":"yě","习":"xí","书":"shū","了":"le","事":"shì","二":"èr","于":"yú","云":"yún","互":"hù","五":"wǔ","些":"xiē","交":"jiāo","产":"chǎn","亮":"liàng","人":"rén","什":"shén","仅":"jǐn","今":"jīn","介":"jiè","仍":"réng","从":"cóng","仓":"cāng","他":"tā","代":"dài","以":"yǐ","们":"men","件":"jiàn","任":"rèn","份 function v3Handle(a,b,i){

 else if(a==='v3Schedule')state.schedule=i;
 else if(a==='v3Route'){
  const graph={S:['A','B'],A:['C','D'],B:['C'],C:['T'],D:['T'],T:[]},from=state.path.at(-1),to=b.dataset.node;
  const nodeBlocked=(state.question===0&&to==='C')||(state.question===2&&(to==='C'||to==='D'));

  if(!graph[from]?.includes(to)||nodeBlocked||edgeBlocked)state.message='这一步不能走，试试其他连接。';

 return true;
}
