因此 4 点封盒时也没有观察簿。","hint":"利用新增的“中间没有打开”这一条件。","ability":"条件变化","relatedTo":"S01-1","type":"choice"},"panels":["周末，天乐和小禾要办一场“看见夜空”的小展览。最重要的观察簿却不见了，空展柜里只剩一张收据。","收据背后写着：下午 4 点，登记员送来一个绿盒。4 点 10 分，","小禾打开绿盒，里面只有放大镜；她随后把盒子合上。到 4 点 20 分天乐搬走盒子时，盒子一直没有再打开。","“一定是搬盒子的时候弄丢的！”团团说。天乐摇摇头：“先别急着认定。”","收据底下还有一行小字：请到图书馆修复台查询。"]},{"day":2,"title":"两本画着星星的簿子","story":["修复台的登记册里有两张照片：照片上的簿子都画了星星，封面几乎一样。管理员说：“别光看封面，看编号。”","天乐带来的展览清单写着：观察簿编号 47。两张照片里的标签分别是 47 和 74。编号 47 的登记卡夹着便条：“请送到温室，借给记录小组。”登记册没有写送出时间，也没有签收记录。","小禾已经朝门口跑去。天乐叫住她：“先问清楚，便条能告诉我们多少。”"],"questions":[{"id":"S02-1","prompt":"哪张照片上簿子的编号与展览清单相同？","options":["编号 74 的簿子","编号 47 的簿子","两本都能确定是展览要找的簿子"],"answer":1,"reason":"清单写的是 47；两本封面相似，不足以说明它们是同一本。","hint":"比较清单和两张标签上的数字。","ability":"核对信息","relatedTo":null,"type":"choice"},{"id":"S02-2","prompt":"便条和登记册能支持哪种判断？","options":["簿子一定已经由温室签收。","簿子一定还在修复台，没有人借走。","温室值得去查，但还不能确定簿子已经送到。"],"answer":2,"reason":"便条提出了送往温室，但缺少送出和签收记录；下一处可以查温室，不应把便条当成送达证明。","hint":"便条说了什么？登记册又缺了什么？","ability":"区分线索与结论","relatedTo":null,"type":"choice"},{"id":"S02-3","prompt":"为了判断编号 47 的簿子后来去了哪里，哪项新证据最有帮助？","options":["查编号 47 的借出时间和温室签收记录。","再数一数封面画了几颗星。","只问两本簿子的封面颜色。"],"answer":0,"reason":"与同一编号相关的交接记录能帮助追踪去向；封面细节不能证明交接。","hint":"需要找能追踪“同一本”的记录。","ability":"选择证据","relatedTo":"S02-2","type":"choice"}],"extra":{"id":"S02-X","prompt":"如果温室有一本也画着星星的簿子，但编号被遮住，能确定就是编号 47 吗？","options":["能，画星星的簿子只有这一本。","不能，需要再核对编号或其他可靠记录。","不能，因为温室里不可能有簿子。"],"answer":1,"reason":"前面已经看到，编号不同的簿子也可能有相似的封面；遮住编号时需要补充识别信息。","hint":"想起登记照片上两本相似的簿子。","ability":"迁移与信息不足","relatedTo":"S02-1","type":"choice"},"panels":["修复台的登记册里有两张照片：照片上的簿子都画了星星，封面几乎一样。","管理员说：“别光看封面，看编号。”","天乐带来的展览清单写着：观察簿编号 47。两张照片里的标签分别是 47 和 74。","编号 47 的登记卡夹着便条：“请送到温室，借给记录小组。”","登记册没有写送出时间，也没有签收记录。","小禾已经朝门口跑去。天乐叫住她：“先问清楚，便条能告诉我们多少。”"]},{"day":3,"title":"温室里的两盆苗","story":["温室的记录小组说，他们把一本旧簿子装进蓝袋，交给了运输机器人；小禾还不能确定是不是编号 47 的观察簿。小组请他们去轨道打印台查看运输单。桌上还留着两张小苗记录卡。","两盆苗使用同种种子、同样的盆和土，每次浇水也一样；甲盆放在亮处，乙盆放在较暗处。一段时间后，甲从 4 厘米长到 7 厘米，乙从 5 厘米长到 7 厘米。","“它们现在一样高，所以长得一样多。”团团说。小禾指着起始数字：“等一下，还要看这里。”"],"questions":[{"id":"S03-1","prompt":"哪盆在这段时间里长得更多？","options":["乙盆多长了 1 厘米。","两盆长得一样多。","甲盆多长了 1 厘米。"],"answer":2,"reason":"甲长了 7－4＝3 厘米，乙长了 7－5＝2 厘米。","hint":"分别用现在的高度减去开始的高度。","ability":"比较变化量","relatedTo":null,"type":"choice"},{"id":"S03-2","prompt":"如果想比较光照的影响，这次记录里哪个条件有意不同？","options":["两盆放置位置的光照。","两盆浇水量。","两盆使用的种子种类。"],"answer":0,"reason":"记录说明种子、盆、土和浇水相同，光照不同。","hint":"对照记录里“相同”和“不同”的条件。","ability":"识别变量","relatedTo":null,"type":"choice"},{"id":"S03-3","prompt":"仅凭这两盆苗的一次记录，能得出什么结论？","options":["所有植物在亮处一定长得更快。","这次甲盆长得更多，但还不能断言所有植物都如此。","因为最后一样高，所以光照没有任何影响。"],"answer":1,"reason":"一次观察可以描述这次结果，但不足以推广到所有植物。","hint":"把“这一次”与“所有情况”分开。","ability":"证据边界","relatedTo":"S03-1","type":"choice"}],"extra":{"id":"S03-X","prompt":"下次怎样补充观察，更有助于检查这个发现？","options":["只测量最后的高度，把开始高度省略。","换成不同种子和不同浇水量后，只比较最后高度。","用更多同类小苗重复比较，并继续记录起始与结束高度。"],"answer":2,"reason":"增加重复观察并保留起止数据，有助于比较结果是否稳定。","hint":"想想需要重复什么、记录什么。","ability":"设计验证","relatedTo":"S03-2","type":"choice"},"panels":["温室的记录小组说，他们把一本旧簿子装进蓝袋，交给了运输机器人；","小禾还不能确定是不是编号 47 的观察簿。小组请他们去轨道打印台查看运输单。","桌上还留着两张小苗记录卡。","两盆苗使用同种种子、同样的盆和土，每次浇水也一样；甲盆放在亮处，","乙盆放在较暗处。一段时间后，甲从 4 厘米长到 7 厘米，","乙从 5 厘米长到 7 厘米。","“它们现在一样高，所以长得一样多。”团团说。小禾指着起始数字：“等一下，还要看这里。”"]},{"day":4,"title":"机器人要走几步","story":["轨道入口的屏幕显示，机器人曾把蓝袋送往仓库。轨道从第 0 格开始，打印台在第 7 格。","机器人一次只能向前走 2 格或 3 格，不能后退，也不能走出轨道后折返。它想尽快到打印台，请天乐设计路线。打印台里有张尚未取出的仓库通行卡。","团团正要按“3 格”按钮，又犹豫起来：“两次能到吗？”"],"questions":[{"id":"S04-1","prompt":"机器人最少走几次，才能刚好到第 7 格？","options":["3 次","2 次","4 次"],"answer":0,"reason":"两次最多走 6 格；三次可以走 2＋2＋3＝7 格。","hint":"先看两次最多能走多远。","ability":"最少步数","relatedTo":null,"type":"choice"},{"id":"S04-2","prompt":"哪一组动作能让它刚好停在第 7 格？","options":["3 格、3 格、3 格","2 格、2 格、3 格","2 格、2 格、2 格"],"answer":1,"reason":"2＋2＋3＝7，刚好到第 7 格；3＋3＋3＝9，2＋2＋2＝6，都不等于 7。","hint":"把每组走的格数加起来。","ability":"核对方案","relatedTo":"S04-1","type":"choice"},{"id":"S04-3","prompt":"为什么不能只用两次就到第 7 格？","options":["因为每次都必须走 2 格。","因为打印台不在轨道上。","每次最多 3 格，两次最多 6 格。"],"answer":2,"reason":"可选步长中最大的是 3，两次最多 3＋3＝6。","hint":"找到一次能走的最大格数。","ability":"解释边界","relatedTo":"S04-1","type":"choice"}],"extra":{"id":"S04-X","prompt":"如果打印台改在第 8 格，从第 0 格出发最少要走几次？","options":["3 次","2 次","4 次"],"answer":0,"reason":"两次最多 6 格；3＋3＋2＝8，三次能到。","hint":"先判断两次够不够，再试三次。","ability":"条件变化","relatedTo":"S04-1","type":"choice"},"panels":["轨道入口的屏幕显示，机器人曾把蓝袋送往仓库。轨道从第 0 格开始，打印台在第 7 格。","机器人一次只能向前走 2 格或 3 格，不能后退，也不能走出轨道后折返。","它想尽快到打印台，请天乐设计路线。打印台里有张尚未取出的仓库通行卡。","团团正要按“3 格”按钮，又犹豫起来：“两次能到吗？”"]},{"day":5,"title":"仓库里的三张纸条","story":["通行卡打开了仓库门。仓库里有红、蓝、绿三个盒子，只有一个装着干燥柜的钥匙。管理员留下三张纸条，并说明三句话中恰好只有一句是真的。","红盒纸条：“钥匙不在红盒。”蓝盒纸条：“钥匙在绿盒。”绿盒纸条：“钥匙不在绿盒。”","团团伸手想拿蓝盒。小禾说：“先比较后面两张纸条，它们可能同时为假吗？”"],"questions":[{"id":"S05-1","prompt":"钥匙在哪个盒子里？","options":["蓝盒","红盒","绿盒"],"answer":1,"reason":"蓝、绿两张纸条互相矛盾，恰有一句真；因此红盒纸条是假话，钥匙在红盒。","hint":"先比较蓝盒和绿盒两句话。","ability":"多条件推理","relatedTo":null,"type":"choice"},{"id":"S05-2","prompt":"为什么蓝盒和绿盒的纸条恰有一句是真的？","options":["因为它们都贴在盒子上。","因为三只盒子颜色不同。","一句说在绿盒，一句说不在绿盒，两句正好相反。"],"answer":2,"reason":"“在绿盒”和“不在绿盒”是相反的陈述；对于同一把钥匙，一真一假。","hint":"把两句话中关于绿盒的部分放在一起。","ability":"解释矛盾","relatedTo":"S05-1","type":"choice"},{"id":"S05-3","prompt":"既然蓝、绿纸条中已有一句真，红盒纸条应当怎样？","options":["是假话，因此钥匙在红盒。","是真话，因此钥匙不在红盒。","真假无法判断，不能使用管理员的说明。"],"answer":0,"reason":"总共恰有一句真，蓝绿之间已占去这一句，所以红盒所说“不在红盒”为假。","hint":"再用上“总共只有一句真”。","ability":"组合证据","relatedTo":"S05-1","type":"choice"}],"extra":{"id":"S05-X","prompt":"如果其他内容不变，改成“三句话中恰好两句是真的”，钥匙可能在哪？","options":["只可能在红盒","可能在蓝盒或绿盒","三个盒子都可能"],"answer":1,"reason":"分别假设钥匙在红、蓝、绿盒，真话数是 1、2、2，因此可能在蓝盒或绿盒。","hint":"分别假设钥匙在每个盒子里，再数一数有几句真话。","ability":"改变条件","relatedTo":"S05-1","type":"choice"},"panels":["通行卡打开了仓库门。仓库里有红、蓝、绿三个盒子，只有一个装着干燥柜的钥匙。","管理员留下三张纸条，并说明三句话中恰好只有一句是真的。","红盒纸条：“钥匙不在红盒。”蓝盒纸条：“钥匙在绿盒。”绿盒纸条：“钥匙不在绿盒。”","团团伸手想拿蓝盒。小禾说：“先比较后面两张纸条，它们可能同时为假吗？”"]},{"day":6,"title":"升降机的第一趟","story":["钥匙打开干燥柜，柜里有三只纸袋：A 袋是手套，重 2 千克；蓝色的 B 袋装着编号 47 的观察簿，重 3 千克；C 袋是展板，重 4 千克。","升降机每趟最多装两只袋子，总重不能超过 6 千克。观察簿必须第一趟上楼。管理员还叮嘱：拿到手套之前，不要打开装观察簿的袋子。","“我想把展板和观察簿一起带上去。”天乐说。团团看了看限重牌。"],"questions":[{"id":"S06-1","prompt":"如果第一趟要装两只袋子，哪种搭配符合条件？","options":["B 袋和 C 袋","A 袋和 C 袋","A 袋和 B 袋"],"answer":2,"reason":"第一趟必须有 B。A＋B 为 5 千克，符合限重；B＋C 为 7 千克，超重。","hint":"先找必须带的袋子，再算总重量。","ability":"综合限制","relatedTo":null,"type":"choice"},{"id":"S06-2","prompt":"为什么不能按天乐的想法第一趟带 B 和 C？","options":["两袋总重 7 千克，超过 6 千克。","两袋加起来只有 5 千克。","规定第一趟不能运观察簿。"],"answer":0,"reason":"B 和 C 重 3＋4＝7 千克，超过每趟 6 千克的上限。","hint":"把 B、C 两袋的重量相加。","ability":"解释条件","relatedTo":"S06-1","type":"choice"},{"id":"S06-3","prompt":"拿到手套之前，应该怎样处理观察簿的袋子？","options":["立刻打开，否则不能上楼。","先保持封好，拿到手套后再打开。","只要两只袋子一起运，就可以不管这条叮嘱。"],"answer":1,"reason":"管理员的叮嘱限制的是打开时间；运输与打开是两件事。","hint":"区分“搬运”和“打开”。","ability":"理解规则","relatedTo":null,"type":"choice"}],"extra":{"id":"S06-X","prompt":"如果限重改为 4 千克，仍要求第一趟运观察簿，下面哪种方式可行？","options":["第一趟运 A 袋和 B 袋。","第一趟运 B 袋和 C 袋。","第一趟只运 B 袋。"],"answer":2,"reason":"B 袋 3 千克可以单独运；A＋B 为 5、B＋C 为 7，均超过 4 千克。","hint":"“最多两只”允许只运一只。","ability":"条件变化","relatedTo":"S06-1","type":"choice"},"panels":["钥匙打开干燥柜，柜里有三只纸袋：A 袋是手套，重 2 千克；","蓝色的 B 袋装着编号 47 的观察簿，重 3 千克；C 袋是展板，重 4 千克。","升降机每趟最多装两只袋子，总重不能超过 6 千克。观察簿必须第一趟上楼。","管理员还叮嘱：拿到手套之前，不要打开装观察簿的袋子。","“我想把展板和观察簿一起带上去。”天乐说。团团看了看限重牌。"]},{"day":7,"title":"展览开门以前","story":["观察簿终于回到展厅。天乐戴上手套，翻开记录页：第一晚看到 3 颗，第二晚看到 5 颗，第三晚看到 1 颗；每晚都观察了 20 分钟。记录还写着第三晚有云。","小禾准备展签：“第三晚有云，看来只要有云就一定看得少。”天乐把笔递给她：“我们把看到的写清楚，再说哪些还不能确定。”","展厅的门外，第一批参观者已经到了。团团把找到观察簿的路线画成一张地图，贴在展柜旁。"],"questions":[{"id":"S07-1","prompt":"这三次同样长的观察中，哪一次看到的数量最多？","options":["第二晚","第一晚","第三晚"],"answer":0,"reason":"第一晚 3 颗、第二晚 5 颗、第三晚 1 颗；第二晚的 5 颗最多。","hint":"对照三晚的记录数字。","ability":"读取并比较记录","relatedTo":null,"type":"choice"},{"id":"S07-2","prompt":"哪句展签既符合记录，也没有把一次观察说成普遍规律？","options":["只要有云，看到的星星就一定比没云时少。","这三次中第二晚看到的最多；是否与云有关还需继续观察。","三晚都看到了同样多的星星。"],"answer":1,"reason":"记录可以比较三次数量，但没有足够证据证明所有有云的夜晚都怎样。","hint":"哪些是记录到的事实，哪些需要更多证据？","ability":"事实与推断","relatedTo":"S07-1","type":"choice"},{"id":"S07-3","prompt":"如果想继续研究云量是否影响观测，哪种记录更有帮助？","options":["只记有云的夜晚，不记看到的数量。","只把第二晚的结果重复写三遍。","多记录几个夜晚的云量、观察时长和看到的数量。"],"answer":2,"reason":"增加不同夜晚的记录，并保留可能影响比较的条件，才能进一步分析。","hint":"除了星星数量，还要记录什么条件？","ability":"设计后续观察","relatedTo":"S07-2","type":"choice"}],"extra":{"id":"S07-X","prompt":"第四晚同样观察了 20 分钟，看到 4 颗。四晚一共记录了多少颗？","options":["13 颗","12 颗","14 颗"],"answer":0,"reason":"3＋5＋1＋4＝13；这是四次记录的合计，不表示四晚看见的是不同的星星。","hint":"把四晚的记录数量相加。","ability":"汇总与解释","relatedTo":"S07-1","type":"choice"},"panels":["观察簿终于回到展厅。天乐戴上手套，翻开记录页：第一晚看到 3 颗，","第二晚看到 5 颗，第三晚看到 1 颗；每晚都观察了 20 分钟。记录还写着第三晚有云。","小禾准备展签：“第三晚有云，看来只要有云就一定看得少。”","天乐把笔递给她：“我们把看到的写清楚，再说哪些还不能确定。”","展厅的门外，第一批参观者已经到了。团团把找到观察簿的路线画成一张地图，贴在展柜旁。"]},{"day":8,"title":"为观星夜选地方","story":["展览结束后，天乐想邀请邻居一起看夜空。他、小禾和团团在地图上圈出操场、屋顶和小山坡。大家约定晚上 8 点开始观察，8 点 20 分结束。","从集合点出发，走到操场要 20 分钟，屋顶要 10 分钟，小山坡要 15 分钟。操场和小山坡视野开阔；操场的灯晚上 8 点半才亮，屋顶有一半天空被遮住。","大家计划不早于 7 点 40 分出发，步行不超过 15 分钟，还希望视野开阔。下过雨后，去山坡之前要请大人确认路面不滑。团团拿起笔：“先按条件找，再确认安全。”"],"activity":"地点比较板：显示出发时间、步行时间、视野与安全确认；允许试换条件，不直接揭示答案。","questions":[{"id":"S08-1","prompt":"如果大人确认山坡路面安全，哪个地方符合大家现在的计划？","options":["操场","屋顶","小山坡"],"answer":2,"reason":"操场步行 20 分钟，超过现定上限；屋顶有遮挡；安全的小山坡 15 分钟可到、视野开阔。","hint":"先比较步行上限，再看视野。","ability":"综合条件","relatedTo":null,"type":"choice"},{"id":"S08-2","prompt":"出发前，哪条新消息最能帮助决定能不能去山坡？","options":["大人刚检查过，雨后的坡道不滑。","白天有人看见屋顶上的鸟。","操场的灯晚上 8 点半才亮。"],"answer":0,"reason":"材料要求雨后先由大人确认坡道不滑，因此最新的路面检查直接关系到能否出发。","hint":"找一找故事里写明的出发前条件。","ability":"选择证据","relatedTo":"S08-1","type":"choice"},{"id":"S08-3","prompt":"把去山坡的安排按先后排好。","options":["到山坡观察夜空","请大人确认坡道安全","从集合点出发"],"answer":[1,2,0],"reason":"先确认安全，再出发，到达后才能观察。","hint":"先想一想哪一步必须在出发前完成。","ability":"计划顺序","relatedTo":null,"type":"order"}],"extra":{"id":"S08-X","prompt":"如果只把步行上限改成 20 分钟，其他条件不变，又确认山坡安全，哪些地方符合计划？","options":["只有屋顶","操场和小山坡","三个地方都符合"],"answer":1,"reason":"操场和小山坡分别走 20、15 分钟；观察在 8 点 20 分结束，早于操场开灯；屋顶仍有遮挡。","hint":"重新检查操场的步行时间、观察结束时间和开灯时间。","ability":"条件变化","relatedTo":"S08-1","type":"choice"},"reflection":"如果你还可以增加一条选地点的条件，会选什么？为什么？","panels":["展览结束后，天乐想邀请邻居一起看夜空。他、小禾和团团在地图上圈出操场、屋顶和小山坡。","大家约定晚上 8 点开始观察，8 点 20 分结束。","从集合点出发，走到操场要 20 分钟，屋顶要 10 分钟，","小山坡要 15 分钟。操场和小山坡视野开阔；操场的灯晚上 8 点半才亮，屋顶有一半天空被遮住。","大家计划不早于 7 点 40 分出发，步行不超过 15 分钟，","还希望视野开阔。下过雨后，去山坡之前要请大人确认路面不滑。","团团拿起笔：“先按条件找，再确认安全。”"]},{"day":9,"title":"云多的时候一定看得少吗","story":["地点还没最后定，小禾找来三次观察卡。每次都从同一个位置、用同一种方法数天空中能看见的星星。","甲卡：观察 20 分钟，云量记为 2，看到 4 颗。乙卡：观察 20 分钟，云量记为 7，看到 2 颗。丙卡：观察 10 分钟，云量记为 2，看到 2 颗。","团团指着甲、乙两张卡：“云越多，看见的星星就一定越少。”天乐想了想：“这两张卡有个条件相同，但我们还需要更多记录。”"],"activity":"观察卡对照：选择两张卡，并并排查看时长、云量和数量；不自动补出未记录的天气。","questions":[{"id":"S09-1","prompt":"想先比较云量不同的两次记录，哪一组的观察时长相同？","options":["甲和乙","甲和丙","乙和丙"],"answer":0,"reason":"甲、乙都观察了 20 分钟，云量分别记为 2 和 7。","hint":"先找观察时长相同、云量不同的两张。","ability":"比较条件","relatedTo":null,"type":"choice"},{"id":"S09-2","prompt":"哪些说法既符合记录，又没有把三次观察当成普遍规律？","options":["这三次证明云多时永远看不到星星。","甲比乙看到的多，但云量是不是原因还要继续观察。","丙看到 2 颗，说明观察时间不影响计数。"],"answer":1,"reason":"甲记录 4 颗、乙记录 2 颗；这些记录不足以排除其他原因，也不能证明所有夜晚都一样。","hint":"把卡片上的事实和原因猜测分开。","ability":"事实与推断","relatedTo":"S09-1","type":"choice"},{"id":"S09-3","prompt":"下一次记录什么，最有助于继续研究？","options":["只写“看得多”或“看得少”","只记录看到的数量，其他都省略","记录多个夜晚的云量、观察时长、地点和数量"],"answer":2,"reason":"更多夜晚及观察条件可以帮助比较；结果是否支持猜想仍要再分析。","hint":"想一想除了数量，还要记下哪些可能影响比较的条件。","ability":"设计观察","relatedTo":null,"type":"choice"}],"extra":{"id":"S09-X","prompt":"如果有一张丁卡：同一地点、观察 20 分钟、云量记为 2、看到 3 颗，它说明什么？","options":["云量为 2 时每次一定看到 4 颗。","相同云量下记录到的数量也可能不同。","乙卡一定抄错了。"],"answer":1,"reason":"甲、丁的云量和时长相同，记录数量却是 4 和 3；仅凭这些记录不能判断乙卡是否抄错。","hint":"对照甲卡和丁卡，注意两张卡相同和不同的地方。","ability":"反例与不确定性","relatedTo":"S09-2","type":"choice"},"reflection":"你觉得还可能有哪些条件影响看到的数量？","panels":["地点还没最后定，小禾找来三次观察卡。每次都从同一个位置、用同一种方法数天空中能看见的星星。","甲卡：观察 20 分钟，云量记为 2，看到 4 颗。乙卡：观察 20 分钟，","云量记为 7，看到 2 颗。丙卡：观察 10 分钟，云量记为 2，看到 2 颗。","团团指着甲、乙两张卡：“云越多，看见的星星就一定越少。”","天乐想了想：“这两张卡有个条件相同，但我们还需要更多记录。”"]},{"day":10,"title":"先运哪一袋","story":["观星夜要把物资从集合点送到观察处。A 袋装手电，重 2 千克；B 袋装饮水，重 4 千克；C 袋装记录本，重 3 千克。","运输车每趟最多装两袋，总重不能超过 5 千克。饮水必须第一趟送到。工作人员到达后再打开记录本袋。","团团把 B 袋搬到车边，又想把手电一起放上车。天乐指着限重牌：“我们先算一算，再安排第二趟。”"],"activity":"装车板：点选袋子，显示数量和总重；超重时保留用户选择并标明超出多少。","questions":[{"id":"S10-1","prompt":"按现在的限制，第一趟怎样装车可行？","options":["B 袋和 A 袋","B 袋和 C 袋","只运 B 袋"],"answer":2,"reason":"B 与 A 合重 6 千克、B 与 C 合重 7 千克，都超过 5；B 单独重 4 千克。","hint":"先放入必须第一趟运的 B，再检查还能不能加一袋。","ability":"约束规划","relatedTo":null,"type":"choice"},{"id":"S10-2","prompt":"如果第二趟要把 A、C 两袋都运走，是否符合限重？","options":["符合，总重正好 5 千克。","不符合，两袋总重 6 千克。","不符合，每趟只能运一袋。"],"answer":0,"reason":"A、C 合重 2＋3＝5 千克，且两袋没有超过每趟两袋的上限。","hint":"同时检查袋数和重量。","ability":"核对方案","relatedTo":"S10-1","type":"choice"},{"id":"S10-3","prompt":"记录本袋送到后，哪种处理符合工作人员的要求？","options":["送到就立刻打开，不用等工作人员。","等工作人员到达后再打开。","只要手电也到了，就能提前打开。"],"answer":1,"reason":"要求限制的是打开时间：工作人员到达后才打开。","hint":"区分“送到”和“打开”。","ability":"理解规则","relatedTo":null,"type":"choice"}],"extra":{"id":"S10-X","prompt":"如果只把每趟限重提高到 6 千克，第一趟仍要运 B，哪种两袋搭配可行？","options":["B 和 C","A 和 C","A 和 B"],"answer":2,"reason":"A＋B＝6 千克，符合新限重；B＋C＝7 千克；A＋C 没有包含必须第一趟运的 B。","hint":"既要包含 B，也要不超过新限重。","ability":"条件变化","relatedTo":"S10-1","type":"choice"},"reflection":"如果你负责安排运输，还想知道什么？","panels":["观星夜要把物资从集合点送到观察处。A 袋装手电，重 2 千克；","B 袋装饮水，重 4 千克；C 袋装记录本，重 3 千克。","运输车每趟最多装两袋，总重不能超过 5 千克。饮水必须第一趟送到。","工作人员到达后再打开记录本袋。","团团把 B 袋搬到车边，又想把手电一起放上车。天乐指着限重牌：“我们先算一算，再安排第二趟。”"]},{"day":11,"title":"观星夜能准时开始吗","story":["场地确定后，大家排练开场。两套方案都从晚上 7 点整开始，而且每一步都紧接着进行：先布置，再检查，再向客人介绍，最后观察。","甲方案依次用 10、5、10、20 分钟；乙方案依次用 5、10、15、20 分钟。负责人要求整个安排最晚在 7 点 45 分结束。","团团在钟面上贴了两条时间线：“先把每一步走完，再看哪条没有超过结束时间。”"],"activity":"时间线拼板：拖动或点选阶段，按顺序显示起止时间；允许撤回和重新排列。","questions":[{"id":"S11-1","prompt":"哪套方案按原安排能在截止时间前或恰好结束？","options":["只有甲方案","只有乙方案","两套方案都可以"],"answer":0,"reason":"甲共 10＋5＋10＋20＝45 分钟，7:45 结束；乙共 50 分钟，7:50 才结束。","hint":"分别求两套方案的总时长。","ability":"比较方案","relatedTo":null,"type":"choice"},{"id":"S11-2","prompt":"按甲方案，观察从什么时候开始？","options":["晚上 7 点 15 分","晚上 7 点 25 分","晚上 7 点 45 分"],"answer":1,"reason":"观察前先用 10＋5＋10＝25 分钟，因此从 7:25 开始。","hint":"只把观察之前的三个阶段相加。","ability":"时间推算","relatedTo":"S11-1","type":"choice"},{"id":"S11-3","prompt":"甲方案如果临时多耽误 5 分钟、起点和其他时长都不变，会怎样？","options":["仍在 7:45 结束","7:40 就能结束","7:50 结束，会超过截止时间"],"answer":2,"reason":"甲原来恰好在 7:45 结束，多耽误 5 分钟就到 7:50。","hint":"甲方案原来留了多少空余时间？","ability":"判断余量","relatedTo":"S11-1","type":"choice"}],"extra":{"id":"S11-X","prompt":"如果截止时间改为 7 点 50 分，起点和两个方案都不变，哪些方案可以按时结束？","options":["只有甲","只有乙","甲和乙都可以"],"answer":2,"reason":"甲在 7:45 结束，乙在 7:50 结束；“最晚在 7:50”包括恰好 7:50。","hint":"比较每套方案的结束时刻与新的截止时刻。","ability":"条件变化","relatedTo":"S11-1","type":"choice"},"reflection":"如果不能改截止时间，你会怎么处理临时耽误？哪些信息还不够？","panels":["场地确定后，大家排练开场。两套方案都从晚上 7 点整开始，","而且每一步都紧接着进行：先布置，再检查，再向客人介绍，最后观察。","甲方案依次用 10、5、10、20 分钟；乙方案依次用 5、10、15、20 分钟。","负责人要求整个安排最晚在 7 点 45 分结束。","团团在钟面上贴了两条时间线：“先把每一步走完，再看哪条没有超过结束时间。”"]},{"day":12,"title":"雨后的路线图","story":["到观察处有几条小路。地图上写着：集合点 S 可以到 A 或 B；A 可以到 C 或 D；B 只能到 C；C、D 都可以到观察处 T。","路线只能沿图上写出的连接走，不走回头路。出发前，工作人员发现 C 点积水，暂时不能经过 C；A、B、D 和 T 都可以走。","团团想从 S 经过 B 再到 D。小禾把地图转过来：“别只看点的位置，先找有没有连着的路。”"],"activity":"路线板：点相连节点形成路径，允许撤回；积水可切换为已排除，且缺失连线不可走。","questions":[{"id":"S12-1","prompt":"C 点不能经过时，哪条路线符合地图？","options":["S → B → D → T","S → A → D → T","S → B → C → T"],"answer":1,"reason":"S 连 A，A 连 D，D 连 T；地图没有 B 到 D 的连接，也不能经过积水的 C。","hint":"从 S 开始，逐段检查每条连接。","ability":"路径规划","relatedTo":null,"type":"choice"},{"id":"S12-2","prompt":"如果 C 点的积水处理好了，所有列出的连接都能走，不走回头路，一共有几条从 S 到 T 的路线？","options":["2 条","3 条","4 条"],"answer":1,"reason":"可以走 S-A-C-T、S-A-D-T 和 S-B-C-T，共 3 条。","hint":"先按第一步走到 A 还是 B 分类，再列出后面的路。","ability":"分类枚举","relatedTo":"S12-1","type":"choice"},{"id":"S12-3","prompt":"如果 C、D 两点都不能经过，按这张地图还能到 T 吗？","options":["能，只要先走到 B。","能，从 A 直接到 T。","不能；到 T 的已列连接都要经过 C 或 D。"],"answer":2,"reason":"地图上到 T 的连接来自 C 和 D；两点都不能经过时，列出的路线都走不通。","hint":"看一看到 T 的最后一段有哪些。","ability":"关键条件","relatedTo":null,"type":"choice"}],"extra":{"id":"S12-X","prompt":"如果 C 可以通行，但从 A 到 C 的那段路关闭，其他连接都可走，有几条不走回头路的路线？","options":["1 条","2 条","3 条"],"answer":1,"reason":"剩下 S-A-D-T 和 S-B-C-T 两条；S-A-C-T 因 A-C 关闭而不可走。","hint":"从原来的三条路线中划掉用到 A-C 的路线。","ability":"条件变化","relatedTo":"S12-2","type":"choice"},"reflection":"你会怎样向没看过地图的人说明为什么 B 不能直接到 D？","panels":["到观察处有几条小路。地图上写着：集合点 S 可以到 A 或 B；","A 可以到 C 或 D；B 只能到 C；C、D 都可以到观察处 T。","路线只能沿图上写出的连接走，不走回头路。出发前，工作人员发现 C 点积水，","暂时不能经过 C；A、B、D 和 T 都可以走。","团团想从 S 经过 B 再到 D。小禾把地图转过来：“别只看点的位置，先找有没有连着的路。”"]},{"day":13,"title":"开始前的安全卡","story":["观星夜开始前，工作人员给团团一张安全卡：只要出现闪电，就暂停户外观察；没有闪电时，还要等大人确认地面不滑，才能开始。","下雨本身没有写成自动取消条件，但雨后仍要检查地面。检查时，小禾发现对讲机里只传来“暂时没有闪电”，还没收到路面检查结果。","团团把手放在开始按钮上。天乐说：“我们先看看卡上还有哪一项没有确认。”"],"activity":"安全卡：分别选择闪电状态与地面确认状态，展示符合的规则；未知状态不自动当作安全。","questions":[{"id":"S13-1","prompt":"现在还没有收到路面检查结果，团团应当怎么做？","options":["立即开始，因为没有闪电。","先等大人确认地面不滑。","直接取消整个观星夜，因为下过雨。"],"answer":1,"reason":"没有闪电只满足一项条件；开始前还需要大人确认地面不滑。","hint":"安全卡写了哪两项开始前条件？","ability":"识别未确认条件","relatedTo":null,"type":"choice"},{"id":"S13-2","prompt":"大人确认地面不滑后，如果又出现闪电，应该怎样？","options":["暂停户外观察。","照常开始，因为地面已经确认。","只要下雨就能继续。"],"answer":0,"reason":"安全卡明确写着出现闪电就暂停；地面确认不能取消这一条。","hint":"找到安全卡里优先处理闪电的规则。","ability":"规则优先级","relatedTo":"S13-1","type":"choice"},{"id":"S13-3","prompt":"收到哪条消息后，可以按安全卡开始？","options":["“地面还没检查，暂时没有闪电。”","“地面不滑，但远处刚出现闪电。”","“没有闪电，大人刚确认地面不滑。”"],"answer":2,"reason":"“没有闪电，大人刚确认地面不滑”同时满足两项条件。","hint":"逐条检查两项条件。","ability":"综合条件","relatedTo":null,"type":"choice"}],"extra":{"id":"S13-X","prompt":"雨停了、没有闪电，但大人说“路面正在检查，还不能确定”，这时呢？","options":["可以开始，因为雨已经停了。","继续等待路面确认。","可以开始，因为大人已经出发去检查。"],"answer":1,"reason":"雨停和开始检查都不等于已经确认不滑；还要等待结果。","hint":"把“正在检查”和“已经确认”分开。","ability":"未知状态","relatedTo":"S13-1","type":"choice"},"reflection":"你能用自己的话把这张安全卡讲给第一次来的客人听吗？","panels":["观星夜开始前，工作人员给团团一张安全卡：只要出现闪电，就暂停户外观察；","没有闪电时，还要等大人确认地面不滑，才能开始。","下雨本身没有写成自动取消条件，但雨后仍要检查地面。检查时，","小禾发现对讲机里只传来“暂时没有闪电”，还没收到路面检查结果。","团团把手放在开始按钮上。天乐说：“我们先看看卡上还有哪一项没有确认。”"]},{"day":14,"title":"给观星夜留一条回家的路","story":["晚上 8 点，大家安全到达观察处。回集合点的路通常要走 10 分钟，负责人要求大家最晚在 8 点 40 分回到集合点。","天乐准备了三个观察方案：观察 15 分钟、25 分钟或 35 分钟，观察一结束就立刻返程。大家想在按时返回的前提下，尽量多观察一会儿。","刚要开始，对讲机又传来消息：有一段路可能需要绕行。天乐把计划卡留在桌上，决定先按现有路况做安排，再看看变化会怎样影响计划。"],"activity":"计划卡：选择观察时长和返程时间，显示预计回到集合点的时刻；允许改变条件后重算。","questions":[{"id":"S14-1","prompt":"按通常的 10 分钟返程，既按时返回又观察最久，应选哪个方案？","options":["观察 15 分钟","观察 25 分钟","观察 35 分钟"],"answer":1,"reason":"25＋10＝35 分钟，8:35 返回；35＋10＝45 分钟，要到 8:45，超过截止时间。","hint":"把每个观察时长与返程时间相加，再比较截止时刻。","ability":"优化方案","relatedTo":null,"type":"choice"},{"id":"S14-2","prompt":"如果返程确定要 20 分钟，截止时间仍为 8:40，哪个方案能按时返回且观察最久？","options":["观察 15 分钟","观察 25 分钟","观察 35 分钟"],"answer":0,"reason":"15＋20＝35 分钟，可以在 8:35 返回；25＋20＝45 分钟，超过 8:40。","hint":"把返程时间换成 20 分钟后重新比较。","ability":"调整方案","relatedTo":"S14-1","type":"choice"},{"id":"S14-3","prompt":"这次实际看到 3 颗，比团团猜的 6 颗少。哪句记录更准确？","options":["今天记录到 3 颗；数量比预想少，原因还需要更多信息。","今天只看到 3 颗，证明观察地点永远不适合观星。","既然猜的是 6 颗，就把记录改成 6 颗。"],"answer":0,"reason":"记录应保留实际看到的 3 颗；仅凭一次结果不能确定原因或所有夜晚的情况。","hint":"区分猜测、实际记录和尚未确定的原因。","ability":"记录与证据","relatedTo":null,"type":"choice"}],"extra":{"id":"S14-X","prompt":"如果返程只要 5 分钟，截止时间仍是 8:40，哪个方案能按时返回且观察最久？","options":["观察 15 分钟","观察 25 分钟","观察 35 分钟"],"answer":2,"reason":"35＋5＝40 分钟，从 8:00 开始计算，恰好在 8:40 回到集合点。","hint":"试着把最长的方案和新的返程时间相加。","ability":"条件变化","relatedTo":"S14-1","type":"choice"},"reflection":"如果观察前又有新的天气消息，你会先检查什么，再决定是否调整计划？","panels":["晚上 8 点，大家安全到达观察处。回集合点的路通常要走 10 分钟，","负责人要求大家最晚在 8 点 40 分回到集合点。","天乐准备了三个观察方案：观察 15 分钟、25 分钟或 35 分钟，","观察一结束就立刻返程。大家想在按时返回的前提下，尽量多观察一会儿。","刚要开始，对讲机又传来消息：有一段路可能需要绕行。天乐把计划卡留在桌上，","决定先按现有路况做安排，再看看变化会怎样影响计划。"]},{"day":15,"title":"断续的呼叫","story":["观星夜结束后，社区广播站邀请天乐和小禾帮忙准备一期节目。傍晚 6:04，录音里传来一句断断续续的话：“我们到……之前……”；后半句听不清。","6:06，值班员调整天线后，广播站音箱里的声音变清楚了。6:12，又收到一段声音：“……七点……见。”记录上没有写两段是否属于同一句话。","团团想立刻播报：“大家七点前一定能到！”小禾拦住他：“先把听见的、看见的和猜出来的分开。”"],"activity":"可撤回的事件时间线；把记录拖到时间位置，并将猜测卡与观察卡分开。","questions":[{"id":"S15-1","prompt":"把已经记录的三件事按时间排好。","options":["6:12 收到第二段声音","6:04 收到第一段声音","6:06 调整天线"],"answer":[1,2,0],"reason":"记录的时间依次为 6:04、6:06、6:12。","hint":"先找每张卡上的时间。","ability":"事件顺序","relatedTo":null,"type":"order"},{"id":"S15-2","prompt":"下面哪句只描述了记录，没有把原因或缺失的内容补进去？","options":["声音一定是因为天线才断续。","两段话合起来一定是“七点前到”。","调整天线后，音箱里的声音变清楚了。"],"answer":2,"reason":"记录提到调整天线和随后声音变清楚，但没有排除其他变化，也没有记录完整句子。","hint":"观察能直接听到或看到什么；再看哪里加入了“一定”。","ability":"事实与推断","relatedTo":"S15-1","type":"choice"},{"id":"S15-3","prompt":"要弄清原话到底是什么，先查哪项最直接？","options":["联系发送者，核对两段原话和发送时间。","检查广播站桌子的颜色。","只根据“七点”和“见”补全句子。"],"answer":0,"reason":"发送者可以核对缺失内容以及两段之间的关系；其他选项不能补足原始信息。","hint":"哪项能核对缺失的句子？","ability":"选择证据","relatedTo":null,"type":"choice"}],"extra":{"id":"S15-X","prompt":"后来发现，6:03 广播站的音箱里也有杂音。现在可以确定什么？","options":["6:06 转天线肯定是杂音消失的唯一原因。","至少在 6:03，音箱里已经出现杂音。","发送者肯定要求大家七点前到。"],"answer":1,"reason":"新记录只说明杂音在 6:03 已出现；它没有单独证明原因，也没有补全原话。","hint":"只用新增记录能直接支持的部分。","ability":"限制结论","relatedTo":"S15-2","type":"choice"},"reflection":"如果暂时联系不到发送者，你会怎样向听众说明现有信息？","panels":["观星夜结束后，社区广播站邀请天乐和小禾帮忙准备一期节目。","傍晚 6:04，录音里传来一句断断续续的话：“我们到……之前……”；后半句听不清。","6:06，值班员调整天线后，广播站音箱里的声音变清楚了。","6:12，又收到一段声音：“……七点……见。”记录上没有写两段是否属于同一句话。","团团想立刻播报：“大家七点前一定能到！”小禾拦住他：“先把听见的、看见的和猜出来的分开。”"]},{"day":16,"title":"两张不同的录音单","story":["广播站找到两份针对 6:04 同一句话的文字记录。这句话只说了一个集合地点：甲单写“在东门集合”，乙单写“在北门集合”。两张单都标了 6:04，记录人不同。","保留下来的片段只能听清“……门集合”。甲、乙记录人都说自己是边听边记的；现场没有其他能确认 6:04 原话的人。","团团指着两张单：“总有一个人在骗人！”天乐摇头：“记录互相冲突，可能听错，也可能记错。先找能核对原话的材料。”"],"activity":"并排记录板：标注相同的时间、互相冲突的地点与缺失的原声。","questions":[{"id":"S16-1","prompt":"两张记录最明确的冲突是什么？","options":["记录的通话时间不同。","记录的集合地点不同。","一张说有人到场，另一张说没有人到场。"],"answer":1,"reason":"两张都标 6:04；一张写东门，一张写北门。","hint":"先找相同项，再找不同项。","ability":"比较记录","relatedTo":null,"type":"choice"},{"id":"S16-2","prompt":"仅凭这两张记录，哪种判断更稳妥？","options":["甲记录人一定在说谎。","乙记录人一定在说谎。","至少有一份文字记录不准确；原因还要核对。"],"answer":2,"reason":"这句话只说了一个地点，“东门”和“北门”不可能都记录准确；冲突本身不能证明谁故意说谎。","hint":"两份文字记录能同时准确吗？能否据此判断动机？","ability":"冲突与原因","relatedTo":"S16-1","type":"choice"},{"id":"S16-3","prompt":"哪项新材料最有助于核对 6:04 的原话？","options":["保留完整声音的 6:04 原始录音。","第二天的天气预报。","某人对广播站装饰的记忆。"],"answer":0,"reason":"如果原始录音中的门名清晰，就能直接核对两份文字记录；仍需确认录音确为该次通话。","hint":"找与同一次通话直接相关的材料。","ability":"证据选择","relatedTo":null,"type":"choice"}],"extra":{"id":"S16-X","prompt":"如果甲改为记录 6:04 的东门，乙改为记录 6:09 的北门，又有 6:09 的改地点通知，怎样理解？","options":["两份记录一定相互矛盾。","两份记录可能分别记下了改动前和改动后的地点。","可以确定两处已经同时有人集合。"],"answer":1,"reason":"时间不同且存在改地点通知，两份记录可能反映不同阶段；它们本身不证明有人到场。","hint":"比较记录时间和通知时间。","ability":"信息更新","relatedTo":"S16-1","type":"choice"},"reflection":"你会给两张未核实的记录加什么标记，让下一位编辑不把它们当成定论？","panels":["广播站找到两份针对 6:04 同一句话的文字记录。这句话只说了一个集合地点：甲单写“在东门集合”，","乙单写“在北门集合”。两张单都标了 6:04，记录人不同。","保留下来的片段只能听清“……门集合”。甲、乙记录人都说自己是边听边记的；","现场没有其他能确认 6:04 原话的人。","团团指着两张单：“总有一个人在骗人！”天乐摇头：“记录互相冲突，可能听错，也可能记错。先找能核对原话的材料。”"]},{"day":17,"title":"跳过的电报码","story":["发送者告诉广播站：备用信号每组有两次闪光，然后停一下。短闪记 1，长闪记 2，把一组两次的数相加。","约定的结果是：2 表示北门，3 表示西门，4 表示暂缓。监测器保存了一组“短闪、长闪、停顿”，但另一段录像只保存了解码结果“西门”。","团团说：“既然都是西门，就能知道录像里先闪了什么。”小禾把两张闪光卡倒过来，发现事情没那么简单。"],"activity":"编码卡：点选两次闪光，显示两次的值和总和；允许调换顺序再比较。","questions":[{"id":"S17-1","prompt":"“短闪、长闪”这一组表示什么？","options":["北门","西门","暂缓"],"answer":1,"reason":"短闪记 1、长闪记 2，总和为 3；约定 3 表示西门。","hint":"把两次闪光对应的数相加。","ability":"按规则解码","relatedTo":null,"type":"choice"},{"id":"S17-2","prompt":"只知道一组解码结果是“西门”，能确定两次闪光的先后吗？","options":["能，一定先短后长。","能，一定先长后短。","不能；短长与长短都能得到 3。"],"answer":2,"reason":"短长是 1＋2，长短是 2＋1，两种先后都得到 3。","hint":"把两种顺序分别代入规则。","ability":"唯一性","relatedTo":"S17-1","type":"choice"},{"id":"S17-3","prompt":"要发出“暂缓”，应使用哪组？","options":["短闪、短闪","短闪、长闪","长闪、长闪"],"answer":2,"reason":"暂缓对应 4；只有两次长闪的和是 2＋2＝4。","hint":"先找到暂缓对应的总和。","ability":"编码与核对","relatedTo":null,"type":"choice"}],"extra":{"id":"S17-X","prompt":"如果录像又显示：这组表示“西门”，并且第一下是长闪，那么第二下是什么？","options":["短闪","长闪","仍不能确定"],"answer":0,"reason":"西门的总和是 3，第一下长闪为 2，所以第二下必须是 1，即短闪。","hint":"从 3 中扣除第一下的值。","ability":"条件补充","relatedTo":"S17-2","type":"choice"},"reflection":"你能想出一条新约定，让“短长”和“长短”表达不同意思吗？说明为什么。","panels":["发送者告诉广播站：备用信号每组有两次闪光，然后停一下。短闪记 1，","长闪记 2，把一组两次的数相加。","约定的结果是：2 表示北门，3 表示西门，4 表示暂缓。","监测器保存了一组“短闪、长闪、停顿”，但另一段录像只保存了解码结果“西门”。","团团说：“既然都是西门，就能知道录像里先闪了什么。”小禾把两张闪光卡倒过来，发现事情没那么简单。"]},{"day":18,"title":"干扰从哪里来","story":["广播站用来检查声音的音箱又出现杂音。问题可能来自远端收音、传输途中，或台内的监听设备；目前还没有足够证据确定是哪一处。","小禾找到一段确认清晰的测试录音。她让同一段录音同时进入耳机和音箱，保持同一音源与音量设置。耳机听起来清楚，音箱仍有杂音。","团团想马上宣布远端话筒坏了。天乐说：“先看这次比较改变了什么。我们可以继续检查音箱和连接处。”"],"activity":"检查路径板：将同一测试音源接到两条输出，标记耳机和音箱的实际结果。","questions":[{"id":"S18-1","prompt":"这次比较里，两边刻意使用了什么相同条件？","options":["同一段测试录音和音源设置。","同一个播放设备。","远端发送者说话时的天气。"],"answer":0,"reason":"耳机和音箱用了同一段录音及相同音源设置，但它们是不同的播放设备。","hint":"看故事里明确保持相同的部分。","ability":"控制条件","relatedTo":null,"type":"choice"},{"id":"S18-2","prompt":"耳机清楚、音箱有杂音，下一步最有依据的方向是什么？","options":["优先检查音箱及其连接处。","断定远端话筒一定损坏。","断定广播内容已经完整无误。"],"answer":0,"reason":"同一测试音源在耳机输出清楚而音箱输出有杂音，值得先检查音箱和连接处；这仍不是对所有故障的最终结论。","hint":"两路结果不同，先检查哪一段？","ability":"依据选择行动","relatedTo":"S18-1","type":"choice"},{"id":"S18-3","prompt":"如果换用另一只音箱后声音清楚了，下面哪句最准确？","options":["原音箱或原来的连接处值得进一步检查。","远端所有设备永远不会再出问题。","所有曾经丢失的字都能自动恢复。"],"answer":0,"reason":"更换后的结果为原音箱和连接处提供了线索，但不能排除其他时段或其他设备的问题。","hint":"区分本次比较的线索和没有测试过的范围。","ability":"证据范围","relatedTo":"S18-2","type":"choice"}],"extra":{"id":"S18-X","prompt":"如果同一测试音源经耳机和音箱都出现杂音，能立即确定只有音箱损坏吗？","options":["能，因为音箱也有杂音。","不能，还要检查两路共用的音源或连接。","能，因为耳机听到了杂音。"],"answer":1,"reason":"两路都出现杂音时，只有音箱损坏无法解释耳机的结果；应继续核查共用部分和其他可能。","hint":"先看哪项事实不能由“只有音箱损坏”解释。","ability":"排查与反例","relatedTo":"S18-2","type":"choice"},"reflection":"为了不漏掉间歇性问题，你还想怎样重复或记录这次检查？","panels":["广播站用来检查声音的音箱又出现杂音。问题可能来自远端收音、传输途中，","或台内的监听设备；目前还没有足够证据确定是哪一处。","小禾找到一段确认清晰的测试录音。她让同一段录音同时进入耳机和音箱，","保持同一音源与音量设置。耳机听起来清楚，音箱仍有杂音。","团团想马上宣布远端话筒坏了。天乐说：“先看这次比较改变了什么。我们可以继续检查音箱和连接处。”"]},{"day":19,"title":"备用电池分配","story":["广播站要把发射器和监听器同时运行一个完整时段。监听器用来检查播放的声音。三块电池的可用容量分别为 9、6、5 单位；每个设备只能接一块电池，一块电池不能同时供给两个设备。","这个时段里，发射器至少需要 6 单位，监听器至少需要 5 单位。还要留一块未使用的电池做应急备用，备用容量不能少于 5 单位。","团团把最大的电池拿给发射器。小禾说：“不一定错，我们把所有条件都检查一下，再看看还能不能留更充足的备用。”"],"activity":"电池装配板：给两个设备分配电池，显示设备需求与未使用电池容量；允许撤回。","questions":[{"id":"S19-1","prompt":"方案甲：9 给发射器、6 给监听器、备用 5。方案乙：6 给发射器、5 给监听器、备用 9。哪些符合现有条件？","options":["只有甲","甲和乙都符合","只有乙"],"answer":1,"reason":"甲的 9≥6、6≥5、备用 5≥5；乙的 6≥6、5≥5、备用 9≥5。","hint":"每个方案都检查两个设备和备用电池。","ability":"多条件比较","relatedTo":null,"type":"choice"},{"id":"S19-2","prompt":"如果要在符合现有条件时留下容量最大的备用电池，应怎样分配？","options":["6 给发射器，5 给监听器，备用 9。","9 给发射器，5 给监听器，备用 6。","5 给发射器，6 给监听器，备用 9。"],"answer":0,"reason":"6 和 5 分别刚好满足两个设备，留下最大的 9；5 不能满足发射器至少 6 的要求。","hint":"先保证两个设备都能运行，再比较备用容量。","ability":"优化与约束","relatedTo":"S19-1","type":"choice"},{"id":"S19-3","prompt":"为什么不能把 5 给发射器、9 给监听器、备用 6？","options":["发射器至少需要 6 单位，5 不够。","监听器不能使用容量大于 5 的电池。","备用电池必须恰好是 5 单位。"],"answer":0,"reason":"规则只说监听器至少需要 5、备用不少于 5；发射器的 6 单位下限没有满足。","hint":"逐一对照“至少”和“不少于”。","ability":"解释不可行","relatedTo":null,"type":"choice"}],"extra":{"id":"S19-X","prompt":"如果取消备用要求，新增一盏至少需要 3 单位的灯；三个设备仍各接一块电池，能同时运行吗？","options":["能：6 给发射器、5 给监听器、9 给灯。","不能：灯只能接容量恰好为 3 的电池。","不能：三块电池无法连接三个设备。"],"answer":0,"reason":"按题目新条件，6、5、9 分别满足 6、5、3 的最低需求，且一块电池只接一个设备。","hint":"检查新增的灯和原有两个设备。","ability":"条件变化","relatedTo":"S19-2","type":"choice"},"reflection":"如果备用电池也要尽可能轻，你还需要哪些信息才能比较？","panels":["广播站要把发射器和监听器同时运行一个完整时段。监听器用来检查播放的声音。","三块电池的可用容量分别为 9、6、5 单位；每个设备只能接一块电池，","一块电池不能同时供给两个设备。","这个时段里，发射器至少需要 6 单位，监听器至少需要 5 单位。","还要留一块未使用的电池做应急备用，备用容量不能少于 5 单位。","团团把最大的电池拿给发射器。小禾说：“不一定错，我们把所有条件都检查一下，再看看还能不能留更充足的备用。”"]},{"day":20,"title":"信号为什么变弱","story":["广播站想研究开窗是否影响接收。第一次用同一段十字测试录音，在同一位置、同一设备上试听：窗开时正确辨认 8 个字，窗关时正确辨认 9 个字。","两次测试不是同时进行的，当时周围还有其他可能变化的声音。团团指着 8 和 9：“只要关窗，永远都会多听清一个字。”","天乐提议再做多组比较：尽量保持位置、设备和录音相同，交替改变开窗状态，并把每次结果和周围情况记下来。"],"activity":"实验条件板：选择需要保持的条件、改变的条件和记录项；不自动推定结果。","questions":[{"id":"S20-1","prompt":"第一次的记录直接说明什么？","options":["那两次分别辨认出 8 个字和 9 个字。","关窗在所有情况下都能多辨认一个字。","开窗一定是唯一影响听清字数的原因。"],"answer":0,"reason":"记录描述的是两次测试结果；测试时间及周围情况可能不同，不能直接推广到所有情况。","hint":"把这两次发生了什么，与普遍规律分开。","ability":"观察与结论","relatedTo":null,"type":"choice"},{"id":"S20-2","prompt":"哪种后续做法更有助于比较开窗状态？","options":["同位置、同设备、同录音，交替开关窗并多次记录。","开窗时换一个房间，关窗时换一台设备。","只记录最满意的一次，丢掉其他结果。"],"answer":0,"reason":"尽量保持其他条件并重复记录，有助于比较；仍应记录可能影响结果的其他情况。","hint":"尽量只改变想研究的条件。","ability":"设计比较","relatedTo":"S20-1","type":"choice"},{"id":"S20-3","prompt":"如果重复测试里某次出现了与预期相反的结果，应先怎么做？","options":["保留该次记录，核对条件与记录方法。","直接删除，因为它不符合猜想。","只凭这一条就宣布原先所有记录无效。"],"answer":0,"reason":"先保留并核对异常结果，才能判断是否有记录问题或其他值得研究的因素。","hint":"想一想删除记录会丢失什么。","ability":"处理异常","relatedTo":null,"type":"choice"}],"extra":{"id":"S20-X","prompt":"若三组开窗结果为 8、7、9，三组关窗结果也为 8、7、9，下面哪句合理？","options":["这几次记录没有显示两种状态的差别；还不能说明所有环境都一样。","已经证明开窗永远不会产生任何影响。","可以确定前一天的 8 和 9 都记录错了。"],"answer":0,"reason":"所给两组数字相同，不能据此证明所有环境的结果；也没有证据说明之前的记录有误。","hint":"先只比较给出的六个数，再检查结论范围。","ability":"比较与范围","relatedTo":"S20-2","type":"choice"},"reflection":"除了开窗状态，你还会记录什么可能影响听清字数的条件？","panels":["广播站想研究开窗是否影响接收。第一次用同一段十字测试录音，","在同一位置、同一设备上试听：窗开时正确辨认 8 个字，窗关时正确辨认 9 个字。","两次测试不是同时进行的，当时周围还有其他可能变化的声音。","团团指着 8 和 9：“只要关窗，永远都会多听清一个字。”","天乐提议再做多组比较：尽量保持位置、设备和录音相同，交替改变开窗状态，","并把每次结果和周围情况记下来。"]},{"day":21,"title":"恢复后的播报","story":["广播站找回了能核实的原始记录：6:04 的通话提过东门；6:09，活动负责人发来一条更改通知，地点改为北门。两条记录都保留了时间。","6:12 的片段仍只听清“七点……见”，没有说清日期。负责人暂时没有回复确认集合时间，编辑不能把猜测写成已经确认的安排。","节目即将开始。小禾要写一句简短播报：既让听众知道地点有过更新，也把尚未确认的时间和下一步核查说清楚。"],"activity":"播报编辑板：把事实、待确认的问题和下一步核查放入三个区域；自由表达不自动判分。","questions":[{"id":"S21-1","prompt":"哪句播报符合现有证据？","options":["负责人 6:09 通知改到北门；集合时间还在核实。","所有人今天七点已经到齐。","两条记录写了不同地点，所以一定有人故意撒谎。"],"answer":0,"reason":"6:09 的改地点通知有明确记录；“七点”片段的日期和完整含义仍未确认。","hint":"按最新地点通知写事实，再标出不确定的时间。","ability":"事实与不确定性","relatedTo":null,"type":"choice"},{"id":"S21-2","prompt":"播报前若只能做一项核对，哪项最直接帮助确认集合时间？","options":["联系活动负责人，核对日期、时间和当前地点。","查询广播站成立年份。","根据“七点”自行补上日期。"],"answer":0,"reason":"负责人可以核对日期、时间和地点是否仍然有效；其余选项不能确认安排。","hint":"找能确认当前安排的人。","ability":"下一步核查","relatedTo":"S21-1","type":"choice"},{"id":"S21-3","prompt":"把播报前的步骤按合理顺序排好。","options":["把已核实事项和待确认事项分别写清楚","核对记录的时间和来源","播出，并在收到新消息后及时更正"],"answer":[1,0,2],"reason":"先核对记录，再区分事实和待确认内容，最后播出，并在收到新消息后及时更正。","hint":"先确认，再写，最后播出。","ability":"编辑流程","relatedTo":null,"type":"order"}],"extra":{"id":"S21-X","prompt":"如果负责人后来明确回复“今天 19:00 在北门”，接着又在 18:18 通知改为 19:10，怎样更新记录？","options":["保留先前记录，标明 18:18 的最新时间为 19:10。","删除所有先前记录，假装从未变更。","继续播报 19:00，不注明后来的通知。"],"answer":0,"reason":"18:18 的通知更新了时间；保留旧记录与变更时间，才能查清信息先后怎样变化。","hint":"比较通知先后，并保留每次变化的记录。","ability":"版本更新","relatedTo":"S21-1","type":"choice"},"reflection":"请写一条播报，分别说明已知事实、待确认事项和下一步；可以不做这道自由表达。","panels":["广播站找回了能核实的原始记录：6:04 的通话提过东门；","6:09，活动负责人发来一条更改通知，地点改为北门。两条记录都保留了时间。","6:12 的片段仍只听清“七点……见”，没有说清日期。负责人暂时没有回复确认集合时间，","编辑不能把猜测写成已经确认的安排。","节目即将开始。小禾要写一句简短播报：既让听众知道地点有过更新，","也把尚未确认的时间和下一步核查说清楚。"]},{"day":22,"title":"消失的积水","story":["广播节目结束后，社区观察馆想做一张雨水地图。工作人员在雨停后的同一段 30 分钟内，测量了东、西、南三个位置的积水深度。","东点从 8 厘米降到 5 厘米；西点从 5 厘米降到 4 厘米；南点两次都是 6 厘米。测量位置和工具没有改变。","团团只看最后的数：“西点的水最浅，所以它下降得最多。”天乐拿起两次记录：“先算变化，再看看记录能不能解释原因。”"],"activity":"水位记录板：点选两个时间，显示起点、终点和两次的差；不自动判断排水原因。","questions":[{"id":"S22-1","prompt":"这 30 分钟里，哪个位置记录的水深下降得最多？","options":["东点","西点","南点"],"answer":0,"reason":"东点下降 8－5＝3 厘米，西点下降 1 厘米，南点没有变化。","hint":"每个点都用开始深度减去结束深度。","ability":"比较变化量","relatedTo":null,"type":"choice"},{"id":"S22-2","prompt":"下面哪句能由这两次测量直接支持？","options":["东点记录的水深下降了 3 厘米。","东点的排水设施一定比其他位置好。","南点的水一直没有流动。"],"answer":0,"reason":"两次读数支持东点从 8 到 5 的变化；它们不能单独证明排水原因，也不能描述中间每一刻。","hint":"只使用记录直接显示的信息。","ability":"事实与原因","relatedTo":"S22-1","type":"choice"},{"id":"S22-3","prompt":"如果要研究水位变化的原因，哪项信息最有帮助？","options":["核对各点附近的排水口、地面和测量过程。","只记下水最浅的地点名称。","把中间没有测量的数都补成零。"],"answer":0,"reason":"排水口、地面及测量过程可能影响解释；未测到的数不能当成零。","hint":"想一想还需要核对哪些条件。","ability":"选择后续信息","relatedTo":null,"type":"choice"}],"extra":{"id":"S22-X","prompt":"另一天同样用 30 分钟测量东点，水深从 7 厘米降到 4 厘米。与第一次相比，下降量怎样？","options":["两次一样，都是 3 厘米。","另一天多下降 1 厘米。","无法计算另一天的下降量。"],"answer":0,"reason":"第一次 8－5＝3，另一天 7－4＝3；终点不同不代表下降量不同。","hint":"分别计算起点与终点的差。","ability":"跨记录比较","relatedTo":"S22-1","type":"choice"},"reflection":"如果你要在地图旁边写一句说明，怎样避免把水位变化直接说成排水原因？","panels":["广播节目结束后，社区观察馆想做一张雨水地图。工作人员在雨停后的同一段 30 分钟内，","测量了东、西、南三个位置的积水深度。","东点从 8 厘米降到 5 厘米；西点从 5 厘米降到 4 厘米；","南点两次都是 6 厘米。测量位置和工具没有改变。","团团只看最后的数：“西点的水最浅，所以它下降得最多。”天乐拿起两次记录：“先算变化，再看看记录能不能解释原因。”"]},{"day":23,"title":"不同大小的容器","story":["观察馆用三只容器收集用于测量的雨水：大桶最多装 8 升，已经有 4 升；中桶最多装 5 升，目前为空；小桶最多装 3 升，目前也为空。","这次实验需要选两只容器，分别把所选容器的剩余空间都接满。工作人员想让新增水量正好是 7 升。容器里的水不能在这次选择中倒来倒去。","小禾先算每只容器还能装多少。团团说：“别只看桶有几只，还要看每只剩下多少空间。”"],"activity":"容器板：显示容量和已有水量，选择两只后显示可新增水量；允许重新选。","questions":[{"id":"S23-1","prompt":"选哪两只，把它们的剩余空间都接满，新增水量正好是 7 升？","options":["大桶和中桶" ，但目前明确关闭。","hint":"把路线用时和当前状态分开看。","ability":"约束优先","relatedTo":null,"type":"choice"}],"extra":{"id":"S24-X","prompt":"如果 C 路后来由工作人员确认开放，其他数据不变，三条路线中哪条给定用时最短？","options":["A 路","B 路","C 路"],"answer":2,"reason":"A 为 10 分钟，B 为 11 分钟，C 为 7 分钟；新增的开放确认改变了可选范围。","hint":"更新 C 路状态后再比较三个总时间。","ability":"更新与比较","relatedTo":"S24-2","type":"choice"},"reflection":"你会在地图上怎样标明“尚未确认”和“已关闭”，让它们不被误认为同一状态？","panels":["工作人员绘制了一张从观察馆 S 到集合处 T 的路线草图：经 A 走 5＋5 分钟，","经 B 走 4＋7 分钟，经 C 走 3＋4 分钟。每条路线都只能按草图上列出的两段走。","C 路因积水暂时关闭；B 路刚由工作人员检查可通行；A 路的门是否打开还没有确认。","孩子们只在工作人员陪同并确认安全后行动。","团团想选用时最短的 C 路。小禾说：“先看这条路现在能不能走，再比较时间。”"]},{"day":25,"title":"雨量记录有空格","story":["观察馆整理某天下午连续三小时的雨量。第一小时记录了 2 毫米，第二小时记录了 3 毫米，第三小时的格子是空白。每小时雨量都不会是负数。","旧记录上没有说明空白是“没有下雨”还是“没有记录”。团团把空格填成 0，写出总雨量是 5 毫米。","天乐说：“我们知道前两小时共 5 毫米，但空格的意思要先核实。”"],"activity":"雨量记录卡：空白显示为“未知”，允许标注待核查，不能自动当作零。","questions":[{"id":"S25-1","prompt":"现在对三小时的总雨量，哪句有依据？","options":["至少是 5 毫米，准确总量仍未知。","正好是 5 毫米。","一定超过 5 毫米。"],"answer":0,"reason":"前两小时合计 5 毫米，第三小时不会是负数但数值未知，因此总量至少为 5。","hint":"先算已知部分，再考虑第三小时可能为零。","ability":"缺失值与范围","relatedTo":null,"type":"choice"},{"id":"S25-2","prompt":"第三小时的空格现在代表什么？","options":["没有足够信息确定它是零还是漏记。","一定没有下雨。","一定下了 1 毫米。"],"answer":0,"reason":"记录没有说明空白含义；需要找原始仪器数据或记录人核对。","hint":"空白有没有明确解释？","ability":"识别未知","relatedTo":"S25-1","type":"choice"},{"id":"S25-3","prompt":"哪项最直接有助于核实第三小时的雨量？","options":["查该小时的原始仪器记录。","查下一周的课程安排。","只重复抄写现有空格。"],"answer":0,"reason":"对应小时的原始仪器记录可能补上缺失数据，仍需核对记录时间。","hint":"找与同一小时直接相关的记录。","ability":"核对来源","relatedTo":null,"type":"choice"}],"extra":{"id":"S25-X","prompt":"如果核实另一份可靠汇总记录显示三小时总雨量为 7 毫米，第三小时是多少？","options":["0 毫米","2 毫米","5 毫米"],"answer":1,"reason":"已知前两小时是 2＋3＝5 毫米，总量为 7，第三小时为 7－5＝2 毫米。","hint":"从总量中减去前两小时。","ability":"条件补充","relatedTo":"S25-1","type":"choice"},"reflection":"如果你设计记录表，会怎样区分“确认没有下雨”和“没有测量”？","panels":["观察馆整理某天下午连续三小时的雨量。第一小时记录了 2 毫米，","第二小时记录了 3 毫米，第三小时的格子是空白。每小时雨量都不会是负数。","旧记录上没有说明空白是“没有下雨”还是“没有记录”。团团把空格填成 0，","写出总雨量是 5 毫米。","天乐说：“我们知道前两小时共 5 毫米，但空格的意思要先核实。”"]},{"day":26,"title":"坡度与流速","story":["工作人员用两块相同表面的模型板做小实验：每次倒入相同量的水，板的长度和起点相同。第一次坡度较小，水到终点用了 6 秒；第二次坡度较大，用了 4 秒。","每种坡度目前只测了一次。团团说：“坡度更大，任何情况下都一定更快。”小禾指出，两次结果值得继续研究，但还不能说明所有情况。","他们决定在工作人员指导下重复比较，并记录每次的坡度、用水量、板面和时间。"],"activity":"实验条件面板：标记需要保持、改变和记录的条件；显示两次样本，不自动推导普遍规律。","questions":[{"id":"S26-1","prompt":"材料明确说明两次模型实验改变了什么？","options":["坡度","板的长度","用水量"],"answer":0,"reason":"材料说板面、长度、起点和水量相同；两次坡度不同。","hint":"先看哪些条件相同，再看不同项。","ability":"控制变量","relatedTo":null,"type":"choice"},{"id":"S26-2","prompt":"关于这两次测量，哪句正确？","options":["较大坡度那次用时 4 秒，比另一次少 2 秒。","这两次已经证明任何板面上都一样。","没有记录两次用时。"],"answer":0,"reason":"记录是 6 秒和 4 秒，相差 2 秒；样本只有两次，不足以说明所有情况。","hint":"先比较实际数字，再检查结论范围。","ability":"数值与结论","relatedTo":"S26-1","type":"choice"},{"id":"S26-3","prompt":"哪种后续做法更能帮助继续比较？","options":["保持板面、长度和水量，重复两种坡度并记录每次结果。","同时换板面和水量，只记录最快的一次。","删掉较慢的一次，再下结论。"],"answer":0,"reason":"尽量保持其他条件并重复记录，有助于观察结果是否稳定。","hint":"继续比较坡度时，应尽量保持哪些条件？","ability":"实验设计","relatedTo":null,"type":"choice"}],"extra":{"id":"S26-X","prompt":"如果下一次把坡度和板面同时改变，得到的时间不同，能只凭这次比较确定是坡度造成的吗？","options":["能，一定是坡度造成。","不能，板面变化也可能有影响。","能，因为每次都倒了水。"],"answer":1,"reason":"坡度和板面同时改变，单凭这次结果不能区分两者各自的作用。","hint":"看一看除了坡度，还有什么变了。","ability":"混杂条件","relatedTo":"S26-3","type":"choice"},"reflection":"你还想记录哪一个可能影响实验结果的条件？为什么？","panels":["工作人员用两块相同表面的模型板做小实验：每次倒入相同量的水，","板的长度和起点相同。第一次坡度较小，水到终点用了 6 秒；","第二次坡度较大，用了 4 秒。","每种坡度目前只测了一次。团团说：“坡度更大，任何情况下都一定更快。”","小禾指出，两次结果值得继续研究，但还不能说明所有情况。","他们决定在工作人员指导下重复比较，并记录每次的坡度、用水量、板面和时间。"]},{"day":27,"title":"先修哪一段","story":["社区准备在白天开放通往观察馆的步行路线。工作人员说明：安全门和桥板都修好后，这条路线才可开放；照明灯是另一个可选改进项目，今天的计划不包含夜间通行。","安全门维修需要 3 个预算单位，桥板需要 4 个单位，照明灯需要 2 个单位。现在的预算为 7 个单位，费用按题中数值计算。维修由工作人员安排。","团团先选了桥板和照明灯。小禾核对清单：“预算够不够是一件事，路线开放的条件有没有满足是另一件事。”"],"activity":"预算卡：选择项目并显示总费用与路线条件；不替代真实安全检查。","questions":[{"id":"S27-1","prompt":"在预算为 7 且必须满足路线开放条件时，应选哪组？","options":["安全门和桥板","桥板和照明灯","安全门和照明灯"],"answer":0,"reason":"安全门和桥板合计 3＋4＝7，并满足材料给出的两项开放条件。","hint":"先找到必须同时完成的项目。","ability":"预算与必要条件","relatedTo":null,"type":"choice"},{"i 员后来确认 A 门已经打开，应怎样更新地图说明？","options":["保留旧记录，写明确认时间和新的状态。","删除所有旧记录，假装没有变化。","仍把 A 门写成已经关闭。"],"answer":0,"reason":"记录确认时间和新状态，同时保留旧记录，才能看清信息何时变化。","hint":"更新当前状态时保留变化经过。","ability":"版本更新","relatedTo":"S28-2","type":"choice"},"reflection":"请写一条给邻居的简短说明，分别说出一项事实、一项待核实事项和下一步。","panels":["观察馆准备把雨水地图介绍给邻居。记录显示：某次 30 分钟里东点水深从 8 厘米降到 5 厘米；","同一天第三小时的雨量格子没有填写。","另有一张最新路线表：B 路已由工作人员确认可通行；C 路暂时关闭。","工作人员还在核对 A 路的门是否打开。实际出行需要遵循现场人员的指引。","小禾写说明时，把测量事实、还不知道的事和下一步要核查的内容分开。","团团提醒：“别为了让地图看起来完整，就替空格编数字。”"]},{"day":29,"title":"找不到标签的三封信","story":["观察馆准备把三封工作信分别交给播报组、造型组和后勤组，每组恰好收到一封。信封 A、B、C 的外标签在搬运时脱落了。","登记簿确认 A 应交给播报组；另一张核对单确认 B 不是给后勤组的。除此之外，每封信和每个组都只对应一次。","团团看着一张松动的“后勤组”标签，想把它贴回 B。小禾说：“这张标签没有固定在信封上，先用已核实的两条记录推一推。”"],"activity":"信封匹配板：试着把三个组分配给 A、B、C，允许撤回；不把松动标签当作已核实证据。","questions":[{"id":"S29-1","prompt":"把三封信分别交给三个组，使已核实的记录都成立。","options":["播报组","造型组","后勤组"],"answer":[0,1,2],"reason":"A 对应播报组；B 不能是播报组或后勤组，所以对应造型组；C 对应后勤组。","hint":"先按记录安排 A，再考虑 B，最后安排 C。","ability":"排除与对应","relatedTo":null,"type":"match"},{"id":"S29-2","prompt":"C 应交给哪个组？","options":["播报组","造型组","后勤组"],"answer":2,"reason":"A 对应播报组，B 对应造型组，剩下的 C 对应后勤组。","hint":"先确定 A、B 的对应，再看剩下哪个组。","ability":"完整匹配","relatedTo":"S29-1","type":"choice"},{"id":"S29-3","prompt":"为什么不能仅凭松动的“后勤组”标签认定 B 属于后勤组？","options":["标签没有固定在信封上，且与已核对的 B 记录冲突。","标签上一定没有字。","每封信都要送给同一个组。"],"answer":0,"reason":"标签与信封的对应关系没有核实；核对单明确写 B 不是后勤组。","hint":"检查标签和信封是否有可靠对应关系。","ability":"证据来源","relatedTo":null,"type":"choice"}],"extra":{"id":"S29-X","prompt":"如果 A 仍交播报组，但 B“不是后勤组”的核对单尚未确认，B 的归属能唯一确定吗？","options":["能，一定是造型组。","不能，B 可能是造型组，也可能是后勤组。","能，一定是后勤组。"],"answer":1,"reason":"只知道 A 是播报组时，B 与 C 可以分别对应另两组的两种排列。","hint":"试着把剩下两个组分别给 B 和 C。","ability":"条件不足","relatedTo":"S29-1","type":"choice"},"reflection":"你会如何记录松动标签，避免后来的人把它误当成已经核实的归属？","panels":["观察馆准备把三封工作信分别交给播报组、造型组和后勤组，每组恰好收到一封。","信封 A、B、C 的外标签在搬运时脱落了。","登记簿确认 A 应交给播报组；另一张核对单确认 B 不是给后勤组的。","除此之外，每封信和每个组都只对应一次。","团团看着一张松动的“后勤组”标签，想把它贴回 B。小禾说：“这张标签没有固定在信封上，先用已核实的两条记录推一推。”"]},{"day":30,"title":"不能走的街口","story":["交接地图上只有这些连接：S 可到 A 或 B；A 可到 C；B 可到 C 或 D；C 和 D 都可到 T。路线可以沿列出的连接向终点前进。","上午 9:30，A 到 C 的路关闭；B 到 D 的门要到 10:00 才开放。其余列出的连接已经确认开放。出发前仍由工作人员确认现场安全。","团团看到 A 到 C 关闭，说：“那 C 一定到不了。”天乐沿着地图从 B 走了一遍。"],"activity":"路线板：点击相邻地点组成路线，可撤回；单独标出关闭的连接和限时开放的门。","questions":[{"id":"S30-1","prompt":"上午 9:30，从 S 出发沿给出的连接规划一条到 T 的开放路线。","options":["S → A → C → T","S → B → C → T","S → B → D → T"],"answer":"S>B>C>T","reason":"A 到 C 关闭，B 到 D 尚未开放；S、B、C、T 之间列出的连接均已开放。","hint":"逐段检查连接是否存在、当时是否开放。","ability":"路径与约束","relatedTo":null,"type":"route"},{"id":"S30-2","prompt":"A 到 C 关闭能否说明 C 一定到不了？","options":["能，因为所有通往 C 的连接都关闭。","不能，还可以由 S 经 B 到 C。","能，因为 B 不连接 C。"],"answer":1,"reason":"材料明确写了 B 到 C 的连接，而且这段路已经确认开放。","hint":"找另一条通向 C 的连接。","ability":"反例与路径","relatedTo":"S30-1","type":"choice"},{"id":"S30-3","prompt":"若 10:00 时只有 B 到 D 的门按时开放，其他状态不变，哪些完整路线可用？","options":["只有 S → B → C → T","S → B → C → T 和 S → B → D → T","三条选项里的路线都可用"],"answer":1,"reason":"B 到 C 仍开放，B 到 D 新开放；A 到 C 仍关闭。","hint":"只更新题目说改变的门，再检查每一段。","ability":"状态更新","relatedTo":"S30-1","type":"choice"}],"extra":{"id":"S30-X","prompt":"如果 9:30 时 B 到 C 也临时关闭，而其余状态都不变，给定连接中还有通向 T 的路线吗？","options":["有，S → A → C → T。","有，S → B → D → T。","没有，三种通向 T 的给定路线都受阻。"],"answer":2,"reason":"A 到 C、B 到 C 都关闭，B 到 D 又未到开放时间；给定连接中没有其他进入 C 或 D 的路线。","hint":"逐个检查能进入 C 或 D 的连接。","ability":"穷举与不可达","relatedTo":"S30-3","type":"choice"},"reflection":"你会怎样在地图上区分“这条连接关闭”和“整个地点不能进入”？","panels":["交接地图上只有这些连接：S 可到 A 或 B；A 可到 C；","B 可到 C 或 D；C 和 D 都可到 T。路线可以沿列出的连接向终点前进。","上午 9:30，A 到 C 的路关闭；B 到 D 的门要到 10:00 才开放。","其余列出的连接已经确认开放。出发前仍由工作人员确认现场安全。","团团看到 A 到 C 关闭，说：“那 C 一定到不了。”","天乐沿着地图从 B 走了一遍。"]},{"day":31,"title":"最晚出发时间","story":["工作人员要把资料从 S 送到 T，必须不晚于 10:00 到达。按计划，从 S 步行到中转点 H 用 12 分钟；在 H 整理资料用 5 分钟；从 H 到 T 再用 8 分钟。","三段所需时间都已计入计划，不另加等待。天乐想从 9:40 出发；小禾拿纸画了一条时间线：“我们先倒着算一遍。”","实际出发前还要由工作人员确认路况；这里先按题中给定的时间规划。"],"activity":"时间轴：输入或选择出发时间，依次显示步行、整理和到达的时刻；允许向前调整。","questions":[{"id":"S31-1","prompt":"按给定计划，最晚可以几点出发？","options":["9:35","9:40","9:45"],"answer 道增加了多少；只查棒子高度或相隔时间，仍缺少第一次的长度。","hint":"想一想两个影子开始时是否一样长。","ability":"解释差值","relatedTo":null,"type":"choice"}],"extra":{"id":"S36-X","prompt":"如果另一次记录中甲从 5 厘米变到 9 厘米，乙从 6 厘米变到 10 厘米，这次两者增加量怎样？","options":["甲更多","乙更多","一样多"],"answer":2,"reason":"这次甲增加 9－5＝4 厘米，乙增加 10－6＝4 厘米。","hint":"使用这一次给出的起始值重新计算。","ability":"新数据比较","relatedTo":"S36-1","type":"choice"},"reflection":"你会怎样在展示卡上写清楚“第二次的长度”和“增加的长度”？","panels":["观察馆的影子实验室里有两根固定的小棒。工作人员在两个时刻分别记录它们的影子长度，","使用同一把尺，并从小棒底部量到影子末端。","甲棒的影子从 4 厘米变成 9 厘米；乙棒的影子从 6 厘米变成 10 厘米。","两次测量之间没有留下其他记录。","团团看着最后的 9 和 10：“乙的影子最后更长，增加的长度也一定更多。”","天乐指着第一列：“先算一算，每根影子增加了多少。”"]},{"day":37,"title":"谁改了位置","story":["工作人员把三次影子实验写在卡片上。灯距指灯与纸片之间的距离；屏距指纸片与屏幕之间的距离。三次都使用同一张纸片、同一盏灯，灯的亮度也相同。","甲：灯距 30 厘米，屏距 20 厘米；乙：灯距 40 厘米，屏距 20 厘米；丙：灯距 40 厘米，屏距 30 厘米。","小禾想先研究灯距变化。团团拿起丙卡，天乐说：“先找两张卡：只改变我们想研究的距离，另一个距离保持相同。”"],"activity":"条件对照板：并排选择两张实验卡，显示灯距、屏距和保持相同的材料。","questions":[{"id":"S37-1","prompt":"从实验卡中选出一对：灯距不同，屏距相同。","options":["甲卡","乙卡","丙卡"],"answer":[0,1],"reason":"甲、乙的屏距同为 20 厘米，灯距分别为 30 和 40 厘米。","hint":"找屏距相同、灯距不同的一对。","ability":"控制条件","relatedTo":null,"type":"pair"},{"id":"S37-2","prompt":"如果先比较屏距不同、灯距相同的两次，应选哪一对？","options":["甲和乙","甲和丙","乙和丙"],"answer":2,"reason":"乙、丙灯距都为 40 厘米，屏距分别为 20 和 30 厘米。","hint":"这次先找灯距相同的一对。","ability":"切换比较目标","relatedTo":"S37-1","type":"choice"},{"id":"S37-3","prompt":"为什么甲和丙不适合只研究灯距变化？","options":["灯距和屏距都不同。","两次的灯距完全相同。","材料没有给出甲和丙的距离。"],"answer":0,"reason":"甲、丙的灯距为 30 和 40，屏距也从 20 变为 30；两项一起改变。","hint":"逐项比较两张卡。","ability":"识别混杂","relatedTo":null,"type":"choice"}],"extra":{"id":"S37-X","prompt":"如果新增丁卡：灯距 30 厘米、屏距 30 厘米，其他设置相同，哪一对适合先比较灯距？","options":["甲和丁","丙和丁","乙和丙"],"answer":1,"reason":"丙、丁的屏距均为 30 厘米，灯距分别为 40 和 30 厘米。","hint":"先找与丁的屏距相同的卡。","ability":"新增记录","relatedTo":"S37-1","type":"choice"},"reflection":"如果还有可能改变的条件，你会把它写在实验卡的哪个位置？","panels":["工作人员把三次影子实验写在卡片上。灯距指灯与纸片之间的距离；","屏距指纸片与屏幕之间的距离。三次都使用同一张纸片、同一盏灯，灯的亮度也相同。","甲：灯距 30 厘米，屏距 20 厘米；乙：灯距 40 厘米，","屏距 20 厘米；丙：灯距 40 厘米，屏距 30 厘米。","小禾想先研究灯距变化。团团拿起丙卡，天乐说：“先找两张卡：只改变我们想研究的距离，另一个距离保持相同。”"]},{"day":38,"title":"一张不完整的表","story":["实验室正在整理三次测量的影子长度：甲是 8 厘米，乙的格子空着，丙是 10 厘米。乙到底没有测量，还是测过却丢了记录？表格上没有说明。","团团看到两个数字，就把乙填为 9 厘米：“这样刚好排得整齐。”小禾说：“整齐不是证据。先保留空格，并找原始记录。”","工作人员找来了当天的原始记录本，还要核对测量时间和实验卡，才能知道哪条记录属于乙。"],"activity":"记录表：明确区分已测数值与未知值；允许标注“待核实”，不自动填补。","questions":[{"id":"S38-1","prompt":"现在能确定乙的影长是多少吗？","options":["能，一定是 9 厘米。","能，一定是 0 厘米。","不能，乙的记录需要核实。"],"answer":2,"reason":"乙的格子没有数值，已知甲和丙不足以唯一决定乙。","hint":"表格有没有说明乙的读数？","ability":"缺失值","relatedTo":null,"type":"choice"},{"id":"S38-2","prompt":"哪条说法目前有依据？","options":["甲和丙记录的影长分别为 8 和 10 厘米。","乙一定比甲长。","三次的平均长度一定是 9 厘米。"],"answer":0,"reason":"甲和丙的数值有记录；乙未知，不能据此确定比较或平均值。","hint":"先找表中明确写出的读数。","ability":"事实与未知","relatedTo":"S38-1","type":"choice"},{"id":"S38-3","prompt":"哪项最直接帮助核实乙？","options":["查与乙的时间和实验卡一致的原始记录。","查同一天任意一次写着 9 厘米的记录。","查第二天使用相同纸片的新记录。"],"answer":0,"reason":"同一次测量的原始记录可能补足数据，仍要确认时间和对象。","hint":"找与乙那次测量直接相关的材料。","ability":"核对来源","relatedTo":null,"type":"choice"}],"extra":{"id":"S38-X","prompt":"如果可靠记录后来确认三次影长的平均值是 9 厘米，乙是多少厘米？","options":["8","9","10"],"answer":1,"reason":"三次总长为 9×3＝27 厘米；减去甲的 8 和丙的 10，乙为 9 厘米。","hint":"先由平均值求三次数值的总和。","ability":"条件补充","relatedTo":"S38-1","type":"choice"},"reflection":"如果找不到乙的原始记录，展览表格上应怎样呈现这一格？","panels":["实验室正在整理三次测量的影子长度：甲是 8 厘米，乙的格子空着，","丙是 10 厘米。乙到底没有测量，还是测过却丢了记录？表格上没有说明。","团团看到两个数字，就把乙填为 9 厘米：“这样刚好排得整齐。”","小禾说：“整齐不是证据。先保留空格，并找原始记录。”","工作人员找来了当天的原始记录本，还要核对测量时间和实验卡，","才能知道哪条记录属于乙。"]},{"day":39,"title":"纸片遮挡试验","story":["观察馆想比较两种纸片遮挡灯光的效果。工作人员准备了大小相同的甲、乙纸片：甲不透光，乙能透过一部分光。","两次都用同一盏灯和同一个屏幕，灯、纸片和屏幕的位置不变。每次更换纸片后，都记录屏幕上影子的样子。","团团提出换纸片时顺便把灯移远。小禾提醒：“这样结果不同，也许有不止一个原因。”"],"activity":"实验搭建板：选择保持的灯、位置、屏幕和要更换的纸片，标明每次记录什么。","questions":[{"id":"S39-1","prompt":"要先比较纸片类型的影响，哪种安排更合适？","options":["保持灯和位置等条件相同，只更换纸片。","换纸片的同时移动灯和屏幕。","两次都用甲纸片，只改变灯的位置。"],"answer":0,"reason":"尽量保持其他条件，才能更清楚地比较纸片类型；还应记录可能影响结果的情况。","hint":"只改变要比较的条件。","ability":"实验设计","relatedTo":null,"type":"choice"},{"id":"S39-2","prompt":"如果换纸片的同时移动了灯，结果发生变化，能只凭这次实验确定原因是纸片吗？","options": 的次数 2"],"answer":1,"reason":"第二条写的是“现在的数”；第一步之后现在的数是 5。","hint":"先找第一步执行后的状态。","ability":"读取当前状态","relatedTo":"S43-1","type":"choice"},{"id":"S43-3","prompt":"如果只执行第一条规则，盒子会显示什么？","options":["3","5","10"],"answer":1,"reason":"只执行加 2，3＋2＝5；还没有执行乘 2。","hint":"这次停在第一步之后。","ability":"中间状态","relatedTo":null,"type":"choice"}],"extra":{"id":"S43-X","prompt":"如果初始数改为 4，两条规则及顺序不变，结果是多少？","options":["10","12","14"],"answer":1,"reason":"先 4＋2＝6，再 6×2＝12。","hint":"替换初始数，再按原顺序运行。","ability":"条件变化","relatedTo":"S43-1","type":"choice"},"reflection":"如果要让别人看懂每一步，你会怎样记录初始数和每次结果？","panels":["团团在规则工坊里测试一个数字盒。盒子最初显示 3，规则卡依次写着：“加 2”，","然后“把现在的数乘 2”。每条规则只执行一次。","屏幕上会显示每一步的结果。团团说：“乘 2 时要用刚开始的 3 吧？”","天乐指着规则卡：“它说的是现在的数。”","大家决定先逐步运行，再和一次算出来的结果对照。"]},{"day":44,"title":"两个条件同时成立","story":["工坊用一个模拟盒练习判断规则。卡片写着：只有“指示灯为绿”并且“盖子已合上”，才显示“可以继续”；其他已确认情况显示“先等待”。","今天小禾把指示灯设为绿，但盖子仍打开。团团看到绿灯就想点“可以继续”，天乐请他把两项条件都看完。","这是纸面模拟规则，显示结果只用于这次练习。"],"activity":"条件开关：分别切换灯色和盖子状态，查看按卡片得到的结果。","questions":[{"id":"S44-1","prompt":"绿灯、盖子打开时，按规则显示什么？","options":["可以继续","先等待","无法判断灯的颜色"],"answer":1,"reason":"虽然灯为绿，但盖子未合上；两项没有同时成立。","hint":"逐项检查“并且”前后的条件。","ability":"同时满足","relatedTo":null,"type":"choice"},{"id":"S44-2","prompt":"哪种状态满足“绿灯并且盖子合上”？","options":["绿灯、盖子合上","绿灯、盖子打开","红灯、盖子合上"],"answer":0,"reason":"只有绿灯且盖子合上时，两项条件都成立。","hint":"两项都要检查。","ability":"条件组合","relatedTo":"S44-1","type":"choice"},{"id":"S44-3","prompt":"红灯、盖子打开时，按原规则显示什么？","options":["可以继续","先等待","两种结果同时显示"],"answer":1,"reason":"两项条件均不满足，因此显示先等待。","hint":"先看两项是否都成立。","ability":"规则应用","relatedTo":null,"type":"choice"}],"extra":{"id":"S44-X","prompt":"如果规则改成“绿灯或者盖子合上就可以继续”，绿灯、盖子打开时显示什么？","options":["可以继续","先等待","没有给出规则"],"answer":0,"reason":"“或者”在这里允许至少一项成立；绿灯这一项已成立。","hint":"比较“并且”和“或者”的要求。","ability":"规则变化","relatedTo":"S44-1","type":"choice"},"reflection":"请举一个状态，说明“并且”和“或者”可能得到不同结果。","panels":["工坊用一个模拟盒练习判断规则。卡片写着：只有“指示灯为绿”并且“盖子已合上”，","才显示“可以继续”；其他已确认情况显示“先等待”。","今天小禾把指示灯设为绿，但盖子仍打开。团团看到绿灯就想点“可以继续”，","天乐请他把两项条件都看完。","这是纸面模拟规则，显示结果只用于这次练习。"]},{"day":45,"title":"先后顺序会变吗","story":["工坊有两套数字规则，初始数都是 3。甲方案先加 2 再乘 2；乙方案先乘 2 再加 2。每个操作都对上一步得到的数执行一次。","团团说：“两套都用了加 2 和乘 2，结果一定一样。”小禾把两条运行轨道画在纸上，准备逐步比较。","他们不先猜结论，而是分别记录每一步。"],"activity":"两条执行轨道：逐步运行甲、乙方案，对照每一步和最终数。","questions":[{"id":"S45-1","prompt":"初始数为 3 时，甲和乙的结果分别是多少？","options":["甲 10，乙 8","甲 8，乙 10","甲、乙都是 10"],"answer":0,"reason":"甲是 (3＋2)×2＝10；乙是 3×2＋2＝8。","hint":"按各自的先后顺序算，不交换步骤。","ability":"顺序与结果","relatedTo":null,"type":"choice"},{"id":"S45-2","prompt":"团团“结果一定一样”的说法能否被这次记录支持？","options":["能，两次都使用了同样的操作。","不能，给定初始数下两种顺序得到 10 和 8。","能，因为两个方案都从 3 开始。"],"answer":1,"reason":"这次结果不同，已经足以说明“结果一定一样”不成立。","hint":"比较两次实际结果。","ability":"用反例检查","relatedTo":"S45-1","type":"choice"},{"id":"S45-3","prompt":"甲方案执行完第一步时，盒子里的数是多少？","options":["3","5","6"],"answer":1,"reason":"甲第一步加 2，3＋2＝5。","hint":"只执行甲的第一步。","ability":"中间状态","relatedTo":null,"type":"choice"}],"extra":{"id":"S45-X","prompt":"如果初始数改为 4，甲、乙方案各执行一次，结果差多少？","options":["0","2","4"],"answer":1,"reason":"甲为 (4＋2)×2＝12，乙为 4×2＋2＝10，相差 2。","hint":"先分别求结果，再相减。","ability":"条件变化","relatedTo":"S45-1","type":"choice"},"reflection":"你能设计两步操作，让调换顺序后结果不同吗？说明一个初始数。","panels":["工坊有两套数字规则，初始数都是 3。甲方案先加 2 再乘 2；","乙方案先乘 2 再加 2。每个操作都对上一步得到的数执行一次。","团团说：“两套都用了加 2 和乘 2，结果一定一样。”小禾把两条运行轨道画在纸上，准备逐步比较。","他们不先猜结论，而是分别记录每一步。"]},{"day":46,"title":"重复到什么时候","story":["数字盒最初显示 1。规则写着：“如果当前数还小于 10，就加 3；然后再次检查。当前数达到或超过 10 时停止。”","团团每次执行一步后都记下数字。小禾提醒：“要用更新后的数判断是否继续，达到 10 也要停。”","屏幕每次只执行一步，可以撤回并重新试。"],"activity":"循环计数板：从 1 开始逐步加 3，显示当前数、执行次数和停止条件。","questions":[{"id":"S46-1","prompt":"按规则运行数字盒；到了该停止的时候，点“我完成了”。","options":["2 次","3 次","4 次"],"answer":"loop:3","reason":"数字依次为 1、4、7、10；执行 3 次后达到 10，停止。","hint":"每次加完都重新检查。","ability":"有限循环","relatedTo":null,"type":"loop"},{"id":"S46-2","prompt":"为什么显示 10 时不再继续？","options":["10 已达到停止条件。","10 小于 10。","规则要求必须再加一次。"],"answer":0,"reason":"规则说达到或超过 10 就停止，10 包含在停止范围内。","hint":"留意“达到或超过”。","ability":"边界条件","relatedTo":"S46-1","type":"choice"},{"id":"S46-3","prompt":"执行两次“加 3”后，盒子显示多少？","options":["4","7","10"],"answer":1,"reason":"从 1 出发，第一次到 4，第二次到 7。","hint":"把每次结果写下来。","ability":"过程状态","relatedTo":null,"type":"choice"}],"extra":{"id":"S46-X","prompt":"如果停止条件改为“当前数大于 10”，其余不变，需要执行几次？","options":["3 次","4 次","5 次"],"answer":1,"reason":"到 10 时还不大于 10，需再加一次到 13；共执行 4 次。","hint":"比较“达到 10”和“大于 10”。","ability":"边界变化","relatedTo":"S46-1","type":"choice"},"reflection":"如果每次加 0，而停止条件仍为达到 10，会发生什么？你会怎样让程序停下来？","panels":["数字盒最初显示 1。规则写着：“如果当前数还小于 10，就加 3；然后再次检查。当前数达到或超过 10 时停止。”","团团每次执行一步后都记下数字。小禾提醒：“要用更新后的数判断是否继续，达到 10 也要停。”","屏幕每次只执行一步，可以撤回并重新试。"]},{"day":47,"title":"未知的输入","story":["工坊的模拟卡有两项输入：指示灯是否为绿、盖子是否合上。规则仍是确认两项都满足时，显示“可以继续”。","这次已确认灯为绿，但盖子状态没有检查。卡片用三种标记记录每一项：“是”“否”“尚未确认”。这张卡规定：只要有一项还没确认，就先显示“待核实”；两项都确认后，再判断能否继续。","团团想把“尚未确认”直接当成“否”。小禾说：“它们可能导致同样暂时不能继续，但记录的含义不同。”"],"activity":"输入状态卡：每项选择是、否或尚未确认，保留未知状态；不把未知自动改成否。","questions":[{"id":"S47-1","prompt":"绿灯已确认，盖子尚未检查时，按这张卡显示什么？","options":["可以继续","先等待，盖子已确认没合上","待核实"],"answer":2,"reason":"盖子是必要条件，目前尚未确认，规则要求显示待核实。","hint":"区分“没有检查”和“已经确认不是”。","ability":"未知状态","relatedTo":null,"type":"choice"},{"id":"S47-2","prompt":"如果后来确认盖子没有合上，记录中的状态应怎样写？","options":["否","尚未确认","是"],"answer":0,"reason":"核查结果是没有合上，应记录为“否”；核查前的未知状态可保留在历史记录。","hint":"用新确认的结果更新当前状态。","ability":"核实与更新","relatedTo":"S47-1","type":"choice"},{"id":"S47-3","prompt":"为什么不能把未检查直接记成“否”？","options":["未检查不能说明实际状态。","所有未检查的状态都是“是”。","这张卡没有“否”的选项。"],"answer":0,"reason":"未检查表示信息不足，不证明盖子已经打开或合上。","hint":"想想“没有看到结果”和“看到了否定结果”。","ability":"信息边界","relatedTo":null,"type":"choice"}],"extra":{"id":"S47-X","prompt":"如果灯后来也变成“尚未确认”，盖子确认合上，按这张卡应显示什么？","options":["可以继续","待核实","先等待，灯已确认不是绿"],"answer":1,"reason":"绿灯是必要条件，但现在未知；盖子已合上不能代替灯的确认。","hint":"检查仍未确认的必要条件。","ability":"条件变化","relatedTo":"S47-1","type":"choice"},"reflection":"你会怎样在记录表里表示“尚未检查”，又不和“检查后为否”混淆？","panels":["工坊的模拟卡有两项输入：指示灯是否为绿、盖子是否合上。规则仍是确认两项都满足时，显示“可以继续”。","这次已确认灯为绿，但盖子状态没有检查。卡片用三种标记记录每一项：“是”“否”“尚未确认”。","这张卡规定：只要有一项还没确认，就先显示“待核实”；两项都确认后，再判断能否继续。","团团想把“尚未确认”直接当成“否”。小禾说：“它们可能导致同样暂时不能继续，但记录的含义不同。”"]},{"day":48,"title":"找出反例","story":["工坊整理了三张卡：甲是蓝色圆形，乙是红色方形，丙是蓝色三角形。团团说：“所有蓝色卡都是圆形。”","小禾没有马上评价，而是逐张对照这句话：先找蓝色卡，再看它们是不是圆形。","只要找到一张蓝色却不是圆形的卡，就能说明团团的话有漏洞。这样的例子叫反例。"],"activity":"卡片试验：按颜色和形状筛选，标记支持或反驳某句话的例子。","questions":[{"id":"S48-1","prompt":"哪张卡是“所有蓝色卡都是圆形”的反例？","options":["甲：蓝色圆形","乙：红色方形","丙：蓝色三角形"],"answer":2,"reason":"丙是蓝色，但不是圆形，违反了这句话。","hint":"找蓝色且不是圆形的卡。","ability":"反例","relatedTo":null,"type":"choice"},{"id":"S48-2","prompt":"为什么红色方形的乙不是这句话的反例？","options":["它不是蓝色卡，原话只讨论蓝色卡。","它是圆形。","它没有颜色。"],"answer":0,"reason":"原话限制在蓝色卡，乙为红色，不属于原话讨论范围。","hint":"先看句子讨论的是哪一类卡。","ability":"限定范围","relatedTo":"S48-1","type":"choice"},{"id":"S48-3","prompt":"找到丙之后，能确定“所有卡都是三角形”吗？","options":["能，因为丙是三角形。","不能，甲和乙并不是三角形。","能，因为丙是蓝色。"],"answer":1,"reason":"丙只能反驳原来的说法；甲是圆形、乙是方形，也反驳“所有卡都是三角形”。","hint":"反驳一句话以后，换一个说法也要检查。","ability":"反驳与证明","relatedTo":null,"type":"choice"}],"extra":{"id":"S48-X","prompt":"如果又有一张蓝色圆形的丁卡，团团原话是否因此变成正确？","options":["是，因为丁支持原话。","否，丙仍是蓝色三角形。","是，因为现在有两张圆形卡。"],"answer":1,"reason":"新增支持例子不会消除已有反例；丙仍违反原话。","hint":"先看反例还在不在。","ability":"新增例子","relatedTo":"S48-1","type":"choice"},"reflection":"你能为“所有方形卡都是红色”设计一张可能的反例吗？","panels":["工坊整理了三张卡：甲是蓝色圆形，乙是红色方形，丙是蓝色三角形。","团团说：“所有蓝色卡都是圆形。”","小禾没有马上评价，而是逐张对照这句话：先找蓝色卡，再看它们是不是圆形。","只要找到一张蓝色却不是圆形的卡，就能说明团团的话有漏洞。这样的例子叫反例。"]},{"day":49,"title":"修复规则卡","story":["工坊要为一组卡编写“送出”规则。工作人员给出三张已确认的样例：蓝色方形要送出；蓝色圆形不送出；红色方形也不送出。","团团写下一条规则：“蓝色或者方形就送出。”小禾用三张样例逐一试运行，发现这条规则会多送出一些卡。","大家准备修改规则，并保留这三张样例用于再次检查；没有给出样例的其他情况仍需进一步确认。"],"activity":"规则编辑与回放：切换“并且/或者”，逐张显示输入条件和结果；允许查看每一步。","questions":[{"id":"S49-1","prompt":"修改颜色、形状和连接词，让规则符合三张样例。","options":["蓝色并且方形才送出。","蓝色或者方形就送出。","只要是圆形就送出。"],"answer":"blue&square","reason":"蓝色方形同时满足两项；蓝色圆形和红色方形各缺一项，都不送出。","hint":"把三张样例逐一代入规则。","ability":"规则与样例","relatedTo":null,"type":"rule"},{"id":"S49-2","prompt":"为什么“蓝色或者方形就送出”不符合样例？","options":["蓝色圆形和红色方形也会被送出。","蓝色方形不会被送出。","三张样例都没有颜色。"],"answer":0,"reason":"“或者”允许任一条件成立；蓝色圆形符合蓝色，红色方形符合方形，但样例要求它们不送出。","hint":"分别试蓝色圆形和红色方形。","ability":"反例验证","relatedTo":"S49-1","type":"choice"},{"id":"S49-3","prompt":"三张样例都符合修改后的规则，是否证明所有未给出的情况也已经核实？","options":["是，不需要再检查。","否，尚未给出的情况仍需进一步确认。","是，因为三张样例都有形状。"],"answer":1,"reason":"现在只知道这三种卡应该怎样处理；其他卡应该送出还是留下，还需要工作人员确认。","hint":"留意样例覆盖了哪些情况。","ability":"测试覆盖","relatedTo":null,"type":"choice"}],"extra":{"id":"S49-X","prompt":"若后来确认红色圆形也不送出，蓝色并且方形规则是否与这条新样例一致？","options":["一致，红色圆形不同时满足两项。","不一致，红色圆形同时满足两项。","无法运行，因为没有规则。"],"answer":0,"reason":"红色圆形既不是蓝色也不是方形，按“并且”规则不送出，与新样例一致。","hint":"分别核对颜色和形状。","ability":"新增样例","relatedTo":"S49-1","type":"choice"},"reflection":"你还会提出哪张新卡，帮助检查这条规则？说明你想核对什么。","panels":["工坊要为一组卡编写“送出”规则。工作人员给出三张已确认的样例：蓝色方形要送出；","蓝色圆形不送出；红色方形也不送出。","团团写下一条规则：“蓝色或者方形就送出。”小禾用三张样例逐一试运行，","发现这条规则会多送出一些卡。","大家准备修改规则，并保留这三张样例用于再次检查；没有给出样例的其他情况仍需进一步确认。"]},{"day":50,"title":"留下三节备用","story":["观察馆要布置一个可以照出影子的角落。桌上有 10 节同样的电池，每支小手电要装 2 节。工作人员要求先留下 3 节备用，不能把备用电池装进手电。","团团排出五支手电：“正好装完！”小禾把备用盒推过来：“先把答应留下的电池放进去。”","天乐准备画一张分配表：备用盒、手电、没有用上的电池，都要记清楚。"],"activity":"电池分配板：先选手电数量，分别显示手电用量、备用三节和剩余数量；可以撤回。","questions":[{"id":"S50-1","prompt":"保留 3 节备用后，最多能同时装好几支手电？","options":["3 支","4 支","5 支"],"answer":0,"reason":"能用于手电的电池有 10－3＝7 节；3 支用 6 节，4 支要 8 节，所以最多 3 支。","hint":"先留下备用电池，再按每支 2 节分配。","ability":"余量与约束","relatedTo":null,"type":"choice"},{"id":"S50-2","prompt":"装好最多的手电后，桌上还没装进手电的电池怎样记录？","options":["备用 3 节，另外剩 1 节。","备用 1 节，另外剩 3 节。","备用 3 节，没有其他剩余。"],"answer":0,"reason":"3 支手电用 6 节，共留下 4 节；其中 3 节是约定备用，另有 1 节未使用。","hint":"总数要对上，也要分清每一部分的用途。","ability":"分配账目","relatedTo":"S50-1","type":"choice"},{"id":"S50-3","prompt":"团团想让 4 支手电同时亮着，又不动备用的 3 节。至少还需要补几节？","options":["1 节","2 节","3 节"],"answer":0,"reason":"4 支要 8 节，加上备用 3 节共要 11 节；现在有 10 节，还差 1 节。","hint":"把手电和备用两部分都算进去。","ability":"反向规划","relatedTo":null,"type":"choice"}],"extra":{"id":"S50-X","prompt":"若总数仍是 10 节，备用要求改成至少 4 节，最多的手电数量会怎样？","options":["仍是 3 支","变成 2 支","变成 4 支"],"answer":0,"reason":"10－4＝6，正好装 3 支；备用要求变化了，但这次最大支数没有变。","hint":"分别计算改动前后可以使用的电池。","ability":"阈值变化","relatedTo":"S50-1","type":"choice"},"reflection":"不计算每一支的细节，你会怎样向团团解释为什么不能直接用 10 除以 2？","panels":["观察馆要布置一个可以照出影子的角落。桌上有 10 节同样的电池，","每支小手电要装 2 节。工作人员要求先留下 3 节备用，","不能把备用电池装进手电。","团团排出五支手电：“正好装完！”小禾把备用盒推过来：“先把答应留下的电池放进去。”","天乐准备画一张分配表：备用盒、手电、没有用上的电池，都要记清楚。"]},{"day":51,"title":"数量一样，盒子不一样","story":["展台需要 6 张卡片。材料柜有两种包装：甲包每盒 3 张，乙包每盒 2 张，盒子都要完整取走。两种卡片大小和用途相同。","小禾取了 2 盒甲包，团团取了 3 盒乙包。两人都说自己正好拿够了。工作人员又提醒：“这次运输盘最多摆 2 盒。”","天乐把“卡片够不够”和“盒子放不放得下”分成两行检查。"],"activity":"包装盘：选择甲乙包装盒数，分别统计盒数和卡片数；运输盘限两盒。","questions":[{"id":"S51-1","prompt":"按故事中的两种拿法，谁正好拿到 6 张卡片？","options":["只有小禾","只有团团","两人都拿到了"],"answer":2,"reason":"小禾拿 2×3＝6 张，团团拿 3×2＝6 张；卡片数相同，盒数不同。","hint":"分别算每盒张数乘以盒数。","ability":"分组数量","relatedTo":null,"type":"choice"},{"id":"S51-2","prompt":"还要满足运输盘最多摆 2 盒，哪一种拿法可一次运完？","options":["2 盒甲包","3 盒乙包","两种拿法都可一次运完"],"answer":0,"reason":"两种拿法都有 6 张，但只有 2 盒甲包不超过两盒的限制。","hint":"卡片数和盒数要同时满足要求。","ability":"双重约束","relatedTo":"S51-1","type":"choice"},{"id":"S51-3","prompt":"团团改成拿 1 盒甲包和 1 盒乙包。这次哪里还不符合要求？","options":["有 2 盒但只有 5 张。","有 6 张但超过 2 盒。","有 5 张且超过 2 盒。"],"answer":0,"reason":"盒数为 1＋1＝2，符合限额；卡片数为 3＋2＝5，比所需少 1 张。","hint":"把两个条件分别算清楚。","ability":"定位缺口","relatedTo":null,"type":"choice"}],"extra":{"id":"S51-X","prompt":"如果需求改成 5 张、最多仍运 2 盒，而且不能多拿，怎样取？","options":["1 盒甲包和 1 盒乙包","2 盒甲包","2 盒乙包"],"answer":0,"reason":"3＋2＝5，正好两盒；两个甲包是 6 张，两个乙包是 4 张。","hint":"这次要求正好 5 张。","ability":"条件替换","relatedTo":"S51-2","type":"choice"},"reflection":"如果运输盘可以放 3 盒，你会怎样改写给两人的建议？","panels":["展台需要 6 张卡片。材料柜有两种包装：甲包每盒 3 张，","乙包每盒 2 张，盒子都要完整取走。两种卡片大小和用途相同。","小禾取了 2 盒甲包，团团取了 3 盒乙包。两人都说自己正好拿够了。","工作人员又提醒：“这次运输盘最多摆 2 盒。”","天乐把“卡片够不够”和“盒子放不放得下”分成两行检查。"]},{"day":52,"title":"六张卡片怎么买","story":["卡片兑换柜改用了积分：4 张装一包要 5 分，2 张装一包要 3 分，单张要 2 分。可以组合兑换，每种都有足够库存。","这次必须正好拿到 6 张，不能多拿。团团先拿三包 2 张装，小禾却想试试不同大小的包装。","天乐准备把能凑成 6 张的买法列出来，找出花分最少的一种。"],"activity":"兑换清单：增减四张包、两张包和单张，显示卡片总数与积分；不把多拿的方案当成正好完成。","questions":[{"id":"S52-1","prompt":"在兑换清单上凑出正好 6 张卡片，并尽量少花积分。","options":["四张包：5 分","两张包：3 分","单张：2 分"],"answer":"packs:1,1,0","reason":"一个四张包加一个两张包，正好 6 张，花 8 分。有四张包时，余下两张至少花 3 分；没有四张包时，三个两张包最省，要花 9 分。因此 8 分最少。","hint":"先核对卡片数，再比较总积分。","ability":"组合成本","relatedTo":null,"type":"purchase"},{"id":"S52-2","prompt":"有人提出买 2 包四张装，理由是每包的单张价格低。这符合本次要求吗？","options":["符合，总积分只要 10 分。","不符合，会拿到 8 张。","不符合，只会拿到 4 张。"],"answer":1,"reason":"两包四张装共 8 张；题目要求正好 6 张，不能只比较单价而忽略数量。","hint":"题目允许多拿吗？","ability":"目标约束","relatedTo":"S52-1","type":"choice"},{"id":"S52-3","prompt":"如果只能花 7 分，在原价格下能正好拿到 6 张吗？","options":["能，用 1 包四张装加 2 张单张。","能，用 2 包两张装加 2 张单张。","不能，最便宜也要 8 分。"],"answer":2,"reason":"有四张包时还差两张，至少再花 3 分，共 8 分；没有四张包，三包两张装已是最省的 9 分，改单张只会更贵。","hint":"先分成“有四张包”和“没有四张包”两种情况。","ability":"排除所有方案","relatedTo":null,"type":"choice"}],"extra":{"id":"S52-X","prompt":"若四张包涨到 7 分，其他价格不变，正好兑换 6 张，至少要花多少积分？","options":["8 分","9 分","10 分"],"answer":1,"reason":"这时四张包加两张包要 10 分，三包两张装要 9 分；其他组合更贵。","hint":"用新价格重新比较，不能沿用原来的答案。","ability":"价格变化","relatedTo":"S52-1","type":"choice"},"reflection":"你会怎样列清单，说明自己没有漏掉一种更省的买法？","panels":["卡片兑换柜改用了积分：4 张装一包要 5 分，2 张装一包要 3 分，","单张要 2 分。可以组合兑换，每种都有足够库存。","这次必须正好拿到 6 张，不能多拿。团团先拿三包 2 张装，","小禾却想试试不同大小的包装。","天乐准备把能凑成 6 张的买法列出来，找出花分最少的一种。"]},{"day":53,"title":"不能花掉的三分","story":["展台小组共有 15 分。灯架必须兑换，花 6 分；记录本也必须兑换，花 4 分。负责人还要求至少留下 3 分，处理当天临时缺少的材料。","装饰柜有彩带 2 分、贴纸 3 分、海报 4 分。三种装饰都不是必需品，最多选一种。","团团看见 15－6－4＝5，就想拿海报。天乐请他再看一眼“至少留下 3 分”的便条。"],"activity":"预算清单：固定必需品、设置备用积分，再选择装饰；分别列出已用和可用。","questions":[{"id":"S53-1","prompt":"买好两件必需品并留下至少 3 分，最多还能花几分买装饰？","options":["2 分","3 分","5 分"],"answer":0,"reason":"必需品共 10 分，至少再留 3 分，所以装饰最多用 15－10－3＝2 分。","hint":"备用积分不能当成可花余额。","ability":"受限预算","relatedTo":null,"type":"choice"},{"id":"S53-2","prompt":"如果想选一种装饰，哪件符合全部要求？","options":["彩带","贴纸","海报"],"answer":0,"reason":"彩带花 2 分，最后留 3 分；贴纸会只留 2 分，海报会只留 1 分。","hint":"逐个检查最后剩下多少。","ability":"方案筛选","relatedTo":"S53-1","type":"choice"},{"id":"S53-3","prompt":"团团选海报时，哪一项要求被漏掉了？","options":["必须兑换灯架。","必须兑换记录本。","至少留 3 分备用。"],"answer":2,"reason":"团团的 15－6－4 已扣除了灯架和记录本，但把全部余下 5 分都当成可以花的积分。","hint":"看他的算式已经考虑了哪些条件。","ability":"追踪推理","relatedTo":null,"type":"choice"}],"extra":{"id":" ,"options":["已领取两件，因为计划金额正好是 8 分。","计划兑换两件，领取结果待确认。","确定没有领取，因为没有签字。"],"answer":1,"reason":"计划能说明要拿什么，缺少确认不能证明已经领到，也不能证明一定没领到。","hint":"把计划、已确认和仍不知道的事分开。","ability":"计划与完成","relatedTo":"S56-1","type":"choice"},{"id":"S56-3","prompt":"下一位同伴要确认底板任务是否完成，最直接应查什么？","options":["这两件的领取记录或柜台确认。","第一笔预算的彩带价格。","昨天有没有红底板。"],"answer":0,"reason":"与这次两件材料对应的领取记录，才能直接帮助确认任务是否完成。","hint":"找与当前待确认事项对应的证据。","ability":"交接追踪","relatedTo":null,"type":"choice"}],"extra":{"id":"S56-X","prompt":"如果领取记录确认只拿到了蓝底板、花了 4 分，专用的 8 分预算还剩多少，接下来缺什么？","options":["剩 4 分，缺标签。","剩 3 分，缺彩带。","剩 0 分，两件都拿到了。"],"answer":0,"reason":"专用预算 8－4＝4 分，足够按原价拿标签；第一笔的 3 分备用不参与这次计算。","hint":"继续按两笔预算分开算。","ability":"更新交接","relatedTo":"S56-2","type":"choice"},"reflection":"给下一位同伴写两句话：一句说明已完成的事，一句说明他还需要确认什么。","panels":["天乐准备把布展任务交给下一位同伴。已兑换的材料有：灯架 6 分、记录本 4 分、彩带 2 分；","原来共有 15 分，还剩 3 分备用。","另一张“底板计划”写着：蓝底板 4 分、标签 4 分，使用另一笔专门的 8 分。","工作人员还没签字确认这两件已经领到，不能把计划直接写成“已领取”。","小禾建议交接卡分成“已经完成”和“还要确认”，并注明每笔积分属于哪张清单，免得算在一起。"]},{"day":57,"title":"三句话，三种来路","story":["纸鸟展快开门了，装纸鸟的蓝箱却不在原来的桌上。小禾说：“八点十分，我亲眼看见一个关着盖子的蓝箱，放在东门旁。”她没有打开箱子。","团团说：“小禾告诉我，八点十分东门旁有个蓝箱。”天乐想：“也许工作人员把箱子搬去布展了。”","三句话都值得记下来，但它们的来路不同。天乐在记录本上留出三栏：亲眼观察、转述、猜想。"],"activity":"信息来源板：给三句话分别选择来源；选择本身是作答，听读另记。","questions":[{"id":"S57-1","prompt":"给三句话标明来路，可以修改后再提交。","options":["亲眼观察","转述","猜想"],"answer":[0,1,2],"reason":"小禾描述自己看见的事；团团说的是小禾告诉他的事；天乐提出了一种可能，还没有证据确认。","hint":"看说话的人是亲眼见到、听别人说，还是提出一种可能。","ability":"区分信息来源","relatedTo":null,"type":"classification","items":["小禾：八点十分，我看见蓝箱在东门旁。","团团：小禾告诉我，蓝箱在东门旁。","天乐：也许工作人员搬箱子去布展了。"]},{"id":"S57-2","prompt":"只根据小禾的观察，哪一句最稳妥？","options":["八点十分，东门旁有一个蓝箱。","现在蓝箱仍在东门旁。","蓝箱里一定装着全部纸鸟。"],"answer":0,"reason":"她记录了某个时间的箱子位置，没有检查里面，也没有一直看守箱子。","hint":"观察的时间和范围是什么？","ability":"限定结论","relatedTo":"S57-1","type":"choice"},{"id":"S57-3","prompt":"小禾和团团都提到东门，能算两个人各自看见过吗？","options":["能，两个人说了相同的话。","不能，团团的消息来自小禾。","不能，所以小禾的观察也没有用。"],"answer":1,"reason":"团团转述同一条消息，没有新增一次独立观察；这不等于原观察无用。","hint":"沿着消息的来路往回找。","ability":"避免重复计证","relatedTo":null,"type":"choice"}],"extra":{"id":"S57-X","prompt":"团团随后亲眼看见蓝箱，记下“八点十五分在东门旁”。这条新记录增加了什么？","options":["八点十五分的一次独立观察。","证明蓝箱整天都没移动。","证明箱子里一定有纸鸟。"],"answer":0,"reason":"新观察提供另一个时刻的位置，仍没有证明整天的位置或箱内物品。","hint":"新增了哪个时间、哪一位观察者？","ability":"新证据的边界","relatedTo":"S57-3","type":"choice"},"reflection":"你今天听到过一句值得核实的话吗？可以说说该找谁、查什么。","panels":["纸鸟展快开门了，装纸鸟的蓝箱却不在原来的桌上。小禾说：“八点十分，我亲眼看见一个关着盖子的蓝箱，放在东门旁。”","她没有打开箱子。","团团说：“小禾告诉我，八点十分东门旁有个蓝箱。”天乐想：“也许工作人员把箱子搬去布展了。”","三句话都值得记下来，但它们的来路不同。天乐在记录本上留出三栏：亲眼观察、转述、猜想。"]},{"day":58,"title":"搬运单上的小差别","story":["值班桌上有两张搬运单。甲单写着：“今天八点十五分，蓝箱，纸鸟，送往西厅。”乙单写着：“今天八点十五分，红箱，纸鱼，送往东厅。”","团团只看见两张单上的时间一样，就把它们当成同一次搬运。小禾用手指沿着颜色、物品和目的地逐行对照。","单子记录的是搬运安排，送达栏都还空着。天乐准备先找到与蓝箱对应的单子，再查送达结果。"],"activity":"搬运单对照：逐张展开时间、箱色、物品和目的地；送达状态保持待确认。","questions":[{"id":"S58-1","prompt":"要追查装纸鸟的蓝箱，应该先看哪张搬运单？","options":["甲单","乙单","两张单的物品相同，任选一张。"],"answer":0,"reason":"甲单同时对应蓝箱和纸鸟；相同时间不能抵消物品的差别。","hint":"不要只核对时间。","ability":"匹配对象","relatedTo":null,"type":"choice"},{"id":"S58-2","prompt":"两张单写着同一时间，为什么仍不能当成同一次搬运？","options":["因为纸鸟和纸鱼发音不同。","因为箱色、物品和目的地都不同。","因为搬运单不可能写相同时间。"],"answer":1,"reason":"同一时间可以有不同搬运任务，应同时核对任务对象和目的地。","hint":"哪些字段指向了不同任务？","ability":"多字段核对","relatedTo":"S58-1","type":"choice"},{"id":"S58-3","prompt":"甲单能直接证明蓝箱已经到了西厅吗？","options":["能，目的地已经写好了。","不能，目前只有安排，送达结果待确认。","不能，所以蓝箱一定还在东门。"],"answer":1,"reason":"安排说明要送往哪里；空着的送达栏既不能证明已经送到，也不能证明还没出发。","hint":"把安排和实际结果分开。","ability":"计划与证据","relatedTo":null,"type":"choice"}],"extra":{"id":"S58-X","prompt":"再仔细看，甲单的日期其实是明天。它能直接说明今天蓝箱去哪儿了吗？","options":["能，颜色和物品都相同。","不能，还要找今天的记录。","能，只要搬运时间相同就行。"],"answer":1,"reason":"对象相同而日期不同，仍不能直接用于今天的任务。","hint":"同一件东西可能有不同日期的安排。","ability":"日期适用范围","relatedTo":"S58-1","type":"choice"},"reflection":"除了日期和时间，你会在搬运单上核对哪两项？为什么？","panels":["值班桌上有两张搬运单。甲单写着：“今天八点十五分，蓝箱，纸鸟，送往西厅。”","乙单写着：“今天八点十五分，红箱，纸鱼，送往东厅。”","团团只看见两张单上的时间一样，就把它们当成同一次搬运。小禾用手指沿着颜色、物品和目的地逐行对照。","单子记录的是搬运安排，送达栏都还空着。天乐准备先找到与蓝箱对应的单子，再查送达结果。"]},{"day":59,"title":"没打开的七只纸鸟","story":["蓝箱找到了，里面共有 12 只纸鸟。天乐已经看清其中 5 只：3 只蓝色、2 只红色。其余 7 只还包在纸里，颜色不知道。","团团准备写“全箱只有 3 只蓝鸟”。小禾拦住他：“没打开的七只，也可能有蓝色呀。”","天乐没有猜一个数填上去，而是先记录已经确定的数量，再想想蓝鸟最多可能有几只。"],"activity":"未知数量板：假设未查看的七只里有几只蓝鸟，观察总数范围；假设不改写观察记录。","questions":[{"id":"S59-1","prompt":"现在能确定，全箱至少有几只蓝鸟？","options":["3 只","5 只","10 只"],"answer":0,"reason":"已经看见的 3 只蓝鸟一定存在；没打开的纸鸟不必都是蓝色。","hint":"先数已经确认的蓝鸟。","ability":"数量下界","relatedTo":null,"type":"choice"},{"id":"S59-2","prompt":"在还没打开其余 7 只之前，蓝鸟最多可能有几只？","options":["7 只","10 只","12 只"],"answer":1,"reason":"如果未知的 7 只全是蓝色，蓝鸟共有 3＋7＝10 只；已确认的 2 只红鸟不能算蓝鸟。","hint":"把未知部分都设成蓝色试一试。","ability":"数量上界","relatedTo":"S59-1","type":"choice"},{"id":"S59-3","prompt":"“全箱只有 3 只蓝鸟”现在能确认吗？","options":["能，已经看见了 3 只。","不能，还没查看的可能也有蓝鸟。","不能，因为蓝鸟一定有 10 只。"],"answer":1,"reason":"3 是已知下限，10 是可能上限，不能把任一个可能值当成已经查清的总数。","hint":"“至少”“最多”和“正好”一样吗？","ability":"不把未知当零","relatedTo":null,"type":"choice"}],"extra":{"id":"S59-X","prompt":"又打开 4 只，发现全是红色。还有 3 只没打开，这时蓝鸟最多可能有几只？","options":["3 只","6 只","10 只"],"answer":1,"reason":"原有 3 只蓝鸟，加上仍未知的最多 3 只，合计最多 6 只。","hint":"只把仍然未知的部分留在范围里。","ability":"更新范围","relatedTo":"S59-2","type":"choice"},"reflection":"如果不让你猜颜色，你会怎样准确地描述现在知道了多少？","panels":["蓝箱找到了，里面共有 12 只纸鸟。天乐已经看清其中 5 只：3 只蓝色、2 只红色。","其余 7 只还包在纸里，颜色不知道。","团团准备写“全箱只有 3 只蓝鸟”。小禾拦住他：“没打开的七只，也可能有蓝色呀。”","天乐没有猜一个数填上去，而是先记录已经确定的数量，再想想蓝鸟最多可能有几只。"]},{"day":60,"title":"两个人都可能没看错","story":["小禾记下：“八点十分，编号 B17 的蓝箱在东门。”团团记下：“八点三十分，编号 B17 的蓝箱在西厅。”他们争了起来。","工作人员拿出已签字的搬运记录：八点二十分从东门取走 B17，八点二十五分送达西厅。","天乐把三个关键时刻写在卡片上。箱子可能移动，描述不同时刻的话未必互相冲突。"],"activity":"时间卡片排序：按事件时间点选，卡片随顺序移动；支持撤回。","questions":[{"id":"S60-1","prompt":"把这三件事按时间先后排好。","options":["八点二十五分，送达西厅。","八点十分，小禾在东门看见 B17。","八点二十分，从东门取走。"],"answer":[1,2,0],"reason":"八点十分早于八点二十分，之后是八点二十五分；这一顺序与搬运记录吻合。","hint":"先比较时间，再核对事件。","ability":"时间线重建","relatedTo":null,"type":"order"},{"id":"S60-2","prompt":"两人的位置记录是否一定有一条错了？","options":["一定，因为同一个箱子不能在两个地方。","不一定，他们记录的时刻不同。","一定，因为后说的人总是错的。"],"answer":1,"reason":"同一箱子可以在不同时刻出现在不同地点，不能忽略时间。","hint":"他们是否在描述同一个时刻？","ability":"区分时点","relatedTo":"S60-1","type":"choice"},{"id":"S60-3","prompt":"新找到的搬运记录对这件事有什么帮助？","options":["说明箱子移动的过程，与两人的观察相容。","证明小禾根本没看见箱子。","证明箱子在西厅从未离开。"],"answer":0,"reason":"八点二十五分已送到，能与八点三十分的观察相接，也不否定八点十分在东门。","hint":"把新记录放到两个观察时刻之间。","ability":"整合证据","relatedTo":null,"type":"choice"}],"extra":{"id":"S60-X","prompt":"如果两人都写“八点十分”，又确认编号相同，却写了两个不同地点，下一步怎么做？","options":["任选一个人相信。","先核对原始记录、计时和编号。","把两个地点合成一个地点。"],"answer":1,"reason":"同一时刻的冲突需要核查，不能仅凭谁说得响或谁先说来裁定。","hint":"先查能帮助消除冲突的原始信息。","ability":"处理冲突","relatedTo":"S60-2","type":"choice"},"reflection":"你能举一个“两句话看起来不同，却都可能是真的”的例子吗？","panels":["小禾记下：“八点十分，编号 B17 的蓝箱在东门。”团团记下：“八点三十分，编号 B17 的蓝箱在西厅。”他们争了起来。","工作人员拿出已签字的搬运记录：八点二十分从东门取走 B17，八点二十五分送达西厅。","天乐把三个关键时刻写在卡片上。箱子可能移动，描述不同时刻的话未必互相冲突。"]},{"day":61,"title":"一张卡就够了吗","story":["九点整，小禾检查了三个箱子：东门有一个蓝箱，西厅有一个蓝箱和一个红箱。其他地方还没有检查。","广播稿却写着：“所有蓝箱都在西厅。”团团拿出西厅蓝箱的照片，想用它证明这句话。","天乐找出东门蓝箱的记录：“先看这张。判断‘所有’，只找一个符合的例子可不够。”"],"activity":"证据卡比较：选择同一时刻的箱色与地点，检查全称说法；不补造未查地点的记录。","questions":[{"id":"S61-1","prompt":"哪张记录足以说明“所有蓝箱都在西厅”不对？","options":["九点整，东门有蓝箱。","九点整，西厅有蓝箱。","九点整，西厅有红箱。"],"answer":0,"reason":"东门的蓝箱就是一个不在西厅的蓝箱，足以推翻“所有蓝箱都在西厅”。","hint":"找符合“蓝箱”，却不符合“在西厅”的例子。","ability":"寻找反例","relatedTo":null,"type":"choice"},{"id":"S61-2","prompt":"看见西厅有一个红箱，就能说所有红箱都在西厅吗？","options":["能，一个例子就够了。","不能，其他地方还没有查完。","不能，所以所有红箱都在东门。"],"answer":1,"reason":"一条符合的记录不能覆盖尚未检查的地点，也不能反过来推出相反的全称说法。","hint":"还缺少哪些范围的观察？","ability":"证据覆盖","relatedTo":"S61-1","type":"choice"},{"id":"S61-3","prompt":"根据现有记录，哪句适合写入广播稿？","options":["蓝箱只出现在西厅。","九点整，东门和西厅都记录到蓝箱。","九点整，所有箱子都已找到。"],"answer":1,"reason":"这句话保留了观察时间和已查地点，没有把有限记录扩大成全部情况。","hint":"尽量准确，也不要超出已经查到的范围。","ability":"限定表述","relatedTo":null,"type":"choice"}],"extra":{"id":"S61-X","prompt":"后来又找到三张西厅蓝箱的照片，能抵消九点整东门那只蓝箱的反例吗？","options":["能，多数照片在西厅。","不能，东门的蓝箱仍使原话不成立。","能，只要西厅蓝箱数量更多。"],"answer":1,"reason":"“所有”不是“多数”；只要同一范围内仍有一个反例，更多符合例子就不能把原话变真。","hint":"原话说的是多数，还是全部？","ability":"反例的作用","relatedTo":"S61-1","type":"choice"},"reflection":"把“所有蓝箱都在西厅”改成一句既有用、又有证据支持的话。","panels":["九点整，小禾检查了三个箱子：东门有一个蓝箱，西厅有一个蓝箱和一个红箱。其他地方还没有检查。","广播稿却写着：“所有蓝箱都在西厅。”团团拿出西厅蓝箱的照片，想用它证明这句话。","天乐找出东门蓝箱的记录：“先看这张。判断‘所有’，只找一个符合的例子可不够。”"]},{"day":62,"title":"最新一句，不一定最准","story":["老师十点确认：纸鸟展十一点在西厅开始。十点十分，老师又发来更正：开始时间不变，地点改到北厅。","十点十二分，团团听见有人说“好像还是西厅”，但不知道这句话从哪里来，也没有找到新的通知。","天乐准备更新广播稿。他把确认通知和未核实的传言分别放好，没有只按“哪句话说得晚”来决定。"],"activity":"通知版本板：查看时间、发布者、是否确认和改动字段；旧版本保留。","questions":[{"id":"S62-1","prompt":"现在广播稿应采用哪项已确认安排？","options":["十一点，北厅。","十一点，西厅。","十点十二分，西厅。"],"answer":0,"reason":"老师的更正保留十一点开始，只改为北厅；后来那句传言没有得到确认。","hint":"最新的已确认更正改变了什么？","ability":"按证据更新","relatedTo":null,"type":"choice"},{"id":"S62-2","prompt":"为什么不能直接采用十点十二分听到的那句话？","options":["因为所有转述都一定是假的。","因为时间虽晚，来源和是否更新安排仍未核实。","因为通知过一次就永远不能改。"],"answer":1,"reason":"晚出现不等于已经确认；仍应核对来源、对象及是否确为新安排。","hint":"除了时间，还应核对什么？","ability":"评估消息","relatedTo":"S62-1","type":"choice"},{"id":"S62-3","prompt":"十点的旧通知怎样处理更合适？","options":["删掉，假装从未说过西厅。","保留并标明已被十点十分的更正替代。","和新通知一起当作当前安排。"],"answer":1,"reason":"保留旧通知能追踪变更，但应清楚标注当前有效版本，避免同时当作现行安排。","hint":"既要避免误用，也要能查清变动。","ability":"版本追踪","relatedTo":null,"type":"choice"}],"extra":{"id":"S62-X","prompt":"十点二十分，老师确认地点仍在北厅，但改为十一点半开始。应该改哪一项？","options":["只把开始时间改为十一点半。","只把地点改回西厅。","地点和时间都照十点的旧通知。"],"answer":0,"reason":"这次更正只改变时间，地点继续沿用已确认的北厅。","hint":"每次只按明确改动更新对应内容。","ability":"字段更新","relatedTo":"S62-1","type":"choice"},"reflection":"给广播员设计一个小标记，让他一眼知道哪张通知正在使用。","panels":["老师十点确认：纸鸟展十一点在西厅开始。十点十分，老师又发来更正：开始时间不变，地点改到北厅。","十点十二分，团团听见有人说“好像还是西厅”，但不知道这句话从哪里来，也没有找到新的通知。","天乐准备更新广播稿。他把确认通知和未核实的传言分别放好，","没有只按“哪句话说得晚”来决定。"]},{"day":63,"title":"让广播说清楚","story":["老师已确认：今天十一点，纸鸟展在北厅开始。十点三十分，天乐清点展台，看到 8 只纸鸟已经摆好。","准备清单上共有 12 只，其中另外 4 只是否已经送来还没查清。团团想在广播里说“十二只纸鸟全部就位”。","天乐请小禾先查那四只的送达情况。广播可以先说清楚已确认的安排，清点记录则保留时间和仍待确认的数量。"],"activity":"广播核对卡：分别查看活动安排、清点记录、未确认项目；更新时保留旧时点。","questions":[{"id":"S63-1","prompt":"现在可以确定写进广播的活动安排是哪句？","options":["今天十一点，北厅举行纸鸟展。","今天十一点，西厅举行纸鸟展。","今天十点半，北厅已经开始纸鸟展。"],"answer":0,"reason":"地点和开始时间来自老师的确认；十点半是清点时间，不是展览开始时间。","hint":"不要把不同事件的时间混在一起。","ability":"信息合成","relatedTo":null,"type":"choice"},{"id":"S63-2","prompt":"十点三十分的清点记录，怎样写才准确？","options":["12 只已全部摆好。","已看见 8 只摆好，另外 4 只待确认。","另外 4 只一定丢失了。"],"answer":1,"reason":"准备数量不等于摆好数量；未确认也不等于丢失。","hint":"分清已看见、准备数和待查事项。","ability":"数量与状态","relatedTo":"S63-1","type":"choice"},{"id":"S63-3","prompt":"下一步怎样才能有效补全这份记录？","options":["把 8 擦掉，照准备清单写 12。","查另外 4 只的实际位置，并记下核实时间。","问哪个数字看起来更整齐。"],"answer":1,"reason":"查实缺口、记录时间，才能形成新的清点结果；不能用计划数直接覆盖观察。","hint":"新证据应回答哪个尚未确认的问题？","ability":"设计核查","relatedTo":null,"type":"choice"}],"extra":{"id":"S63-X","prompt":"十点四十分，确认另外 4 只也已摆好，原有 8 只仍在。怎样更新？","options":["新增“十点四十分共 12 只”，保留十点半的记录。","把十点半的 8 改成 12，不写新时间。","仍只写 8，因为旧记录不能有后续。"],"answer":0,"reason":"新的清点支持新的时点记录，不应倒改十点半实际观察到的数量。","hint":"保存原观察，再添加新结果。","ability":"保留变化轨迹","relatedTo":"S63-2","type":"choice"},"reflection":"替天乐写两句话：一句用于广播，一句留给继续核查的同伴。","panels":["老师已确认：今天十一点，纸鸟展在北厅开始。十点三十分，天乐清点展台，","看到 8 只纸鸟已经摆好。","准备清单上共有 12 只，其中另外 4 只是否已经送来还没查清。","团团想在广播里说“十二只纸鸟全部就位”。","天乐请小禾先查那四只的送达情况。广播可以先说清楚已确认的安排，","清点记录则保留时间和仍待确认的数量。"]},{"day":64,"title":"接起来，为什么短了一点","story":["纸桥工坊里有两条直纸条，分别长 3 厘米和 4 厘米。它们沿同一直线摆放，不能剪短，也不能留空隙。","如果两条纸条首尾相接，总长就是 7 厘米。可这次模型只需要 6 厘米长，工作人员允许把接头处叠在一起。","团团说：“长出来的那一厘米可以藏到接头里。”天乐想自己移动纸条，检查重叠多少才合适。"],"activity":"纸条拼接板：调整重叠长度，显示各纸条端点与整体长度；由孩子决定何时提交。","questions":[{"id":"S64-1","prompt":"调整接头，让两条纸条拼出的整体正好长 6 厘米。","options":["不重叠","重叠 1 厘米","重叠 2 厘米"],"answer":"overlap:1","reason":"两条纸条相加为 7 厘米；重叠的 1 厘米在相加时算了两遍，整体应只算一次，所以总长是 6 厘米。","hint":"画出重叠的那一段，看看是否被数了两次。","ability":"重叠长度","relatedTo":null,"type":"strip"},{"id":"S64-2","prompt":"如果重叠 2 厘米，整体会长多少？","options":["5 厘米","6 厘米","9 厘米"],"answer":0,"reason":"3＋4－2＝5 厘米；重叠越多，整体越短。","hint":"从相加的长度里减去多算的一段。","ability":"调整后重算","relatedTo":"S64-1","type":"choice"},{"id":"S64-3","prompt":"为什么不能始终把 3＋4 当作拼好后的总长？","options":["纸条的厘米会变小。","相加时可能把接头处算了两遍。","两条纸条的长度无法测量。"],"answer":1,"reason":"单条长度未变，但整体覆盖的长度取决于是否重叠；相同的一段不能重复计算。","hint":"单条长度和整体覆盖长度是同一个量吗？","ability":"解释重复计数","relatedTo":null,"type":"choice"}],"extra":{"id":"S64-X","prompt":"如果一端完全重合，让 3 厘米纸条全部叠在 4 厘米纸条上，整体长多少？","options":["1 厘米","4 厘米",
