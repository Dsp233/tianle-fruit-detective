经满足两项，所以算完成。","还不合格，需要调整位置或朝向。","说明六格长方形根本不可能。"],"answer":1,"reason":"必须同时满足全部要求；一个方案失败也不等于所有方案都失败。","hint":"是哪一项还没有满足？","ability":"条件交集","relatedTo":"S70-1","type":"choice"},{"id":"S70-3","prompt":"别人拼出的图与天乐的位置不同，怎样验收最合适？","options":["只接受与天乐完全重合的图。","对照同一组条件检查他的图。","只看两人的颜色是否一样。"],"answer":1,"reason":"题目允许不同位置和朝向，应按规则验收，而不是按一个示例的位置验收。","hint":"什么是要求，什么只是示例的外观？","ability":"验证多解","relatedTo":null,"type":"choice"}],"extra":{"id":"S70-X","prompt":"如果后来第一行第四列可以用了，原先合格的摆法会怎样？","options":["仍合格，另外可能多出可用摆法。","全部失效。","必须立刻涂上那一格。"],"answer":0,"reason":"解除禁用只是放宽限制，并没有要求必须使用该格；旧方案仍满足原有尺寸条件。","hint":"规则是允许使用，还是必须使用？","ability":"约束放宽","relatedTo":"S70-1","type":"choice"},"reflection":"给别人写一份简短验收单，怎样避免只认你自己的摆法？","panels":["天乐重新拿出三行四列的设计纸，每格边长 1 厘米。仍要拼一个六格长方形，","外边一圈正好 10 厘米。","这次第一行第四列要留给电线口，不能涂。其他格都可以使用；","长方形可以换位置、转方向。","团团想沿用昨天的摆法。天乐说：“先看看它有没有占到电线口。原来合格，不代表新要求下也合格。”"]},{"day":71,"title":"十张票，几个人","story":["纸桥工坊旁边开了一个小集市。每进入一次体验区，就收一张入场票；同一个人可以离开后再进来。","上午收到了 10 张票。门口记录显示：6 位小朋友各进了一次，另外 2 位各进了两次，没有其他人进入。","团团准备写“十位小朋友来过”。天乐把来过的人与进入的次数分开画，发现这两个数未必相同。"],"activity":"人次记录板：逐人展开进入次数，同一个人的两次进入保留同一编号。","questions":[{"id":"S71-1","prompt":"按记录，上午共有多少位不同的小朋友来过？","options":["8 位","10 位","12 位"],"answer":0,"reason":"有 6 位只进一次，另有 2 位进两次，不同的人共 6＋2＝8 位。","hint":"每个人只数一次。","ability":"人数与人次","relatedTo":null,"type":"choice"},{"id":"S71-2","prompt":"为什么收到了 10 张票？","options":["因为有 10 位不同的小朋友。","因为进入次数为 6＋2×2＝10 次。","因为有两张票一定多收了。"],"answer":1,"reason":"规则按每次进入收票，两位小朋友的第二次进入也各用一张。","hint":"收票规则数的是人，还是进入次数？","ability":"计数单位","relatedTo":"S71-1","type":"choice"},{"id":"S71-3","prompt":"如果只有 10 张票，没有逐人记录，能直接知道不同人数吗？","options":["能，一定是 10 人。","不能，同一人可能多次进入。","能，一定是 8 人。"],"answer":1,"reason":"仅有人次，不能知道其中有多少重复进入；8 人依赖这次的额外记录。","hint":"缺少了哪些对应关系？","ability":"信息不足","relatedTo":null,"type":"choice"}],"extra":{"id":"S71-X","prompt":"下午改成每人发一枚印章，只在第一次进入时盖章。这 8 位小朋友都至少进入一次，需要盖几次？","options":["8 次","10 次","16 次"],"answer":0,"reason":"新规则按不同的人盖章，不再按每次进入计算。","hint":"先读清楚新规则数什么。","ability":"更换计数规则","relatedTo":"S71-1","type":"choice"},"reflection":"你能说出一种“次数很多，但参与的人未必很多”的情况吗？","panels":["纸桥工坊旁边开了一个小集市。每进入一次体验区，就收一张入场票；","同一个人可以离开后再进来。","上午收到了 10 张票。门口记录显示：6 位小朋友各进了一次，","另外 2 位各进了两次，没有其他人进入。","团团准备写“十位小朋友来过”。天乐把来过的人与进入的次数分开画，发现这两个数未必相同。"]},{"day":72,"title":"排开以后，真的变多了吗","story":["天乐把编号一到六的六枚筹码排成两行。团团把它们拉开距离，改排成很长的一行。没有添入、拿走或叠放筹码。","团团说：“这一行长得多，筹码也变多了。”小禾指着编号，邀请他把移动前后的筹码一一对上。","排布的样子可以变化，编号帮助大家追踪是不是仍然同一批东西。"],"activity":"同一批筹码重排：切换两行、长行和圆形布局，始终保留六枚唯一编号。","questions":[{"id":"S72-1","prompt":"只把同一批筹码拉开距离，数量会怎样？","options":["仍是 6 枚","变成 12 枚","不能知道，因为排法变了"],"answer":0,"reason":"没有增加、移走或重复筹码，仍是编号一到六的同一批。","hint":"把每枚筹码在移动前后对应起来。","ability":"数量守恒","relatedTo":null,"type":"choice"},{"id":"S72-2","prompt":"哪项证据最能说明数量没有变？","options":["排成的一行看起来更长。","六个编号各出现一次，没有新增或缺失。","两种排法用了相同颜色的桌布。"],"answer":1,"reason":"唯一编号的一一对应能核对物品是否增减，行长和桌布颜色不能证明数量。","hint":"找能追踪每一枚筹码的信息。","ability":"一一对应","relatedTo":"S72-1","type":"choice"},{"id":"S72-3","prompt":"如果后来发现编号三出现两次、编号五不见了，该怎样记录？","options":["仍有六个位置，所以清单完全正确。","数量可能仍是六，但物品清单需要核对。","编号不同不影响任何任务，不必查。"],"answer":1,"reason":"数量相同不保证成员相同；重复和缺失都需要单独核实。","hint":"总数和每件物品是否对应是同一件事吗？","ability":"数量与身份","relatedTo":null,"type":"choice"}],"extra":{"id":"S72-X","prompt":"只移走编号六，其他五枚重新排得更散，剩多少枚？","options":["5 枚","6 枚","要看排成多长"],"answer":0,"reason":"移走一枚改变了数量；重新排开只改变位置。","hint":"分清拿走和移动。","ability":"追踪真实变化","relatedTo":"S72-1","type":"choice"},"reflection":"为什么“总数对上了”有时还不能说明交接清单没有问题？","panels":["天乐把编号一到六的六枚筹码排成两行。团团把它们拉开距离，","改排成很长的一行。没有添入、拿走或叠放筹码。","团团说：“这一行长得多，筹码也变多了。”小禾指着编号，邀请他把移动前后的筹码一一对上。","排布的样子可以变化，编号帮助大家追踪是不是仍然同一批东西。"]},{"day":73,"title":"报名表里重复的名字","story":["灯笼体验的报名表写着：小禾、团团、天乐。纸鸟体验的报名表写着：天乐、小雨、小宁。每张表里都没有重复名字。","工作人员要给参加至少一种体验的小朋友各发一张纪念卡。同一个人参加两种，也只领一张。","团团把两张表的三个名字直接相加，准备六张。天乐发现自己的名字在两张表里都出现了。"],"activity":"双表姓名板：选一个名字，同时高亮它在两张表中的位置；共同成员只计一次。","questions":[{"id":"S73-1","prompt":"应该准备多少张纪念卡？","options":["5 张","6 张","4 张"],"answer":0,"reason":"共有小禾、团团、天乐、小雨、小宁五个人；天乐不能领两次。","hint":"把同一个名字在两表中连起来。","ability":"去重计数","relatedTo":null,"type":"choice"},{"id":"S73-2","prompt":"只参加纸鸟体验、没有参加灯笼体验的有几人？","options":["1 人","2 人","3 人"],"answer":1,"reason":"纸鸟表中的小雨和小宁不在灯笼表里；天乐属于共同部分。","hint":"先去掉同时出现在另一张表的人。","ability":"独有成员","relatedTo":"S73-1","type":"choice"},{"id":"S73-3","prompt":"计算 3＋3－1 时，减去的 1 表示什么？","options":["天乐不能领卡。","去掉天乐被重复计算的一次。","有一个报名无效。"],"answer":1,"reason":"天乐仍领一张，只是不能因两次报名重复领取；没有证据说报名无效。","hint":"他在相加时被数了几次？","ability":"解释去重","relatedTo":null,"type":"choice"}],"extra":{"id":"S73-X","prompt":"如果小禾也报名纸鸟体验，两张表合起来的不同人数会怎样？","options":["变成 6 人","仍是 5 人","变成 4 人"],"answer":1,"reason":"增加的是已有成员的另一项报名，没有增加新的人。","hint":"新名字是否已在另一张表里？","ability":"成员更新","relatedTo":"S73-1","type":"choice"},"reflection":"有人建议按每人参加的活动数发卡。这和现在的规则有什么不同？","panels":["灯笼体验的报名表写着：小禾、团团、天乐。纸鸟体验的报名表写着：天乐、小雨、小宁。","每张表里都没有重复名字。","工作人员要给参加至少一种体验的小朋友各发一张纪念卡。同一个人参加两种，也只领一张。","团团把两张表的三个名字直接相加，准备六张。天乐发现自己的名字在两张表里都出现了。"]},{"day":74,"title":"分得一样，还是按约定分","story":["三个小组共用 12 枚材料筹码。今天的约定是：每组至少 3 枚，把 12 枚全部分完，不要求三组一样多。","小禾提出每组 4 枚，团团提出第一组 3 枚、第二组 3 枚、第三组 6 枚。两人都想说明自己的方案符合约定。","天乐准备自己分一次。他先把“至少三枚”和“必须平均”区分开，再核对有没有漏掉筹码。"],"activity":"筹码分配板：给三组分别增减数量，保留总量；接受所有满足下限和总数的分法。","questions":[{"id":"S74-1","prompt":"自己分完 12 枚筹码，让每组至少得到 3 枚。","options":["第一组","第二组","第三组"],"answer":"allocation:12:3,3,3","reason":"每组 4 枚可以；3、3、6 及其换位也可以。只要三组都不少于 3，合计正好 12，就符合约定。","hint":"先保证每组至少三枚，再安排剩下的。","ability":"多解分配","relatedTo":null,"type":"allocation","allocation":{"total":12,"minimum":[3,3,3]}},{"id":"S74-2","prompt":"3、3、6 这份方案是否符合今天的约定？","options":["符合，每组至少三枚，合计十二枚。","不符合，因为不是平均分。","不符合，因为第三组超过三枚。"],"answer":0,"reason":"今天要求的是下限和总数，没有要求平均，也没有规定每组最多三枚。","hint":"“至少”限制的是最少还是最多？","ability":"准确读条件","relatedTo":"S74-1","type":"choice"},{"id":"S74-3","prompt":"如果有人分成 3、4、4，哪里还没完成？","options":["有一组不足三枚。","只分出十一枚，还剩一枚没安排。","给得不一样，所以一定违规。"],"answer":1,"reason":"三组均达到下限，但合计只有十一枚，没有把十二枚全部分完。","hint":"下限和总数分开检查。","ability":"定位遗漏","relatedTo":null,"type":"choice"}],"extra":{"id":"S74-X","prompt":"若改成每组至少 4 枚，总共仍是 12 枚，而且全部分完，会剩几种不同的数量方案？","options":["只有 4、4、4 一种。","仍可用 3、3、6。","没有任何方案。"],"answer":0,"reason":"三个最低需求正好用完十二枚，没有多余筹码可以给某组。","hint":"先把三个最低数量相加。","ability":"约束收紧","relatedTo":"S74-1","type":"choice"},"reflection":"如果你认为分配还应考虑其他事情，会先和同伴补充哪条约定？","panels":["三个小组共用 12 枚材料筹码。今天的约定是：每组至少 3 枚，","把 12 枚全部分完，不要求三组一样多。","小禾提出每组 4 枚，团团提出第一组 3 枚、第二组 3 枚、第三组 6 枚。","两人都想说明自己的方案符合约定。","天乐准备自己分一次。他先把“至少三枚”和“必须平均”区分开，再核对有没有漏掉筹码。"]},{"day":75,"title":"最后两张票怎么记","story":["每组三位小朋友，要一起进入纸桥体验区。柜台剩 14 张票，每人一张，不能拆开一个组让其中两人先进去。","团团准备了四组，正好发出 12 张票。桌上还剩两张，他想再写上“第五组已安排”。","天乐把“已有完整安排的组”和“还没凑够票的组”分开记录。剩下两张票有用，但还不够一整组。"],"activity":"整组装票板：每次放入三张成一组，分别显示完整组数和余票，不把零头算成一组。","questions":[{"id":"S75-1","prompt":"目前最多能完整安排几组？","options":["4 组","5 组","6 组"],"answer":0,"reason":"四组要十二张，五组要十五张；十四张只够四个完整组。","hint":"先按每组三张组成完整的一份。","ability":"整组与余数","relatedTo":null,"type":"choice"},{"id":"S75-2","prompt":"安排四组后怎样记录余票？","options":["还剩两张，暂时不够一整组。","还剩两组。","没有余票，因为不足一组就不算。"],"answer":0,"reason":"两张票仍然存在，必须保留在账目中；只是暂时不能单独完成一组。","hint":"数量不足一组，不等于数量为零。","ability":"保留余量","relatedTo":"S75-1","type":"choice"},{"id":"S75-3","prompt":"要让第五组也完整进入，至少还需要补多少张？","options":["1 张","2 张","3 张"],"answer":0,"reason":"第五组需要三张，已有两张，还差一张。","hint":"先使用已有余票，再算缺口。","ability":"补足缺口","relatedTo":null,"type":"choice"}],"extra":{"id":"S75-X","prompt":"如果改成每组两人，其他规则不变，14 张票能完整安排多少组？","options":["4 组","6 组","7 组"],"answer":2,"reason":"每组两张，十四张可分成七个完整组，没有余票。","hint":"新规则改变了每组需要的数量。","ability":"单位改变","relatedTo":"S75-1","type":"choice"},"reflection":"为什么不能把“还差一张”和“需要三张”当成同一个数？","panels":["每组三位小朋友，要一起进入纸桥体验区。柜台剩 14 张票，","每人一张，不能拆开一个组让其中两人先进去。","团团准备了四组，正好发出 12 张票。桌上还剩两张，他想再写上“第五组已安排”。","天乐把“已有完整安排的组”和“还没凑够票的组”分开记录。","剩下两张票有用，但还不够一整组。"]},{"day":76,"title":"规则换了，旧算法还管用吗","story":["上午的体验区每进入一次收一张票。6 位小朋友各进一次，2 位各进两次，共用了 10 张。","下午改成每位小朋友只领一张通行卡，凭卡可以重复进入，不再按每次进入加发卡。仍是上午这 8 位小朋友。","团团照上午的次数准备十张卡。天乐把新旧两条规则并排放好，先找改变的是哪一个条件。"],"activity":"新旧规则对照：相同成员与进入次数，切换按人或按次的计数单位。","questions":[{"id":"S76-1","prompt":"下午应发多少张通行卡？","options":["8 张","10 张","12 张"],"answer":0,"reason":"每位不同的小朋友一张，共八人；重复进入不再增加卡片。","hint":"现在发卡的单位是什么？","ability":"规则迁移","relatedTo":null,"type":"choice"},{"id":"S76-2","prompt":"团团沿用十这个数，主要漏看了什么？","options":["上午的人数变了。","下午从按进入次数改为按不同的人发卡。","下午所有人只能进一次。"],"answer":1,"reason":"成员没有变，次数也不决定领卡数；改变的是发放规则。","hint":"找新旧规则的不同之处。","ability":"定位条件变化","relatedTo":"S76-1","type":"choice"},{"id":"S76-3","prompt":"已经准备好的十张卡，给八人每人一张后，应怎样记录？","options":["发出八张，余下两张未发。","发出十张，假装没有余卡。","把余下两张也算作两个人。"],"answer":0,"reason":"发放和库存都应按实际记录，卡片不能自动代表新增的人。","hint":"卡片数量和人数继续分开。","ability":"更新账目","relatedTo":null,"type":"choice"}],"extra":{"id":"S76-X","prompt":"随后新来一位小朋友，还没领过卡，应该怎样更新？","options":["再发一张，累计发出九张。","不发，因为上午没有这人。","发两张，因为还有两张余卡。"],"answer":0,"reason":"按当前一人一卡规则，新成员新增一张发放；不取决于上午是否来过或库存余量。","hint":"把新成员放进当前规则。","ability":"新增成员","relatedTo":"S76-1","type":"choice"},"reflection":"你会怎样提醒同伴：昨天正确的算法，今天需要先检查什么？","panels":["上午的体验区每进入一次收一张票。6 位小朋友各进一次，2 位各进两次，共用了 10 张。","下午改成每位小朋友只领一张通行卡，凭卡可以重复进入，不再按每次进入加发卡。","仍是上午这 8 位小朋友。","团团照上午的次数准备十张卡。天乐把新旧两条规则并排放好，","先找改变的是哪一个条件。"]},{"day":77,"title":"三组的需求不一样","story":["集市收尾还要做三块展牌。第一组至少需要 3 枚材料筹码，第二组至少 4 枚，第三组至少 5 枚；这次一共有 13 枚，要全部分完。","小禾先按需要分出 3、4、5，剩下一枚。团团想把最后一枚给第三组；天乐想给第一组，两种提议都需要核对。","今天没有要求平均，也没有规定剩余一枚必须给谁。大家准备把不同合格方案一起留下，并说清各自的理由。"],"activity":"不同下限分配板：三组需求分别为三、四、五，接受三种用完十三枚的合法分配。","questions":[{"id":"S77-1","prompt":"分完 13 枚筹码，分别满足三组的最低需要。","options":["第一组至少 3","第二组至少 4","第三组至少 5"],"answer":"allocation:13:3,4,5","reason":"先分出 3、4、5 共十二枚。最后一枚给任意一组，都满足要求，所以有 4、4、5，3、5、5，3、4、6 三种方案。","hint":"先满足各组下限，再决定最后一枚给谁。","ability":"不同需求分配","relatedTo":null,"type":"allocation","allocation":{"total":13,"minimum":[3,4,5]}},{"id":"S77-2","prompt":"如果分成 4、5、4，为什么不合格？","options":["总数不是十三。","第三组只有四枚，低于它需要的五枚。","前两组不能多于最低需要。"],"answer":1,"reason":"总数虽为十三，但第三组不够；最低需要不是统一的数字，也不是上限。","hint":"逐组对照自己的需求。","ability":"逐项核验","relatedTo":"S77-1","type":"choice"},{"id":"S77-3","prompt":"两种分配都合格，还能怎样讨论哪种更适合？","options":["只能把与天乐不同的方案判错。","比较实际用途，必要时一起补充更明确的约定。","只要总数相同，其他需要都可忽略。"],"answer":1,"reason":"现有条件容许多解；进一步选择可依据用途和共同约定，不应擅自添加隐藏标准。","hint":"“符合现有要求”和“更合适”可能需要不同信息。","ability":"解释多解","relatedTo":null,"type":"choice"}],"extra":{"id":"S77-X","prompt":"如果只有 11 枚，三组原来的最低需要都不变，能全部满足吗？","options":["能，把筹码排开就够了。","不能，最低合计十二枚，还差一枚。","能，每组少给一点仍算符合原要求。"],"answer":1,"reason":"下限总和是十二，十一枚不足；若要降低需求，必须先明确改变约定。","hint":"先算所有最低需要的合计。","ability":"不可行性","relatedTo":"S77-1","type":"choice"},"reflection":"选择一种合格分法，写出它符合哪些要求；再说一条可能影响最终选择的新信息。","panels":["集市收尾还要做三块展牌。第一组至少需要 3 枚材料筹码，","第二组至少 4 枚，第三组至少 5 枚；这次一共有 13 枚，要全部分完。","小禾先按需要分出 3、4、5，剩下一枚。团团想把最后一枚给第三组；","天乐想给第一组，两种提议都需要核对。","今天没有要求平均，也没有规定剩余一枚必须给谁。大家准备把不同合格方案一起留下，并说清各自的理由。"]},{"day":78,"title":"最后一封邀请信","story":["观察馆的最后一天，天乐收到邀请：十一点之前，把完成检查的展牌送到北厅。从现在十点半起，制作和检查一共还要 15 分钟，必须全部做完才能出发。","两条室内路线都已确认可用：近路走 10 分钟，远路走 20 分钟。时间都包括搬运展牌，不能同时制作和走路。","团团只看路程，想马上出发。小禾把“先完成检查”也写进计划，天乐准备核对哪条路还能按时到。"],"activity":"时间计划板：先列制作检查十五分钟，再选择十或二十分钟路线，显示到达时间。","questions":[{"id":"S78-1","prompt":"按现有条件，哪份计划能在十一点之前送到？","options":["十点半开始制作检查，之后走近路。","十点半开始制作检查，之后走远路。","十点半跳过检查直接出发。"],"answer":0,"reason":"制作检查到十点四十五分结束；近路十点五十五分到，远路十一点零五分到；跳过检查不符合要求。","hint":"时间条件和先完成检查的条件都要核对。","ability":"综合规划","relatedTo":null,"type":"choice"},{"id":"S78-2","prompt":"走近路的合格计划，在十一点前还留出多少分钟？","options":["5 分钟","10 分钟","15 分钟"],"answer":0,"reason":"十点五十五分到达，距离十一点还有五分钟。","hint":"先算到达时间，再看剩余时间。","ability":"时间余量","relatedTo":"S78-1","type":"choice"},{"id":"S78-3","prompt":"团团直接用十一点减路程，为什么还不够？","options":["因为他还必须留出制作和检查的时间。","因为北厅的钟一定不准。","因为两条路线不能比较。"],"answer":0,"reason":"出发前有不能省略、也不能与搬运同时进行的十五分钟工作，必须一起安排。","hint":"哪些事情要先完成，才能做下一件？","ability":"前后依赖","relatedTo":null,"type":"choice"}],"extra":{"id":"S78-X","prompt":"若近路临时需要 15 分钟，制作检查仍需 15 分钟，十点半开始能在十一点之前到吗？","options":["能，正好十一点就算之前。","不能，只能正好十一点到。","不能，会到十一点十五分。"],"answer":1,"reason":"十五加十五共三十分钟，只能正好十一点；本题要求严格早于十一点。","hint":"“之前”和“最晚十一点”是不是同一要求？","ability":"截止边界","relatedTo":"S78-1","type":"choice"},"reflection":"如果实际路程可能多花几分钟，你会提前确认什么，或者怎样留出余量？","panels":["观察馆的最后一天，天乐收到邀请：十一点之前，把完成检查的展牌送到北厅。","从现在十点半起，制作和检查一共还要 15 分钟，必须全部做完才能出发。","两条室内路线都已确认可用：近路走 10 分钟，远路走 20 分钟。","时间都包括搬运展牌，不能同时制作和走路。","团团只看路程，想马上出发。小禾把“先完成检查”也写进计划，","天乐准备核对哪条路还能按时到。"]},{"day":79,"title":"先选对检查工具","story":["交展牌之前，天乐要核查三件事：纸条长多少厘米、搬运从几点到几点、清单上的材料是不是都领到了。","桌上有直尺、带日期的计时记录和材料领取单。它们能回答的问题不同，不能因为其中一个数字看起来顺眼就拿来替代。","小禾建议先说清“要确认什么”，再决定看哪份记录或用哪件工具。"],"activity":"工具匹配板：给长度、起止时间、领取状态三项任务选择直接对应的工具或记录。","questions":[{"id":"S79-1","prompt":"给三项核查任务选择最直接的工具或记录。","options":["直尺","带日期的计时记录","材料领取单"],"answer":[0,1,2],"reason":"长度用直尺测，起止时刻查计时记录，是否领取查对应领取单；每项都要核对当前对象。","hint":"先看每件工具究竟记录或测量什么。","ability":"选择证据工具","relatedTo":null,"type":"classification","items":["核查纸条长多少厘米。","核查这次搬运从几点到几点。","核查这批材料是否已经领齐。"]},{"id":"S79-2","prompt":"领取单上写着“预计十点送达”，能直接当作实际到达时刻吗？","options":["能，只要写了时间。","不能，“预计”仍是计划，需要实际记录确认。","不能，所以一定没有到达。"],"answer":1,"reason":"预计时刻没有证明实际结果；不能据此确认到达，也不能反推出一定未到。","hint":"记录是在计划，还是在确认已发生的事？","ability":"证据类型","relatedTo":"S79-1","type":"choice"},{"id":"S79-3","prompt":"直尺读数和领取单的箱子数量为什么不能直接相加？","options":["因为数值都很小。","因为它们表示不同的量和单位。","因为所有数字都不能相加。"],"answer":1,"reason":"厘米是长度，箱数是数量，直接相加没有明确含义；先说明要计算的是什么。","hint":"先说清数字后面跟的单位。","ability":"单位意识","relatedTo":null,"type":"choice"}],"extra":{"id":"S79-X","prompt":"两份计时记录给出不同到达时刻，先做什么更合适？","options":["选较早的时间。","核对日期、搬运对象和记录来源。","把两个时间平均后当事实。"],"answer":1,"reason":"应先确认是否在描述同一次搬运，并追查原始记录；不能靠挑选或平均消除事实冲突。","hint":"是否同一件事、同一天、同一种记录？","ability":"核实冲突","relatedTo":"S79-1","type":"choice"},"reflection":"自己提出一个待确认的问题，并说明什么证据能真正回答它。","panels":["交展牌之前，天乐要核查三件事：纸条长多少厘米、搬运从几点到几点、清单上的材料是不是都领到了。","桌上有直尺、带日期的计时记录和材料领取单。它们能回答的问题不同，","不能因为其中一个数字看起来顺眼就拿来替代。","小禾建议先说清“要确认什么”，再决定看哪份记录或用哪件工具。"]},{"day":80,"title":"先后次序不能省","story":["展牌的交接卡规定：先把纸条贴好，再检查尺寸和固定情况，检查合格后才能交给搬运员。三步都要完成。","团团想先把空白交接卡签上“已检查”，这样看起来进度更快。小禾说：“签字应当记录已经做过的事。”","天乐把三步做成能移动的卡片，准备按实际顺序排列，完成一项再记一项。"],"activity":"任务顺序卡：按先制作、再检查、后交付排序；点选后真实换位，支持撤回。","questions":[{"id":"S80-1","prompt":"把三张任务卡按规定排好。","options":["检查尺寸与固定情况。","贴好纸条。","检查合格后交给搬运员。"],"answer":[1,0,2],"reason":"检查需要面对已经贴好的展牌，交付又以检查合格为前提，所以是制作、检查、交付。","hint":"每一步开始前，哪件事必须已经完成？","ability":"任务依赖","relatedTo":null,"type":"order"},{"id":"S80-2","prompt":"提前签“已检查”，会造成什么问题？","options":["记录说完成了，实际却还没有检查。","展牌一定变得更结实。","三步会自动同时完成。"],"answer":0,"reason":"提前签字把计划当成完成事实，后面的人可能误以为可以直接交付。","hint":"记录应该对应计划，还是已经完成的动作？","ability":"记录真实性","relatedTo":"S80-1","type":"choice"},{"id":"S80-3","prompt":"检查发现尺寸不符，下一步怎样处理？","options":["修改制作结果，再重新检查。","照原计划签字交付。","只把记录中的尺寸改正确。"],"answer":0,"reason":"应修正实际物品并重新验证，不能只改数字或跳过未通过的条件。","hint":"让实际结果与要求一致，需要改什么？","ability":"验证后修订","relatedTo":null,"type":"choice"}],"extra":{"id":"S80-X","prompt":"如果只更换交接卡的颜色，制作和检查条件没有变，必须改变这三步顺序吗？","options":["必须反过来。","不必，先后依赖没有改变。","可以直接省掉检查。"],"answer":1,"reason":"卡片颜色没有改变工作依赖，不能据此反转或省略步骤。","hint":"新信息是否影响前后条件？","ability":"识别相关变化","relatedTo":"S80-1","type":"choice"},"reflection":"你会怎样写“检查未通过”的记录，让下一位同伴知道要修什么？","panels":["展牌的交接卡规定：先把纸条贴好，再检查尺寸和固定情况，检查合格后才能交给搬运员。三步都要完成。","团团想先把空白交接卡签上“已检查”，这样看起来进度更快。","小禾说：“签字应当记录已经做过的事。”","天乐把三步做成能移动的卡片，准备按实际顺序排列，完成一项再记一项。"]},{"day":81,"title":"近路关闭以后","story":["现在是十点十分。原计划十点半开始制作检查，用 15 分钟，再走 10 分钟近路，十一点之前送到北厅。","工作人员刚确认近路关闭，20 分钟的远路仍可用。制作检查可以提前开始，其他要求不变，不能省略检查。","天乐保留原计划，并写下新消息。他要改的是受路线影响的时间安排，不是把原来的计划假装从未写过。"],"activity":"计划修订板：选择新的开始时刻，固定十五分钟准备和二十分钟远路，核对严格早于十一点。","questions":[{"id":"S81-1","prompt":"下面哪个开始时刻，配合远路仍能在十一点之前送到？","options":["十点二十分","十点二十五分","十点半"],"answer":0,"reason":"准备与搬运共三十五分钟。十点二十分开始，十点五十五分到；二十五分开始正好十一点，不算之前。","hint":"保留检查时间，再看新路线的到达时刻。","ability":"新证据下重规划","relatedTo":null,"type":"choice"},{"id":"S81-2","prompt":"为什么不能继续按原计划十点半开始？","options":["远路会使到达变成十一点零五分。","原来所有加法都变错了。","已经没有任何可用路线。"],"answer":0,"reason":"原来十分钟路程改为二十分钟，使原开始时刻下的到达时间延后十分钟。","hint":"新消息具体改变了哪一个量？","ability":"定位变化","relatedTo":"S81-1","type":"choice"},{"id":"S81-3","prompt":"记录修改原因，哪种写法更清楚？","options":["改早一点，因为我想改。","十点十分确认近路关闭，改走远路并提前开始。","近路从来没有开过，所以删掉旧计划。"],"answer":1,"reason":"写清消息时间、确认事实和对应修改，才能让后来的人追踪原因；旧计划不必被抹去。","hint":"把新依据和新决定连起来。","ability":"可追踪修订","relatedTo":null,"type":"choice"}],"extra":{"id":"S81-X","prompt":"如果只能最早十点半开始，而且近路仍关闭，怎样处理更合理？","options":["声称十一点前能送到。","说明按现条件无法按时，联系负责人调整安排。","直接不检查，装作要求没变。"],"answer":1,"reason":"现条件需要三十五分钟，早于十一点不可达；应明确缺口并协商改变条件，不能虚报或擅自省略要求。","hint":"先承认条件冲突，再讨论能否改变条件。","ability":"不可行计划","relatedTo":"S81-1","type":"choice"},"reflection":"你改过一个计划吗？试着用“原来……新发现……所以……”说清原因。","panels":["现在是十点十分。原计划十点半开始制作检查，用 15 分钟，","再走 10 分钟近路，十一点之前送到北厅。","工作人员刚确认近路关闭，20 分钟的远路仍可用。制作检查可以提前开始，","其他要求不变，不能省略检查。","天乐保留原计划，并写下新消息。他要改的是受路线影响的时间安排，","不是把原来的计划假装从未写过。"]},{"day":82,"title":"两趟搬完，有几种办法","story":["展台剩三包模型材料：A 包重 1 千克，B 包重 2 千克，C 包重 3 千克。模型车每趟最多放两包，总重不能超过 4 千克。","要求正好两趟搬完，三包都要运走，各运一次；C 包要在第一趟到。这里只是在桌面模型里规划，不搬真实重物。","团团想让 C 单独先走，小禾想给 C 找个同车伙伴。两人还没写出完整的两趟清单，天乐准备分别检验。"],"activity":"两趟装载表：为每包选择第一趟或第二趟，按每趟件数、重量和先后要求验收。","questions":[{"id":"S82-1","prompt":"给三包材料安排趟次，满足全部要求。","options":["A 包：1 千克","B 包：2 千克","C 包：3 千克"],"answer":"manifest:1,2,3:4:Cfirst","reason":"第一趟 C、第二趟 A 和 B，或第一趟 A 和 C、第二趟 B，都合格。B 与 C 同车会重五千克，超出限制。","hint":"分别检查两趟重量、包数，再看 C 是否第一趟。","ability":"多解装载","relatedTo":null,"type":"manifest","manifest":{"weights":[1,2,3],"capacity":4,"maxItems":2,"firstRequired":[2]}},{"id":"S82-2","prompt":"第一趟带 B 和 C，哪一项不符合？","options":["两包已超过件数限制。","总重五千克，超过四千克。","C 不在第一趟。"],"answer":1,"reason":"件数为两包，C 也在第一趟，但重量 2＋3＝5 超过上限。","hint":"把件数和重量分别核对。","ability":"定位超限","relatedTo":"S82-1","type":"choice"},{"id":"S82-3","prompt":"第一趟只带 C，第二趟带 A 和 B，为什么也合格？","options":["每趟都必须装满四千克。","两趟分别三千克，件数不超限，C 先到。","因为只要 C 先到就不用管其他条件。"],"answer":1,"reason":"上限不是必须达到的目标；这个方案两趟都不超重，且各包只运一次。","hint":"“最多”是否要求必须装满？","ability":"上限与目标","relatedTo":null,"type":"choice"}],"extra":{"id":"S82-X","prompt":"如果每趟上限降低为 3 千克，其余要求不变，哪种方案仍可用？","options":["第一趟 A 和 C，第二趟 B。","第一趟 C，第二趟 A 和 B。","第一趟 B 和 C，第二趟 A。"],"answer":1,"reason":"C 单独三千克，A＋B 也是三千克；另外两种第一趟分别四或五千克。","hint":"用新上限重新检查原方案。","ability":"收紧约束","relatedTo":"S82-1","type":"choice"},"reflection":"选择一种合格方案，逐条解释它符合哪些要求；再说说另一种为什么也可以。","panels":["展台剩三包模型材料：A 包重 1 千克，B 包重 2 千克，","C 包重 3 千克。模型车每趟最多放两包，总重不能超过 4 千克。","要求正好两趟搬完，三包都要运走，各运一次；C 包要在第一趟到。","这里只是在桌面模型里规划，不搬真实重物。","团团想让 C 单独先走，小禾想给 C 找个同车伙伴。两人还没写出完整的两趟清单，天乐准备分别检验。"]},{"day":83,"title":"换一份清单，再试一次","story":["另一组送来一份新的桌面模型清单：A 包重 2 千克，B 包重 3 千克，C 包重 4 千克。模型车每趟最多两包，总重不超过 6 千克。","仍要求正好两趟，各包运一次，C 必须第一趟到。天乐先自己规划，想停就可以停，也可以使用听读、提示和讲解。","这是一份新清单，不是昨天答案的复印件。是否用过帮助、第一次怎样分配、后来怎样修改，都分开记录。"],"activity":"新参数装载任务：允许独立尝试，也允许求助；保留首次方案和帮助，不凭一次答对宣称掌握。","questions":[{"id":"S83-1","prompt":"根据新清单安排两趟，先自己试试，也可以随时求助。","options":["A 包：2 千克","B 包：3 千克","C 包：4 千克"],"answer":"manifest:2,3,4:6:Cfirst","reason":"第一趟 C、第二趟 A 和 B，重量分别四和五；第一趟 A 和 C、第二趟 B，重量分别六和三。两种都符合要求。","hint":"先把必须先到的 C 放进第一趟，再检查其他材料怎样分配。","ability":"新情境规划","relatedTo":null,"type":"manifest","manifest":{"weights":[2,3,4],"capacity":6,"maxItems":2,"firstRequired":[2]}},{"id":"S83-2","prompt":"若第一趟带 B 和 C，总重是多少，是否超限？","options":["七千克，超过六千克。","六千克，正好符合。","五千克，没有超限。"],"answer":0,"reason":"新清单中 B 为三千克、C 为四千克，合计七千克；不能沿用昨日重量。","hint":"先找这次每包的重量。","ability":"核对当前数据","relatedTo":"S83-1","type":"choice"},{"id":"S83-3","prompt":"如果第一次方案不合格，修改后合格，应怎样记？","options":["只留下最后的正确方案。","保留首次方案，再追加修改及依据。","把首次记录改成修改后的样子。"],"answer":1,"reason":"首次和后续过程提供不同信息；保留它们能看见改动，而不把后来的理解倒填到第一次。","hint":"记录过程需要保留哪几个时点？","ability":"记录学习过程","relatedTo":"S83-1","type":"choice"}],"extra":{"id":"S83-X","prompt":"若上限降为 5 千克，原来的哪种方案仍合格？","options":["第一趟 A 和 C，第二趟 B。","第一趟 C，第二趟 A 和 B。","第一趟 B 和 C，第二趟 A。"],"answer":1,"reason":"C 单独四千克，A＋B 五千克，均不超限；另外两种第一趟六或七千克。","hint":"改变一个条件后，每趟都重新核对。","ability":"单条件迁移","relatedTo":"S83-1","type":"choice"},"reflection":"哪一步是你自己想到的？哪里用了帮助？这题太容易、刚合适，还是太难？可以按真实感受写。","panels":["另一组送来一份新的桌面模型清单：A 包重 2 千克，B 包重 3 千克，","C 包重 4 千克。模型车每趟最多两包，总重不超过 6 千克。","仍要求正好两趟，各包运一次，C 必须第一趟到。天乐先自己规划，","想停就可以停，也可以使用听读、提示和讲解。","这是一份新清单，不是昨天答案的复印件。是否用过帮助、第一次怎样分配、后来怎样修改，都分开记录。"]},{"day":84,"title":"把你的办法讲给别人听","story":["观察馆要给下一批小朋友留一本方法册。天乐挑了自己试过的一个任务，准备写清要求、第一次想法、后来得到的新信息和最后的方案。","小禾提醒：“有些任务不只一个答案。还没确认的地方，也可以诚实地写出来。”团团想把所有错过的步骤都删掉，让本子看起来完美。","天乐给方法册留了一页反馈：哪些活动还想再玩，哪些太简单，哪句话读起来费劲。下一次修改，要依据真实使用情况。"],"activity":"作品交接与反馈：查看要求、证据和修改过程；自由表达与难度感受不自动判分。","questions":[{"id":"S84-1","prompt":"哪种方法册最方便别人检查和继续使用？","options":["只有最后一个答案，没有题目条件。","写明要求、方案依据、修改过程和仍待确认的
